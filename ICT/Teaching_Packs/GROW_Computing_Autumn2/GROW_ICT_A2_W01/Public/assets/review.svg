<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400"><rect width="640" height="400" fill="white"/><rect x="10" y="15" width="300" height="170" rx="12" fill="#F0CC76"/><text x="28" y="50" font-family="Liberation Sans,sans-serif" font-size="22" font-weight="700" fill="#17263B">Reset test</text><text x="28" y="87" font-family="Liberation Sans,sans-serif" font-size="22" font-weight="400" fill="#17263B">Set a test value of 5.</text><text x="28" y="117" font-family="Liberation Sans,sans-serif" font-size="22" font-weight="400" fill="#17263B">Trigger start.</text><rect x="330" y="15" width="300" height="170" rx="12" fill="#B0D8D1"/><text x="348" y="50" font-family="Liberation Sans,sans-serif" font-size="22" font-weight="700" fill="#17263B">Check readouts</text><text x="348" y="87" font-family="Liberation Sans,sans-serif" font-size="22" font-weight="400" fill="#17263B">Do both return to 0?</text><text x="348" y="117" font-family="Liberation Sans,sans-serif" font-size="22" font-weight="400" fill="#17263B">Is the start pad clear?</text><rect x="10" y="215" width="300" height="170" rx="12" fill="#B0D8D1"/><text x="28" y="250" font-family="Liberation Sans,sans-serif" font-size="22" font-weight="700" fill="#17263B">One useful fix</text><text x="28" y="287" font-family="Liberation Sans,sans-serif" font-size="22" font-weight="400" fill="#17263B">Fix a missing zero block.</text><text x="28" y="317" font-family="Liberation Sans,sans-serif" font-size="22" font-weight="400" fill="#17263B">Move a readout box.</text><rect x="330" y="215" width="300" height="170" rx="12" fill="#F0CC76"/><text x="348" y="250" font-family="Liberation Sans,sans-serif" font-size="22" font-weight="700" fill="#17263B">Final saved check</text><text x="348" y="287" font-family="Liberation Sans,sans-serif" font-size="22" font-weight="400" fill="#17263B">Save the project.</text><text x="348" y="317" font-family="Liberation Sans,sans-serif" font-size="22" font-weight="400" fill="#17263B">Reopen and test start.</text></svg>