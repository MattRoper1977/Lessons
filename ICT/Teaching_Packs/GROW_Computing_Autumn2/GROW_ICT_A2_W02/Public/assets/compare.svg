<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400"><rect width="640" height="400" fill="white"/><rect x="10" y="30" width="300" height="345" rx="12" fill="#F1F4F5"/><text x="28" y="65" font-family="Liberation Sans,sans-serif" font-size="22" font-weight="700" fill="#17263B">Script A</text><text x="28" y="102" font-family="Liberation Sans,sans-serif" font-size="22" font-weight="400" fill="#17263B">Touch fuel pod</text><text x="28" y="132" font-family="Liberation Sans,sans-serif" font-size="22" font-weight="400" fill="#17263B">Set FuelScore to 1</text><text x="28" y="162" font-family="Liberation Sans,sans-serif" font-size="22" font-weight="400" fill="#17263B">Touch pod again</text><text x="28" y="192" font-family="Liberation Sans,sans-serif" font-size="22" font-weight="400" fill="#17263B">Score stays 1</text><rect x="330" y="30" width="300" height="345" rx="12" fill="#B0D8D1"/><text x="348" y="65" font-family="Liberation Sans,sans-serif" font-size="22" font-weight="700" fill="#17263B">Script B</text><text x="348" y="102" font-family="Liberation Sans,sans-serif" font-size="22" font-weight="400" fill="#17263B">Touch fuel pod</text><text x="348" y="132" font-family="Liberation Sans,sans-serif" font-size="22" font-weight="400" fill="#17263B">Change FuelScore by 1</text><text x="348" y="162" font-family="Liberation Sans,sans-serif" font-size="22" font-weight="400" fill="#17263B">Touch pod again</text><text x="348" y="222" font-family="Liberation Sans,sans-serif" font-size="22" font-weight="400" fill="#17263B">Score adds up</text><text x="348" y="252" font-family="Liberation Sans,sans-serif" font-size="22" font-weight="400" fill="#17263B">1 then 2 then 3</text><text x="348" y="282" font-family="Liberation Sans,sans-serif" font-size="22" font-weight="400" fill="#17263B">Each pickup counts</text></svg>