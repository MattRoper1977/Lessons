<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400"><rect width="640" height="400" fill="white"/><rect x="20" y="10" width="600" height="80" rx="12" fill="#F0CC76"/><text x="38" y="45" font-family="Liberation Sans,sans-serif" font-size="22" font-weight="700" fill="#17263B">Two maze scoring events</text><rect x="20" y="115" width="600" height="110" rx="12" fill="#B0D8D1"/><text x="38" y="150" font-family="Liberation Sans,sans-serif" font-size="22" font-weight="700" fill="#17263B">Event 1: Pickup</text><text x="38" y="187" font-family="Liberation Sans,sans-serif" font-size="22" font-weight="400" fill="#17263B">Touch fuel pod -&gt; change FuelScore by 1.</text><rect x="20" y="250" width="600" height="125" rx="12" fill="#B0D8D1"/><text x="38" y="285" font-family="Liberation Sans,sans-serif" font-size="22" font-weight="700" fill="#17263B">Event 2: Hazard</text><text x="38" y="322" font-family="Liberation Sans,sans-serif" font-size="22" font-weight="400" fill="#17263B">Touch laser wall -&gt; change HazardHits by 1.</text></svg>