<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400"><rect width="640" height="400" fill="white"/><rect x="20" y="20" width="600" height="355" rx="12" fill="#F1F4F5"/><text x="38" y="55" font-family="Liberation Sans,sans-serif" font-size="22" font-weight="700" fill="#17263B">My event score check</text><text x="38" y="92" font-family="Liberation Sans,sans-serif" font-size="22" font-weight="400" fill="#17263B">Pickup contact adds 1 to pickup score</text><text x="38" y="122" font-family="Liberation Sans,sans-serif" font-size="22" font-weight="400" fill="#17263B">Hazard contact adds 1 to hazard hits</text><text x="38" y="152" font-family="Liberation Sans,sans-serif" font-size="22" font-weight="400" fill="#17263B">Uses change blocks, not set blocks</text><text x="38" y="182" font-family="Liberation Sans,sans-serif" font-size="22" font-weight="400" fill="#17263B">Start still resets both scores to 0</text><text x="38" y="212" font-family="Liberation Sans,sans-serif" font-size="22" font-weight="400" fill="#17263B">Saved and reopened in W02_Events</text></svg>