<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Week 1 · Knowing Myself · PEQ</title><desc id="desc">Original GROW ASDAN teaching model for Self-knowledge evidence map. It visualises the lesson's hotspot rehearsal and transfer to a real independent task.</desc>
<style>
  .bg{fill:#f8f6ef}.panel{fill:#fff;stroke:#1f3a4a;stroke-width:2}.accent{fill:#2e6f73}.accent2{fill:#c57542}
  .soft{fill:#e7f0ed;stroke:#2e6f73;stroke-width:2}.warm{fill:#f7e9dd;stroke:#c57542;stroke-width:2}
  .ink{fill:#17212a;font-family:Arial,sans-serif}.muted{fill:#52616b;font-family:Arial,sans-serif}
  .title{font-size:32px;font-weight:700}.sub{font-size:17px;font-weight:600}.label{font-size:17px;font-weight:700}.small{font-size:14px}
  .line{fill:none;stroke:#2e6f73;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:14 9;animation:dash 2.2s ease-out 1}
  .focus{animation:focus 1.5s ease 1}.card{animation:rise .7s ease both}.d2{animation-delay:.18s}.d3{animation-delay:.36s}.d4{animation-delay:.54s}
  @keyframes dash{from{stroke-dashoffset:180}to{stroke-dashoffset:0}}@keyframes rise{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}@keyframes focus{50%{filter:drop-shadow(0 0 10px #c57542)}}
  @media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

<rect width="1200" height="675" class="bg"/>
<rect x="24" y="24" width="1152" height="627" rx="26" class="panel"/>
<rect x="24" y="24" width="1152" height="88" rx="26" class="accent"/>
<text x="58" y="67" fill="#fff" font-family="Arial,sans-serif" font-size="16" font-weight="700">GROW ASDAN · PEQ · ORIGINAL MODEL</text>
<text x="58" y="98" fill="#fff" font-family="Arial,sans-serif" font-size="28" font-weight="700">Self-knowledge evidence map</text>
<g class="card d1"><rect x="80" y="132" width="230" height="58" rx="16" class="soft"/><circle cx="108" cy="161" r="16" class="accent"/><text x="108" y="167" fill="#fff" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700">1</text><text x="134" y="167" class="ink label">PREDICT</text></g><path d="M310 161 H340" class="line"/><g class="card d2"><rect x="350" y="132" width="230" height="58" rx="16" class="soft"/><circle cx="378" cy="161" r="16" class="accent"/><text x="378" y="167" fill="#fff" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700">2</text><text x="404" y="167" class="ink label">TEST</text></g><path d="M580 161 H610" class="line"/><g class="card d3"><rect x="620" y="132" width="230" height="58" rx="16" class="soft"/><circle cx="648" cy="161" r="16" class="accent"/><text x="648" y="167" fill="#fff" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700">3</text><text x="674" y="167" class="ink label">COMPARE</text></g><path d="M850 161 H880" class="line"/><g class="card d4"><rect x="890" y="132" width="230" height="58" rx="16" class="warm"/><circle cx="918" cy="161" r="16" class="accent2"/><text x="918" y="167" fill="#fff" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700">4</text><text x="944" y="167" class="ink label">JUSTIFY</text></g><rect x="85" y="220" width="1030" height="310" rx="24" class="soft"/><path d="M120 465 C280 330 405 500 570 350 C720 215 880 390 1070 275" class="line"/><g class="card d1"><circle cx="120" cy="270" r="28" class="accent"/><text x="120" y="277" fill="#fff" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700">1</text><text x="162" y="265" class="ink label" text-anchor="start"><tspan x="162" dy="0">STRENGTH</tspan></text></g><g class="card d2"><circle cx="550" cy="270" r="28" class="accent2"/><text x="550" y="277" fill="#fff" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700">2</text><text x="592" y="265" class="ink label" text-anchor="start"><tspan x="592" dy="0">INTEREST</tspan></text></g><g class="card d3"><circle cx="980" cy="270" r="28" class="accent"/><text x="980" y="277" fill="#fff" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700">3</text><text x="1022" y="265" class="ink label" text-anchor="start"><tspan x="1022" dy="0">VALUE</tspan></text></g><g class="card d4"><circle cx="120" cy="430" r="28" class="accent2"/><text x="120" y="437" fill="#fff" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700">4</text><text x="162" y="425" class="ink label" text-anchor="start"><tspan x="162" dy="0">WORKING CONDITION</tspan></text></g><g class="card d1"><circle cx="550" cy="430" r="28" class="accent"/><text x="550" y="437" fill="#fff" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700">5</text><text x="592" y="425" class="ink label" text-anchor="start"><tspan x="592" dy="0">STARTING POINT</tspan></text></g><g class="card d2"><circle cx="980" cy="430" r="28" class="accent2"/><text x="980" y="437" fill="#fff" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700">6</text><text x="1022" y="425" class="ink label" text-anchor="start"><tspan x="1022" dy="0">NEXT TEST</tspan></text></g>
<rect x="70" y="580" width="1060" height="46" rx="14" class="warm"/>
<text x="600" y="609" class="ink sub" text-anchor="middle">TRANSFER: Complete your profile using one strength, interest, value and working condition. Add the evidence and one next test for each.</text>
</svg>
