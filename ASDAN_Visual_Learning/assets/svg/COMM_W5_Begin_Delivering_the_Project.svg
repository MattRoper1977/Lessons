<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Week 5 · Begin Delivering the Project · Community &amp; Enterprise</title><desc id="desc">Original LAUNCH ASDAN teaching model for Live project delivery simulator. It visualises the lesson's model rehearsal and transfer to a real independent task.</desc>
