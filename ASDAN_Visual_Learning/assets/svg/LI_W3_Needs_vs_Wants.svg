<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Week 3 · Needs vs Wants · Living Independently</title><desc id="desc">Original BUILD ASDAN teaching model for Needs, wants and the reason between them. It visualises the lesson's evidence rehearsal and transfer to a real independent task.</desc>
<style>
