<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Week 3 · Following Instructions &amp; Routines · Vocational</title><desc id="desc">Original LAUNCH ASDAN teaching model for Instruction-to-action loop. It visualises the lesson's sequence rehearsal and transfer to a real independent task.</desc>
<style>
  .bg{fill:#f8f6ef}.panel{fill:#fff;stroke:#1f3a4a;stroke-width:2}.accent{fill:#2e6f73}.accent2{fill:#c57542}
  .soft{fill:#e7f0ed;stroke:#2e6f73;stroke-width:2}.warm{fill:#f7e9dd;stroke:#c57542;stroke-width:2}
  .ink{fill:#17212a;font-family:Arial,sans-serif}.muted{fill:#52616b;font-family:Arial,sans-serif}
  .title{font-size:32px;font-weight:700}.sub{font-size:17px;font-weight:600}.label{font-size:17px;font-weight:700}.small{font-size:14px}
  .line{fill:none;stroke:#2e6f73;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:14 9;animation:dash 2.2s ease-out 1}
  .focus{animation:focus 1.5s ease 1}.card{animation:rise .7s ease both}.d2{animation-delay:.18s}.d3{animation-delay:.36s}.d4{animation-delay:.54s}
  @keyframes dash{from{stroke-dashoffset:180}to{stroke-dashoffset:0}}@keyframes rise{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}@keyframes focus{50%{filter:drop-shadow(0 0 10px #c57542)}}
  @media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

<rect width="1200" height="675" class="bg"/>
<rect x="24" y="24" width="1152" height="627" rx="26" class="panel"/>
<rect x="24" y="24" width="1152" height="88" rx="26" class="accent"/>
<text x="58" y="67" fill="#fff" font-family="Arial,sans-serif" font-size="16" font-weight="700">LAUNCH ASDAN · Vocational · ORIGINAL MODEL</text>
<text x="58" y="98" fill="#fff" font-family="Arial,sans-serif" font-size="28" font-weight="700">Instruction-to-action loop</text>
<g class="card d1"><rect x="80" y="132" width="230" height="58" rx="16" class="soft"/><circle cx="108" cy="161" r="16" class="accent"/><text x="108" y="167" fill="#fff" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700">1</text><text x="134" y="167" class="ink label">INVESTIGATE</text></g><path d="M310 161 H340" class="line"/><g class="card d2"><rect x="350" y="132" width="230" height="58" rx="16" class="soft"/><circle cx="378" cy="161" r="16" class="accent"/><text x="378" y="167" fill="#fff" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700">2</text><text x="404" y="167" class="ink label">LOCATE EVIDENCE</text></g><path d="M580 161 H610" class="line"/><g class="card d3"><rect x="620" y="132" width="230" height="58" rx="16" class="soft"/><circle cx="648" cy="161" r="16" class="accent"/><text x="648" y="167" fill="#fff" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700">3</text><text x="674" y="167" class="ink label">REASON</text></g><path d="M850 161 H880" class="line"/><g class="card d4"><rect x="890" y="132" width="230" height="58" rx="16" class="warm"/><circle cx="918" cy="161" r="16" class="accent2"/><text x="918" y="167" fill="#fff" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700">4</text><text x="944" y="167" class="ink label">ACT</text></g><g class="card d1"><circle cx="100" cy="320" r="56" class="soft"/><text x="100" y="308" class="ink label" text-anchor="middle">1</text><text x="100" y="331" class="ink small" text-anchor="middle"><tspan x="100" dy="0">Receive the</tspan><tspan x="100" dy="17">instruction in the</tspan><tspan x="100" dy="17">agreed…</tspan></text></g><path d="M158 320 C190 290,215 386,247 356" class="line"/><g class="card d2"><circle cx="305" cy="356" r="56" class="soft"/><text x="305" y="344" class="ink label" text-anchor="middle">2</text><text x="305" y="367" class="ink small" text-anchor="middle"><tspan x="305" dy="0">Restate the</tspan><tspan x="305" dy="17">outcome, first</tspan><tspan x="305" dy="17">step…</tspan></text></g><path d="M363 356 C395 326,420 350,452 320" class="line"/><g class="card d3"><circle cx="510" cy="320" r="56" class="soft"/><text x="510" y="308" class="ink label" text-anchor="middle">3</text><text x="510" y="331" class="ink small" text-anchor="middle"><tspan x="510" dy="0">Prepare tools,</tspan><tspan x="510" dy="17">materials and</tspan><tspan x="510" dy="17">workspace…</tspan></text></g><path d="M568 320 C600 290,625 386,657 356" class="line"/><g class="card d4"><circle cx="715" cy="356" r="56" class="soft"/><text x="715" y="344" class="ink label" text-anchor="middle">4</text><text x="715" y="367" class="ink small" text-anchor="middle"><tspan x="715" dy="0">Complete one chunk</tspan><tspan x="715" dy="17">and compare it</tspan><tspan x="715" dy="17">with…</tspan></text></g><path d="M773 356 C805 326,830 350,862 320" class="line"/><g class="card d4"><circle cx="920" cy="320" r="56" class="warm"/><text x="920" y="308" class="ink label" text-anchor="middle">5</text><text x="920" y="331" class="ink small" text-anchor="middle"><tspan x="920" dy="0">Pause and clarify</tspan><tspan x="920" dy="17">when wording,</tspan><tspan x="920" dy="17">condition…</tspan></text></g>
<rect x="70" y="580" width="1060" height="46" rx="14" class="warm"/>
<text x="600" y="609" class="ink sub" text-anchor="middle">TRANSFER: Use the real task instruction. Mark the first action, checkpoint, stop/clarify cue, final standard and handover.</text>
</svg>
