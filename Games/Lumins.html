<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#060a18">
<title>LUMINS</title>
<style>
:root{
  --bg0:#060a18; --bg1:#0b1226; --panel:rgba(16,24,48,.72);
  --line:rgba(90,120,180,.28); --ink:#eaf6ff; --mut:#8fa6c8;
  --cyan:#27e0ff; --violet:#b18cff; --green:#39ff9e; --amber:#ffc14d;
  --pink:#ff6ea9; --orange:#ff9a4c;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:radial-gradient(120% 120% at 50% -10%,#101a36,var(--bg0));
  color:var(--ink);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
#app{display:flex;flex-direction:column;height:100%;max-width:900px;margin:0 auto}
#top{display:flex;align-items:center;gap:10px;padding:8px 12px;flex-wrap:wrap}
#brand{font-family:'Orbitron','Segoe UI',sans-serif;font-weight:800;letter-spacing:3px;font-size:20px;
  color:var(--ink);text-shadow:0 0 14px rgba(39,224,255,.5)}
#brand b{color:var(--cyan)}
.stat{font-family:'Orbitron',sans-serif;font-weight:700;font-size:13px;padding:3px 9px;border-radius:8px;
  background:var(--panel);border:1px solid var(--line)}
.stat.save{color:var(--green)} .stat.out{color:var(--violet)}
#lvlname{margin-left:auto;font-family:'Orbitron',sans-serif;font-size:12px;color:var(--mut);letter-spacing:1px}
#stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;min-height:0;padding:2px 8px}
#wrap{position:relative}
canvas{display:block;border-radius:12px;border:1px solid var(--line);
  box-shadow:0 0 40px rgba(10,20,50,.7),inset 0 0 60px rgba(0,0,0,.35);background:#070c1c}
#tools{display:flex;gap:6px;padding:6px 10px;justify-content:center;flex-wrap:wrap}
.skill{position:relative;min-width:66px;padding:7px 6px 6px;border-radius:12px;cursor:pointer;
  background:var(--panel);border:1px solid var(--line);text-align:center;transition:transform .08s,border-color .15s,box-shadow .15s}
.skill:active{transform:translateY(1px)}
.skill .ic{font-size:20px;line-height:1}
.skill .nm{font-family:'Orbitron',sans-serif;font-size:9px;letter-spacing:.5px;color:var(--mut);margin-top:3px;text-transform:uppercase}
.skill .ct{position:absolute;top:-7px;right:-7px;min-width:20px;height:20px;line-height:20px;border-radius:10px;
  font-family:'Orbitron',sans-serif;font-size:11px;font-weight:700;background:#0d1630;border:1px solid var(--line);color:var(--ink)}
.skill.on{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan) inset,0 0 18px rgba(39,224,255,.35)}
.skill.empty{opacity:.4;cursor:not-allowed}
#bar{display:flex;gap:6px;padding:2px 10px 10px;justify-content:center;flex-wrap:wrap}
.ctrl{padding:7px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line);color:var(--ink);
  font-family:'Orbitron',sans-serif;font-size:12px;letter-spacing:.5px;cursor:pointer}
.ctrl.act{border-color:var(--cyan);color:var(--cyan)}
.ov{position:absolute;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:20px;
  background:rgba(6,10,24,.86);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.ov.show{display:flex}
.card{max-width:420px;width:100%;background:linear-gradient(180deg,#0e1730,#0a1122);border:1px solid var(--line);
  border-radius:18px;padding:22px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.card h1{font-family:'Orbitron',sans-serif;margin:0 0 4px;font-size:26px;letter-spacing:2px}
.card h1.win{color:var(--green)} .card h1.lose{color:var(--amber)}
.card .sub{color:var(--mut);font-size:13px;margin-bottom:14px}
.card .hint{background:rgba(39,224,255,.08);border:1px solid rgba(39,224,255,.25);border-radius:12px;
  padding:10px 12px;font-size:13px;color:#cfeeff;margin:12px 0;text-align:left;line-height:1.45}
.inv{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:12px 0}
.inv span{font-family:'Orbitron',sans-serif;font-size:11px;background:#0d1630;border:1px solid var(--line);
  border-radius:8px;padding:4px 8px;color:var(--mut)}
/* ===== seals ===== */
.seals{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px 0 4px}
.seal-t{font-family:'Orbitron',sans-serif;font-size:12px;background:#0d1630;border:1px solid var(--line);
  border-radius:10px;padding:6px 10px;color:var(--mut)}
.seal-t.have{border-color:rgba(57,255,158,.5);color:#d9ffef}
.seal-big{font-size:52px;line-height:1;margin:4px 0 2px;display:inline-block;animation:sealPop .6s cubic-bezier(.2,1.6,.4,1) both}
.seal-big.gold{filter:drop-shadow(0 0 14px rgba(255,215,80,.75));animation:sealPop .6s cubic-bezier(.2,1.6,.4,1) both, sealGlow 1.6s ease-in-out .6s infinite}
.seal-name{font-family:'Orbitron',sans-serif;font-size:13px;letter-spacing:2px;margin-bottom:8px}
.seal-name.g0{color:var(--mut)} .seal-name.g1{color:#e8a05c} .seal-name.g2{color:#cfd8ea} .seal-name.g3{color:#ffd750}
.newbest{display:inline-block;font-family:'Orbitron',sans-serif;font-size:10px;letter-spacing:1px;color:#04141c;
  background:var(--green);border-radius:8px;padding:3px 8px;margin-left:6px;vertical-align:middle}
@keyframes sealPop{0%{transform:scale(.2) rotate(-18deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes sealGlow{0%,100%{filter:drop-shadow(0 0 8px rgba(255,215,80,.5))}50%{filter:drop-shadow(0 0 20px rgba(255,215,80,.95))}}
/* ===== level select ===== */
.lvl-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.lvl-tile{background:#0d1630;border:1px solid var(--line);border-radius:12px;padding:12px 10px;cursor:pointer;
  text-align:center;transition:transform .12s,border-color .12s}
.lvl-tile:hover{transform:translateY(-2px);border-color:var(--cyan)}
.lvl-tile .lt-seal{font-size:26px;line-height:1;margin-bottom:4px}
.lvl-tile .lt-name{font-family:'Orbitron',sans-serif;font-size:11px;color:var(--ink);letter-spacing:.5px}
.lvl-tile .lt-best{font-size:11px;color:var(--mut);margin-top:3px}
.lvl-tile.lock{opacity:.45;cursor:not-allowed}
.lvl-tile.lock:hover{transform:none;border-color:var(--line)}
.constel{margin:2px 0 4px;letter-spacing:5px}
.cs{font-style:normal;font-size:15px}
.cs.on{color:var(--green);text-shadow:0 0 8px rgba(57,255,158,.6);animation:csTw 1.7s ease-in-out infinite}
.cs.off{color:#3a4767}
@keyframes csTw{0%,100%{opacity:1}50%{opacity:.4}}
.chal{background:rgba(255,110,169,.1);border:1px solid rgba(255,110,169,.4);border-radius:12px;
  padding:9px 12px;font-size:13px;color:#ffd6e6;margin:10px 0;font-family:'Orbitron',sans-serif;letter-spacing:.4px}
.chal.winby{background:rgba(57,255,158,.1);border-color:rgba(57,255,158,.45);color:#d9ffef}
.seal-tally{font-family:'Orbitron',sans-serif;font-size:12px;color:var(--mut);margin-bottom:4px}
@media (max-width:640px){ .lvl-grid{grid-template-columns:1fr 1fr} .seal-big{font-size:44px} }
.cbtn{margin-top:8px;padding:12px 26px;border:none;border-radius:12px;font-family:'Orbitron',sans-serif;
  font-weight:800;letter-spacing:1px;font-size:15px;cursor:pointer;background:var(--cyan);color:#04141c}
.cbtn.alt{background:rgba(255,255,255,.08);color:var(--ink);border:1px solid var(--line);margin-left:8px}
#tip{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);font-size:12px;color:var(--mut);
  background:rgba(6,10,24,.6);padding:4px 10px;border-radius:8px;pointer-events:none;opacity:0;transition:opacity .3s}
#tip.show{opacity:1}
@media (max-width:520px){#brand{font-size:16px}.skill{min-width:58px}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto}}

/* ===== Matt's Apps splash ===== */
#ma-splash{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:opacity .5s ease;font-family:'Orbitron','Segoe UI',sans-serif;overflow:hidden;
  background:
    radial-gradient(60% 50% at 18% 12%,rgba(78,50,160,.35),transparent 70%),
    radial-gradient(55% 45% at 85% 80%,rgba(20,120,180,.28),transparent 70%),
    radial-gradient(120% 120% at 50% 0%,#0d1530,#04060f)}
#ma-splash::before{content:"";position:absolute;inset:0;pointer-events:none;background-image:
  radial-gradient(1.5px 1.5px at 12% 25%,rgba(233,244,255,.8),transparent 55%),
  radial-gradient(1px 1px at 32% 68%,rgba(180,220,255,.7),transparent 55%),
  radial-gradient(1.5px 1.5px at 58% 15%,rgba(200,190,255,.65),transparent 55%),
  radial-gradient(1px 1px at 74% 45%,rgba(233,244,255,.7),transparent 55%),
  radial-gradient(1.5px 1.5px at 88% 22%,rgba(180,220,255,.6),transparent 55%),
  radial-gradient(1px 1px at 22% 85%,rgba(233,244,255,.6),transparent 55%),
  radial-gradient(1px 1px at 66% 88%,rgba(200,190,255,.6),transparent 55%),
  radial-gradient(1.5px 1.5px at 44% 40%,rgba(233,244,255,.5),transparent 55%);
  animation:maTwinkle 3.4s ease-in-out infinite}
#ma-splash.ma-out{opacity:0;pointer-events:none}
.ma-stage{text-align:center;position:relative;z-index:2}
.ma-ring{position:absolute;left:50%;top:50%;border-radius:50%;pointer-events:none;
  border:1px solid rgba(39,224,255,.16);transform:translate(-50%,-50%)}
.mr1{width:46vmin;height:46vmin;animation:maPulse 3.2s ease-out infinite}
.mr2{width:66vmin;height:66vmin;animation:maPulse 3.2s .5s ease-out infinite}
.mr3{width:88vmin;height:88vmin;animation:maPulse 3.2s 1s ease-out infinite}
.ma-pre{font-size:clamp(12px,3vw,16px);letter-spacing:.6em;text-indent:.6em;color:#8fa6c8;
  animation:maIn .8s .1s ease both}
.ma-word{margin-top:6px;font-size:clamp(26px,7.5vw,46px);font-weight:800;letter-spacing:.2em;text-indent:.2em;
  color:#eaf6ff;text-shadow:0 0 24px rgba(120,160,255,.4);animation:maIn .8s .4s ease both}
.ma-line{position:relative;width:min(64vw,320px);height:2px;margin:22px auto 18px;
  background:linear-gradient(90deg,transparent,rgba(39,224,255,.55),transparent);
  animation:maIn .8s .8s ease both}
.ma-orb{position:absolute;top:-5px;left:0;width:12px;height:12px;border-radius:50%;
  background:radial-gradient(circle at 34% 30%,#fff,#27e0ff 55%,#0a91b3);
  box-shadow:0 0 12px #27e0ff,0 0 34px rgba(39,224,255,.65);
  animation:maWalk 2.4s 1s cubic-bezier(.45,0,.55,1) infinite alternate}
.ma-title{font-size:clamp(34px,11vw,72px);font-weight:900;letter-spacing:.32em;text-indent:.32em;
  background:linear-gradient(180deg,#eafcff 10%,#7be8ff 45%,#27e0ff 70%,#1179a0);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 18px rgba(39,224,255,.55)) drop-shadow(0 4px 30px rgba(39,224,255,.25));
  animation:maIn .9s 1s ease both}
.ma-tag{margin-top:10px;font-size:clamp(10px,2.6vw,13px);letter-spacing:.34em;text-indent:.34em;
  color:#7ea0d0;animation:maIn 1s 1.5s ease both}
.ma-skip{margin-top:30px;font-size:10px;letter-spacing:.25em;color:#5d7397;animation:maIn 1s 2s ease both}
@keyframes maIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes maPulse{0%{opacity:.5;scale:.92}70%{opacity:0}100%{opacity:0;scale:1.06}}
@keyframes maWalk{from{left:2%}to{left:calc(98% - 12px)}}
@keyframes maTwinkle{0%,100%{opacity:.9}50%{opacity:.55}}
@media (prefers-reduced-motion:reduce){#ma-splash *,#ma-splash::before{animation:none!important}
  .ma-orb{left:calc(50% - 6px)}}
/* ===== leaderboard ===== */
#lb-rows{margin:8px 0 0;padding:0;list-style:none;counter-reset:rk;text-align:left}
#lb-rows li{display:flex;gap:8px;align-items:baseline;padding:5px 8px;border-radius:8px;font-size:14px;counter-increment:rk}
#lb-rows li::before{content:counter(rk);font-family:'Orbitron',sans-serif;font-size:11px;color:#8fa6c8;min-width:18px}
#lb-rows li:nth-child(1){background:rgba(255,193,77,.10)}
#lb-rows li:nth-child(1)::before{content:"🥇";min-width:22px}
#lb-rows li:nth-child(2)::before{content:"🥈";min-width:22px}
#lb-rows li:nth-child(3)::before{content:"🥉";min-width:22px}
#lb-rows .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#lb-rows .sc{font-family:'Orbitron',sans-serif;color:var(--cyan);font-size:13px}
.lb-form{display:flex;gap:8px;margin-top:12px}
#lb-name{flex:1;min-width:0;padding:10px 12px;border-radius:10px;border:1px solid var(--line);
  background:#0d1630;color:var(--ink);font-size:14px;outline:none}
#lb-name:focus{border-color:var(--cyan)}
#lb-send{padding:10px 14px;border:none;border-radius:10px;background:var(--cyan);color:#04141c;
  font-family:'Orbitron',sans-serif;font-weight:800;font-size:11px;letter-spacing:.5px;cursor:pointer}
#lb-send:disabled{opacity:.5}
.lb-msg{font-size:12px;color:var(--mut);min-height:16px;margin-top:6px}
.lb-run{margin:10px 0 0;padding:8px 10px;border-radius:10px;font-size:13px;
  background:rgba(57,255,158,.08);border:1px solid rgba(57,255,158,.3);color:#bff5d9}
#ed-panel{padding:6px 10px 12px;max-height:44vh;overflow-y:auto}
.ed-hd{font-family:'Orbitron',sans-serif;font-size:11px;letter-spacing:.5px;color:var(--cyan);text-align:center;margin:2px 0 8px}
#ed-tools,#ed-act{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:6px}
.ed-t.act{border-color:var(--cyan);color:var(--cyan);box-shadow:0 0 0 1px var(--cyan) inset}
.ed-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px 10px;margin:6px 0}
.ed-step{display:flex;align-items:center;justify-content:space-between;gap:6px;
  background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px 8px;font-size:12px}
.ed-step b{font-family:'Orbitron',sans-serif;min-width:22px;text-align:center;color:var(--cyan)}
.ed-b{width:26px;height:26px;border-radius:6px;border:1px solid var(--line);background:#0d1630;color:var(--ink);font-size:15px;cursor:pointer}
.ed-share{width:100%;margin-top:8px;padding:8px;border-radius:8px;border:1px solid var(--line);background:#0d1630;color:var(--cyan);font-size:11px}
</style>
</head>

<div id="ma-splash" aria-hidden="true">
  <div class="ma-ring mr1"></div><div class="ma-ring mr2"></div><div class="ma-ring mr3"></div>
  <div class="ma-stage">
    <div class="ma-pre">MATT'S APPS</div>
    <div class="ma-word">PRESENTS</div>
    <div class="ma-line"><i class="ma-orb"></i></div>

    <div class="ma-skip">tap to skip</div>

</div>

<div id="app">
  <div id="top">
    <div id="brand">LU<b>M</b>INS</div>
    <div class="stat save" id="s-saved">✦ 0/0</div>

  <div id="stage">
    <div id="wrap">
      <canvas id="cv" width="720" height="432"></canvas>
      <div id="tip"></div>

  <div id="tools"></div>
  <div id="bar">
    <button class="ctrl" id="c-pause">⏸ PAUSE</button>
    <button class="ctrl" id="c-speed">▶ 1×</button>
    <button class="ctrl" id="c-restart">↻ RESTART</button>
    <button class="ctrl" id="c-end">🏁 END</button>
    <button class="ctrl" id="c-sound">🔈 SOUND</button>
    <button class="ctrl" id="c-calm">☾ CALM</button>
    <button class="ctrl" id="c-daily">🔆 DAILY</button>
    <button class="ctrl" id="c-lvls">🗺 LEVELS</button>
    <button class="ctrl" id="c-lb">🏆 SCORES</button>
    <button class="ctrl" id="c-edit">✏️ MAKE</button>
  </div>
  <div id="ed-panel" style="display:none">
    <div class="ed-hd">✏️ LEVEL MAKER — paint, test, then share the link</div>

    <div id="ed-set"></div>
    <div id="ed-act"></div>
    <div class="lb-msg" id="ed-msg" style="text-align:center"></div>
    <input id="ed-share" class="ed-share" readonly style="display:none">
  </div>
</div>

/* ============================ LOAD LEVEL ============================ */
function defFromMap(L){
  var rows=L.map, w=0; for(var k=0;k<rows.length;k++) w=Math.max(w,rows[k].length);
  var grid=new Uint8Array(w*rows.length), ent={c:0,r:0}, ex={c:0,r:0};
  for(var r=0;r<rows.length;r++){ var line=rows[r];
    for(var c=0;c<w;c++){ var ch=c<line.length?line[c]:'.'; var v=0;
      if(ch==='#')v=1; else if(ch==='=')v=2; else if(ch==='%')v=3; else if(ch==='>')v=4; else if(ch==='<')v=5; else if(ch==='*')v=6;
      else if(ch==='E'){ent={c:c,r:r};} else if(ch==='X'){ex={c:c,r:r};}
      grid[r*w+c]=v; } }
  return {cols:w, rows:rows.length, grid:grid, entrance:ent, exit:ex,
    skills:{block:L.skills.block|0,dig:L.skills.dig|0,bash:L.skills.bash|0,build:L.skills.build|0,float:L.skills.float|0},
    total:L.total, target:L.target, spawn:L.spawn, start:L.start||1, name:L.name, hint:L.hint};
}

  G.def=d; G.cols=d.cols; G.rows=d.rows;

  G.entrance={c:d.entrance.c,r:d.entrance.r}; G.exit={c:d.exit.c,r:d.exit.r};
  G.lumins=[]; G.parts=[]; G.saved=0; G.out=0; G.spawned=0; G.dead=0;
  G.spawnT=0; G.armed=null; G.terrainDirty=true; G.mode="play"; G.crumbs={};
  G.lvl=(typeof d.lvl==="number")?d.lvl:-1;

/* ============================ GRID HELPERS ============================ */
function cellType(c,r){ if(c<0||r<0||c>=G.cols||r>=G.rows) return (r>=G.rows?0:2); return G.grid[r*G.cols+c]; }
function solid(c,r){ var t=cellType(c,r); return t===1||t===2||t===3; }
function steel(c,r){ return cellType(c,r)===2; }
function setEmpty(c,r){ if(c>=0&&r>=0&&c<G.cols&&r<G.rows && G.grid[r*G.cols+c]===1){ G.grid[r*G.cols+c]=0; G.terrainDirty=true; puff(c,r,"#7fa8ff",4);} }
function setTerrain(c,r){ if(c>=0&&r>=0&&c<G.cols&&r<G.rows && G.grid[r*G.cols+c]===0){ G.grid[r*G.cols+c]=1; G.terrainDirty=true; } }
function blockerAt(c,r){ for(var i=0;i<G.lumins.length;i++){var L=G.lumins[i]; if(L.state==="block"&&L.c===c&&L.r===r) return true;} return false; }
function isExit(c,r){ return c===G.exit.c && (r===G.exit.r || r===G.exit.r-1); }

/* ============================ LUMIN ============================ */
function spawn(){
  G.lumins.push({c:G.entrance.c, r:G.entrance.r, dir:G.def.start||1, state:"fall",
    timer:0, fall:0, floater:false, bricks:0, rx:G.entrance.c*CELL+CELL/2, ry:G.entrance.r*CELL+CELL, born:performance.now()});
  G.spawned++;
}

function stepLumin(L){
  if(L.state==="exit"||L.state==="dead") return;
  if(isExit(L.c,L.r)){ L.state="exit"; G.saved++; G.out++; ping(880); puff(L.c,L.r,"#39ff9e",10); return; }
  if(L.r>=G.rows+2){ L.state="dead"; L.dtime=performance.now(); G.dead++; G.out++; return; }
  if(cellType(L.c,L.r)===6){ L.state="dead"; L.dtime=performance.now(); G.dead++; G.out++; puff(L.c,L.r,"#b18cff",10); ping(150); return; }
  if(cellType(L.c,L.r+1)===3){ if(!G.crumbs) G.crumbs={}; var cidx=(L.r+1)*G.cols+L.c; if(!(cidx in G.crumbs)) G.crumbs[cidx]=22; }
  L.timer++;
  switch(L.state){
    case "walk":{
      if(L.timer<WALKINT) return; L.timer=0;
      if(!solid(L.c,L.r+1)){ L.state="fall"; L.fall=0; return; }
      if(blockerAt(L.c+L.dir,L.r)){ L.dir*=-1; return; }
      var gt=cellType(L.c+L.dir,L.r); if((gt===4&&L.dir<0)||(gt===5&&L.dir>0)){ L.dir*=-1; return; }
      if(solid(L.c+L.dir,L.r)){
        // wall: step up 1 if room
        if(!solid(L.c+L.dir,L.r-1) && !solid(L.c,L.r-1)){ L.c+=L.dir; L.r-=1; }
        else L.dir*=-1;
      } else {
        L.c+=L.dir;
        if(!solid(L.c,L.r+1)){
          if(solid(L.c,L.r+2)) L.r+=1;            // one-cell step down
          else { L.state="fall"; L.fall=0; }
        }
      }
      return;
    }
    case "fall":{
      var iv = L.floater?FLOATINT:FALLINT;
      if(L.timer<iv) return; L.timer=0;
      if(solid(L.c,L.r+1)){
        if(!L.floater && L.fall>MAXFALL){ L.state="dead"; L.dtime=performance.now(); G.dead++; G.out++; puff(L.c,L.r,"#9aa4b6",8); ping(180); }
        else { L.state="walk"; L.wave=false; if(L.pending) applyPending(L); }
        return;
      }
      L.r+=1; L.fall++;
      if(!L.floater && L.fall>MAXFALL) L.wave=true;
      return;
    }
    case "dig":{
      if(L.timer<DIGINT) return; L.timer=0;
      var below=cellType(L.c,L.r+1);
      if(below===2){ L.state="walk"; return; }
      if(below===1){ setEmpty(L.c,L.r+1); L.r+=1; ping(320); }
      else { L.state="walk"; }
      return;
    }
    case "bash":{
      if(L.timer<BASHINT) return; L.timer=0;
      var ah=cellType(L.c+L.dir,L.r), hd=cellType(L.c+L.dir,L.r-1);
      if(ah===2){ L.state="walk"; L.dir*=-1; return; }
      if(ah===1||hd===1){
        if(ah===1) setEmpty(L.c+L.dir,L.r);
        if(hd===1) setEmpty(L.c+L.dir,L.r-1);
        L.c+=L.dir; ping(300);
        if(!solid(L.c,L.r+1)){ L.state="fall"; L.fall=0; }
      } else { L.state="walk"; }
      return;
    }
    case "build":{
      if(L.timer<BUILDINT) return; L.timer=0;
      if(L.bricks<=0){ L.state="walk"; return; }
      var tc=L.c+L.dir;
      if(solid(tc,L.r)){ L.state="walk"; L.dir*=-1; return; }   // wall ahead
      setTerrain(tc,L.r+1);
      L.c=tc; L.bricks--; ping(440);
      return;
    }
    case "block": return;
  }
}

/* ============================ ASSIGN SKILL ============================ */
function assignable(L,type){
  if(L.state==="exit"||L.state==="dead"||L.state==="block") return false;
  if(type==="float") return !L.floater;                 // trait, even mid-air
  if(L.pending) return false;                            // one queued skill max
  return L.state==="walk"||L.state==="fall";             // falling? we queue it
}
function applyPending(L){
  var p=L.pending; L.pending=null; L.timer=0;
  if(p==="block") L.state="block";
  else if(p==="dig") L.state="dig";
  else if(p==="bash") L.state="bash";
  else if(p==="build"){ L.state="build"; L.bricks=BUILDLEN; }
}
function assign(L,type){
  if((G.skills[type]|0)<=0) return false;
  if(!assignable(L,type)) return false;
  if(type!=="float" && L.state==="fall"){               // queue for landing
    L.pending=type; G.skills[type]--; puff(L.c,L.r,skillCol(type),8); return true;
  }
  if(type==="float"){ L.floater=true; }
  else if(type==="block"){ L.state="block"; L.timer=0; }
  else if(type==="dig"){ L.state="dig"; L.timer=0; }
  else if(type==="bash"){ L.state="bash"; L.timer=0; }
  else if(type==="build"){ L.state="build"; L.timer=0; L.bricks=BUILDLEN; }
  G.skills[type]--; puff(L.c,L.r,skillCol(type),8); return true;
}
function skillCol(id){ for(var i=0;i<SKILLDEF.length;i++) if(SKILLDEF[i].id===id) return SKILLDEF[i].col; return "#fff"; }

/* ============================ SIM STEP ============================ */
function step(){
  if(G.state!=="play") return;
  // spawn
  if(G.spawned<G.def.total){ G.spawnT++; if(G.spawnT>=(G.def.spawn||SPAWNINT)){ G.spawnT=0; spawn(); } }
  for(var i=0;i<G.lumins.length;i++) stepLumin(G.lumins[i]);
  // crumbling soft stone
  if(G.crumbs){ for(var ck in G.crumbs){ if(--G.crumbs[ck]<=0){ var ci2=+ck;
    if(G.grid[ci2]===3){ G.grid[ci2]=0; G.terrainDirty=true; puff(ci2%G.cols,(ci2/G.cols)|0,"#ffc14d",6); ping(240); }
    delete G.crumbs[ck]; } } }
  // particles
  for(var p=G.parts.length-1;p>=0;p--){ var q=G.parts[p]; q.life--; q.x+=q.vx; q.y+=q.vy; q.vy+=0.05; if(q.life<=0) G.parts.splice(p,1); }
  // end condition
  var active=0; for(var j=0;j<G.lumins.length;j++){ var s=G.lumins[j].state; if(s!=="exit"&&s!=="dead"&&s!=="block") active++; }
  if(G.spawned>=G.def.total && active===0){ endLevel(); }
}
function endLevel(){
  G.state="over";
  try{ localStorage.setItem("lumins_total", (((+localStorage.getItem("lumins_total"))||0)+G.saved)+""); }catch(e){}
  noteResult();
  showResult(G.saved>=G.def.target);
}

/* ============================ PARTICLES ============================ */
function puff(c,r,col,n){
  if(G.calm||reduced) return;
  var x=c*CELL+CELL/2, y=r*CELL+CELL/2;
  for(var i=0;i<n;i++){ var a=Math.random()*6.283, sp=0.6+Math.random()*1.6;
    G.parts.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-0.6,life:16+Math.random()*14,col:col}); }
}

      ctx.strokeStyle="rgba(140,240,255,.9)"; ctx.lineWidth=1.8;
      for(var k=0;k<2;k++){ var off=(((ph+k*0.5)%1)-0.5)*CELL*0.7;
        var bx=x+CELL/2+dir*off;
        ctx.beginPath(); ctx.moveTo(bx-dir*3.5,y+3); ctx.lineTo(bx+dir*2.5,y+CELL/2); ctx.lineTo(bx-dir*3.5,y+CELL-3); ctx.stroke(); }
      ctx.restore();
    } else if(t===6){
      var tw=still?0.5:(0.5+0.5*Math.sin(now/260+c*7+r*13));
      ctx.save();
      var sg=ctx.createRadialGradient(x+CELL/2,y+CELL/2,1,x+CELL/2,y+CELL/2,CELL*0.95);
      sg.addColorStop(0,"rgba(177,140,255,"+(0.28+0.24*tw).toFixed(3)+")"); sg.addColorStop(1,"rgba(177,140,255,0)");
      ctx.fillStyle=sg; ctx.fillRect(x-CELL*0.45,y-CELL*0.45,CELL*1.9,CELL*1.9);
      ctx.fillStyle="#b18cff";
      ctx.beginPath(); ctx.moveTo(x+CELL*0.5,y+2); ctx.lineTo(x+CELL*0.72,y+CELL-2); ctx.lineTo(x+CELL*0.28,y+CELL-2); ctx.closePath(); ctx.fill();
      ctx.fillStyle="rgba(220,200,255,.9)";
      ctx.beginPath(); ctx.moveTo(x+CELL*0.24,y+CELL*0.36); ctx.lineTo(x+CELL*0.34,y+CELL-2); ctx.lineTo(x+CELL*0.14,y+CELL-2); ctx.closePath(); ctx.fill();
      ctx.restore();
    }
  }
  if(G.crumbs && !still){ ctx.save();
    for(var ck2 in G.crumbs){ var ii=+ck2, cc=ii%G.cols, rr=(ii/G.cols)|0;
      var jx=Math.sin(now/23+ii)*1.4, urg=1-(G.crumbs[ck2]/22);
      ctx.globalAlpha=0.25+urg*0.4; ctx.fillStyle="#ffdf9e";
      ctx.fillRect(cc*CELL+jx, rr*CELL, CELL, 2);
      ctx.globalAlpha=urg*0.28; ctx.fillStyle="#ff9a4c";
      ctx.fillRect(cc*CELL+jx, rr*CELL, CELL, CELL); }
    ctx.restore(); ctx.globalAlpha=1; }
}
function drawMotes(){
  if(G.calm||reduced||!G.motes) return;
  var now=performance.now();
  ctx.save(); ctx.globalCompositeOperation="lighter";
  for(var i=0;i<G.motes.length;i++){ var m=G.motes[i];
    var yy=m.y-((now*0.03*m.spd)%(cv.height+20)); if(yy<-10) yy+=cv.height+20;
    var xx=m.x+Math.sin(now/1000*m.spd+m.ph)*m.sway;
    ctx.globalAlpha=Math.max(0,0.22+0.25*Math.sin(now/700+m.ph));
    ctx.fillStyle=m.hue+"1)";
    ctx.beginPath(); ctx.arc(xx,yy,m.r,0,6.283); ctx.fill();
  }
  ctx.restore(); ctx.globalAlpha=1;
}
function render(){
  ctx.clearRect(0,0,cv.width,cv.height);

    for(var i=0;i<G.parts.length;i++){ var q=G.parts[i]; ctx.globalAlpha=Math.max(0,q.life/28);

function canvasCell(ev){
  var rect=cv.getBoundingClientRect();
  var px=(ev.clientX-rect.left)/scale, py=(ev.clientY-rect.top)/scale;
  return {c:Math.floor(px/CELL), r:Math.floor(py/CELL), px:px, py:py};
}
function pickLumin(px,py){
  var rad=Math.max(CELL*1.4, 34/(scale||1));       // ~34 screen px whatever the zoom
  var best=null,bd=rad, bestOk=null,bdOk=rad;
  for(var i=0;i<G.lumins.length;i++){ var L=G.lumins[i]; if(L.state==="exit"||L.state==="dead") continue;
    var d=Math.hypot(L.rx-px, L.ry-py); if(d>=rad) continue;
    if(d<bd){ bd=d; best=L; }
    if(G.armed && d<bdOk && assignable(L,G.armed)){ bdOk=d; bestOk=L; }
  }
  return bestOk||best;                              // prefer one that can take the skill
}

  if(G.state!=="play") return; if(!G.armed){ tip("Pick a skill first"); return; }

  if(!L){ tip("Tap right on a lumin"); return; }
  if(assign(L,G.armed)){ ping(520); buildTools(); if((G.skills[G.armed]|0)<=0) G.armed=null; buildTools(); }

  if(!G.paused && G.state==="play"){ acc+=dt*G.speed; var STEP=1000/TICKHZ; var guard=0;
    while(acc>=STEP && guard<8){ step(); acc-=STEP; guard++; } if(acc>300)acc=0; }
  render(); if(G.mode==="edit") drawEditorOverlay(); requestAnimationFrame(frame);
}

/* ===== seals: bronze = target, silver = midpoint (or level.silver), gold = all ===== */
function silverOf(L){ return L.silver || Math.min(goldOf(L), L.target + Math.ceil((goldOf(L)-L.target)/2)); }
function goldOf(L){ return L.gold || L.total; }
function sealFor(L,saved){ if(saved>=goldOf(L)) return 3; if(saved>=silverOf(L)) return 2; if(saved>=L.target) return 1; return 0; }
function bestSeal(i){ var L=LEVELS[i]; if(!L) return 0; return sealFor(L, RUN.best[i]|0); }
function unlocked(i){ return i===0 || bestSeal(i-1)>=1; }
function sealTally(){ var t=[0,0,0,0]; for(var i=0;i<LEVELS.length;i++) t[bestSeal(i)]++; return t; }

/* ===== Daily Lumin: seeded, constructive, verified by the solver bot ===== */
function mulberry(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; var t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function todayStr(){ var d=new Date(), m=d.getMonth()+1, dy=d.getDate();
  return ""+d.getFullYear()+(m<10?"0":"")+m+(dy<10?"0":"")+dy; }
function prettyDay(s){ var mo=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return (+s.slice(6,8))+" "+mo[(+s.slice(4,6))-1]+" "+s.slice(0,4); }
function genDaily(seed,attempt){
  var rng=mulberry(seed*131+attempt*7919+11), cols=40, rows=24, grid=new Uint8Array(cols*rows);
  function set(c,r,v){ if(c>=0&&r>=0&&c<cols&&r<rows) grid[r*cols+c]=v; }
  function floorTo(a,b,R){ for(var c=a;c<=b;c++) set(c,R,2); }
  var R=9, c=2, sk={block:0,dig:0,bash:0,build:0,float:0}, usedDig=false;
  for(var r0=R-5;r0<=R;r0++) set(1,r0,2);                    // left boundary
  var ent={c:3,r:R-3};
  var pad=4+((rng()*3)|0); floorTo(c,c+pad,R); c+=pad+1;
  var nH=3+((rng()*3)|0);
  for(var h=0;h<nH && c<27;h++){
    var roll=rng(), type=(!usedDig&&roll<0.3&&h>0)?"dig":(roll<0.62?"gap":"wall");
    if(type==="gap"){ var w=3+((rng()*3)|0); sk.build++; c+=w; }
    else if(type==="wall"){ set(c,R-1,1); set(c,R-2,1); set(c,R,2); c+=1; sk.bash++; }
    else { // dig descent R -> 15
      set(c,R,1); for(var rr=R+1;rr<=R+4;rr++) set(c,rr,1);
      set(c+1,R-1,2); set(c+1,R-2,2); set(c+1,R,2);
      usedDig=true; sk.dig++; var oldR=R; R=15; floorTo(c,c+2,R); c+=2; }
    var p2=3+((rng()*3)|0); floorTo(c,c+p2,R); c+=p2+1;
  }
  floorTo(c,Math.min(c+3,38),R);
  var ex={c:Math.min(c+1,37), r:R-1};
  // one spare tool of a used type, for kindness
  var used=["build","bash","dig"].filter(function(k){return sk[k]>0;});
  if(used.length) sk[used[(rng()*used.length)|0]]++;
  var total=8+((rng()*5)|0), target=Math.max(3,Math.round(total*(0.55+rng()*0.15)));
  return {cols:cols,rows:rows,grid:grid,entrance:ent,exit:ex,skills:sk,
    total:total,target:target,spawn:16+((rng()*12)|0),start:1,
    name:"Daily Lumin", hint:"A brand-new board, the same for everyone today. Save as many as you can, then share your score — tomorrow brings a new one."};
}
function makeDaily(dateStr){
  var seed=parseInt(dateStr,10)||20260101, d=null, r={solved:false};
  for(var a=0;a<60;a++){ d=genDaily(seed,a); r=simulate(d); if(r.solved && r.saved>=d.target) break; }
  d.daily=dateStr; d.name="Daily Lumin · "+prettyDay(dateStr);
  return d;
}

function dailyStreak(){

function b64urlFromBytes(bytes){ var bin=""; for(var i=0;i<bytes.length;i++) bin+=String.fromCharCode(bytes[i]);
  return btoa(bin).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); }
function bytesFromB64url(str){ str=str.replace(/-/g,"+").replace(/_/g,"/"); while(str.length%4)str+="=";
  var bin=atob(str), a=new Uint8Array(bin.length); for(var i=0;i<bin.length;i++) a[i]=bin.charCodeAt(i); return a; }
function encodeLevel(d){
  var head=[1,d.cols,d.rows,d.entrance.c,d.entrance.r,d.exit.c,d.exit.r,d.total,d.target,d.spawn,
    d.skills.block,d.skills.dig,d.skills.bash,d.skills.build,d.skills.float];
  var rle=[], g=d.grid, n=g.length, i=0;
  while(i<n){ var v=g[i], j=i+1; while(j<n && g[j]===v && (j-i)<255) j++; rle.push(v, j-i); i=j; }
  var bytes=new Uint8Array(head.length+rle.length); bytes.set(head,0); bytes.set(rle,head.length);
  return b64urlFromBytes(bytes);
}
function decodeLevel(str){
  var b=bytesFromB64url(str); if(b[0]!==1) throw "version";
  var cols=b[1], rows=b[2];
  if(!cols||!rows||cols>80||rows>60) throw "dims";
  var d={cols:cols, rows:rows, entrance:{c:b[3],r:b[4]}, exit:{c:b[5],r:b[6]},
    total:b[7], target:b[8], spawn:b[9],
    skills:{block:b[10],dig:b[11],bash:b[12],build:b[13],float:b[14]}};
  var grid=new Uint8Array(cols*rows), gi=0, k=15;
  while(k+1<b.length && gi<grid.length){ var v=b[k++], cnt=b[k++]; for(var q=0;q<cnt&&gi<grid.length;q++) grid[gi++]=v; }
  if(gi!==grid.length) throw "size";
  d.grid=grid; d.start=1; d.name="✦ Shared Level";
  d.hint="Someone built this level for you — save "+d.target+" of "+d.total+" lumins!";
  return d;
}

/* in-browser solvability check (reuses the real engine on a temp state) */
function simulate(d){
  var keys=["grid","cols","rows","lumins","parts","saved","out","spawned","dead","entrance","exit","skills","def","state","spawnT","armed","sound","mode"];
  var snap={}; for(var q=0;q<keys.length;q++) snap[keys[q]]=G[keys[q]];
  G.cols=d.cols; G.rows=d.rows; G.grid=new Uint8Array(d.grid);
  G.entrance={c:d.entrance.c,r:d.entrance.r}; G.exit={c:d.exit.c,r:d.exit.r};
  G.lumins=[]; G.parts=[]; G.saved=0; G.out=0; G.spawned=0; G.dead=0; G.spawnT=0; G.armed=null;
  G.skills={}; for(var s in d.skills) G.skills[s]=d.skills[s];
  G.def={total:d.total,target:d.target,spawn:d.spawn,start:d.start||1}; G.state="play"; G.sound=false; G.mode="sim";
  for(var t=0;t<12000;t++){
    if(G.spawned<G.def.total){ G.spawnT++; if(G.spawnT>=(G.def.spawn||SPAWNINT)){ G.spawnT=0; spawn(); } }
    for(var i=0;i<G.lumins.length;i++) stepLumin(G.lumins[i]);
    for(var j=0;j<G.lumins.length;j++){ var L=G.lumins[j]; if(L.state!=="walk") continue;
      var c2=L.c+L.dir;
      var gap=!solid(c2,L.r+1)&&!solid(c2,L.r);
      var big=gap&&!solid(c2,L.r+2)&&!solid(c2,L.r+3)&&!solid(c2,L.r+4)&&!solid(c2,L.r+5);
      var wallT=cellType(c2,L.r)===1&&solid(c2,L.r-1);
      var steelW=cellType(c2,L.r)===2&&solid(c2,L.r-1);
      if(big&&(G.skills.float|0)>0) assign(L,"float");
      else if(gap&&(G.skills.build|0)>0) assign(L,"build");
      else if(wallT&&(G.skills.bash|0)>0) assign(L,"bash");
      else if(steelW&&cellType(L.c,L.r+1)===1&&(G.skills.dig|0)>0) assign(L,"dig");
    }
    var active=0; for(var k=0;k<G.lumins.length;k++){ var st=G.lumins[k].state; if(st!=="exit"&&st!=="dead") active++; }
    if(G.spawned>=G.def.total && active===0) break;
  }
  var res={solved:G.saved>=d.target, saved:G.saved};
  for(var q2=0;q2<keys.length;q2++) G[keys[q2]]=snap[keys[q2]];
  G.terrainDirty=true;
  return res;
}
