<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="lh-sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#BAD9F2"/>
      <stop offset="60%" stop-color="#8FBFE8"/>
      <stop offset="100%" stop-color="#7FB2E0"/>
    </linearGradient>
    <filter id="lh-soft"><feGaussianBlur stdDeviation="1.2"/></filter>
    <filter id="lh-hazy"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#lh-sky)"/>

  <!-- sun haze, top right, gentle -->
  <circle cx="1700" cy="140" r="180" fill="#FFF3C4" opacity="0.35" filter="url(#lh-hazy)"/>
  <circle cx="1700" cy="140" r="60" fill="#FFEFAE" opacity="0.5" filter="url(#lh-soft)"/>

  <!-- cloud bank: soft ellipse clusters, edges of frame, centre kept clear -->
  <g fill="#F6F9FD" filter="url(#lh-soft)">
    <!-- top left cluster -->
    <g opacity="0.9">
      <ellipse cx="220" cy="150" rx="150" ry="42"/>
      <ellipse cx="320" cy="120" rx="100" ry="36"/>
      <ellipse cx="130" cy="120" rx="80" ry="30"/>
    </g>
    <!-- mid left, fainter -->
    <g opacity="0.55">
      <ellipse cx="90" cy="520" rx="130" ry="34"/>
      <ellipse cx="180" cy="495" rx="80" ry="26"/>
    </g>
    <!-- right edge -->
    <g opacity="0.75">
      <ellipse cx="1800" cy="480" rx="160" ry="40"/>
      <ellipse cx="1690" cy="455" rx="90" ry="30"/>
    </g>
    <!-- low wide band near bottom -->
    <g opacity="0.6">
      <ellipse cx="480" cy="1010" rx="260" ry="48"/>
      <ellipse cx="660" cy="985" rx="150" ry="36"/>
      <ellipse cx="1400" cy="1030" rx="300" ry="52"/>
      <ellipse cx="1590" cy="1000" rx="160" ry="38"/>
    </g>
    <!-- small drifting puffs -->
    <ellipse cx="900" cy="90" rx="70" ry="20" opacity="0.5"/>
    <ellipse cx="1200" cy="220" rx="55" ry="16" opacity="0.4"/>
  </g>

  <!-- Magritte bowler hat, floating top-right of centre, quiet -->
  <g transform="translate(1310,240)" opacity="0.28">
    <ellipse cx="0" cy="26" rx="74" ry="12" fill="#16233B"/>
    <path d="M-44 24 Q-44 -34 0 -34 Q44 -34 44 24 Z" fill="#16233B"/>
    <path d="M-44 12 Q0 24 44 12" stroke="#2c3e5c" stroke-width="2" fill="none" opacity="0.6"/>
  </g>

  <!-- dove silhouette (Magritte cut-out bird), left mid-air -->
  <g transform="translate(430,300) scale(1.05)" opacity="0.30" fill="#F6F9FD">
    <path d="M0 30 Q28 -6 62 6 Q46 12 44 22 Q78 10 104 26 Q76 30 66 40 Q90 44 100 58 Q70 54 52 60 Q60 74 52 88 Q42 70 30 62 Q10 56 0 30 Z"/>
  </g>
  <!-- second smaller dove, far right low -->
  <g transform="translate(1620,720) scale(0.6) rotate(-8)" opacity="0.22" fill="#F6F9FD">
    <path d="M0 30 Q28 -6 62 6 Q46 12 44 22 Q78 10 104 26 Q76 30 66 40 Q90 44 100 58 Q70 54 52 60 Q60 74 52 88 Q42 70 30 62 Q10 56 0 30 Z"/>
  </g>

  <!-- faint horizon suggestion at very bottom -->
  <rect x="0" y="1064" width="1920" height="16" fill="#6FA6D8" opacity="0.5"/>
</svg>
