<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="launch_animal_systems_data4-title launch_animal_systems_data4-desc"><title id="launch_animal_systems_data4-title">Distinguish a hormone message from a transported fuel</title><desc id="launch_animal_systems_data4-desc">Two related but distinct routes. Insulin released by pancreatic beta cells is carried in blood and signals responsive target tissues. Glucose is carried as a material; insulin promotes uptake in responsive tissues and glycogen storage in liver/muscle. The model does not imply all glucose uptake requires insulin.</desc><defs><marker id="launch_animal_systems_data4-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><text font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="30" y="50">Distinguish a hormone message from a transported fuel</tspan></text><rect x="45" y="120" width="270" height="125" fill="#F0EBF5" stroke="#7A5C9E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="180" y="169">Pancreatic</tspan><tspan x="180" y="201.4">beta cells</tspan></text><rect x="650" y="120" width="305" height="125" fill="#F0EBF5" stroke="#7A5C9E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="802.5" y="156">Responsive tissues</tspan><tspan x="802.5" y="184.8">Receive an</tspan><tspan x="802.5" y="213.6">insulin signal</tspan></text><defs><marker id="launch_animal_systems_data4-arrow-5" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#7A5C9E"/></marker></defs><line x1="330" y1="180" x2="630" y2="180" fill="none" stroke="#7A5C9E" stroke-width="4" marker-end="url(#launch_animal_systems_data4-arrow-5)"/><text font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="480" y="156">Insulin in blood</tspan></text><rect x="45" y="330" width="270" height="125" fill="#EEF3F7" stroke="#4D82A0" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="180" y="377">Glucose</tspan><tspan x="180" y="409.4">in blood</tspan></text><rect x="650" y="330" width="305" height="125" fill="#EEF3F7" stroke="#4D82A0" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="802.5" y="371">Glucose uptake /</tspan><tspan x="802.5" y="402.2">glycogen storage</tspan><tspan x="802.5" y="433.4">are promoted</tspan></text><defs><marker id="launch_animal_systems_data4-arrow-11" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#4D82A0"/></marker></defs><line x1="330" y1="390" x2="630" y2="390" fill="none" stroke="#4D82A0" stroke-width="4" marker-end="url(#launch_animal_systems_data4-arrow-11)"/><text font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="480" y="449">Glucose is a material</tspan></text><defs><marker id="launch_animal_systems_data4-arrow-13" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#7A5C9E"/></marker></defs><line x1="805" y1="260" x2="805" y2="310" fill="none" stroke="#7A5C9E" stroke-width="4" marker-end="url(#launch_animal_systems_data4-arrow-13)"/><text font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="45" y="521">Insulin is a signal; it is not converted into glycogen.</tspan></text></svg>