<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="launch_animal_systems_data6-title launch_animal_systems_data6-desc"><title id="launch_animal_systems_data6-title">Oxygen supply is a linked pathway</title><desc id="launch_animal_systems_data6-desc">Schematic pathway: ventilation replenishes alveolar air; oxygen diffuses into pulmonary blood; heart-driven circulation carries oxygen to tissue capillaries; oxygen diffuses towards cells down a gradient. Cells use oxygen in aerobic respiration. It is not a quantitative supply model.</desc><defs><marker id="launch_animal_systems_data6-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><text font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="30" y="50">Oxygen supply is a linked pathway</tspan></text><rect x="50" y="110" width="390" height="135" fill="#F0EBF5" stroke="#7A5C9E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="245" y="157">Ventilation</tspan><tspan x="245" y="189.4">Replenishes alveolar air</tspan></text><rect x="555" y="110" width="390" height="135" fill="#F0EBF5" stroke="#7A5C9E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="750" y="156">Lung exchange</tspan><tspan x="750" y="187.2">Oxygen diffuses</tspan><tspan x="750" y="218.4">into blood</tspan></text><rect x="555" y="325" width="390" height="150" fill="#F0EBF5" stroke="#7A5C9E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="750" y="371">Circulation</tspan><tspan x="750" y="402.2">Carries oxygen towards</tspan><tspan x="750" y="433.4">tissue capillaries</tspan></text><rect x="50" y="325" width="390" height="150" fill="#F0EBF5" stroke="#7A5C9E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="245" y="371">Tissue exchange</tspan><tspan x="245" y="402.2">Oxygen diffuses to cells</tspan><tspan x="245" y="433.4">for aerobic respiration</tspan></text><defs><marker id="launch_animal_systems_data6-arrow-9" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#7A5C9E"/></marker></defs><line x1="453" y1="175" x2="540" y2="175" fill="none" stroke="#7A5C9E" stroke-width="4" marker-end="url(#launch_animal_systems_data6-arrow-9)"/><defs><marker id="launch_animal_systems_data6-arrow-10" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#7A5C9E"/></marker></defs><line x1="750" y1="260" x2="750" y2="310" fill="none" stroke="#7A5C9E" stroke-width="4" marker-end="url(#launch_animal_systems_data6-arrow-10)"/><defs><marker id="launch_animal_systems_data6-arrow-11" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#7A5C9E"/></marker></defs><line x1="540" y1="395" x2="455" y2="395" fill="none" stroke="#7A5C9E" stroke-width="4" marker-end="url(#launch_animal_systems_data6-arrow-11)"/><text font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="50" y="519">Each link has a different mechanism; one number cannot describe them all.</tspan></text></svg>