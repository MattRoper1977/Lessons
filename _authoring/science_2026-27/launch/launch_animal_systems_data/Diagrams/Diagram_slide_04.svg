<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="launch_animal_systems_data3-title launch_animal_systems_data3-desc"><title id="launch_animal_systems_data3-title">Constructed pump records: calculate both factors</title><desc id="launch_animal_systems_data3-desc">Constructed teaching records. Pump A: 60 beats/min × 70 mL/beat = 4,200 mL/min = 4.2 L/min. Pump B: 90 × 60 = 5,400 mL/min = 5.4 L/min. These are not observations of pupils or diagnostic reference ranges.</desc><defs><marker id="launch_animal_systems_data3-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><text font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="30" y="50">Constructed pump records: calculate both factors</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="40" y="101">Model pump output (L/min)</tspan></text><line x1="120" y1="450" x2="925" y2="450" fill="none" stroke="#1F2937" stroke-width="4"/><line x1="120" y1="135" x2="120" y2="450" fill="none" stroke="#1F2937" stroke-width="4"/><line x1="120" y1="450" x2="925" y2="450" fill="none" stroke="#D9D4E0" stroke-width="1"/><text font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="end" fill="#1F2937"><tspan x="105" y="456">0</tspan></text><line x1="120" y1="375" x2="925" y2="375" fill="none" stroke="#D9D4E0" stroke-width="1"/><text font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="end" fill="#1F2937"><tspan x="105" y="381">1.5</tspan></text><line x1="120" y1="300" x2="925" y2="300" fill="none" stroke="#D9D4E0" stroke-width="1"/><text font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="end" fill="#1F2937"><tspan x="105" y="306">3</tspan></text><line x1="120" y1="225" x2="925" y2="225" fill="none" stroke="#D9D4E0" stroke-width="1"/><text font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="end" fill="#1F2937"><tspan x="105" y="231">4.5</tspan></text><line x1="120" y1="150" x2="925" y2="150" fill="none" stroke="#D9D4E0" stroke-width="1"/><text font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="end" fill="#1F2937"><tspan x="105" y="156">6</tspan></text><rect x="155" y="240" width="335" height="210" fill="#DACEEC" stroke="#7A5C9E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="322.5" y="225">4.2</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="322.5" y="490">A</tspan></text><rect x="525" y="180" width="335" height="270" fill="#DACEEC" stroke="#7A5C9E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="692.5" y="165">5.4</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="692.5" y="490">B</tspan></text></svg>