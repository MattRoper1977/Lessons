<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="launch_disease_data_newsroom3-title launch_disease_data_newsroom3-desc"><title id="launch_disease_data_newsroom3-title">I keep the denominator in the calculation</title><desc id="launch_disease_data_newsroom3-desc">Worked constructed example:12 new cases among 2000 people during the same 7 days.12 divided by 2000 times 1000 equals 6 new cases per 1000 people over 7 days. This is a period proportion expressed per 1000, not a person-time incidence rate.</desc><defs><marker id="launch_disease_data_newsroom3-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><text font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="30" y="50">I keep the denominator in the calculation</tspan></text><rect x="65" y="135" width="360" height="125" fill="#F0EBF5" stroke="#7A5C9E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="245" y="185">12 new cases</tspan><tspan x="245" y="221">2000 people at risk</tspan></text><defs><marker id="launch_disease_data_newsroom3-arrow-3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#7A5C9E"/></marker></defs><line x1="440" y1="200" x2="565" y2="200" fill="none" stroke="#7A5C9E" stroke-width="4" marker-end="url(#launch_disease_data_newsroom3-arrow-3)"/><rect x="590" y="135" width="345" height="125" fill="#F0EBF5" stroke="#7A5C9E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="762.5" y="188">6 cases per 1000</tspan><tspan x="762.5" y="224">over 7 days</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="38" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="497.5" y="353">12 ÷ 2000 × 1000 = 6</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="500" y="438">Same disease definition, same period,</tspan><tspan x="500" y="471.6">comparable recording and population.</tspan></text></svg>