<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="launch_photosynthesis_light_lab4-title launch_photosynthesis_light_lab4-desc"><title id="launch_photosynthesis_light_lab4-title">Constructed results: compare mean bubble rates</title><desc id="launch_photosynthesis_light_lab4-desc">Constructed sample means: at 300 lux 5 bubbles/min,600 lux 10 bubbles/min,1200 lux 17 bubbles/min. The categorical axis represents measured light levels. Bubble count is a proxy, not exact oxygen volume.</desc><defs><marker id="launch_photosynthesis_light_lab4-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><text font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="30" y="50">Constructed results: compare mean bubble rates</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="40" y="101">Mean bubbles per minute; light sensor level below</tspan></text><line x1="120" y1="450" x2="925" y2="450" fill="none" stroke="#1F2937" stroke-width="4"/><line x1="120" y1="135" x2="120" y2="450" fill="none" stroke="#1F2937" stroke-width="4"/><line x1="120" y1="450" x2="925" y2="450" fill="none" stroke="#D9D4E0" stroke-width="1"/><text font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="end" fill="#1F2937"><tspan x="105" y="456">0</tspan></text><line x1="120" y1="375" x2="925" y2="375" fill="none" stroke="#D9D4E0" stroke-width="1"/><text font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="end" fill="#1F2937"><tspan x="105" y="381">5</tspan></text><line x1="120" y1="300" x2="925" y2="300" fill="none" stroke="#D9D4E0" stroke-width="1"/><text font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="end" fill="#1F2937"><tspan x="105" y="306">10</tspan></text><line x1="120" y1="225" x2="925" y2="225" fill="none" stroke="#D9D4E0" stroke-width="1"/><text font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="end" fill="#1F2937"><tspan x="105" y="231">15</tspan></text><line x1="120" y1="150" x2="925" y2="150" fill="none" stroke="#D9D4E0" stroke-width="1"/><text font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="end" fill="#1F2937"><tspan x="105" y="156">20</tspan></text><rect x="155" y="375" width="211.667" height="75" fill="#DACEEC" stroke="#7A5C9E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="260.833" y="360">5</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="260.833" y="490">300 lux</tspan></text><rect x="401.667" y="300" width="211.667" height="150" fill="#DACEEC" stroke="#7A5C9E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="507.5" y="285">10</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="507.5" y="490">600 lux</tspan></text><rect x="648.333" y="195" width="211.667" height="255" fill="#DACEEC" stroke="#7A5C9E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="754.167" y="180">17</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="754.167" y="490">1200 lux</tspan></text></svg>