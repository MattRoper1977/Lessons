<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="launch_photosynthesis_light_lab2-title launch_photosynthesis_light_lab2-desc"><title id="launch_photosynthesis_light_lab2-title">Matter changes; light supplies the energy</title><desc id="launch_photosynthesis_light_lab2-desc">Photosynthesis word equation. Carbon dioxide and water are converted into glucose and oxygen using light energy absorbed by chlorophyll. The process takes in energy; light is not a material reactant.</desc><defs><marker id="launch_photosynthesis_light_lab2-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><text font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="30" y="50">Matter changes; light supplies the energy</tspan></text><rect x="45" y="205" width="305" height="135" fill="#F0EBF5" stroke="#7A5C9E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="197.5" y="255">Carbon dioxide</tspan><tspan x="197.5" y="291">+ water</tspan></text><defs><marker id="launch_photosynthesis_light_lab2-arrow-3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#7A5C9E"/></marker></defs><line x1="365" y1="270" x2="625" y2="270" fill="none" stroke="#7A5C9E" stroke-width="4" marker-end="url(#launch_photosynthesis_light_lab2-arrow-3)"/><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="middle" fill="#C9803B"><tspan x="495" y="173">Light energy</tspan><tspan x="495" y="206.6">chlorophyll</tspan></text><rect x="650" y="205" width="305" height="135" fill="#F0EBF5" stroke="#7A5C9E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="802.5" y="255">Glucose</tspan><tspan x="802.5" y="291">+ oxygen</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="500" y="437">Glucose can build biomass or be used in respiration.</tspan><tspan x="500" y="469.4">Photosynthesis takes in energy.</tspan></text></svg>