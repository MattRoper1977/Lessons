<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="launch_photosynthesis_light_lab6-title launch_photosynthesis_light_lab6-desc"><title id="launch_photosynthesis_light_lab6-title">Change light; monitor temperature</title><desc id="launch_photosynthesis_light_lab6-desc">Schematic supervised pondweed setup with LED lamp, distance ruler, vessel of solution, shoot, bubbles, light sensor and thermometer. It models apparatus positions, not a scale drawing or an exact gas-volume method.</desc><defs><marker id="launch_photosynthesis_light_lab6-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><text font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="30" y="50">Change light; monitor temperature</tspan></text><rect x="45" y="175" width="130" height="110" fill="#F9E8C9" stroke="#C9803B" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="110" y="217">Cool LED</tspan><tspan x="110" y="249.4">lamp</tspan></text><defs><marker id="launch_photosynthesis_light_lab6-arrow-3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#C9803B"/></marker></defs><line x1="190" y1="210" x2="465" y2="210" fill="none" stroke="#C9803B" stroke-width="4" marker-end="url(#launch_photosynthesis_light_lab6-arrow-3)"/><rect x="490" y="120" width="300" height="305" fill="#ECF4F9" stroke="#4D82A0" stroke-width="3"/><line x1="505" y1="170" x2="775" y2="170" fill="none" stroke="#4D82A0" stroke-width="3"/><line x1="635" y1="365" x2="635" y2="220" fill="none" stroke="#3F7D6E" stroke-width="9"/><line x1="635" y1="330" x2="580" y2="295" fill="none" stroke="#3F7D6E" stroke-width=