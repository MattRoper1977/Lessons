<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="launch_disease_detectives4-title launch_disease_detectives4-desc"><title id="launch_disease_detectives4-title">Risk is not a single switch</title><desc id="launch_disease_detectives4-desc">A conceptual risk diagram with inherited, environmental and behavioural factors converging on the probability of a non-communicable disease. No numerical prediction or blame is implied.</desc><defs><marker id="launch_disease_detectives4-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><text font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="30" y="50">Risk is not a single switch</tspan></text><rect x="45" y="115" width="275" height="135" fill="#F0EBF5" stroke="#7A5C9E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="182.5" y="165">Inherited and</tspan><tspan x="182.5" y="198.6">body factors</tspan></text><rect x="362" y="115" width="275" height="135" fill="#F0EBF5" stroke="#7A5C9E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="499.5" y="165">Environment</tspan><tspan x="499.5" y="198.6">and exposures</tspan></text><rect x="680" y="115" width="275" height="135" fill="#F0EBF5" stroke="#7A5C9E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="817.5" y="165">Behaviour and</tspan><tspan x="817.5" y="198.6">circumstances</tspan></text><defs><marker id="launch_disease_detectives4-arrow-7" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#7A5C9E"/></marker></defs><line x1="200" y1="265" x2="380" y2="355" fill="none" stroke="#7A5C9E" stroke-width="4" marker-end="url(#launch_disease_detectives4-arrow-7)"/><defs><marker id="launch_disease_detectives4-arrow-8" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#7A5C9E"/></marker></defs><line x1="500" y1="265" x2="500" y2="355" fill="none" stroke="#7A5C9E" stroke-width="4" marker-end="url(#launch_disease_detectives4-arrow-8)"/><defs><marker id="launch_disease_detectives4-arrow-9" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#7A5C9E"/></marker></defs><line x1="817" y1="265" x2="620" y2="355" fill="none" stroke="#7A5C9E" stroke-width="4" marker-end="url(#launch_disease_detectives4-arrow-9)"/><rect x="285" y="365" width="430" height="105" fill="#F0EBF5" stroke="#7A5C9E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="500" y="416">Can alter the chance</tspan><tspan x="500" y="447.2">of disease</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="45" y="525">Risk is not certainty. Illness is not a blame label.</tspan></text></svg>