<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="launch_disease_detectives2-title launch_disease_detectives2-desc"><title id="launch_disease_detectives2-title">Classify using the cause, not the symptom</title><desc id="launch_disease_detectives2-desc">A branching comparison: communicable disease involves a transmissible infectious cause; non-communicable disease is not transmitted. Cough is deliberately shown with both tuberculosis and asthma.</desc><defs><marker id="launch_disease_detectives2-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><text font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="30" y="50">Classify using the cause, not the symptom</tspan></text><rect x="45" y="110" width="415" height="145" fill="#F0EBF5" stroke="#7A5C9E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="65" y="156">Communicable</tspan><tspan x="65" y="189.6">Transmissible pathogen</tspan></text><rect x="540" y="110" width="415" height="145" fill="#F0EBF5" stroke="#7A5C9E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="560" y="156">Non-communicable</tspan><tspan x="560" y="189.6">Not transmitted</tspan></text><rect x="45" y="330" width="415" height="145" fill="#F0EBF5" stroke="#7A5C9E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="65" y="376">Tuberculosis: bacterium</tspan><tspan x="65" y="409.6">Can involve coughing</tspan></text><rect x="540" y="330" width="415" height="145" fill="#F0EBF5" stroke="#7A5C9E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="560" y="373">Asthma: airway condition</tspan><tspan x="560" y="403">Cough can occur</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="40" y="520">The same symptom can have different causes.</tspan></text></svg>