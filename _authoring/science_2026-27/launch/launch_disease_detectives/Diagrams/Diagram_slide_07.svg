<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="launch_disease_detectives6-title launch_disease_detectives6-desc"><title id="launch_disease_detectives6-title">Malaria: a vector connects hosts</title><desc id="launch_disease_detectives6-desc">A simplified malaria transmission model. An infected person may infect a mosquito feeding on them; an infected mosquito can pass the malaria protist to another person when biting. Not every mosquito is a malaria vector; this is a route model, not a forecast.</desc><defs><marker id="launch_disease_detectives6-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><text font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="30" y="50">Malaria: a vector connects hosts</tspan></text><rect x="50" y="160" width="235" height="150" fill="#F0EBF5" stroke="#7A5C9E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="167.5" y="215">Infected</tspan><tspan x="167.5" y="251">person</tspan></text><ellipse cx="500" cy="235" rx="110" ry="65" fill="#E4F0E9" stroke="#3F7D6E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="500" y="223">Mosquito</tspan><tspan x="500" y="256.6">vector</tspan></text><rect x="710" y="160" width="240" height="150" fill="#F0EBF5" stroke="#7A5C9E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="830" y="213">Another</tspan><tspan x="830" y="249">person</tspan></text><defs><marker id="launch_disease_detectives6-arrow-7" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#7A5C9E"/></marker></defs><line x1="295" y1="235" x2="380" y2="235" fill="none" stroke="#7A5C9E" stroke-width="4" marker-end="url(#launch_disease_detectives6-arrow-7)"/><defs><marker id="launch_disease_detectives6-arrow-8" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#7A5C9E"/></marker></defs><line x1="620" y1="235" x2="700" y2="235" fill="none" stroke="#7A5C9E" stroke-width="4" marker-end="url(#launch_disease_detectives6-arrow-8)"/><text font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="70" y="356">Pathogen may enter</tspan><tspan x="70" y="387.2">mosquito during feed</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="625" y="356">Infected mosquito</tspan><tspan x="625" y="387.2">may pass pathogen</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="55" y="472">A route through a vector is still communicable.</tspan><tspan x="55" y="504.4">A bite does not automatically mean infection.</tspan></text></svg>