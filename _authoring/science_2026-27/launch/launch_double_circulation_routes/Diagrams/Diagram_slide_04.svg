<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="launch_double_circulation_routes3-title launch_double_circulation_routes3-desc"><title id="launch_double_circulation_routes3-title">Atria receive; ventricles pump out</title><desc id="launch_double_circulation_routes3-desc">Simplified four-chamber map. The body’s right side is shown on the left of the image. Blood passes from each atrium to its ventricle, with a septum separating sides. The thicker left-ventricle outline represents a thicker muscular wall, not a larger volume per beat.</desc><defs><marker id="launch_double_circulation_routes3-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><text font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="30" y="50">Atria receive; ventricles pump out</tspan></text><rect x="95" y="135" width="350" height="125" fill="#E4EEF5" stroke="#4D82A0" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="270" y="178">Right atrium</tspan><tspan x="270" y="211.6">Receives from body</tspan></text><rect x="95" y="345" width="350" height="135" fill="#E4EEF5" stroke="#4D82A0" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="270" y="395">Right ventricle</tspan><tspan x="270" y="428.6">Pumps to lungs</tspan></text><rect x="555" y="135" width="350" height="125" fill="#F6E5E5" stroke="#B34D4D" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="730" y="178">Left atrium</tspan><tspan x="730" y="211.6">Receives from lungs</tspan></text><rect x="555" y="345" width="350" height="135" fill="#F6E5E5" stroke="#B34D4D" stroke-width="12"/><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="730" y="395">Left ventricle</tspan><tspan x="730" y="428.6">Pumps to body</tspan></text><defs><marker id="launch_double_circulation_routes3-arrow-9" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#4D82A0"/></marker></defs><line x1="270" y1="275" x2="270" y2="330" fill="none" stroke="#4D82A0" stroke-width="4" marker-end="url(#launch_double_circulation_routes3-arrow-9)"/><defs><marker id="launch_double_circulation_routes3-arrow-10" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#B34D4D"/></marker></defs><line x1="730" y1="275" x2="730" y2="330" fill="none" stroke="#B34D4D" stroke-width="4" marker-end="url(#launch_double_circulation_routes3-arrow-10)"/><line x1="500" y1="130" x2="500" y2="480" fill="none" stroke="#1F2937" stroke-width="6"/><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="500" y="105">Septum separates sides</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="500" y="534">Body’s right is shown left; this is a structure model.</tspan></text></svg>