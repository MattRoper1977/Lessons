<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="launch_double_circulation_routes4-title launch_double_circulation_routes4-desc"><title id="launch_double_circulation_routes4-title">A valve permits forward flow and limits backflow</title><desc id="launch_double_circulation_routes4-desc">Two-panel simplified valve model. Left: a forward pressure difference opens leaflets, permitting flow. Right: reverse pressure closes leaflets, opposing backflow. Valves do not provide the pumping energy.</desc><defs><marker id="launch_double_circulation_routes4-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><text font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="30" y="50">A valve permits forward flow and limits backflow</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="250" y="127">Forward pressure: open</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="750" y="127">Reverse pressure: closed</tspan></text><line x1="65" y1="185" x2="435" y2="185" fill="none" stroke="#4D82A0" stroke-width="4"/><line x1="65" y1="335" x2="435" y2="335" fill="none" stroke="#4D82A0" stroke-width="4"/><line x1="230" y1="185" x2="300" y2="220" fill="none" stroke="#1F2937" stroke-width="6"/><line x1="230" y1="335" x2="300" y2="300" fill="none" stroke="#1F2937" stroke-width="6"/><defs><marker id="launch_double_circulation_routes4-arrow-7" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#4D82A0"/></marker></defs><line x1="90" y1="260" x2="410" y2="260" fill="none" stroke="#4D82A0" stroke-width="6" marker-end="url(#launch_double_circulation_routes4-arrow-7)"/><line x1="565" y1="185" x2="935" y2="185" fill="none" stroke="#4D82A0" stroke-width="4"/><line x1="565" y1="335" x2="935" y2="335" fill="none" stroke="#4D82A0" stroke-width="4"/><line x1="690" y1="185" x2="745" y2="260" fill="none" stroke="#1F2937" stroke-width="6"/><line x1="690" y1="335" x2="745" y2="260" fill="none" stroke="#1F2937" stroke-width="6"/><defs><marker id="launch_double_circulation_routes4-arrow-12" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#4D82A0"/></marker></defs><line x1="910" y1="260" x2="785" y2="260" fill="none" stroke="#4D82A0" stroke-width="6" marker-end="url(#launch_double_circulation_routes4-arrow-12)"/><text font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="255" y="406">Flow passes through</tspan><tspan x="255" y="437.2">when the valve opens</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="750" y="406">Leaflets close against</tspan><tspan x="750" y="437.2">a reverse pressure</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="500" y="521">Heart muscle creates pressure; valves direct the flow.</tspan></text></svg>