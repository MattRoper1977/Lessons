<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="launch_ecosystem_evidence_web3-title launch_ecosystem_evidence_web3-desc"><title id="launch_ecosystem_evidence_web3-title">A selected garden food web</title><desc id="launch_ecosystem_evidence_web3-desc">Plant leaves feed caterpillars and aphids; blue tits eat caterpillars and aphids; ladybirds eat aphids. Arrows run from the food to the consumer. Decomposers and many additional links are omitted.</desc><defs><marker id="launch_ecosystem_evidence_web3-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><text font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="500" y="52">Follow food → consumer</tspan></text><rect x="40" y="240" width="220" height="90" fill="#EFF7F3" stroke="#3F7D6E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="150" y="288">Plant leaves</tspan></text><rect x="365" y="100" width="250" height="90" fill="#EFF7F3" stroke="#3F7D6E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="490" y="148">Caterpillars</tspan></text><rect x="365" y="370" width="250" height="90" fill="#EFF7F3" stroke="#3F7D6E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="490" y="418">Aphids</tspan></text><rect x="720" y="370" width="240" height="90" fill="#EFF7F3" stroke="#3F7D6E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="840" y="418">Ladybirds</tspan></text><rect x="720" y="100" width="240" 