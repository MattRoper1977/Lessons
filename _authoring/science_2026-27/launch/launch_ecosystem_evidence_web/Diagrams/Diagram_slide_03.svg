<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="launch_ecosystem_evidence_web2-title launch_ecosystem_evidence_web2-desc"><title id="launch_ecosystem_evidence_web2-title">An ecosystem includes interactions</title><desc id="launch_ecosystem_evidence_web2-desc">The community panel names organisms. The abiotic panel names light, temperature and soil moisture. Directed labelled links show that light supports plant photosynthesis and plant cover can affect shade and soil moisture.</desc><defs><marker id="launch_ecosystem_evidence_web2-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><text font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="500" y="52">More than a list of living things</tspan></text><rect x="50" y="110" width="365" height="260" fill="#EFF7F3" stroke="#7A5C9E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="232.5" y="155">COMMUNITY</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="232.5" y="227">Plants</tspan><tspan x="232.5" y="259.4">Aphids and caterpillars</tspan><tspan x="232.5" y="291.8">Ladybirds and blue tits</tspan></text><rect x="585" y="110" width="365" height="260" fill="#EFF7F3" stroke="#4D82A0" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="767.5" y="152">ABIOTIC ENVIRONMENT</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="767.5" y="227">Light</tspan><tspan x="767.5" y="259.4">Temperature</tspan><tspan x="767.5" y="291.8">Soil moisture</tspan></text><defs><marker id="launch_ecosystem_evidence_web2-arrow-7" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#4D82A0"/></marker></defs><line x1="580" y1="180" x2="420" y2="180" fill="none" stroke="#4D82A0" stroke-width="5" marker-end="url(#launch_ecosystem_evidence_web2-arrow-7)"/><text font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="500" y="134">Light for</tspan><tspan x="500" y="162.8">plants</tspan></text><defs><marker id="launch_ecosystem_evidence_web2-arrow-9" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#7A5C9E"/></marker></defs><line x1="420" y1="305" x2="580" y2="305" fill="none" stroke="#7A5C9E" stroke-width="5" marker-end="url(#launch_ecosystem_evidence_web2-arrow-9)"/><text font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="500" y="344">Plant cover</tspan><tspan x="500" y="372.8">changes</tspan><tspan x="500" y="401.6">shade</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="500" y="468">Ecosystem = community + environment</tspan><tspan x="500" y="501.6">+ their interactions.</tspan></text></svg>