<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="launch_ecosystem_evidence_web4-title launch_ecosystem_evidence_web4-desc"><title id="launch_ecosystem_evidence_web4-title">Plant sample counts</title><desc id="launch_ecosystem_evidence_web4-desc">Constructed equal-area samples contain twenty individuals each. Patch A has sixteen daisies and four clover plants, with zero dandelions or plantains. Patch B has five individuals of each of the four named species. Counts are not whole-site totals.</desc><defs><marker id="launch_ecosystem_evidence_web4-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><text font-family="Segoe UI, Arial, sans-serif" font-size="31" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="500" y="46">Equal totals can hide different richness</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="390" y="104">Patch A</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="765" y="104">Patch B</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="125" y="175">Daisy</tspan></text><rect x="255" y="148" width="240" height="38" fill="#C9803B" stroke="#C9803B" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="537.5" y="166">16</tspan></text><rect x="635" y="148" width="75" height="38" fill="#7A5C9E" stroke="#7A5C9E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="752.5" y="166">5</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="125" y="251">Clover</tspan></text><rect x="255" y="224" width="60" height="38" fill="#C9803B" stroke="#C9803B" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="357.5" y="242">4</tspan></text><rect x="635" y="224" width="75" height="38" fill="#7A5C9E" stroke="#7A5C9E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="752.5" y="242">5</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="125" y="327">Dandelion</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="297.5" y="318">0</tspan></text><rect x="635" y="300" width="75" height="38" fill="#7A5C9E" stroke="#7A5C9E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="752.5" y="318">5</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="125" y="403">Plantain</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="297.5" y="394">0</tspan></text><rect x="635" y="376" width="75" height="38" fill="#7A5C9E" stroke="#7A5C9E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="752.5" y="394">5</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="500" y="480">Constructed data: one 1 m² sample per patch.</tspan><tspan x="500" y="510">Bar length shows number of individual plants; totals = 20 each.</tspan></text></svg>