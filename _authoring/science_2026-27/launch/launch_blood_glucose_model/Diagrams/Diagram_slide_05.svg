<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="launch_blood_glucose_model4-title launch_blood_glucose_model4-desc"><title id="launch_blood_glucose_model4-title">Read direction, not a clinical number</title><desc id="launch_blood_glucose_model4-desc">Qualitative conceptual trace across four stages: usual range before input, raised after absorption, still raised while a response develops, and towards the usual range later. Axes have no clinical units or real timings.</desc><defs><marker id="launch_blood_glucose_model4-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><text font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="30" y="50">Read direction, not a clinical number</tspan></text><rect x="180" y="340" width="735" height="70" fill="#E6F0E8" stroke="#E6F0E8" stroke-width="3"/><line x1="180" y1="440" x2="930" y2="440" fill="none" stroke="#1F2937" stroke-width="4"/><line x1="180" y1="140" x2="180" y2="440" fill="none" stroke="#1F2937" stroke-width="4"/><text font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="30" y="181">Raised</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="25" y="371">Usual</tspan><tspan x="25" y="402.2">range</tspan></text><line x1="235" y1="375" x2="445" y2="180" fill="none" stroke="#7A5C9E" stroke-width="5"/><line x1="445" y1="180" x2="655" y2="225" fill="none" stroke="#7A5C9E" stroke-width="5"/><line x1="655" y1="225" x2="865" y2="365" fill="none" stroke="#7A5C9E" stroke-width="5"/><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="242.5" y="485">Before</tspan><tspan x="242.5" y="515">input</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="442.5" y="485">After</tspan><tspan x="442.5" y="515">absorption</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="655" y="485">Response</tspan><tspan x="655" y="515">develops</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="867.5" y="485">Later</tspan></text></svg>