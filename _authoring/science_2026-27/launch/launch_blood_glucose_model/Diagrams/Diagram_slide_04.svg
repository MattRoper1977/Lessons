<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="launch_blood_glucose_model3-title launch_blood_glucose_model3-desc"><title id="launch_blood_glucose_model3-title">A signal is not the stored material</title><desc id="launch_blood_glucose_model3-desc">Material-versus-signal model: insulin from pancreas signals liver/muscle storage processes. Separate glucose symbols are joined into a schematic glycogen store. Insulin does not become glycogen; molecule drawings are simplified.</desc><defs><marker id="launch_blood_glucose_model3-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><text font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="30" y="50">A signal is not the stored material</tspan></text><rect x="45" y="120" width="250" height="120" fill="#F0EBF5" stroke="#7A5C9E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="170" y="173">Pancreas</tspan><tspan x="170" y="206.6">Insulin signal</tspan></text><defs><marker id="launch_blood_glucose_model3-arrow-3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#7A5C9E"/></marker></defs><line x1="310" y1="185" x2="555" y2="185" fill="none" stroke="#7A5C9E" stroke-width="4" marker-end="url(#launch_blood_glucose_model3-arrow-3)"/><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#7A5C9E"><tspan x="320" y="145">Hormone in blood</tspan></text><rect x="580" y="110" width="375" height="350" fill="#E9F1EA" stroke="#3F7D6E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="767.5" y="152">Liver / muscle storage</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="187.5" y="337">Glucose units</tspan><tspan x="187.5" y="369.4">Material to store</tspan></text><defs><marker id="launch_blood_glucose_model3-arrow-8" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#C9803B"/></marker></defs><line x1="310" y1="340" x2="555" y2="340" fill="none" stroke="#C9803B" stroke-width="4" marker-end="url(#launch_blood_glucose_model3-arrow-8)"/><text font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="770" y="421">Glycogen store model</tspan></text><ellipse cx="92.5" cy="272.5" rx="17.5" ry="17.5" fill="#F5DDB7" stroke="#C9803B" stroke-width="3"/><ellipse cx="154.5" cy="272.5" rx="17.5" ry="17.5" fill="#F5DDB7" stroke="#C9803B" stroke-width="3"/><ellipse cx="216.5" cy="272.5" rx="17.5" ry="17.5" fill="#F5DDB7" stroke="#C9803B" stroke-width="3"/><ellipse cx="630" cy="295" rx="20" ry="20" fill="#F5DDB7" stroke="#C9803B" stroke-width="3"/><ellipse cx="692" cy="295" rx="20" ry="20" fill="#F5DDB7" stroke="#C9803B" stroke-width="3"/><ellipse cx="754" cy="295" rx="20" ry="20" fill="#F5DDB7" stroke="#C9803B" stroke-width="3"/><ellipse cx="816" cy="295" rx="20" ry="20" fill="#F5DDB7" stroke="#C9803B" stroke-width="3"/><ellipse cx="878" cy="295" rx="20" ry="20" fill="#F5DDB7" stroke="#C9803B" stroke-width="3"/><line x1="650" y1="295" x2="672" y2="295" fill="none" stroke="#C9803B" stroke-width="5"/><line x1="712" y1="295" x2="734" y2="295" fill="none" stroke="#C9803B" stroke-width="5"/><line x1="774" y1="295" x2="796" y2="295" fill="none" stroke="#C9803B" stroke-width="5"/><line x1="836" y1="295" x2="858" y2="295" fill="none" stroke="#C9803B" stroke-width="5"/><text font-family="Segoe UI, Aria