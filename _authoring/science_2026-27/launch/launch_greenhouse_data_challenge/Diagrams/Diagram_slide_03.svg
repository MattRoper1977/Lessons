<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="launch_greenhouse_data_challenge2-title launch_greenhouse_data_challenge2-desc"><title id="launch_greenhouse_data_challenge2-title">A controlled comparison needs a fair pair</title><desc id="launch_greenhouse_data_challenge2-desc">Experimental-design comparison: A(low light,0.30 L), B(high light,0.60 L), C(low light,0.15 L), D(high light,0.15 L). Major conditions other than shown light/water match. C/D isolates the intended light change; A/B changes both light and total water supplied.</desc><defs><marker id="launch_greenhouse_data_challenge2-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><text font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="30" y="50">A controlled comparison needs a fair pair</tspan></text><rect x="45" y="110" width="415" height="145" fill="#F0EBF5" stroke="#7A5C9E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="65" y="154">A: low light</tspan><tspan x="65" y="185.2">Water supplied 0.30 L</tspan></text><rect x="540" y="110" width="415" height="145" fill="#F0EBF5" stroke="#7A5C9E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="560" y="154">B: high light</tspan><tspan x="560" y="185.2">Water supplied 0.60 L</tspan></text><rect x="45" y="330" width="415" height="145" fill="#F0EBF5" stroke="#7A5C9E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="65" y="374">C: low light</tspan><tspan x="65" y="405.2">Water supplied 0.15 L</tspan></text><rect x="540" y="330" width="415" height="145" fill="#F0EBF5" stroke="#7A5C9E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="560" y="374">D: high light</tspan><tspan x="560" y="405.2">Water supplied 0.15 L</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="40" y="520">For a light test, compare C and D: same supplied water.</tspan></text></svg>