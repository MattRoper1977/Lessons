<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="launch_greenhouse_data_challenge4-title launch_greenhouse_data_challenge4-desc"><title id="launch_greenhouse_data_challenge4-title">Two requirements make a decision region</title><desc id="launch_greenhouse_data_challenge4-desc">Constructed scatter plot: water supplied onx-axis and mean dry-biomass gain ony-axis. Target is at least 2.5 g gain and at most 0.50 L supplied water. The shaded upper-left region meets both. Only E of the supplied plans lies there. This is a decision aid, not a biological law.</desc><defs><marker id="launch_greenhouse_data_challenge4-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><text font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="30" y="50">Two requirements make a decision region</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="45" y="100">Mean dry-biomass gain(g/plant) over 14 days</tspan></text><rect x="130" y="140" width="535" height="85" fill="#E6F0E8" stroke="#E6F0E8" stroke-width="3"/><line x1="130" y1="430" x2="900" y2="430" fill="none" stroke="#1F2937" stroke-width="4"/><line x1="130" y1="140" x2="130" y2="430" fill="none" stroke="#1F2937" stroke-width="4"/><line x1="130" y1="430" x2="900" y2="430" fill="none" stroke="#D9D4E0" stroke-width="1"/><text font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="end" fill="#1F2937"><tspan x="115" y="437">0</tspan></text><line x1="130" y1="348" x2="900" y2="348" fill="none" stroke="#D9D4E0" stroke-width="1"/><text font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="end" fill="#1F2937"><tspan x="115" y="355">1</tspan></text><line x1="130" y1="266" x2="900" y2="266" fill="none" stroke="#D9D4E0" stroke-width="1"/><text font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="end" fill="#1F2937"><tspan x="115" y="273">2</tspan></text><line x1="130" y1="184" x2="900" y2="184" fill="none" stroke="#D9D4E0" stroke-width="1"/><text font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="end" fill="#1F2937"><tspan x="115" y="191">3</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="130" y="467">0</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="344" y="467">0.2</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="558" y="467">0.4</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="772" y="467">0.6</tspan></text><line x1="665" y1="140" x2="665" y2="430" fill="none" stroke="#C9803B" stroke-width="3"/><line x1="130" y1="225" x2="900" y2="225" fill="none" stroke="#C9803B" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#C9803B"><tspan x="685" y="334">Water cap 0.50 L</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" text-anchor="start" fill="#3F7D6E"><tspan x="140" y="178">Meets both limits</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="560" y="520">Water supplied(L/plant) over 14 days</tspan></text><ellipse cx="451" cy="282.4" rx="7" ry="7" fill="#7A5C9E" stroke="#7A5C9E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700"