<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="launch_genetic_engineering2-title launch_genetic_engineering2-desc"><title id="launch_genetic_engineering2-title">Engineering changes DNA directly</title><desc id="launch_genetic_engineering2-desc">Three conceptual changes to a DNA sequence: adding a DNA segment, changing bases, or deleting a segment. Different methods perform these changes. Diagrams are symbolic blocks, not actual DNA sequences or laboratory protocols.</desc><defs><marker id="launch_genetic_engineering2-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><text font-family="Segoe UI, Arial, sans-serif" font-size="31" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="35" y="51">Genetic engineering: alter the genome</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="35" y="107">A genome is all an organism’s genetic information.</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="45" y="173">Add a</tspan><tspan x="45" y="206.6">segment</tspan></text><rect x="255" y="150" width="190" height="55" fill="#8BBBD2" stroke="#4D82A0" stroke-width="3"/><rect x="450" y="150" width="165" height="55" fill="#E8BB8B" stroke="#C9803B" stroke-width="3"/><rect x="620" y="150" width="260" height="55" fill="#8BBBD2" stroke="#4D82A0" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="45" y="303">Change DNA</tspan></text><rect x="255" y="270" width="190" height="55" fill="#8BBBD2" stroke="#4D82A0" stroke-width="3"/><rect x="450" y="270" width="165" height="55" fill="#D9D0E3" stroke="#7A5C9E" stroke-width="3"/><rect x="620" y="270" width="260" height="55" fill="#8BBBD2" stroke="#4D82A0" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="45" y="423">Delete DNA</tspan></text><rect x="255" y="385" width="190" height="55" fill="#8BBBD2" stroke="#4D82A0" stroke-width="3"/><line x1="450" y1="412" x2="615" y2="412" fill="none" stroke="#1F2937" stroke-width="3"/><rect x="620" y="385" width="260" height="55" fill="#8BBBD2" stroke="#4D82A0" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="600" y="516">Cross-species transfer is only one method.</tspan></text></svg>