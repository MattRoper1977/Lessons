<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="launch_genetic_engineering5-title launch_genetic_engineering5-desc"><title id="launch_genetic_engineering5-title">The crop and the pest can both change</title><desc id="launch_genetic_engineering5-desc">A conceptual resistance mechanism across pest generations. The crop kills susceptible pests; rare inherited resistance variants can survive and reproduce, making resistance more common. The diagram shows a mechanism, not numerical data.</desc><defs><marker id="launch_genetic_engineering5-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><text font-family="Segoe UI, Arial, sans-serif" font-size="31" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="35" y="51">Why resistance needs monitoring</tspan></text><rect x="50" y="115" width="255" height="260" fill="#F0EBF5" stroke="#7A5C9E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="177.5" y="163">Before</tspan><tspan x="177.5" y="196.6">exposure</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="177.5" y="256">Pests vary.</tspan><tspan x="177.5" y="287.2">Some inherited</tspan><tspan x="177.5" y="318.4">variants resist</tspan><tspan x="177.5" y="349.6">the Bt protein.</tspan></text><defs><marker id="launch_genetic_engineering5-arrow-4" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#7A5C9E"/></marker></defs><line x1="320" y1="245" x2="365" y2="245" fill="none" stroke="#7A5C9E" stroke-width="5" marker-end="url(#launch_genetic_engineering5-arrow-4)"/><rect x="385" y="115" width="250" height="260" fill="#F0EBF5" stroke="#7A5C9E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="510" y="163">Selection</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="510" y="256">Susceptible</tspan><tspan x="510" y="287.2">pests are killed.</tspan><tspan x="510" y="318.4">Resistant pests</tspan><tspan x="510" y="349.6">may survive.</tspan></text><defs><marker id="launch_genetic_engineering5-arrow-8" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#7A5C9E"/></marker></defs><line x1="650" y1="245" x2="695" y2="245" fill="none" stroke="#7A5C9E" stroke-width="5" marker-end="url(#launch_genetic_engineering5-arrow-8)"/><rect x="715" y="115" width="235" height="260" fill="#F0EBF5" stroke="#7A5C9E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="832.5" y="162">Later</tspan><tspan x="832.5" y="194.4">generations</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="832.5" y="256">Survivors</tspan><tspan x="832.5" y="287.2">reproduce.</tspan><tspan x="832.5" y="318.4">Resistance can</tspan><tspan x="832.5" y="349.6">become common.</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="500" y="451">Monitoring and resistance-management strategies</tspan><tspan x="500" y="482.2">can delay resistance, but not promise zero risk.</tspan></text></svg>