<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="launch_genetic_engineering3-title launch_genetic_engineering3-desc"><title id="launch_genetic_engineering3-title">A DNA change can alter a characteristic</title><desc id="launch_genetic_engineering3-desc">Conceptual gene expression chain: a changed or added functional gene can alter the protein made and therefore a characteristic. It may need appropriate control sequences and cellular conditions; not every DNA change changes phenotype.</desc><defs><marker id="launch_genetic_engineering3-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><text font-family="Segoe UI, Arial, sans-serif" font-size="31" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="35" y="51">Connect a genetic change to its effect</tspan></text><rect x="50" y="165" width="250" height="150" fill="#F0EBF5" stroke="#7A5C9E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="31" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="175" y="221">DNA</tspan><tspan x="175" y="258.2">information</tspan></text><defs><marker id="launch_genetic_engineering3-arrow-3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#7A5C9E"/></marker></defs><line x1="315" y1="240" x2="375" y2="240" fill="none" stroke="#7A5C9E" stroke-width="5" marker-end="url(#launch_genetic_engineering3-arrow-3)"/><rect x="395" y="165" width="235" height="150" fill="#F0EBF5" stroke="#7A5C9E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="512.5" y="219">Protein</tspan><tspan x="512.5" y="253.8">made by cells</tspan></text><defs><marker id="launch_genetic_engineering3-arrow-6" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#7A5C9E"/></marker></defs><line x1="645" y1="240" x2="705" y2="240" fill="none" stroke="#7A5C9E" stroke-width="5" marker-end="url(#launch_genetic_engineering3-arrow-6)"/><rect x="725" y="165" width="230" height="150" fill="#F0EBF5" stroke="#7A5C9E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="840" y="219">Possible</tspan><tspan x="840" y="253.8">trait change</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="500" y="393">A Bt gene can enable a crop to make a protein</tspan><tspan x="500" y="426.6">that harms certain insect pests.</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="500" y="500">Simplified model; the change must be checked.</tspan></text></svg>