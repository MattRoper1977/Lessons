<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="launch_genetic_engineering4-title launch_genetic_engineering4-desc"><title id="launch_genetic_engineering4-title">A useful protein, not a change of species</title><desc id="launch_genetic_engineering4-desc">Conceptual recombinant insulin production: genetic instructions for human insulin are introduced into suitable microbial cells, which produce protein. The insulin is recovered, purified and checked; patients receive medicine, not the engineered organisms. No laboratory protocol is supplied.</desc><defs><marker id="launch_genetic_engineering4-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><text font-family="Segoe UI, Arial, sans-serif" font-size="31" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="35" y="51">Example: make a useful medicine</tspan></text><rect x="55" y="110" width="365" height="135" fill="#F0EBF5" stroke="#7A5C9E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="237.5" y="159">Genetic instruction</tspan><tspan x="237.5" y="193.8">for human insulin</tspan></text><defs><marker id="launch_genetic_engineering4-arrow-3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#7A5C9E"/></marker></defs><line x1="440" y1="180" x2="560" y2="180" fill="none" stroke="#7A5C9E" stroke-width="5" marker-end="url(#launch_genetic_engineering4-arrow-3)"/><rect x="580" y="110" width="365" height="135" fill="#F0EBF5" stroke="#7A5C9E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="762.5" y="148">Suitable microbial</tspan><tspan x="762.5" y="181.6">cells produce</tspan><tspan x="762.5" y="215.2">insulin</tspan></text><defs><marker id="launch_genetic_engineering4-arrow-6" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#7A5C9E"/></marker></defs><line x1="760" y1="260" x2="760" y2="325" fill="none" stroke="#7A5C9E" stroke-width="5" marker-end="url(#launch_genetic_engineering4-arrow-6)"/><rect x="580" y="340" width="365" height="130" fill="#F0EBF5" stroke="#7A5C9E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="762.5" y="378">Recover, purify</tspan><tspan x="762.5" y="411.6">and check</tspan><tspan x="762.5" y="445.2">the medicine</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="55" y="353">The cells remain microbes.</tspan><tspan x="55" y="386.6">The gene is information.</tspan><tspan x="55" y="420.2">Insulin is the product.</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="500" y="529">Conceptual model, not a practical method.</tspan></text></svg>