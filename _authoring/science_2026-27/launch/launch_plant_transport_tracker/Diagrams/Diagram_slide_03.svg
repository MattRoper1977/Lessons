<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="launch_plant_transport_tracker2-title launch_plant_transport_tracker2-desc"><title id="launch_plant_transport_tracker2-title">Two tissues, different jobs</title><desc id="launch_plant_transport_tracker2-desc">Whole-plant transport model: blue xylem arrows carry water and mineral ions from roots towards the leaves. Purple phloem paths move sucrose from a source leaf to a growing bud above and roots below in different tubes. Plant and paths are schematic, not to scale.</desc><defs><marker id="launch_plant_transport_tracker2-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><text font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="30" y="50">Two tissues, different jobs</tspan></text><line x1="485" y1="430" x2="485" y2="140" fill="none" stroke="#3F7D6E" stroke-width="20"/><line x1="485" y1="250" x2="650" y2="190" fill="none" stroke="#3F7D6E" stroke-width="9"/><ellipse cx="750" cy="185" rx="140" ry="65" fill="#E4F0E9" stroke="#3F7D6E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="750" y="179">Source leaf</tspan><tspan x="750" y="210.2">Makes sugars</tspan></text><ellipse cx="482.5" cy="125" rx="82.5" ry="45" fill="#E4F0E9" stroke="#3F7D6E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="605" y="76">Growing bud: sink</tspan></text><defs><marker id="launch_plant_transport_tracker2-arrow-7" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#3F7D6E"/></marker></defs><line x1="585" y1="82" 