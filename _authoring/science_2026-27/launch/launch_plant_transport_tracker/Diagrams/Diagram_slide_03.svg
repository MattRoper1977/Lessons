start" fill="#7A5C9E"><tspan x="35" y="356">Phloem</tspan><tspan x="35" y="387.2">Sucrose: source to sink</tspan><tspan x="35" y="418.4">Different tubes</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="65" y="540">Phloem transport uses living cells and energy.</tspan></text></svg>