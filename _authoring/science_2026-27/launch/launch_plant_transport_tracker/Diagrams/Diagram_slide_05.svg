<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="launch_plant_transport_tracker4-title launch_plant_transport_tracker4-desc"><title id="launch_plant_transport_tracker4-title">A moving bubble indicates water uptake</title><desc id="launch_plant_transport_tracker4-desc">Schematic bubble potometer: the shoot takes up water, drawing an air bubble along the graduated capillary towards the shoot. The measured distance over time indicates volume uptake only when capillary cross-section is known. It is not a direct measurement of water vapour loss.</desc><defs><marker id="launch_plant_transport_tracker4-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><text font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="30" y="50">A moving bubble indicates water uptake</tspan></text><line x1="75" y1="310" x2="720" y2="310" fill="none" stroke="#4D82A0" stroke-width="10"/><line x1="720" y1="310" x2="720" y2="175" fill="none" stroke="#4D82A0" stroke-width="10"/><line x1="720" y1="175" x2="720" y2="100" fill="none" stroke="#3F7D6E" stroke-width="10"/><ellipse cx="815" cy="125" rx="75" ry="40" fill="#E4F0E9" stroke="#3F7D6E" stroke-width="3"/><ellipse cx="637.5" cy="142.5" rx="77.5" ry="42.5" fill="#E4F0E9" stroke="#3F7D6E" stroke-width="3"/><ellipse cx="265" cy="310" rx="30" ry="12" fill="#FFFFFF" stroke="#1F2937" stroke-width="3"/><defs><marker id="launch_plant_transport_tracker4-arrow-7" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#4D82A0"/></marker></defs><line x1="310" y1="255" x2="470" y2="255" fill="none" stroke="#4D82A0" stroke-width="4" marker-end="url(#launch_plant_transport_tracker4-arrow-7)"/><text font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="367.5" y="206">Bubble moves towards</tspan><tspan x="367.5" y="237.2">the water-taking shoot</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="45" y="385">Graduated capillary</tspan><tspan x="45" y="415">Measure distance and time</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="600" y="385">Sealed shoot connection</tspan><tspan x="600" y="415">Check for leaks</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="502.5" y="492">Uptake is a proxy for transpiration, not an exact match.</tspan></text><line x1="100" y1="325" x2="100" y2="345" fill="none" stroke="#1F2937" stroke-width="2"/><line x1="140" y1="325" x2="140" y2="345" fill="none" stroke="#1F2937" stroke-width="2"/><line x1="180" y1="325" x2="180" y2="345" fill="none" stroke="#1F2937" stroke-width="2"/><line x1="220" y1="325" x2="220" y2="345" fill="none" stroke="#1F2937" stroke-width="2"/><line x1="260" y1="325" x2="260" y2="345" fill="none" stroke="#1F2937" stroke-width="2"/><line x1="300" y1="325" x2="300" y2="345" fill="none" stroke="#1F2937" stroke-width="2"/><line x1="340" y1="325" x2="340" y2="345" fill="none" stroke="#1F2937" stroke-width="2"/><line x1="380" y1="325" x2="380" y2="345" fill="none" stroke="#1F2937" stroke-width="2"/><line x1="420" y1="325" x2="420" y2="345" fill="none" stroke="#1F2937" stroke-width="2"/><line x1="460" y1="325" x2="460" y2="345" fill="none" stroke="#1F2937" stroke-width="2"/><line x1="500" y1="325" x2="500" y2="345" fill="none" stroke="#1F2937" stroke-width="2"/><line x1="540" y1="325" x2="540" y2="345" fill="none" stroke="#1F2937" stroke-width="2"/><line x1="580" y1="325" x2="580" y2="345" fill="none" stroke="#1F2937" stroke-width="2"/><line x1="620" y1="325" x2="620" y2="345" fill="none" stroke="#1F2937" stroke-width="2"/><line x1="660" y1="325" x2="660" y2="345" fill="none" stroke="#1F2937" stroke-width="2"/></svg>