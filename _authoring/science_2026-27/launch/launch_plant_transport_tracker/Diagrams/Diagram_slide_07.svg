<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="launch_plant_transport_tracker6-title launch_plant_transport_tracker6-desc"><title id="launch_plant_transport_tracker6-title">Transpiration: evaporation, then diffusion</title><desc id="launch_plant_transport_tracker6-desc">Leaf-section model: water at moist internal cell surfaces evaporates into internal air spaces. Water vapour diffuses through a stoma to the air when a gradient exists. Guard cells control the pore. Shapes are schematic, not a complete leaf section.</desc><defs><marker id="launch_plant_transport_tracker6-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><text font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="30" y="50">Transpiration: evaporation, then diffusion</tspan></text><rect x="45" y="95" width="910" height="310" fill="#ECF3E9" stroke="#3F7D6E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="65" y="142">Inside the leaf</tspan></text><ellipse cx="215" cy="247.5" rx="105" ry="67.5" fill="#E4F0E9" stroke="#3F7D6E" stroke-width="3"/><ellipse cx="745" cy="247.5" rx="105" ry="67.5" fill="#E4F0E9" stroke="#3F7D6E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="215" y="240">Moist cell</tspan><tspan x="215" y="270">surface</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="745" y="240">Moist cell</tspan><tspan x="745" y="270">surface</tspan></text><defs><marker id="launch_plant_transport_tracker6-arrow-7" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#4D82A0"/></marker></defs><line x1="345" y1="250" x2="465" y2="290" fill="none" stroke="#4D82A0" stroke-width="4" marker-end="url(#launch_plant_transport_tracker6-arrow-7)"/><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="497.5" y="195">Water evaporates</tspan><tspan x="497.5" y="225">into air spaces</tspan></text><rect x="45" y="360" width="360" height="45" fill="#B9D3B0" stroke="#3F7D6E" stroke-width="3"/><rect x="595" y="360" width="360" height="45" fill="#B9D3B0" stroke="#3F7D6E" stroke-width="3"/><ellipse cx="410" cy="387" rx="40" ry="40" fill="#E4F0E9" stroke="#3F7D6E" stroke-width="3"/><ellipse cx="590" cy="387" rx="40" ry="40" fill="#E4F0E9" stroke="#3F7D6E" stroke-width="3"/><defs><marker id="launch_plant_transport_tracker6-arrow-13" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#4D82A0"/></marker></defs><line x1="500" y1="320" x2="500" y2="475" fill="none" stroke="#4D82A0" stroke-width="4" marker-end="url(#launch_plant_transport_tracker6-arrow-13)"/><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="65" y="460">Guard cells control</tspan><tspan x="65" y="490">the stomatal pore</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="590" y="470">Water vapour diffuses</tspan><tspan x="590" y="500">to surrounding air</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="500" y="525">Outside the leaf</tspan></text></svg>