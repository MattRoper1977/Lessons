<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="launch_topics7_8_checkpoint4-title launch_topics7_8_checkpoint4-desc"><title id="launch_topics7_8_checkpoint4-title">Ventilation changes volume and pressure</title><desc id="launch_topics7_8_checkpoint4-desc">Two-panel schematic of quiet breathing. Inhalation: diaphragm contracts/flattens, ribs move up/out, thoracic volume rises and pressure falls below atmospheric pressure so air enters. Quiet exhalation: muscles relax and elastic recoil reduces volume, raising pressure so air leaves.</desc><defs><marker id="launch_topics7_8_checkpoint4-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><text font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="30" y="50">Ventilation changes volume and pressure</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="250" y="111">Inhalation</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="750" y="111">Quiet exhalation</tspan></text><rect x="85" y="160" width="330" height="225" fill="#EEF3F7" stroke="#4D82A0" stroke-width="3"/><ellipse cx="182.5" cy="270" rx="47.5" ry="75" fill="#E4F0E9" stroke="#3F7D6E" stroke-width="3"/><ellipse cx="317.5" cy="270" rx="47.5" ry="75" fill="#E4F0E9" stroke="#3F7D6E" stroke-width="3"/><defs><marker id="launch_topics7_8_checkpoint4-arrow-6" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#4D82A0"/></marker></defs><line x1="250" y1="130" x2="250" y2="215" fill="none" stroke="#4D82A0" stroke-width="6" marker-end="url(#launch_topics7_8_checkpoint4-arrow-6)"/><line x1="110" y1="390" x2="390" y2="390" fill="none" stroke="#7A5C9E" stroke-width="7"/><rect x="585" y="195" width="330" height="190" fill="#EEF3F7" stroke="#4D82A0" stroke-width="3"/><ellipse cx="682.5" cy="277.5" rx="47.5" ry="57.5" fill="#E4F0E9" stroke="#3F7D6E" stroke-width="3"/><ellipse cx="817.5" cy="277.5" rx="47.5" ry="57.5" fill="#E4F0E9" stroke="#3F7D6E" stroke-width="3"/><defs><marker id="launch_topics7_8_checkpoint4-arrow-11" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#4D82A0"/></marker></defs><line x1="750" y1="215" x2="750" y2="130" fill="none" stroke="#4D82A0" stroke-width="6" marker-end="url(#launch_topics7_8_checkpoint4-arrow-11)"/><line x1="610" y1="390" x2="750" y2="345" fill="none" stroke="#7A5C9E" stroke-width="7"/><line x1="750" y1="345" x2="890" y2="390" fill="none" stroke="#7A5C9E" stroke-width="7"/><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="250" y="445">Diaphragm contracts/flattens</tspan><tspan x="250" y="475">Volume rises; pressure falls</tspan><tspan x="250" y="505">Air enters</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="750" y="445">Diaphragm relaxes; recoil</tspan><tspan x="750" y="475">Volume falls; pressure rises</tspan><tspan x="750" y="505">Air leaves</tspan></text></svg>