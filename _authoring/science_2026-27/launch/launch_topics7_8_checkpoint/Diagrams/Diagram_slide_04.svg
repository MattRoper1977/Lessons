<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="launch_topics7_8_checkpoint3-title launch_topics7_8_checkpoint3-desc"><title id="launch_topics7_8_checkpoint3-title">Two linked circuits, one continuous route</title><desc id="launch_topics7_8_checkpoint3-desc">Schematic double circulation: body→right heart→lungs→left heart→body. Blue-labelled paths carry relatively oxygen-poor blood; red-labelled paths carry relatively oxygen-rich blood. Colour is accompanied by text. The positions are not anatomical.</desc><defs><marker id="launch_topics7_8_checkpoint3-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><text font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="30" y="50">Two linked circuits, one continuous route</tspan></text><rect x="40" y="210" width="235" height="130" fill="#EEF0F3" stroke="#1F2937" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="157.5" y="269">Body tissues</tspan></text><rect x="365" y="345" width="265" height="120" fill="#E4EEF5" stroke="#4D82A0" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="497.5" y="392">Right heart</tspan><tspan x="497.5" y="424.4">To the lungs</tspan></text><rect x="730" y="210" width="230" height="130" fill="#E8F1EB" stroke="#3F7D6E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="845" y="267">Lungs</tspan><tspan x="845" y="299.4">Gas exchange</tspan></text><rect x="365" y="95" width="265" height="120" fill="#F6E5E5" stroke="#B34D4D" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="497.5" y="142">Left heart</tspan><tspan x="497.5" y="174.4">To the body</tspan></text><defs><marker id="launch_topics7_8_checkpoint3-arrow-9" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#4D82A0"/></marker></defs><line x1="285" y1="325" x2="350" y2="380" fill="none" stroke="#4D82A0" stroke-width="4" marker-end="url(#launch_topics7_8_checkpoint3-arrow-9)"/><defs><marker id="launch_topics7_8_checkpoint3-arrow-10" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#4D82A0"/></marker></defs><line x1="645" y1="380" x2="715" y2="325" fill="none" stroke="#4D82A0" stroke-width="4" marker-end="url(#launch_topics7_8_checkpoint3-arrow-10)"/><defs><marker id="launch_topics7_8_checkpoint3-arrow-11" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#B34D4D"/></marker></defs><line x1="715" y1="225" x2="645" y2="175" fill="none" stroke="#B34D4D" stroke-width="4" marker-end="url(#launch_topics7_8_checkpoint3-arrow-11)"/><defs><marker id="launch_topics7_8_checkpoint3-arrow-12" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#B34D4D"/></marker></defs><line x1="350" y1="175" x2="285" y2="225" fill="none" stroke="#B34D4D" stroke-width="4" marker-end="url(#launch_topics7_8_checkpoint3-arrow-12)"/><text font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#4D82A0"><tspan x="65" y="449">Relatively</tspan><tspan x="65" y="477.8">oxygen-poor route</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#B34D4D"><tspan x="675" y="114">Relatively</tspan><tspan x="675" y="142.8">oxygen-rich route</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="505" y="531">Artery = away from heart; vein = towards heart.</tspan></text></svg>