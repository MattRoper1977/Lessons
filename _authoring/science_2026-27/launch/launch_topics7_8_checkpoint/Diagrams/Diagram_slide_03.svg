<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="launch_topics7_8_checkpoint2-title launch_topics7_8_checkpoint2-desc"><title id="launch_topics7_8_checkpoint2-title">One message, three important locations</title><desc id="launch_topics7_8_checkpoint2-desc">Endocrine transport model: an endocrine gland releases a hormone into circulating blood; the hormone reaches tissues, but only appropriate target cells respond. Arrows show information/material transport, not a private gland-to-organ duct.</desc><defs><marker id="launch_topics7_8_checkpoint2-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><text font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="30" y="50">One message, three important locations</tspan></text><rect x="45" y="160" width="265" height="170" fill="#F0EBF5" stroke="#7A5C9E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="177.5" y="212">Endocrine gland</tspan><tspan x="177.5" y="240.8">Hormone released</tspan><tspan x="177.5" y="269.6">into blood</tspan></text><defs><marker id="launch_topics7_8_checkpoint2-arrow-3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#7A5C9E"/></marker></defs><line x1="320" y1="245" x2="360" y2="245" fill="none" stroke="#7A5C9E" stroke-width="4" marker-end="url(#launch_topics7_8_checkpoint2-arrow-3)"/><rect x="375" y="160" width="250" height="170" fill="#F0EBF5" stroke="#7A5C9E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="500" y="214">Bloodstream</tspan><tspan x="500" y="242.8">Carries</tspan><tspan x="500" y="271.6">hormone</tspan></text><defs><marker id="launch_topics7_8_checkpoint2-arrow-6" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#7A5C9E"/></marker></defs><line x1="635" y1="245" x2="675" y2="245" fill="none" stroke="#7A5C9E" stroke-width="4" marker-end="url(#launch_topics7_8_checkpoint2-arrow-6)"/><rect x="690" y="160" width="265" height="170" fill="#F0EBF5" stroke="#7A5C9E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="822.5" y="212">Target cells</tspan><tspan x="822.5" y="240.8">Recognise signal</tspan><tspan x="822.5" y="269.6">Change activity</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="500" y="448">The bloodstream distributes the signal.</tspan><tspan x="500" y="481.6">Cell recognition helps determine the response.</tspan></text></svg>