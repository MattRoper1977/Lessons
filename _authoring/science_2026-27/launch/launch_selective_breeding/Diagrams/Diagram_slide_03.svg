<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="launch_selective_breeding2-title launch_selective_breeding2-desc"><title id="launch_selective_breeding2-title">Selective breeding changes later generations</title><desc id="launch_selective_breeding2-desc">Four linked steps: choose parents for inherited traits, reproduce, compare varied offspring, and select for the next generation. The repeated cycle changes the breeding population; individual plants do not choose to change their genes.</desc><defs><marker id="launch_selective_breeding2-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><text font-family="Segoe UI, Arial, sans-serif" font-size="31" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="30" y="51">Select, breed, compare, repeat</tspan></text><rect x="55" y="105" width="370" height="135" fill="#F0EBF5" stroke="#7A5C9E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="75" y="146">1. Select parents</tspan><tspan x="75" y="179.6">with useful</tspan><tspan x="75" y="213.2">inherited traits</tspan></text><rect x="575" y="105" width="370" height="135" fill="#F0EBF5" stroke="#7A5C9E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="595" y="146">2. Breed them</tspan><tspan x="595" y="179.6">Offspring inherit</tspan><tspan x="595" y="213.2">alleles</tspan></text><rect x="575" y="345" width="370" height="135" fill="#F0EBF5" stroke="#7A5C9E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="595" y="393">3. Compare offspring</tspan><tspan x="595" y="426.6">They vary</tspan></text><rect x="55" y="345" width="370" height="135" fill="#F0EBF5" stroke="#7A5C9E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="75" y="383">4. Select again</tspan><tspan x="75" y="416.6">Check health</tspan><tspan x="75" y="450.2">and diversity</tspan></text><defs><marker id="launch_selective_breeding2-arrow-9" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#7A5C9E"/></marker></defs><line x1="435" y1="170" x2="560" y2="170" fill="none" stroke="#7A5C9E" stroke-width="5" marker-end="url(#launch_selective_breeding2-arrow-9)"/><defs><marker id="launch_selective_breeding2-arrow-10" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#7A5C9E"/></marker></defs><line x1="760" y1="255" x2="760" y2="330" fill="none" stroke="#7A5C9E" stroke-width="5" marker-end="url(#launch_selective_breeding2-arrow-10)"/><defs><marker id="launch_selective_breeding2-arrow-11" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#7A5C9E"/></marker></defs><line x1="560" y1="410" x2="435" y2="410" fill="none" stroke="#7A5C9E" stroke-width="5" marker-end="url(#launch_selective_breeding2-arrow-11)"/><defs><marker id="launch_selective_breeding2-arrow-12" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#7A5C9E"/></marker></defs><line x1="240" y1="330" x2="240" y2="255" fill="none" stroke="#7A5C9E" stroke-width="5" marker-end="url(#launch_selective_breeding2-arrow-12)"/></svg>