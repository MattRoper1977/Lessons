<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="launch_selective_breeding3-title launch_selective_breeding3-desc"><title id="launch_selective_breeding3-title">Offspring are not photocopies</title><desc id="launch_selective_breeding3-desc">Conceptual inheritance model using fictitious allele symbols at two loci. Parents AABB and aabb produce AaBb offspring. This shows transmission of alleles only: yield and disease resistance in the breeding activity are multi-gene traits, not assigned to these symbols.</desc><defs><marker id="launch_selective_breeding3-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><text font-family="Segoe UI, Arial, sans-serif" font-size="31" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="35" y="51">An allele can be inherited; a wish cannot</tspan></text><rect x="60" y="105" width="350" height="130" fill="#F0EBF5" stroke="#7A5C9E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="235" y="157">Parent 1</tspan><tspan x="235" y="195.4">AABB</tspan></text><rect x="590" y="105" width="350" height="130" fill="#F0EBF5" stroke="#7A5C9E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="765" y="157">Parent 2</tspan><tspan x="765" y="195.4">aabb</tspan></text><defs><marker id="launch_selective_breeding3-arrow-5" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#7A5C9E"/></marker></defs><line x1="260" y1="245" x2="430" y2="325" fill="none" stroke="#7A5C9E" stroke-width="5" marker-end="url(#launch_selective_breeding3-arrow-5)"/><defs><marker id="launch_selective_breeding3-arrow-6" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#7A5C9E"/></marker></defs><line x1="750" y1="245" x2="570" y2="325" fill="none" stroke="#7A5C9E" stroke-width="5" marker-end="url(#launch_selective_breeding3-arrow-6)"/><rect x="325" y="330" width="350" height="110" fill="#F0EBF5" stroke="#7A5C9E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="500" y="382">Offspring: AaBb</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="500" y="496">Symbol model only. Real yield and resistance</tspan><tspan x="500" y="527.2">can involve many genes and the environment.</tspan></text></svg>