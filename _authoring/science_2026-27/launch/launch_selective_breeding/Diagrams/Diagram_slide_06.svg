<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="launch_selective_breeding5-title launch_selective_breeding5-desc"><title id="launch_selective_breeding5-title">Keep variation in the breeding population</title><desc id="launch_selective_breeding5-desc">Two conceptual breeding plans: repeatedly select two close relatives, or include suitable unrelated lines. Less diversity can increase shared vulnerability. Different labels represent family lines, not a count of all genes.</desc><defs><marker id="launch_selective_breeding5-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><text font-family="Segoe UI, Arial, sans-serif" font-size="31" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="35" y="51">Select useful traits and protect diversity</tspan></text><rect x="50" y="105" width="420" height="330" fill="#F0EBF5" stroke="#7A5C9E" stroke-width="3"/><rect x="530" y="105" width="420" height="330" fill="#F0EBF5" stroke="#7A5C9E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="260" y="153">Repeated close</tspan><tspan x="260" y="186.6">relatives</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="740" y="153">Several suitable</tspan><tspan x="740" y="186.6">family lines</tspan></text><ellipse cx="162.5" cy="272.5" rx="47.5" ry="37.5" fill="#F0EBF5" stroke="#7A5C9E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="162.5" y="279">F1</tspan></text><ellipse cx="347.5" cy="272.5" rx="47.5" ry="37.5" fill="#F0EBF5" stroke="#7A5C9E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="347.5" y="279">F1</tspan></text><ellipse cx="637.5" cy="272.5" rx="47.5" ry="37.5" fill="#F0EBF5" stroke="#7A5C9E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="637.5" y="279">F1</tspan></text><ellipse cx="762.5" cy="272.5" rx="47.5" ry="37.5" fill="#F0EBF5" stroke="#7A5C9E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="762.5" y="279">F2</tspan></text><ellipse cx="882.5" cy="272.5" rx="47.5" ry="37.5" fill="#F0EBF5" stroke="#7A5C9E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="882.5" y="279">F3</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="260" y="370">Can reduce genetic diversity</tspan><tspan x="260" y="400">and increase inbreeding risk.</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="740" y="370">Retain useful variation;</tspan><tspan x="740" y="400">still test offspring carefully.</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="500" y="500">Neither plan guarantees health or future yield.</tspan><tspan x="500" y="530">Family labels are a simplified model.</tspan></text></svg>