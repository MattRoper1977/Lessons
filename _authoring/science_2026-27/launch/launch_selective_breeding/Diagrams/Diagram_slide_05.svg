<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="launch_selective_breeding4-title launch_selective_breeding4-desc"><title id="launch_selective_breeding4-title">Selection can shift a population</title><desc id="launch_selective_breeding4-desc">Constructed sample data: mean grain mass per plant is 34, 39, 43 and 44 g in generations 0 to 3, with the same trial conditions. This illustrates a possible outcome, not a guarantee that yield always rises or that every offspring improves.</desc><defs><marker id="launch_selective_breeding4-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><text font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="35" y="50">Constructed sample data: selected crop line</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="35" y="92">Mean grain mass per plant (g); matched conditions</tspan></text><line x1="130" y1="435" x2="920" y2="435" fill="none" stroke="#1F2937" stroke-width="4"/><line x1="130" y1="125" x2="130" y2="435" fill="none" stroke="#1F2937" stroke-width="4"/><line x1="120" y1="435" x2="920" y2="435" fill="none" stroke="#D8D3DC" stroke-width="2"/><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="end" fill="#1F2937"><tspan x="110" y="443">30</tspan></text><line x1="120" y1="365" x2="920" y2="365" fill="none" stroke="#D8D3DC" stroke-width="2"/><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="end" fill="#1F2937"><tspan x="110" y="373">35</tspan></text><line x1="120" y1="295" x2="920" y2="295" fill="none" stroke="#D8D3DC" stroke-width="2"/><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="end" fill="#1F2937"><tspan x="110" y="303">40</tspan></text><line x1="120" y1="225" x2="920" y2="225" fill="none" stroke="#D8D3DC" stroke-width="2"/><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="end" fill="#1F2937"><tspan x="110" y="233">45</tspan></text><line x1="120" y1="155" x2="920" y2="155" fill="none" stroke="#D8D3DC" stroke-width="2"/><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="end" fill="#1F2937"><tspan x="110" y="163">50</tspan></text><ellipse cx="210" cy="379" rx="7" ry="7" fill="#7A5C9E" stroke="#7A5C9E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="210" y="487">G0</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="210" y="357">34</tspan></text><ellipse cx="420" cy="309" rx="7" ry="7" fill="#7A5C9E" stroke="#7A5C9E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="420" y="487">G1</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="420" y="287">39</tspan></text><ellipse cx="630" cy="253" rx="7" ry="7" fill="#7A5C9E" stroke="#7A5C9E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="630" y="487">G2</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="630" y="231">43</tspan></text><ellipse cx="840" cy="239" rx="7" ry="7" fill="#7A5C9E" stroke="#7A5C9E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="840" y="487">G3</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="840" y="217">44</tspan></text><line x1="210" y1="379" x2="420" y2="309" fill="none" stroke="#7A5C9E" stroke-width="4"/><line x1="420" y1="309" x2="630" y2="253" fill="none" stroke="#7A5C9E" stroke-width="4"/><line x1="630" y1="253" x2="840" y2="239" fill="none" stroke="#7A5C9E" stroke-width="4"/><text font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="525" y="536">Generation (G)</tspan></text></svg>