<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="launch_evolution_evidence2-title launch_evolution_evidence2-desc"><title id="launch_evolution_evidence2-title">Whale relatives through deep time</title><desc id="launch_evolution_evidence2-desc">Simplified timeline of three extinct whale relatives using Natural History Museum approximate ages. Separate branches are not drawn: the timeline orders evidence and does not claim a direct ancestor sequence.</desc><defs><marker id="launch_evolution_evidence2-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><text font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="35" y="55">Fossils reveal different combinations of traits</tspan></text><defs><marker id="launch_evolution_evidence2-arrow-1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><line x1="95" y1="440" x2="900" y2="440" fill="none" stroke="#1F2937" stroke-width="4" marker-end="url(#launch_evolution_evidence2-arrow-1)"/><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="45" y="505">Older: about 50 Ma</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="735" y="505">Younger: 33 Ma</tspan></text><rect x="50" y="100" width="275" height="275" fill="#F0EBF5" stroke="#7A5C9E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="65" y="145">Pakicetus</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="65" y="197">About 50 Ma</tspan><tspan x="65" y="229.4">Four walking legs</tspan><tspan x="65" y="261.8">Whale-group</tspan><tspan x="65" y="294.2">ear features</tspan></text><line x1="170" y1="380" x2="170" y2="435" fill="none" stroke="#7A5C9E" stroke-width="4"/><rect x="360" y="100" width="280" height="275" fill="#F0EBF5" stroke="#7A5C9E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="375" y="145">Ambulocetus</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="375" y="197">About 50–48 Ma</tspan><tspan x="375" y="229.4">Large feet</tspan><tspan x="375" y="261.8">Movement in water</tspan><tspan x="375" y="294.2">and on land</tspan></text><line x1="480" y1="380" x2="480" y2="435" fill="none" stroke="#7A5C9E" stroke-width="4"/><rect x="675" y="100" width="275" height="275" fill="#F0EBF5" stroke="#7A5C9E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="690" y="145">Dorudon</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="690" y="197">About 40–33 Ma</tspan><tspan x="690" y="229.4">Flippers</tspan><tspan x="690" y="261.8">Very small</tspan><tspan x="690" y="294.2">hind legs</tspan></text><line x1="810" y1="380" x2="810" y2="435" fill="none" stroke="#7A5C9E" stroke-width="4"/></svg>