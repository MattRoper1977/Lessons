<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="launch_evolution_evidence4-title launch_evolution_evidence4-desc"><title id="launch_evolution_evidence4-title">Read the genetic evidence</title><desc id="launch_evolution_evidence4-desc">Constructed practice data for fictional species. A differs from Q at 2 of 100 aligned DNA positions, B at 11 and C at 24. Fewer differences support closer relatedness for comparable DNA; this short sample alone cannot establish a complete tree.</desc><defs><marker id="launch_evolution_evidence4-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><text font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="35" y="49">Constructed sample data: DNA compared with Q</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="35" y="90">Differences in the same aligned 100 DNA positions</tspan></text><line x1="230" y1="425" x2="900" y2="425" fill="none" stroke="#1F2937" stroke-width="4"/><line x1="230" y1="130" x2="230" y2="425" fill="none" stroke="#1F2937" stroke-width="4"/><line x1="230" y1="425" x2="230" y2="438" fill="none" stroke="#1F2937" stroke-width="4"/><text font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="230" y="474">0</tspan></text><line x1="355" y1="425" x2="355" y2="438" fill="none" stroke="#1F2937" stroke-width="4"/><text font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="355" y="474">5</tspan></text><line x1="480" y1="425" x2="480" y2="438" fill="none" stroke="#1F2937" stroke-width="4"/><text font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="480" y="474">10</tspan></text><line x1="605" y1="425" x2="605" y2="438" fill="none" stroke="#1F2937" stroke-width="4"/><text font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="605" y="474">15</tspan></text><line x1="730" y1="425" x2="730" y2="438" fill="none" stroke="#1F2937" stroke-width="4"/><text font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="730" y="474">20</tspan></text><line x1="855" y1="425" x2="855" y2="438" fill="none" stroke="#1F2937" stroke-width="4"/><text font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="855" y="474">25</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="90" y="185">A</tspan></text><rect x="230" y="155" width="50" height="50" fill="#7A5C9E" stroke="#7A5C9E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="300" y="183">2</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="90" y="270">B</tspan></text><rect x="230" y="240" width="275" height="50" fill="#7A5C9E" stroke="#7A5C9E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="525" y="268">11</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="90" y="355">C</tspan></text><rect x="230" y="325" width="600" height="50" fill="#7A5C9E" stroke="#7A5C9E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#1F2937">