<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="launch_evolution_evidence3-title launch_evolution_evidence3-desc"><title id="launch_evolution_evidence3-title">One inherited limb pattern, different functions</title><desc id="launch_evolution_evidence3-desc">Schematic human forelimb and a five-digit whale flipper: one upper limb bone, two lower limb bones, wrist bones and five digits. Bone proportions and numbers of small wrist and digit bones are simplified; colours link corresponding regions, not exact scale.</desc><defs><marker id="launch_evolution_evidence3-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><text font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="230" y="70">Human forelimb</tspan></text><rect x="200" y="110" width="48" height="105" fill="#E8BB8B" stroke="#C9803B" stroke-width="3"/><rect x="175" y="235" width="27" height="95" fill="#8BBBD2" stroke="#4D82A0" stroke-width="3"/><rect x="237" y="235" width="27" height="95" fill="#8BBBD2" stroke="#4D82A0" stroke-width="3"/><rect x="165" y="345" width="112" height="35" fill="#D9D0E3" stroke="#7A5C9E" stroke-width="3"/><line x1="177" y1="385" x2="135" y2="405" fill="none" stroke="#7A5C9E" stroke-width="9"/><line x1="135" y1="407" x2="135" y2="460" fill="none" stroke="#7A5C9E" stroke-width="9"/><line x1="193" y1="385" x2="177" y2="405" fill="none" stroke="#7A5C9E" stroke-width="9"/><line x1="177" y1="407" x2="177" y2="483" fill="none" stroke="#7A5C9E" stroke-width="9"/><line x1="209" y1="385" x2="219" y2="405" fill="none" stroke="#7A5C9E" stroke-width="9"/><line x1="219" y1="407" x2="219" y2="483" fill="none" stroke="#7A5C9E" stroke-width="9"/><line x1="225" y1="385" x2="261" y2="405" fill="none" stroke="#7A5C9E" stroke-width="9"/><line x1="261" y1="407" x2="261" y2="483" fill="none" stroke="#7A5C9E" stroke-width="9"/><line x1="241" y1="385" x2="303" y2="405" fill="none" stroke="#7A5C9E" stroke-width="9"/><line x1="303" y1="407" x2="303" y2="460" fill="none" stroke="#7A5C9E" stroke-width="9"/><text font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="730" y="70">Whale flipper</tspan></text><rect x="685" y="125" width="75" height="65" fill="#E8BB8B" stroke="#C9803B" stroke-width="3"/><rect x="655" y="220" width="50" height="70" fill="#8BBBD2" stroke="#4D82A0" stroke-width="3"/><rect x="740" y="220" width="50" height="70" fill="#8BBBD2" stroke="#4D82A0" stroke-width="3"/><rect x="660" y="310" width="125" height="30" fill="#D9D0E3" stroke="#7A5C9E" stroke-width="3"/><line x1="672" y1="348" x2="625" y2="365" fill="none" stroke="#7A5C9E" stroke-width="8"/><line x1="625" y1="368" x2="625" y2="445" fill="none" stroke="#7A5C9E" stroke-width="8"/><line x1="695" y1="348" x2="671" y2="365" fill="none" stroke="#7A5C9E" stroke-width="8"/><line x1="671" y1="368" x2="671" y2="480" fill="none" stroke="#7A5C9E" stroke-width="8"/><line x1="718" y1="348" x2="717" y2="365" fill="none" stroke="#7A5C9E" stroke-width="8"/><line x1="717" y1="368" x2="717" y2="480" fill="none" stroke="#7A5C9E" stroke-width="8"/><line x1="741" y1="348" x2="763" y2="365" fill="none" stroke="#7A5C9E" stroke-width="8"/><line x1="763" y1="368" x2="763" y2="480" fill="none" stroke="#7A5C9E" stroke-width="8"/><line x1="764" y1="348" x2="809" y2="365" fill="none" stroke="#7A5C9E" stroke-width="8"/><line x1="809" y1="368" x2="809" y2="445" fill="none" stroke="#7A5C9E" stroke-width="8"/><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" text-anchor="middle" fill="#C9803B"><tspan x="490" y="140">1 upper bone</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" text-anchor="middle" fill="#4D82A0"><tspan x="490" y="270">2 lower bones</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" text-anchor="middle" fill="#7A5C9E"><tspan x="490" y="370">Wrist bones</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" text-anchor="middle" fill="#7A5C9E"><tspan x="490" y="450">5 digits</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="500" y="534">Same bone plan; different shapes. Not to scale.</tspan></text></svg>