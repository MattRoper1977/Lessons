<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="launch_evolution_evidence5-title launch_evolution_evidence5-desc"><title id="launch_evolution_evidence5-title">Branching does not mean a ladder</title><desc id="launch_evolution_evidence5-desc">One possible schematic hypothesis for fictional Q, A, B and C. The Q-only comparisons support Q/A closeness but do not establish the B/C branching order. Branch lengths do not show measured time.</desc><defs><marker id="launch_evolution_evidence5-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><text font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="35" y="50">One possible relationship model</tspan></text><line x1="110" y1="410" x2="310" y2="410" fill="none" stroke="#7A5C9E" stroke-width="5"/><line x1="310" y1="410" x2="310" y2="135" fill="none" stroke="#7A5C9E" stroke-width="5"/><line x1="310" y1="135" x2="560" y2="135" fill="none" stroke="#7A5C9E" stroke-width="5"/><line x1="310" y1="410" x2="890" y2="410" fill="none" stroke="#7A5C9E" stroke-width="5"/><line x1="560" y1="135" x2="560" y2="285" fill="none" stroke="#7A5C9E" stroke-width="5"/><line x1="560" y1="285" x2="890" y2="285" fill="none" stroke="#7A5C9E" stroke-width="5"/><line x1="560" y1="135" x2="730" y2="135" fill="none" stroke="#7A5C9E" stroke-width="5"/><line x1="730" y1="135" x2="730" y2="70" fill="none" stroke="#7A5C9E" stroke-width="5"/><line x1="730" y1="70" x2="890" y2="70" fill="none" stroke="#7A5C9E" stroke-width="5"/><line x1="730" y1="135" x2="730" y2="170" fill="none" stroke="#7A5C9E" stroke-width="5"/><line x1="730" y1="170" x2="890" y2="170" fill="none" stroke="#7A5C9E" stroke-width="5"/><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="905" y="78">Q</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="905" y="178">A</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="905" y="293">B</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="905" y="418">C</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="60" y="476">Tips = living species in this model</tspan><tspan x="60" y="507.2">Branch lengths are not a time scale.</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="50" y="109">Q did not</tspan><tspan x="50" y="143.8">evolve from</tspan><tspan x="50" y="178.6">living A.</tspan></text></svg>