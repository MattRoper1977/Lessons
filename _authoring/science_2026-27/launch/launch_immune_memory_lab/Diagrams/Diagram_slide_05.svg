<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="launch_immune_memory_lab4-title launch_immune_memory_lab4-desc"><title id="launch_immune_memory_lab4-title">Same antigen: compare the responses</title><desc id="launch_immune_memory_lab4-desc">Constructed teaching data comparing elapsed days after first and later exposure to the same antigen. Arbitrary antibody units: first response 0,0,2,6,10,7; later response 0,8,20,32,30,24 at days 0,2,4,6,8,10. Not clinical measurements or a protective threshold.</desc><defs><marker id="launch_immune_memory_lab4-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><text font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="30" y="50">Same antigen: compare the responses</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="35" y="100">Antibody amount (arbitrary units)</tspan></text><line x1="130" y1="430" x2="920" y2="430" fill="none" stroke="#1F2937" stroke-width="4"/><line x1="130" y1="140" x2="130" y2="430" fill="none" stroke="#1F2937" stroke-width="4"/><line x1="130" y1="430" x2="920" y2="430" fill="none" stroke="#D9D4E0" stroke-width="1"/><text font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="end" fill="#1F2937"><tspan x="116" y="436">0</tspan></text><line x1="130" y1="362.5" x2="920" y2="362.5" fill="none" stroke="#D9D4E0" stroke-width="1"/><text font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="end" fill="#1F2937"><tspan x="116" y="368.5">10</tspan></text><line x1="130" y1="295" x2="920" y2="295" fill="none" stroke="#D9D4E0" stroke-width="1"/><text font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weig