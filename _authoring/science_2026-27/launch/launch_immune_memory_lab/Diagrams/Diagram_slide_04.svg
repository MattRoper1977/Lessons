<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="launch_immune_memory_lab3-title launch_immune_memory_lab3-desc"><title id="launch_immune_memory_lab3-title">A protein can recognise a specific antigen</title><desc id="launch_immune_memory_lab3-desc">Simplified shape-matching model, not molecular scale: antibody protein has binding sites complementary to antigen X. Antigen Y is a different shape. Binding helps the immune response; antibodies are not cells and do not themselves engulf pathogens.</desc><defs><marker id="launch_immune_memory_lab3-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><text font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="30" y="50">A protein can recognise a specific antigen</tspan></text><ellipse cx="207.5" cy="242.5" rx="127.5" ry="107.5" fill="#F7EBD9" stroke="#C9803B" stroke-width="3"/><rect x="180" y="108" width="55" height="55" fill="#DCCFED" stroke="#7A5C9E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="215" y="399">Pathogen surface</tspan><tspan x="215" y="427.8">Antigen X: square</tspan></text><line x1="520" y1="310" x2="520" y2="220" fill="none" stroke="#7A5C9E" stroke-width="14"/><line x1="520" y1="220" x2="452" y2="155" fill="none" stroke="#7A5C9E" stroke-width="14"/><line x1="520" y1="220" x2="588" y2="155" fill="none" stroke="#7A5C9E" stroke-width="14"/><line x1="438" y1="143" x2="438" y2="174" fill="none" stroke="#7A5C9E" stroke-width="5"/><line x1="438" y1="174" x2="467" y2="174" fill="none" stroke="#7A5C9E" stroke-width="5"/><line x1="602" y1="143" x2="602" y2="174" fill="none" stroke="#7A5C9E" stroke-width="5"/><line x1="573" y1="174" x2="602" y2="174" fill="none" stroke="#7A5C9E" stroke-width="5"/><text font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="520" y="399">Antibody protein</tspan><tspan x="520" y="427.8">Binding-site model</tspan></text><ellipse cx="825" cy="225" rx="70" ry="70" fill="#E2EEE8" stroke="#3F7D6E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="822.5" y="399">Antigen Y</tspan><tspan x="822.5" y="427.8">Different fit</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="55" y="505">A simplified recognition model; shapes are not to scale.</tspan></text></svg>