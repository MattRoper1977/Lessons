<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="launch_immune_memory_lab2-title launch_immune_memory_lab2-desc"><title id="launch_immune_memory_lab2-title">Defences at the entry points</title><desc id="launch_immune_memory_lab2-desc">Four labelled examples pair a defence with a mechanism: skin barrier, mucus and cilia in airways, lysozyme in tears, hydrochloric acid in the stomach. These reduce entry or survival, not a perfect shield.</desc><defs><marker id="launch_immune_memory_lab2-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><text font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="30" y="50">Defences at the entry points</tspan></text><rect x="45" y="110" width="415" height="145" fill="#F0EBF5" stroke="#7A5C9E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="65" y="154">Skin</tspan><tspan x="65" y="185.2">Physical barrier</tspan></text><rect x="540" y="110" width="415" height="145" fill="#F0EBF5" stroke="#7A5C9E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="560" y="154">Airway mucus + cilia</tspan><tspan x="560" y="185.2">Trap material,</tspan><tspan x="560" y="216.4">then move it</tspan></text><rect x="45" y="330" width="415" height="145" fill="#F0EBF5" stroke="#7A5C9E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="65" y="374">Tears: lysozyme</tspan><tspan x="65" y="405.2">Damages some</tspan><tspan x="65" y="436.4">bacterial walls</tspan></text><rect x="540" y="330" width="415" height="145" fill="#F0EBF5" stroke="#7A5C9E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="560" y="374">Stomach acid</tspan><tspan x="560" y="405.2">Kills many swallowed</tspan><tspan x="560" y="436.4">pathogens</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="40" y="520">Barriers reduce entry or survival; they are not perfect.</tspan></text></svg>