<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="launch_health_plants_checkpoint4-title launch_health_plants_checkpoint4-desc"><title id="launch_health_plants_checkpoint4-title">Worked method, different numbers</title><desc id="launch_health_plants_checkpoint4-desc">Analogous warm-up: three counts each lasting 2 minutes are 7, 8 and 9 bubbles; mean 8 per 2 minutes gives 4 bubbles/min. The checkpoint uses different data.</desc><defs><marker id="launch_health_plants_checkpoint4-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><text font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="30" y="50">Worked method, different numbers</tspan></text><rect x="60" y="135" width="375" height="125" fill="#F0EBF5" stroke="#7A5C9E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="247.5" y="186">Counts: 7, 8, 9</tspan><tspan x="247.5" y="219.6">Each lasted 2 minutes</tspan></text><defs><marker id="launch_health_plants_checkpoint4-arrow-3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#7A5C9E"/></marker></defs><line x1="450" y1="200" x2="555" y2="200" fill="none" stroke="#7A5C9E" stroke-width="4" marker-end="url(#launch_health_plants_checkpoint4-arrow-3)"/><rect x="575" y="135" width="365" height="125" fill="#F0EBF5" stroke="#7A5C9E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="757.5" y="186">Mean count=8</tspan><tspan x="757.5" y="219.6">Rate = 4 bubbles/min</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="500" y="360">(7+8+9)÷3=8; then 8 ÷ 2 = 4</tspan><tspan x="500" y="396">Check the time before writing the rate.</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="500" y="495">Constructed warm-up data; not the checkpoint answers.</tspan></text></svg>