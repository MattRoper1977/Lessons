<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="launch_health_plants_checkpoint2-title launch_health_plants_checkpoint2-desc"><title id="launch_health_plants_checkpoint2-title">A cause test beats a symptom guess</title><desc id="launch_health_plants_checkpoint2-desc">Recap comparison: two fictional conditions share a rash symptom. One is caused by a transmissible virus; the other is a non-infectious skin reaction. The cause and route determine the category, not rash alone.</desc><defs><marker id="launch_health_plants_checkpoint2-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><text font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="30" y="50">A cause test beats a symptom guess</tspan></text><rect x="45" y="110" width="415" height="145" fill="#F0EBF5" stroke="#7A5C9E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="65" y="154">Recap P: virus</tspan><tspan x="65" y="185.2">Can spread between hosts</tspan></text><rect x="540" y="110" width="415" height="145" fill="#F0EBF5" stroke="#7A5C9E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="560" y="154">Recap Q: skin reaction</tspan><tspan x="560" y="185.2">No infectious cause</tspan></text><rect x="45" y="330" width="415" height="145" fill="#F0EBF5" stroke="#7A5C9E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="65" y="374">Both may show a rash</tspan><tspan x="65" y="405.2">A symptom can be shared</tspan></text><rect x="540" y="330" width="415" height="145" fill="#F0EBF5" stroke="#7A5C9E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="560" y="374">Find the cause and route</tspan><tspan x="560" y="405.2">Do not diagnose a pupil</tspan></text></svg>