<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="launch_exchange_ventilation_lab6-title launch_exchange_ventilation_lab6-desc"><title id="launch_exchange_ventilation_lab6-title">Oxygen and carbon dioxide diffuse in opposite directions</title><desc id="launch_exchange_ventilation_lab6-desc">Simplified alveolar exchange: oxygen diffuses from alveolar air into arriving oxygen-poor capillary blood; carbon dioxide diffuses from blood into alveolar air. A thin barrier separates air and blood. Directions are based on gradients, not active pumping of gases.</desc><defs><marker id="launch_exchange_ventilation_lab6-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><text font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="30" y="50">Oxygen and carbon dioxide diffuse in opposite directions</tspan></text><ellipse cx="217.5" cy="280" rx="172.5" ry="135" fill="#EDF4F8" stroke="#4D82A0" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="215" y="202">Alveolar air</tspan><tspan x="215" y="234.4">Higher oxygen than</tspan><tspan x="215" y="266.8">arriving blood</tspan></text><rect x="610" y="140" width="345" height="275" fill="#F6E5E5" stroke="#B34D4D" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="782.5" y="197">Arriving blood</tspan><tspan x="782.5" y="229.4">Lower oxygen than</tspan><tspan x="782.5" y="261.8">alveolar air</tspan></text><line x1="455" y1="125" x2="455" y2="430" fill="none" stroke="#1F2937" stroke-width="5"/><line x1="495" y1="125" x2="495" y2="430" fill="none" stroke="#1F2937" stroke-width="5"/><defs><marker id="launch_exchange_ventilation_lab6-arrow-7" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#4D82A0"/></marker></defs><line x1="340" y1="295" x2="600" y2="295" fill="none" stroke="#4D82A0" stroke-width="4" marker-end="url(#launch_exchange_ventilation_lab6-arrow-7)"/><rect x="370" y="243" width="220" height="40" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/><text font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="480" y="270">Oxygen</tspan></text><defs><marker id="launch_exchange_ventilation_lab6-arrow-10" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#B34D4D"/></marker></defs><line x1="600" y1="370" x2="340" y2="370" fill="none" stroke="#B34D4D" stroke-width="4" marker-end="url(#launch_exchange_ventilation_lab6-arrow-10)"/><rect x="350" y="385" width="255" height="45" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/><text font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="477.5" y="411">Carbon dioxide</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="45" y="491">Thin, moist exchange barrier</tspan><tspan x="45" y="522.2">Short diffusion distance</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="585" y="490">Blood flow and ventilation</tspan><tspan x="585" y="520">help maintain gradients</tspan></text></svg>