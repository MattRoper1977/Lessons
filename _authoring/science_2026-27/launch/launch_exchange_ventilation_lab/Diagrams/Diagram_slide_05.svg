<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="launch_exchange_ventilation_lab4-title launch_exchange_ventilation_lab4-desc"><title id="launch_exchange_ventilation_lab4-title">Constructed model: compare one factor</title><desc id="launch_exchange_ventilation_lab4-desc">Idealised relative diffusion-rate indices calculated as area×concentration difference÷thickness with the same omitted proportionality constant. P:2×4/1=8; Q:4×4/1=16; R:2×4/2=4. This is a mathematical comparison, not measured physiological data.</desc><defs><marker id="launch_exchange_ventilation_lab4-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><text font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="30" y="50">Constructed model: compare one factor</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="40" y="101">Relative model rate index; not a clinical unit</tspan></text><line x1="120" y1="450" x2="925" y2="450" fill="none" stroke="#1F2937" stroke-width="4"/><line x1="120" y1="135" x2="120" y2="450" fill="none" stroke="#1F2937" stroke-width="4"/><line x1="120" y1="450" x2="925" y2="450" fill="none" stroke="#D9D4E0" stroke-width="1"/><text font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="end" fill="#1F2937"><tspan x="105" y="456">0</tspan></text><line x1="120" y1="375" x2="925" y2="375" fill="none" stroke="#D9D4E0" stroke-width="1"/><text font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="end" fill="#1F2937"><tspan x="105" y="381">5</tspan></text><line x1="120" y1="300" x2="925" y2="300" fill="none" stroke="#D9D4E0" stroke-width="1"/><text font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="end" fill="#1F2937"><tspan x="105" y="306">10</tspan></text><line x1="120" y1="225" x2="925" y2="225" fill="none" stroke="#D9D4E0" stroke-width="1"/><text font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="end" fill="#1F2937"><tspan x="105" y="231">15</tspan></text><line x1="120" y1="150" x2="925" y2="150" fill="none" stroke="#D9D4E0" stroke-width="1"/><text font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="end" fill="#1F2937"><tspan x="105" y="156">20</tspan></text><rect x="155" y="330" width="211.667" height="120" fill="#DACEEC" stroke="#7A5C9E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="260.833" y="315">8</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="260.833" y="490">P</tspan></text><rect x="401.667" y="210" width="211.667" height="240" fill="#DACEEC" stroke="#7A5C9E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="507.5" y="195">16</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="507.5" y="490">Q</tspan></text><rect x="648.333" y="390" width="211.667" height="60" fill="#DACEEC" stroke="#7A5C9E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="754.167" y="375">4</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="754.167" y="490">R</tspan></text></svg>