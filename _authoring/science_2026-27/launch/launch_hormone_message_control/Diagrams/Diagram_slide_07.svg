<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="launch_hormone_message_control6-title launch_hormone_message_control6-desc"><title id="launch_hormone_message_control6-title">A circulating hormone needs a matching response</title><desc id="launch_hormone_message_control6-desc">Simplified receptor model: a purple signal is present near two cells. Cell A has a matching receptor and can respond; cell B lacks that receptor. Shapes model recognition only; real receptors are molecules, not conscious locks.</desc><defs><marker id="launch_hormone_message_control6-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><text font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="30" y="50">A circulating hormone needs a matching response</tspan></text><ellipse cx="255" cy="275" rx="145" ry="110" fill="#E4F0E9" stroke="#3F7D6E" stroke-width="3"/><ellipse cx="745" cy="275" rx="145" ry="110" fill="#EEF0F3" stroke="#1F2937" stroke-width="3"/><rect x="245" y="130" width="40" height="60" fill="#FFFFFF" stroke="#7A5C9E" stroke-width="3"/><ellipse cx="265" cy="122" rx="18" ry="18" fill="#7A5C9E" stroke="#7A5C9E" stroke-width="3"/><ellipse cx="745" cy="122" rx="18" ry="18" fill="#7A5C9E" stroke="#7A5C9E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="255" y="432">Cell A: matching receptor</tspan><tspan x="255" y="464.4">A response can occur</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="745" y="431">Cell B: no matching receptor</tspan><tspan x="745" y="462.2">No response to this signal</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="255" y="264">Specific</tspan><tspan x="255" y="298.8">response</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="745" y="263">Same blood</tspan><tspan x="745" y="296.6">signal present</tspan></text></svg>