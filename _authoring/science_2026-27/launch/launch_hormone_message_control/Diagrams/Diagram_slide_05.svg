<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="launch_hormone_message_control4-title launch_hormone_message_control4-desc"><title id="launch_hormone_message_control4-title">Control reduces a departure</title><desc id="launch_hormone_message_control4-desc">General negative-feedback model: a condition departs from a suitable range, the change is detected/coordinated, a response opposes the departure, and the condition moves towards the range. This is a control concept, not a claim that all responses are hormonal.</desc><defs><marker id="launch_hormone_message_control4-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><text font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="30" y="50">Control reduces a departure</tspan></text><rect x="45" y="110" width="415" height="145" fill="#F0EBF5" stroke="#7A5C9E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="65" y="154">Condition departs</tspan><tspan x="65" y="185.2">from a suitable range</tspan></text><rect x="540" y="110" width="415" height="145" fill="#F0EBF5" stroke="#7A5C9E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="560" y="154">Change is detected</tspan><tspan x="560" y="185.2">and coordinated</tspan></text><rect x="45" y="330" width="415" height="145" fill="#F0EBF5" stroke="#7A5C9E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="65" y="374">Condition moves</tspan><tspan x="65" y="405.2">towards suitable limits</tspan></text><rect x="540" y="330" width="415" height="145" fill="#F0EBF5" stroke="#7A5C9E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="560" y="374">Response counteracts</tspan><tspan x="560" y="405.2">the original change</tspan></text><defs><marker id="launch_hormone_message_control4-arrow-9" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#7A5C9E"/></marker></defs><line x1="470" y1="183" x2="525" y2="183" fill="none" stroke="#7A5C9E" stroke-width="4" marker-end="url(#launch_hormone_message_control4-arrow-9)"/><defs><marker id="launch_hormone_message_control4-arrow-10" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#7A5C9E"/></marker></defs><line x1="750" y1="268" x2="750" y2="317" fill="none" stroke="#7A5C9E" stroke-width="4" marker-end="url(#launch_hormone_message_control4-arrow-10)"/><defs><marker id="launch_hormone_message_control4-arrow-11" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#7A5C9E"/></marker></defs><line x1="530" y1="402" x2="475" y2="402" fill="none" stroke="#7A5C9E" stroke-width="4" marker-end="url(#launch_hormone_message_control4-arrow-11)"/><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="40" y="520">Homeostasis is active regulation, not perfect stillness.</tspan></text></svg>