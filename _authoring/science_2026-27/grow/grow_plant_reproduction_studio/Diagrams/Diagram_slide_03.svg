<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="grow_plant_reproduction_studio2-title grow_plant_reproduction_studio2-desc"><title id="grow_plant_reproduction_studio2-title">Sexual reproduction: the defining event</title><desc id="grow_plant_reproduction_studio2-desc">A simplified scientific sequence: Male gamete; Fusion with
female gamete; Offspring
with inherited
genes. Gametes may come from different plants
or from one self-fertile plant.</desc><defs><marker id="grow_plant_reproduction_studio2-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><text font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="500" y="57">Sexual reproduction: the defining event</tspan></text><rect x="60" y="190" width="273.333" height="130" fill="#EFF7F3" stroke="#3F7D6E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="196.667" y="237">Male gamete</tspan></text><defs><marker id="grow_plant_reproduction_studio2-arrow-3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><line x1="333.333" y1="255" x2="363.333" y2="255" fill="none" stroke="#1F2937" stroke-width="5" marker-end="url(#grow_plant_reproduction_studio2-arrow-3)"/><rect x="363.333" y="190" width="273.333" height="130" fill="#EFF7F3" stroke="#3F7D6E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="500" y="237">Fusion with</tspan><tspan x="500" y="269.4">female gamete</tspan></text><defs><marker id="grow_plant_reproduction_studio2-arrow-6" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><line x1="636.667" y1="255" x2="666.667" y2="255" fill="none" stroke="#1F2937" stroke-width="5" marker-end="url(#grow_plant_reproduction_studio2-arrow-6)"/><rect x="666.667" y="190" width="273.333" height="130" fill="#EFF7F3" stroke="#3F7D6E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="803.333" y="226">Offspring</tspan><tspan x="803.333" y="258.4">with inherited</tspan><tspan x="803.333" y="290.8">genes</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="500" y="402">Gametes may come from different plants</tspan><tspan x="500" y="434.4">or from one self-fertile plant.</tspan></text></svg>