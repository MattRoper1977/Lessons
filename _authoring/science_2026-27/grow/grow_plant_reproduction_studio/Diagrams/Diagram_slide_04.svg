<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="grow_plant_reproduction_studio3-title grow_plant_reproduction_studio3-desc"><title id="grow_plant_reproduction_studio3-title">Strawberry runner: new plant from a stem</title><desc id="grow_plant_reproduction_studio3-desc">An original strawberry plant is connected by a horizontal runner to a rooted daughter plant. Both are shown above the same ground line; no gamete fusion is required in this vegetative route.</desc><defs><marker id="grow_plant_reproduction_studio3-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><text font-family="Segoe UI, Arial, sans-serif" font-size="31" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="500" y="51">A runner can produce a daughter plant</tspan></text><line x1="50" y1="385" x2="950" y2="385" fill="none" stroke="#1F2937" stroke-width="5"/><line x1="240" y1="385" x2="240" y2="245" fill="none" stroke="#3F7D6E" stroke-width="5"/><ellipse cx="202.5" cy="252.5" rx="47.5" ry="22.5" fill="#CBE0D5" stroke="#3F7D6E" stroke-width="3"/><ellipse cx="295" cy="282.5" rx="50" ry="22.5" fill="#CBE0D5" stroke="#3F7D6E" stroke-width="3"/><line x1="240" y1="360" x2="720" y2="360" fill="none" stroke="#3F7D6E" stroke-width="5"/><line x1="720" y1="385" x2="720" y2="270" fill="none" stroke="#3F7D6E" stroke-width="5"/><ellipse cx="685" cy="291" rx="45" ry="21" fill="#CBE0D5" stroke="#3F7D6E" stroke-width="3"/><ellipse cx="770" cy="311" rx="45" ry="21" fill="#CBE0D5" stroke="#3F7D6E" stroke-width="3"/><line x1="240" y1="385" x2="205" y2="465" fill="none" stroke="#3F7D6E" stroke-width="5"/><line x1="240" y1="385" x2="280" y2="455" fill="none" stroke="#3F7D6E" stroke-width="5"/><line x1="720" y1="385" x2="688" y2="450" fill="none" stroke="#3F7D6E" stroke-width="5"/><line x1="720" y1="385" x2="754" y2="453" fill="none" stroke="#3F7D6E" stroke-width="5"/><text font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="240" y="170">Parent plant</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="720" y="200">Daughter plant</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="485" y="317">Runner: a stem</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="500" y="517">Vegetative growth from the parent; no gamete fusion here.</tspan></text></svg>