<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="grow_plant_reproduction_studio4-title grow_plant_reproduction_studio4-desc"><title id="grow_plant_reproduction_studio4-title">Genes and environment are different influences</title><desc id="grow_plant_reproduction_studio4-desc">Two rooted cuttings from the same parent are drawn with different heights under different growth conditions. The comparison illustrates that clonal genetic similarity does not guarantee identical appearance.</desc><defs><marker id="grow_plant_reproduction_studio4-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><text font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="500" y="52">Clones need not look identical</tspan></text><rect x="75" y="140" width="390" height="305" fill="#EFF7F3" stroke="#3F7D6E" stroke-width="3"/><rect x="535" y="140" width="390" height="305" fill="#EFF7F3" stroke="#3F7D6E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="270" y="183">Same parent cutting</tspan><tspan x="270" y="216.6">condition A</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="730" y="183">Same parent cutting</tspan><tspan x="730" y="216.6">condition B</tspan></text><line x1="100" y1="405" x2="440" y2="405" fill="none" stroke="#1F2937" stroke-width="5"/><line x1="560" y1="405" x2="900" y2="405" fill="none" stroke="#1F2937" stroke-width="5"/><line x1="270" y1="405" x2="270" y2="270" fill="none" stroke="#3F7D6E" stroke-width="5"/><line x1="730" y1="405" x2="730" y2="330" fill="none" stroke="#3F7D6E" stroke-width="5"/><ellipse cx="250" cy="300" rx="30" ry="15" fill="#CBE0D5" stroke="#3F7D6E" stroke-width="3"/><ellipse cx="302.5" cy="335" rx="32.5" ry="15" fill="#CBE0D5" stroke="#3F7D6E" stroke-width="3"/><ellipse cx="715.5" cy="357" rx="27.5" ry="14" fill="#CBE0D5" stroke="#3F7D6E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="500" y="510">Illustrative model: genes and growth conditions both affect traits.</tspan></text></svg>