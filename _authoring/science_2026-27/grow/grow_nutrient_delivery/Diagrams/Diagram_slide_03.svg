<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="grow_nutrient_delivery2-title grow_nutrient_delivery2-desc"><title id="grow_nutrient_delivery2-title">Absorption: across a surface</title><desc id="grow_nutrient_delivery2-desc">Small glucose symbols cross the intestinal wall into a capillary. Labels distinguish intestine contents, wall and blood. The model is not to scale or a literal sieve.</desc><defs><marker id="grow_nutrient_delivery2-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><text font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="500" y="52">A soluble nutrient crosses the gut wall</tspan></text><rect x="50" y="115" width="330" height="280" fill="#FCF4E7" stroke="#C9803B" stroke-width="3"/><rect x="380" y="115" width="170" height="280" fill="#E5EEE9" stroke="#3F7D6E" stroke-width="3"/><rect x="550" y="115" width="400" height="280" fill="#FBECEB" stroke="#B64745" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="215" y="163">Inside the intestine</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="465" y="157">Gut</tspan><tspan x="465" y="189.4">wall</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="750" y="163">Small blood vessel</tspan></text><ellipse cx="112" cy="247" rx="12" ry="12" fill="#C9803B" stroke="#C9803B" stroke-width="3"/><ellipse cx="212" cy="302" rx="12" ry="12" fill="#C9803B" stroke="#C9803B" stroke-width="3"/><ellipse cx="307" cy="252" rx="12" ry="12" fill="#C9803B" stroke="#C9803B" stroke-width="3"/><defs><marker id="grow_nutrient_delivery2-arrow-10" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#C9803B"/></marker></defs><line x1="270" y1="300" x2="700" y2="300" fill="none" stroke="#C9803B" stroke-width="5" marker-end="url(#grow_nutrient_delivery2-arrow-10)"/><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="752.5" y="360">Glucose dissolved in plasma</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="500" y="455">Particles and wall are not to scale. This shows absorption,</tspan><tspan x="500" y="485">not a literal hole or a whole-food filter.</tspan></text></svg>