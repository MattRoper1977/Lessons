<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="grow_nutrient_delivery3-title grow_nutrient_delivery3-desc"><title id="grow_nutrient_delivery3-title">Water and a soluble nutrient travel</title><desc id="grow_nutrient_delivery3-desc">A simplified scientific sequence: Intestine:
absorption; Blood plasma:
transport; Body tissues:
substances used. Circulation carries substances onwards. This job map
omits the detailed liver, heart and lung route.</desc><defs><marker id="grow_nutrient_delivery3-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><text font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="500" y="57">Water and a soluble nutrient travel</tspan></text><rect x="60" y="190" width="273.333" height="130" fill="#EFF7F3" stroke="#3F7D6E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="196.667" y="237">Intestine:</tspan><tspan x="196.667" y="269.4">absorption</tspan></text><defs><marker id="grow_nutrient_delivery3-arrow-3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><line x1="333.333" y1="255" x2="363.333" y2="255" fill="none" stroke="#1F2937" stroke-width="5" marker-end="url(#grow_nutrient_delivery3-arrow-3)"/><rect x="363.333" y="190" width="273.333" height="130" fill="#EFF7F3" stroke="#3F7D6E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="500" y="237">Blood plasma:</tspan><tspan x="500" y="269.4">transport</tspan></text><defs><marker id="grow_nutrient_delivery3-arrow-6" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><line x1="636.667" y1="255" x2="666.667" y2="255" fill="none" stroke="#1F2937" stroke-width="5" marker-end="url(#grow_nutrient_delivery3-arrow-6)"/><rect x="666.667" y="190" width="273.333" height="130" fill="#EFF7F3" stroke="#3F7D6E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="803.333" y="237">Body tissues:</tspan><tspan x="803.333" y="269.4">substances used</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="500" y="402">Circulation carries substances onwards. This job map</tspan><tspan x="500" y="434.4">omits the detailed liver, heart and lung route.</tspan></text></svg>