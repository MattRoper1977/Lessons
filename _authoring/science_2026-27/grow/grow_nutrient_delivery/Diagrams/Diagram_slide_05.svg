<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="grow_nutrient_delivery4-title grow_nutrient_delivery4-desc"><title id="grow_nutrient_delivery4-title">Two different routes out</title><desc id="grow_nutrient_delivery4-desc">A branching model distinguishes unabsorbed material continuing through large intestine to faeces, from blood being filtered by kidneys to produce urine.</desc><defs><marker id="grow_nutrient_delivery4-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><text font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="500" y="52">Faeces and urine take different routes</tspan></text><rect x="55" y="125" width="275" height="130" fill="#EFF7F3" stroke="#3F7D6E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="192.5" y="177">Unabsorbed</tspan><tspan x="192.5" y="209.4">gut material</tspan></text><rect x="380" y="125" width="260" height="130" fill="#EFF7F3" stroke="#3F7D6E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="510" y="177">Large intestine</tspan><tspan x="510" y="209.4">then rectum</tspan></text><rect x="690" y="125" width="255" height="130" fill="#EFF7F3" stroke="#3F7D6E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="817.5" y="176">Faeces</tspan><tspan x="817.5" y="207.2">leave through anus</tspan></text><defs><marker id="grow_nutrient_delivery4-arrow-7" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><line x1="330" y1="190" x2="380" y2="190" fill="none" stroke="#1F2937" stroke-width="5" marker-end="url(#grow_nutrient_delivery4-arrow-7)"/><defs><marker id="grow_nutrient_delivery4-arrow-8" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><line x1="640" y1="190" x2="690" y2="190" fill="none" stroke="#1F2937" stroke-width="5" marker-end="url(#grow_nutrient_delivery4-arrow-8)"/><rect x="55" y="345" width="275" height="130" fill="#FBECEB" stroke="#B64745" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="192.5" y="392">Blood carries</tspan><tspan x="192.5" y="424.4">water and wastes</tspan></text><rect x="380" y="345" width="260" height="130" fill="#EFF7F3" stroke="#3F7D6E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="510" y="392">Kidneys</tspan><tspan x="510" y="424.4">filter blood</tspan></text><rect x="690" y="345" width="255" height="130" fill="#EFF7F3" stroke="#3F7D6E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="817.5" y="392">Urine</tspan><tspan x="817.5" y="424.4">then bladder</tspan></text><defs><marker id="grow_nutrient_delivery4-arrow-15" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><line x1="330" y1="410" x2="380" y2="410" fill="none" stroke="#1F2937" stroke-width="5" marker-end="url(#grow_nutrient_delivery4-arrow-15)"/><defs><marker id="grow_nutrient_delivery4-arrow-16" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><line x1="640" y1="410" x2="690" y2="410" fill="none" stroke="#1F2937" stroke-width="5" marker-end="url(#grow_nutrient_delivery4-arrow-16)"/><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="500" y="520">No direct intestine-to-bladder tube is shown or implied.</tspan></text></svg>