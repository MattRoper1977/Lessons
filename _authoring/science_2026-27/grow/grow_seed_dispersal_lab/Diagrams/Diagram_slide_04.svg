<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="grow_seed_dispersal_lab3-title grow_seed_dispersal_lab3-desc"><title id="grow_seed_dispersal_lab3-title">Fair paper-model drop comparison</title><desc id="grow_seed_dispersal_lab3-desc">Two paper shapes are released from the same marked height into a clear floor area. The measured quantity is fall time. The models have equal original paper dimensions and retained mass, with shape as the changed feature.</desc><defs><marker id="grow_seed_dispersal_lab3-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><text font-family="Segoe UI, Arial, sans-serif" font-size="31" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="500" y="51">Change shape; keep the drop conditions</tspan></text><line x1="80" y1="135" x2="920" y2="135" fill="none" stroke="#4D82A0" stroke-width="5"/><line x1="80" y1="430" x2="920" y2="430" fill="none" stroke="#1F2937" stroke-width="5"/><ellipse cx="252.5" cy="142.5" rx="17.5" ry="17.5" fill="#DFEACC" stroke="#3F7D6E" stroke-width="3"/><rect x="680" y="125" width="85" height="16" fill="#DFEACC" stroke="#3F7D6E" stroke-width="3"/><rect x="714" y="135" width="16" height="45" fill="#DFEACC" stroke="#3F7D6E" stroke-width="3"/><defs><marker id="grow_seed_dispersal_lab3-arrow-6" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#4D82A0"/></marker></defs><line x1="250" y1="190" x2="250" y2="385" fill="none" stroke="#4D82A0" stroke-width="5" marker-end="url(#grow_seed_dispersal_lab3-arrow-6)"/><defs><marker id="grow_seed_dispersal_lab3-arrow-7" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#4D82A0"/></marker></defs><line x1="720" y1="195" x2="720" y2="385" fill="none" stroke="#4D82A0" stroke-width="5" marker-end="url(#grow_seed_dispersal_lab3-arrow-7)"/><text font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="500" y="106">Release height: 1.5 m in the constructed test</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="280" y="497">Compact paper shape</tspan><tspan x="280" y="529.4">Measure time to floor</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="730" y="497">Rotor paper shape</tspan><tspan x="730" y="529.4">Measure time to floor</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="480" y="250">Same paper mass</tspan><tspan x="480" y="280">Same release rule</tspan><tspan x="480" y="310">Still indoor air</tspan></text></svg>