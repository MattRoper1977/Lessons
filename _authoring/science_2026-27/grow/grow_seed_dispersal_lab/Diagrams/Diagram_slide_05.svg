<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="grow_seed_dispersal_lab4-title grow_seed_dispersal_lab4-desc"><title id="grow_seed_dispersal_lab4-title">What the paper model can tell us</title><desc id="grow_seed_dispersal_lab4-desc">A simplified scientific sequence: Observed:
longer fall time; Possible effect:
more time in air; Not measured:
outdoor distance. Paper models test one feature. Real seed journeys
also depend on wind, release height and surroundings.</desc><defs><marker id="grow_seed_dispersal_lab4-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><text font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="500" y="57">What the paper model can tell us</tspan></text><rect x="60" y="190" width="273.333" height="130" fill="#EFF7F3" stroke="#3F7D6E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="196.667" y="237">Observed:</tspan><tspan x="196.667" y="269.4">longer fall time</tspan></text><defs><marker id="grow_seed_dispersal_lab4-arrow-3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><line x1="333.333" y1="255" x2="363.333" y2="255" fill="none" stroke="#1F2937" stroke-width="5" marker-end="url(#grow_seed_dispersal_lab4-arrow-3)"/><rect x="363.333" y="190" width="273.333" height="130" fill="#EFF7F3" stroke="#3F7D6E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="500" y="237">Possible effect:</tspan><tspan x="500" y="269.4">more time in air</tspan></text><defs><marker id="grow_seed_dispersal_lab4-arrow-6" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><line x1="636.667" y1="255" x2="666.667" y2="255" fill="none" stroke="#1F2937" stroke-width="5" marker-end="url(#grow_seed_dispersal_lab4-arrow-6)"/><rect x="666.667" y="190" width="273.333" height="130" fill="#EFF7F3" stroke="#3F7D6E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="803.333" y="237">Not measured:</tspan><tspan x="803.333" y="269.4">outdoor distance</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="500" y="402">Paper models test one feature. Real seed journeys</tspan><tspan x="500" y="434.4">also depend on wind, release height and surroundings.</tspan></text></svg>