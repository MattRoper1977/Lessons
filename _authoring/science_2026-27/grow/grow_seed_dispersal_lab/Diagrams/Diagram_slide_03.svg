<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="grow_seed_dispersal_lab2-title grow_seed_dispersal_lab2-desc"><title id="grow_seed_dispersal_lab2-title">Different structures, different dispersal routes</title><desc id="grow_seed_dispersal_lab2-desc">Two schematic botanical structures are compared without a connecting arrow: sycamore winged fruit with seed-bearing region, and burdock hooked burr enclosing fruits. Structures are simplified and not to scale.</desc><defs><marker id="grow_seed_dispersal_lab2-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><text font-family="Segoe UI, Arial, sans-serif" font-size="31" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="500" y="51">Structures can change how a seed travels</tspan></text><rect x="60" y="125" width="410" height="320" fill="#EFF7F3" stroke="#3F7D6E" stroke-width="3"/><rect x="530" y="125" width="410" height="320" fill="#EFF7F3" stroke="#3F7D6E" stroke-width="3"/><ellipse cx="175" cy="307.5" rx="35" ry="32.5" fill="#D6BC8D" stroke="#C9803B" stroke-width="3"/><ellipse cx="295" cy="252.5" rx="105" ry="37.5" fill="#DFEACC" stroke="#3F7D6E" stroke-width="3"/><line x1="200" y1="300" x2="385" y2="245" fill="none" stroke="#3F7D6E" stroke-width="5"/><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="265" y="173">Sycamore: winged fruit</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="265" y="395">Seed inside the base</tspan><tspan x="265" y="425">Wing interacts with air</tspan></text><ellipse cx="730" cy="310" rx="60" ry="60" fill="#DFEACC" stroke="#3F7D6E" stroke-width="3"/><line x1="680" y1="255" x2="650" y2="215" fill="none" stroke="#3F7D6E" stroke-width="5"/><line x1="650" y1="215" x2="635" y2="230" fill="none" stroke="#3F7D6E" stroke-width="5"/><line x1="780" y1="265" x2="825" y2="235" fill="none" stroke="#3F7D6E" stroke-width="5"/><line x1="825" y1="235" x2="828" y2="258" fill="none" stroke="#3F7D6E" stroke-width="5"/><line x1="782" y1="340" x2="828" y2="362" fill="none" stroke="#3F7D6E" stroke-width="5"/><line x1="828" y1="362" x2="807" y2="376" fill="none" stroke="#3F7D6E" stroke-width="5"/><line x1="683" y1="350" x2="645" y2="387" fill="none" stroke="#3F7D6E" stroke-width="5"/><line x1="645" y1="387" x2="632" y2="368" fill="none" stroke="#3F7D6E" stroke-width="5"/><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="735" y="173">Burdock: hooked burr</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="735" y="420">Hooks can attach to fur</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="500" y="515">Dispersal can move the whole fruit containing the seed.</tspan></text></svg>