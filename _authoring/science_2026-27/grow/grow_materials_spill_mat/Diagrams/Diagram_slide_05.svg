<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="grow_materials_spill_mat4-title grow_materials_spill_mat4-desc"><title id="grow_materials_spill_mat4-title">Make the comparison answer one question</title><desc id="grow_materials_spill_mat4-desc">Three connected stages of a controlled sample test: dry mass and sample area, soak for 30 seconds, then drip vertically 10 seconds without squeezing and measure wet mass. These settings define this original comparison.</desc><defs><marker id="grow_materials_spill_mat4-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><text font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="45" y="59">Same method for each product sample</tspan></text><rect x="65" y="150" width="230" height="130" fill="#F6EEDC" stroke="#8C7454" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="74" y="199">One layer</tspan><tspan x="74" y="227.8">10 cm × 10 cm</tspan></text><defs><marker id="grow_materials_spill_mat4-arrow-3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><line x1="315" y1="220" x2="375" y2="220" fill="none" stroke="#1F2937" stroke-width="6" marker-end="url(#grow_materials_spill_mat4-arrow-3)"/><rect x="400" y="170" width="210" height="180" fill="#D7EAF4" stroke="#4D82A0" stroke-width="3"/><rect x="440" y="200" width="130" height="115" fill="#B6D6D9" stroke="#3F7D6E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="403" y="391">Fully immerse</tspan><tspan x="403" y="422.2">for 30 seconds</tspan></text><defs><marker id="grow_materials_spill_mat4-arrow-7" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><line x1="635" y1="220" x2="690" y2="220" fill="none" stroke="#1F2937" stroke-width="6" marker-end="url(#grow_materials_spill_mat4-arrow-7)"/><rect x="765" y="135" width="80" height="175" fill="#B6D6D9" stroke="#3F7D6E" stroke-width="3"/><ellipse cx="804" cy="337.5" rx="9" ry="12.5" fill="#A7D6EB" stroke="#4D82A0" stroke-width="3"/><ellipse cx="804" cy="382.5" rx="9" ry="12.5" fill="#A7D6EB" stroke="#4D82A0" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="675" y="435">Drip vertically 10 s.</tspan><tspan x="675" y="465">Do not squeeze.</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="65" y="356">Measure dry mass</tspan><tspan x="65" y="387.2">before soaking.</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="65" y="510">Use fresh dry samples for repeats. Then measure wet mass.</tspan></text></svg>