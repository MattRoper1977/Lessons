<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="grow_materials_spill_mat3-title grow_materials_spill_mat3-desc"><title id="grow_materials_spill_mat3-title">Measure water retained, not total wet mass</title><desc id="grow_materials_spill_mat3-desc">Original worked example with constructed masses: dry sample 2.0 g and wet sample 9.0 g after a fixed dripping time, so retained water is 7.0 g. No real measurements are claimed.</desc><defs><marker id="grow_materials_spill_mat3-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><text font-family="Segoe UI, Arial, sans-serif" font-size="31" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="45" y="56">Constructed worked example: subtract dry mass</tspan></text><rect x="85" y="250" width="340" height="130" fill="#E8ECEF" stroke="#6B7280" stroke-width="3"/><rect x="575" y="250" width="340" height="130" fill="#E8ECEF" stroke="#6B7280" stroke-width="3"/><rect x="140" y="170" width="230" height="60" fill="#F6EEDC" stroke="#8C7454" stroke-width="3"/><rect x="630" y="170" width="230" height="60" fill="#B6D6D9" stroke="#4D82A0" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="130" y="124">Dry sample</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="620" y="124">Wet after dripping</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="36" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="170" y="316">2.0 g</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="36" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="660" y="316">9.0 g</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="155" y="484">Water retained = 9.0 − 2.0 = 7.0 g</tspan></text></svg>