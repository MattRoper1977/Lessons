<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="grow_materials_spill_mat2-title grow_materials_spill_mat2-desc"><title id="grow_materials_spill_mat2-title">Water can enter connected spaces</title><desc id="grow_materials_spill_mat2-desc">A simplified close-up compares a fibrous absorbent sample, with spaces that hold water, and an intact plastic sheet with a drop remaining on its surface. Dots are enlarged water regions, not single molecules.</desc><defs><marker id="grow_materials_spill_mat2-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><text font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="45" y="57">Absorbing water is a useful material property</tspan></text><rect x="70" y="150" width="390" height="215" fill="#F6EEDC" stroke="#8C7454" stroke-width="3"/><rect x="570" y="305" width="340" height="50" fill="#CDE0D6" stroke="#3F7D6E" stroke-width="3"/><line x1="95" y1="195" x2="420" y2="195" fill="none" stroke="#AD926D" stroke-width="11"/><line x1="95" y1="265" x2="420" y2="265" fill="none" stroke="#AD926D" stroke-width="11"/><line x1="180" y1="170" x2="180" y2="340" fill="none" stroke="#AD926D" stroke-width="11"/><line x1="345" y1="170" x2="345" y2="340" fill="none" stroke="#AD926D" stroke-width="11"/><ellipse cx="245" cy="230" rx="35" ry="18" fill="#A7D6EB" stroke="#4D82A0" stroke-width="3"/><ellipse cx="312.5" cy="299" rx="22.5" ry="19" fill="#A7D6EB" stroke="#4D82A0" stroke-width="3"/><ellipse cx="132.5" cy="305.5" rx="27.5" ry="17.5" fill="#A7D6EB" stroke="#4D82A0" stroke-width="3"/><ellipse cx="735" cy="274" rx="40" ry="29" fill="#A7D6EB" stroke="#4D82A0" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="65" y="416">Fibres and connected spaces</tspan><tspan x="65" y="447.2">can take in and retain water.</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="555" y="416">A drop on an intact plastic</tspan><tspan x="555" y="447.2">sheet is not absorbed.</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="70" y="524">Close-up model; water marks and spaces are enlarged.</tspan></text></svg>