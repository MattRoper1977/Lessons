<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="grow_life_cycle_archive3-title grow_life_cycle_archive3-desc"><title id="grow_life_cycle_archive3-title">Monarch: complete metamorphosis</title><desc id="grow_life_cycle_archive3-desc">Clockwise sequence: Egg; Larva
caterpillar; Pupa
chrysalis; Adult butterfly. The pupa is a living development stage.
