<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="grow_life_cycle_archive4-title grow_life_cycle_archive4-desc"><title id="grow_life_cycle_archive4-title">Two named animal sequences</title><desc id="grow_life_cycle_archive4-desc">Two horizontal sequences compare development in European rabbits and robins. Rabbit young develop inside the mother and are born alive; young feed on milk. Robin young hatch from eggs, grow in the nest, then fledge and mature. Reproduction makes new offspring; these rows omit the connecting reproductive arrows.</desc><defs><marker id="grow_life_cycle_archive4-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><text font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="500" y="52">Rabbit and robin: two named life cycles</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="500" y="120">European rabbit</tspan></text><rect x="40" y="150" width="200" height="100" fill="#EFF7F3" stroke="#3F7D6E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="140" y="191">Develops inside</tspan><tspan x="140" y="222.2">mother</tspan></text><defs><marker id="grow_life_cycle_archive4-arrow-4" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><line x1="240" y1="200" x2="280" y2="200" fill="none" stroke="#1F2937" stroke-width="5" marker-end="url(#grow_life_cycle_archive4-arrow-4)"/><rect x="280" y="150" width="200" height="100" fill="#EFF7F3" stroke="#3F7D6E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="380" y="191">Newborn kit</tspan><tspan x="380" y="222.2">feeds on milk</tspan></text><defs><marker id="grow_life_cycle_archive4-arrow-7" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><line x1="480" y1="200" x2="520" y2="200" fill="none" stroke="#1F2937" stroke-width="5" marker-end="url(#grow_life_cycle_archive4-arrow-7)"/><rect x="520" y="150" width="200" height="100" fill="#EFF7F3" stroke="#3F7D6E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="620" y="191">Growing</tspan><tspan x="620" y="222.2">young rabbit</tspan></text><defs><marker id="grow_life_cycle_archive4-arrow-10" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><line x1="720" y1="200" x2="760" y2="200" fill="none" stroke="#1F2937" stroke-width="5" marker-end="url(#grow_life_cycle_archive4-arrow-10)"/><rect x="760" y="150" width="200" height="100" fill="#EFF7F3" stroke="#3F7D6E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="860" y="191">Mature</tspan><tspan x="860" y="222.2">adult</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="500" y="335">Robin</tspan></text><rect x="40" y="365" width="200" height="100" fill="#EFF7F3" stroke="#3F7D6E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="140" y="406">Egg in</tspan><tspan x="140" y="437.2">a nest</tspan></text><defs><marker id="grow_life_cycle_archive4-arrow-16" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><line x1="240" y1="415" x2="280" y2="415" fill="none" stroke="#1F2937" stroke-width="5" marker-end="url(#grow_life_cycle_archive4-arrow-16)"/><rect x="280" y="365" width="200" height="100" fill="#EFF7F3" stroke="#3F7D6E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="380" y="406">Nestling</tspan><tspan x="380" y="437.2">chick</tspan></text><defs><marker id="grow_life_cycle_archive4-arrow-19" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><line x1="480" y1="415" x2="520" y2="415" fill="none" stroke="#1F2937" stroke-width="5" marker-end="url(#grow_life_cycle_archive4-arrow-19)"/><rect x="520" y="365" width="200" height="100" fill="#EFF7F3" stroke="#3F7D6E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="620" y="406">Fledgling</tspan><tspan x="620" y="437.2">young bird</tspan></text><defs><marker id="grow_life_cycle_archive4-arrow-22" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><line x1="720" y1="415" x2="760" y2="415" fill="none" stroke="#1F2937" stroke-width="5" marker-end="url(#grow_life_cycle_archive4-arrow-22)"/><rect x="760" y="365" width="200" height="100" fill="#EFF7F3" stroke="#3F7D6E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="860" y="406">Mature</tspan><tspan x="860" y="437.2">adult</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="500" y="515">Mature adults can reproduce to produce new offspring.</tspan></text></svg>