<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="grow_health_evidence_advisers2-title grow_health_evidence_advisers2-desc"><title id="grow_health_evidence_advisers2-title">Food patterns supply different needs</title><desc id="grow_health_evidence_advisers2-desc">Three parallel food-group examples show overlapping nutrient contributions: starchy foods provide carbohydrate, protein foods supply amino acids, and fruit or vegetables supply fibre and other nutrients. No transformation between groups is implied.</desc><defs><marker id="grow_health_evidence_advisers2-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><text font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="500" y="57">Food patterns supply different needs</tspan></text><rect x="60" y="190" width="273.333" height="130" fill="#EFF7F3" stroke="#3F7D6E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="196.667" y="237">Starchy foods</tspan><tspan x="196.667" y="269.4">provide carbohydrate</tspan></text><rect x="363.333" y="190" width="273.333" height="130" fill="#EFF7F3" stroke="#3F7D6E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="500" y="237">Protein foods</tspan><tspan x="500" y="269.4">supply amino acids</tspan></text><rect x="666.667" y="190" width="273.333" height="130" fill="#EFF7F3" stroke="#3F7D6E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="803.333" y="226">Fruit / vegetables</tspan><tspan x="803.333" y="258.4">provide fibre</tspan><tspan x="803.333" y="290.8">and more</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="500" y="402">Food groups overlap. Variety over time matters;</tspan><tspan x="500" y="434.4">this is not a list of good and bad people or foods.</tspan></text></svg>