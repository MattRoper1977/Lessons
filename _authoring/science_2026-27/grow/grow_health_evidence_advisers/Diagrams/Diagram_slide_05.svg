<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="grow_health_evidence_advisers4-title grow_health_evidence_advisers4-desc"><title id="grow_health_evidence_advisers4-title">Medicines: purpose, directions and effects</title><desc id="grow_health_evidence_advisers4-desc">Three parallel considerations for medicine use: intended benefit, correct directions and possible side effects. These are not a causal sequence.</desc><defs><marker id="grow_health_evidence_advisers4-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><text font-family="Segoe UI, Arial, sans-serif" font-size="31" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="500" y="56">One substance can have more than one effect</tspan></text><rect x="60" y="150" width="270" height="180" fill="#EFF7F3" stroke="#3F7D6E" stroke-width="3"/><rect x="365" y="150" width="270" height="180" fill="#EFF7F3" stroke="#3F7D6E" stroke-width="3"/><rect x="670" y="150" width="270" height="180" fill="#EFF7F3" stroke="#3F7D6E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="195" y="202">Intended benefit</tspan><tspan x="195" y="234.4">May treat or prevent</tspan><tspan x="195" y="266.8">a condition</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="500" y="202">Directions matter</tspan><tspan x="500" y="234.4">Right person, dose</tspan><tspan x="500" y="266.8">and timing</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="805" y="202">Other effects</tspan><tspan x="805" y="234.4">Side effects can</tspan><tspan x="805" y="266.8">also occur</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="500" y="417">Use prescribed medicines as directed.</tspan><tspan x="500" y="449.4">Ask a pharmacist or prescriber about questions.</tspan></text></svg>