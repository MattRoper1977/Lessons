<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="grow_life_cycle_comparison4-title grow_life_cycle_comparison4-desc"><title id="grow_life_cycle_comparison4-title">Eggs do not mean the same animal group</title><desc id="grow_life_cycle_comparison4-desc">Parallel comparisons of platypus and robin: both lay eggs, but platypus young receive milk and robin chicks receive food from parents. No arrow connects the animal groups.</desc><defs><marker id="grow_life_cycle_comparison4-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><text font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="500" y="57">Compare one feature at a time</tspan></text><rect x="70" y="125" width="400" height="300" fill="#EFF7F3" stroke="#3F7D6E" stroke-width="3"/><rect x="530" y="125" width="400" height="300" fill="#EFF7F3" stroke="#3F7D6E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="270" y="175">Platypus: mammal</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="730" y="175">Robin: bird</tspan></text><ellipse cx="260" cy="252.5" rx="40" ry="27.5" fill="#F4EAD6" stroke="#C9803B" stroke-width="3"/><ellipse cx="720" cy="252.5" rx="40" ry="27.5" fill="#F4EAD6" stroke="#C9803B" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="270" y="338">Eggs in a burrow</tspan><tspan x="270" y="371.6">Young receive milk</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="730" y="338">Eggs in a nest</tspan><tspan x="730" y="371.6">Chicks receive food</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="500" y="497">Same egg-laying feature; different animal groups.</tspan></text></svg>