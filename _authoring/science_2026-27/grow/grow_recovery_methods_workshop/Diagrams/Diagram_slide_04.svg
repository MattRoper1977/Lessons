<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="grow_recovery_methods_workshop3-title grow_recovery_methods_workshop3-desc"><title id="grow_recovery_methods_workshop3-title">Evaporation leaves dissolved salt behind</title><desc id="grow_recovery_methods_workshop3-desc">A process model shows salt solution at left and salt remaining in a dish at right after water has evaporated into surrounding air. Water is not collected by this open process.</desc><defs><marker id="grow_recovery_methods_workshop3-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><text font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="500" y="52">Target: recover the salt</tspan></text><rect x="80" y="245" width="300" height="180" fill="#D5EAF4" stroke="#4D82A0" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="230" y="195">Salt solution</tspan></text><defs><marker id="grow_recovery_methods_workshop3-arrow-3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#3F7D6E"/></marker></defs><line x1="410" y1="335" x2="565" y2="335" fill="none" stroke="#3F7D6E" stroke-width="5" marker-end="url(#grow_recovery_methods_workshop3-arrow-3)"/><defs><marker id="grow_recovery_methods_workshop3-arrow-4" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#4D82A0"/></marker></defs><line x1="730" y1="245" x2="730" y2="145" fill="none" stroke="#4D82A0" stroke-width="5" marker-end="url(#grow_recovery_methods_workshop3-arrow-4)"/><defs><marker id="grow_recovery_methods_workshop3-arrow-5" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#4D82A0"/></marker></defs><line x1="810" y1="245" x2="850" y2="160" fill="none" stroke="#4D82A0" stroke-width="5" marker-end="url(#grow_recovery_methods_workshop3-arrow-5)"/><rect x="630" y="380" width="300" height="45" fill="#F4E7CE" stroke="#C9803B" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="770" y="474">Salt remains</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="772.5" y="91">Water vapour</tspan><tspan x="772.5" y="122.2">leaves into the air</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="500" y="531">Open evaporation does not collect the water.</tspan></text></svg>