<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="grow_recovery_methods_workshop2-title grow_recovery_methods_workshop2-desc"><title id="grow_recovery_methods_workshop2-title">Filtration of sand mixed with saltwater</title><desc id="grow_recovery_methods_workshop2-desc">A schematic funnel and filter paper retain sand above the filter. Salt solution passes through and is collected below. Labels distinguish sand residue and filtrate still containing dissolved salt. Purple symbols represent dissolved salt; the larger brown grains represent retained sand.</desc><defs><marker id="grow_recovery_methods_workshop2-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><text font-family="Segoe UI, Arial, sans-serif" font-size="31" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="500" y="49">A filter retains sand, not dissolved salt</tspan></text><line x1="340" y1="120" x2="470" y2="310" fill="none" stroke="#1F2937" stroke-width="5"/><line x1="470" y1="310" x2="600" y2="120" fill="none" stroke="#1F2937" stroke-width="5"/><line x1="340" y1="120" x2="600" y2="120" fill="none" stroke="#1F2937" stroke-width="5"/><line x1="360" y1="130" x2="470" y2="280" fill="none" stroke="#3F7D6E" stroke-width="5"/><line x1="470" y1="280" x2="580" y2="130" fill="none" stroke="#3F7D6E" stroke-width="5"/><line x1="470" y1="310" x2="470" y2="350" fill="none" stroke="#1F2937" stroke-width="5"/><ellipse cx="445" cy="204" rx="15" ry="12" fill="#B89873" stroke="#C9803B" stroke-width="3"/><ellipse cx="477" cy="214" rx="15" ry="12" fill="#B89873" stroke="#C9803B" stroke-width="3"/><ellipse cx="491" cy="186" rx="15" ry="12" fill="#B89873" stroke="#C9803B" stroke-width="3"/><defs><marker id="grow_recovery_methods_workshop2-arrow-10" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#4D82A0"/></marker></defs><line x1="470" y1="355" x2="470" y2="390" fill="none" stroke="#4D82A0" stroke-width="5" marker-end="url(#grow_recovery_methods_workshop2-arrow-10)"/><line x1="335" y1="390" x2="335" y2="490" fill="none" stroke="#1F2937" stroke-width="5"/><line x1="335" y1="490" x2="610" y2="490" fill="none" stroke="#1F2937" stroke-width="5"/><line x1="610" y1="490" x2="610" y2="390" fill="none" stroke="#1F2937" stroke-width="5"/><rect x="340" y="435" width="265" height="50" fill="#D5EAF4" stroke="#4D82A0" stroke-width="3"/><ellipse cx="396" cy="456" rx="6" ry="6" fill="#9974C2" stroke="#725293" stroke-width="3"/><ellipse cx="501" cy="465" rx="6" ry="6" fill="#9974C2" stroke="#725293" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="180" y="193">Sand residue</tspan><tspan x="180" y="226.6">on the filter</tspan></text><line x1="302" y1="205" x2="428" y2="205" fill="none" stroke="#1F2937" stroke-width="5"/><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="800" y="203">Salt and water</tspan><tspan x="800" y="236.6">pass through</tspan></text><line x1="580" y1="230" x2="655" y2="230" fill="none" stroke="#1F2937" stroke-width="5"/><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="792.5" y="425">Filtrate:</tspan><tspan x="792.5" y="458.6">salt solution</tspan></text><line x1="610" y1="449" x2="645" y2="449" fill="none" stroke="#1F2937" stroke-width="5"/><text font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="502.5" y="523">Purple symbols: dissolved salt.</tspan><tspan x="502.5" y="549.4">Schematic only; particles and pores are not to scale.</tspan></text></svg>