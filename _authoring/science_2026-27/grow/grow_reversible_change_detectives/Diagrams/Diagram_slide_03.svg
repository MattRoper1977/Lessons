<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="grow_reversible_change_detectives2-title grow_reversible_change_detectives2-desc"><title id="grow_reversible_change_detectives2-title">Melting and freezing of water</title><desc id="grow_reversible_change_detectives2-desc">Two macroscopic states of the same substance are connected by opposite arrows: warming can melt ice into liquid water; cooling enough can freeze water into ice. This diagram does not represent exact density or crystal structure.</desc><defs><marker id="grow_reversible_change_detectives2-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><text font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="500" y="57">Same substance; different state</tspan></text><rect x="80" y="180" width="320" height="180" fill="#E3EFF5" stroke="#4D82A0" stroke-width="3"/><ellipse cx="765" cy="267.5" rx="125" ry="52.5" fill="#D4E8F4" stroke="#4D82A0" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="31" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="240" y="256">Ice</tspan><tspan x="240" y="293.2">solid water</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="31" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="770" y="366">Liquid water</tspan></text><defs><marker id="grow_reversible_change_detectives2-arrow-5" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#C9803B"/></marker></defs><line x1="420" y1="180" x2="605" y2="180" fill="none" stroke="#C9803B" stroke-width="5" marker-end="url(#grow_reversible_change_detectives2-arrow-5)"/><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="512.5" y="120">Melting</tspan><tspan x="512.5" y="150">energy transferred in</tspan></text><defs><marker id="grow_reversible_change_detectives2-arrow-7" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#4D82A0"/></marker></defs><line x1="605" y1="435" x2="420" y2="435" fill="none" stroke="#4D82A0" stroke-width="5" marker-end="url(#grow_reversible_change_detectives2-arrow-7)"/><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="515" y="490">Freezing</tspan><tspan x="515" y="520">energy transferred out</tspan></text></svg>