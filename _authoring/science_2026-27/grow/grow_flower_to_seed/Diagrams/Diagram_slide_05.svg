<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="grow_flower_to_seed4-title grow_flower_to_seed4-desc"><title id="grow_flower_to_seed4-title">Two structures develop after fertilisation</title><desc id="grow_flower_to_seed4-desc">Two parallel developmental links: fertilised ovule develops into seed; ovary develops into fruit. The pollen grain is not shown becoming a seed.</desc><defs><marker id="grow_flower_to_seed4-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><text font-family="Segoe UI, Arial, sans-serif" font-size="31" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="500" y="56">After fertilisation: identify the structure</tspan></text><rect x="75" y="150" width="320" height="110" fill="#EFF7F3" stroke="#3F7D6E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="235" y="210">Fertilised ovule</tspan></text><rect x="610" y="150" width="315" height="110" fill="#EFF7F3" stroke="#3F7D6E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="31" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="767.5" y="211">Seed</tspan></text><defs><marker id="grow_flower_to_seed4-arrow-5" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><line x1="395" y1="205" x2="610" y2="205" fill="none" stroke="#1F2937" stroke-width="5" marker-end="url(#grow_flower_to_seed4-arrow-5)"/><rect x="75" y="345" width="320" height="110" fill="#EFF7F3" stroke="#3F7D6E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="31" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="235" y="406">Ovary</tspan></text><rect x="610" y="345" width="315" height="110" fill="#EFF7F3" stroke="#3F7D6E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="31" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="767.5" y="406">Fruit</tspan></text><defs><marker id="grow_flower_to_seed4-arrow-10" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><line x1="395" y1="400" x2="610" y2="400" fill="none" stroke="#1F2937" stroke-width="5" marker-end="url(#grow_flower_to_seed4-arrow-10)"/><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="500" y="518">A seed contains a young plant embryo; fruit surrounds seeds.</tspan></text></svg>