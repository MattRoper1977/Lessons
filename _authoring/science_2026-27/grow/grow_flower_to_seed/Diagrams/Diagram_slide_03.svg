<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="grow_flower_to_seed2-title grow_flower_to_seed2-desc"><title id="grow_flower_to_seed2-title">Selected flower structures and pollen transfer</title><desc id="grow_flower_to_seed2-desc">A simplified flower section labels anther, pollen, stigma, style, ovary and ovule. A pollen-transfer arrow goes from anther to stigma; it does not lead directly to a seed.</desc><defs><marker id="grow_flower_to_seed2-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><text font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="500" y="52">Pollination: pollen reaches a stigma</tspan></text><rect x="472" y="210" width="56" height="160" fill="#E6F0EA" stroke="#3F7D6E" stroke-width="3"/><ellipse cx="500" cy="177.5" rx="80" ry="27.5" fill="#D1E6D8" stroke="#3F7D6E" stroke-width="3"/><ellipse cx="500" cy="417.5" rx="115" ry="62.5" fill="#E6F0EA" stroke="#3F7D6E" stroke-width="3"/><ellipse cx="477.5" cy="412.5" rx="27.5" ry="27.5" fill="#FFE6BA" stroke="#C9803B" stroke-width="3"/><line x1="265" y1="350" x2="265" y2="235" fill="none" stroke="#3F7D6E" stroke-width="5"/><ellipse cx="265" cy="216" rx="50" ry="21" fill="#F3D59C" stroke="#C9803B" stroke-width="3"/><ellipse cx="310" cy="185" rx="10" ry="10" fill="#C9803B" stroke="#C9803B" stroke-width="3"/><defs><marker id="grow_flower_to_seed2-arrow-8" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#C9803B"/></marker></defs><line x1="325" y1="183" x2="414" y2="173" fill="none" stroke="#C9803B" stroke-width="5" marker-end="url(#grow_flower_to_seed2-arrow-8)"/><text font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="140" y="301">Anther:</tspan><tspan x="140" y="332.2">makes pollen</tspan></text><line x1="225" y1="285" x2="230" y2="237" fill="none" stroke="#1F2937" stroke-width="5"/><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="800" y="160">Stigma:</tspan><tspan x="800" y="190">receives pollen</tspan></text><line x1="580" y1="176" x2="675" y2="176" fill="none" stroke="#1F2937" stroke-width="5"/><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="780" y="298">Style</tspan></text><line x1="530" y1="295" x2="650" y2="295" fill="none" stroke="#1F2937" stroke-width="5"/><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="790" y="413">Ovary</tspan></text><line x1="610" y1="410" x2="660" y2="410" fill="none" stroke="#1F2937" stroke-width="5"/><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="230" y="433">Ovule</tspan></text><line x1="335" y1="430" x2="449" y2="417" fill="none" stroke="#1F2937" stroke-width="5"/><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="500" y="520">Selected structures only; not to scale. Petals are omitted.</tspan></text></svg>