<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="grow_flower_to_seed3-title grow_flower_to_seed3-desc"><title id="grow_flower_to_seed3-title">After compatible pollen arrives</title><desc id="grow_flower_to_seed3-desc">A pollen grain on the stigma grows a tube through the style towards an ovule. The tube delivers male gametes. A male gamete fuses with an egg cell inside the ovule; the pollen grain itself does not turn into a seed.</desc><defs><marker id="grow_flower_to_seed3-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><text font-family="Segoe UI, Arial, sans-serif" font-size="31" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="500" y="49">Fertilisation happens after pollination</tspan></text><rect x="450" y="170" width="100" height="180" fill="#E6F0EA" stroke="#3F7D6E" stroke-width="3"/><ellipse cx="500" cy="150" rx="95" ry="25" fill="#D1E6D8" stroke="#3F7D6E" stroke-width="3"/><ellipse cx="500" cy="412.5" rx="140" ry="72.5" fill="#E6F0EA" stroke="#3F7D6E" stroke-width="3"/><ellipse cx="479" cy="124" rx="14" ry="14" fill="#F3D59C" stroke="#C9803B" stroke-width="3"/><line x1="480" y1="145" x2="480" y2="320" fill="none" stroke="#C9803B" stroke-width="5"/><defs><marker id="grow_flower_to_seed3-arrow-6" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#C9803B"/></marker></defs><line x1="480" y1="320" x2="510" y2="388" fill="none" stroke="#C9803B" stroke-width="5" marker-end="url(#grow_flower_to_seed3-arrow-6)"/><ellipse cx="526" cy="411" rx="41" ry="36" fill="#FFE6BA" stroke="#C9803B" stroke-width="3"/><ellipse cx="530" cy="409" rx="11" ry="11" fill="#EFAE7B" stroke="#C9803B" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="195" y="182">Pollen grain grows</tspan><tspan x="195" y="214.4">a pollen tube</tspan></text><line x1="345" y1="196" x2="480" y2="196" fill="none" stroke="#1F2937" stroke-width="5"/><text font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="795" y="212">Male gamete</tspan><tspan x="795" y="244.4">travels through</tspan><tspan x="795" y="276.8">the tube</tspan></text><line x1="480" y1="253" x2="650" y2="253" fill="none" stroke="#1F2937" stroke-width="5"/><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="187.5" y="383">Egg cell</tspan><tspan x="187.5" y="416.6">inside an ovule</tspan></text><line x1="335" y1="418" x2="518" y2="410" fill="none" stroke="#1F2937" stroke-width="5"/><text font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="802.5" y="387">Gametes fuse:</tspan><tspan x="802.5" y="419.4">fertilisation</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="500" y="524">One key fusion is shown; advanced double-fertilisation detail omitted.</tspan></text></svg>