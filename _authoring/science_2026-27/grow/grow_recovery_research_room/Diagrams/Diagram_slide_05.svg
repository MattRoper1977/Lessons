<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="grow_recovery_research_room4-title grow_recovery_research_room4-desc"><title id="grow_recovery_research_room4-title">Repeated immediate heart rates</title><desc id="grow_recovery_research_room4-desc">Three zero-baseline bars show constructed immediate rates A 120, B 116, C 124 beats per minute. The mean is 120. Different trials can vary without one automatically being wrong.</desc><defs><marker id="grow_recovery_research_room4-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><text font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="500" y="50">Repeats: similar is not identical</tspan></text><line x1="130" y1="420" x2="920" y2="420" fill="none" stroke="#1F2937" stroke-width="5"/><line x1="130" y1="420" x2="130" y2="100" fill="none" stroke="#1F2937" stroke-width="5"/><text font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="87.5" y="424">0</tspan></text><line x1="120" y1="420" x2="130" y2="420" fill="none" stroke="#1F2937" stroke-width="5"/><text font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="87.5" y="332">40</tspan></text><line x1="120" y1="328" x2="130" y2="328" fill="none" stroke="#1F2937" stroke-width="5"/><text font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="87.5" y="240">80</tspan></text><line x1="120" y1="236" x2="130" y2="236" fill="none" stroke="#1F2937" stroke-width="5"/><text font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="87.5" y="148">120</tspan></text><line x1="120" y1="144" x2="130" y2="144" fill="none" stroke="#1F2937" stroke-width="5"/><rect x="240" y="144" width="120" height="276" fill="#CBE0D5" stroke="#3F7D6E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="300" y="183">120</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="300" y="458">A</tspan></text><rect x="460" y="153.2" width="120" height="266.8" fill="#CBE0D5" stroke="#3F7D6E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="520" y="192.2">116</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="520" y="458">B</tspan></text><rect x="680" y="134.8" width="120" height="285.2" fill="#CBE0D5" stroke="#3F7D6E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="740" y="173.8">124</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="740" y="458">C</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="520" y="100">Immediate heart rate / beats per minute</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="500" y="505">Constructed sample repeats. Same planned method.</tspan><tspan x="500" y="535">Mean = (120 + 116 + 124) ÷ 3 = 120.</tspan></text></svg>