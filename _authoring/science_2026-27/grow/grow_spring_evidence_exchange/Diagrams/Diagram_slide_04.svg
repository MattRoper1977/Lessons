<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="grow_spring_evidence_exchange3-title grow_spring_evidence_exchange3-desc"><title id="grow_spring_evidence_exchange3-title">Training toy-car comparison</title><desc id="grow_spring_evidence_exchange3-desc">Two equal-height ramps lead onto surfaces A and B. The same toy car, release point and measuring rule are used. This training example is separate from the independent checkpoint.</desc><defs><marker id="grow_spring_evidence_exchange3-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><text font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="500" y="57">Training: compare one condition</tspan></text><line x1="90" y1="170" x2="330" y2="360" fill="none" stroke="#1F2937" stroke-width="5"/><line x1="580" y1="170" x2="820" y2="360" fill="none" stroke="#1F2937" stroke-width="5"/><line x1="70" y1="360" x2="470" y2="360" fill="none" stroke="#3F7D6E" stroke-width="5"/><line x1="550" y1="360" x2="950" y2="360" fill="none" stroke="#4D82A0" stroke-width="5"/><rect x="120" y="160" width="75" height="40" fill="#EFF7F3" stroke="#3F7D6E" stroke-width="3"/><rect x="610" y="160" width="75" height="40" fill="#EFF7F3" stroke="#3F7D6E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="272.5" y="433">Surface A</tspan><tspan x="272.5" y="466.6">same car and release</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="752.5" y="433">Surface B</tspan><tspan x="752.5" y="466.6">same car and release</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="500" y="132">Same ramp height; change only the surface.</tspan></text></svg>