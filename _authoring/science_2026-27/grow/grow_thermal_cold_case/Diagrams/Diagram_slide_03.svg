<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="grow_thermal_cold_case2-title grow_thermal_cold_case2-desc"><title id="grow_thermal_cold_case2-title">Same temperature; different feeling</title><desc id="grow_thermal_cold_case2-desc">A warmer hand transfers energy to metal and wood at the same room temperature. A thicker arrow represents faster transfer into metal, not a lower starting temperature.</desc><defs><marker id="grow_thermal_cold_case2-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><text font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="45" y="64">Both samples start at 20 °C</tspan></text><rect x="65" y="150" width="280" height="95" fill="#FBE8D6" stroke="#C9803B" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="90" y="186">Hand</tspan><tspan x="90" y="217.2">about 32 °C</tspan></text><rect x="655" y="125" width="280" height="95" fill="#E2E6EB" stroke="#66788A" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="680" y="178">Metal: 20 °C</tspan></text><rect x="655" y="325" width="280" height="95" fill="#EFE5D7" stroke="#8C7454" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="680" y="378">Wood: 20 °C</tspan></text><defs><marker id="grow_thermal_cold_case2-arrow-7" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#C9803B"/></marker></defs><line x1="355" y1="180" x2="640" y2="180" fill="none" stroke="#C9803B" stroke-width="15" marker-end="url(#grow_thermal_cold_case2-arrow-7)"/><defs><marker id="grow_thermal_cold_case2-arrow-8" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#C9803B"/></marker></defs><line x1="345" y1="245" x2="640" y2="365" fill="none" stroke="#C9803B" stroke-width="4" marker-end="url(#grow_thermal_cold_case2-arrow-8)"/><text font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="365" y="121">Faster transfer</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="365" y="391">Slower transfer</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="65" y="501">Arrow width is a model, not measured data.</tspan></text></svg>