<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="grow_thermal_cold_case3-title grow_thermal_cold_case3-desc"><title id="grow_thermal_cold_case3-title">Energy can melt ice</title><desc id="grow_thermal_cold_case3-desc">At room temperature, energy transfers from the warmer surroundings through the warmer tray towards the ice. Faster melting is evidence of faster energy transfer in this set-up; sizes are not to scale.</desc><defs><marker id="grow_thermal_cold_case3-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><text font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="45" y="59">Ice is cooler than the tray and room</tspan></text><rect x="85" y="345" width="820" height="65" fill="#DEE5ED" stroke="#66788A" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="300" y="383">Room-temperature metal tray</tspan></text><rect x="325" y="155" width="320" height="190" fill="#D9EDF7" stroke="#4D82A0" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="385" y="225">Ice</tspan><tspan x="385" y="261">about 0 °C</tspan></text><defs><marker id="grow_thermal_cold_case3-arrow-5" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#C9803B"/></marker></defs><line x1="240" y1="350" x2="350" y2="295" fill="none" stroke="#C9803B" stroke-width="9" marker-end="url(#grow_thermal_cold_case3-arrow-5)"/><defs><marker id="grow_thermal_cold_case3-arrow-6" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#C9803B"/></marker></defs><line x1="735" y1="350" x2="630" y2="295" fill="none" stroke="#C9803B" stroke-width="9" marker-end="url(#grow_thermal_cold_case3-arrow-6)"/><text font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="70" y="236">Energy</tspan><tspan x="70" y="267.2">towards the ice</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="700" y="236">Ice gains energy</tspan><tspan x="700" y="267.2">and can melt</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="85" y="486">Model: other energy routes and sizes are simplified.</tspan></text></svg>