<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="grow_thermal_cold_case4-title grow_thermal_cold_case4-desc"><title id="grow_thermal_cold_case4-title">An insulator slows transfer in either direction</title><desc id="grow_thermal_cold_case4-desc">Two insulated containers: energy moves out from warm contents to a cooler room; energy moves in from a warmer room to cool contents. Insulation slows both transfers. Arrows show net energy transfer only.</desc><defs><marker id="grow_thermal_cold_case4-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><text font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="40" y="59">Insulation slows energy transfer</tspan></text><rect x="75" y="140" width="360" height="240" fill="#CDE0D6" stroke="#3F7D6E" stroke-width="3"/><rect x="115" y="180" width="280" height="150" fill="#F9E0C8" stroke="#C9803B" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="140" y="245">Warm contents</tspan><tspan x="140" y="281">40 °C</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="70" y="421">Cooler room: 20 °C</tspan></text><defs><marker id="grow_thermal_cold_case4-arrow-5" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#C9803B"/></marker></defs><line x1="260" y1="185" x2="260" y2="90" fill="none" stroke="#C9803B" stroke-width="6" marker-end="url(#grow_thermal_cold_case4-arrow-5)"/><rect x="565" y="140" width="360" height="240" fill="#CDE0D6" stroke="#3F7D6E" stroke-width="3"/><rect x="605" y="180" width="280" height="150" fill="#D9EDF7" stroke="#4D82A0" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="630" y="245">Cool contents</tspan><tspan x="630" y="281">8 °C</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="565" y="421">Warmer room: 20 °C</tspan></text><defs><marker id="grow_thermal_cold_case4-arrow-10" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#C9803B"/></marker></defs><line x1="750" y1="85" x2="750" y2="180" fill="none" stroke="#C9803B" stroke-width="6" marker-end="url(#grow_thermal_cold_case4-arrow-10)"/><text font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="75" y="507">The green jacket adds insulation. It makes no heat.</tspan></text></svg>