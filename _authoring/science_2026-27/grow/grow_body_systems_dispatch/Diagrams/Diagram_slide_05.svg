<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="grow_body_systems_dispatch4-title grow_body_systems_dispatch4-desc"><title id="grow_body_systems_dispatch4-title">Where the systems connect</title><desc id="grow_body_systems_dispatch4-desc">A simplified scientific sequence: Food in
small intestine; Small absorbed
nutrients; Blood carries
to body tissues. The gut wall is crossed by small substances.
