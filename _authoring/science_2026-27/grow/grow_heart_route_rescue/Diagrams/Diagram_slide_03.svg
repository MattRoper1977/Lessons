<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="grow_heart_route_rescue2-title grow_heart_route_rescue2-desc"><title id="grow_heart_route_rescue2-title">One complete route: two heart sides</title><desc id="grow_heart_route_rescue2-desc">Clockwise sequence: Right heart
pumps to lungs; Lungs
oxygen enters blood; Left heart
pumps to body; Body tissues
use oxygen. Clockwise. Colour marks oxygen content,
not the actual colour of blood.</desc><defs><marker id="grow_heart_route_rescue2-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><text font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="500" y="54">One complete route: two heart sides</tspan></text><rect x="80" y="110" width="310" height="110" fill="#EFF7F3" stroke="#4D82A0" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="235" y="154">Right heart</tspan><tspan x="235" y="187.6">pumps to lungs</tspan></text><rect x="610" y="110" width="310" height="110" fill="#EFF7F3" stroke="#B64745" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="765" y="154">Lungs</tspan><tspan x="765" y="187.6">oxygen enters blood</tspan></text><rect x="610" y="340" width="310" height="110" fill="#EFF7F3" stroke="#B64745" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="765" y="384">Left heart</tspan><tspan x="765" y="417.6">pumps to body</tspan></text><rect x="80" y="340" width="310" height="110" fill="#EFF7F3" stroke="#4D82A0" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="235" y="384">Body tissues</tspan><tspan x="235" y="417.6">use oxygen</tspan></text><defs><marker id="grow_heart_route_rescue2-arrow-9" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><line x1="390" y1="165" x2="610" y2="165" fill="none" stroke="#1F2937" stroke-width="5" marker-end="url(#grow_heart_route_rescue2-arrow-9)"/><defs><marker id="grow_heart_route_rescue2-arrow-10" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><line x1="765" y1="220" x2="765" y2="340" fill="none" stroke="#1F2937" stroke-width="5" marker-end="url(#grow_heart_route_rescue2-arrow-10)"/><defs><marker id="grow_heart_route_rescue2-arrow-11" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><line x1="610" y1="395" x2="390" y2="395" fill="none" stroke="#1F2937" stroke-width="5" marker-end="url(#grow_heart_route_rescue2-arrow-11)"/><defs><marker id="grow_heart_route_rescue2-arrow-12" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><line x1="235" y1="340" x2="235" y2="220" fill="none" stroke="#1F2937" stroke-width="5" marker-end="url(#grow_heart_route_rescue2-arrow-12)"/><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="500" y="503">Clockwise. Colour marks oxygen content,</tspan><tspan x="500" y="533">not the actual colour of blood.</tspan></text></svg>