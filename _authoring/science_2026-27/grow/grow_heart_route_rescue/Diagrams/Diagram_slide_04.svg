<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="grow_heart_route_rescue3-title grow_heart_route_rescue3-desc"><title id="grow_heart_route_rescue3-title">Name vessels by their direction</title><desc id="grow_heart_route_rescue3-desc">A simplified scientific sequence: Heart; Artery:
away from heart; Body tissues. The return route uses veins towards the heart.
The heart-to-lungs artery also goes away.</desc><defs><marker id="grow_heart_route_rescue3-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><text font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="500" y="57">Name vessels by their direction</tspan></text><rect x="60" y="190" width="273.333" height="130" fill="#EFF7F3" stroke="#3F7D6E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="196.667" y="237">Heart</tspan></text><defs><marker id="grow_heart_route_rescue3-arrow-3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><line x1="333.333" y1="255" x2="363.333" y2="255" fill="none" stroke="#1F2937" stroke-width="5" marker-end="url(#grow_heart_route_rescue3-arrow-3)"/><rect x="363.333" y="190" width="273.333" height="130" fill="#EFF7F3" stroke="#3F7D6E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="500" y="237">Artery:</tspan><tspan x="500" y="269.4">away from heart</tspan></text><defs><marker id="grow_heart_route_rescue3-arrow-6" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><line x1="636.667" y1="255" x2="666.667" y2="255" fill="none" stroke="#1F2937" stroke-width="5" marker-end="url(#grow_heart_route_rescue3-arrow-6)"/><rect x="666.667" y="190" width="273.333" height="130" fill="#EFF7F3" stroke="#3F7D6E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="803.333" y="237">Body tissues</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="500" y="402">The return route uses veins towards the heart.</tspan><tspan x="500" y="434.4">The heart-to-lungs artery also goes away.</tspan></text></svg>