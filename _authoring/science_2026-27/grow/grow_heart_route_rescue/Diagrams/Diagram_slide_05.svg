<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="grow_heart_route_rescue4-title grow_heart_route_rescue4-desc"><title id="grow_heart_route_rescue4-title">A pumping chamber and a one-way valve</title><desc id="grow_heart_route_rescue4-desc">Schematic cross-section: muscular wall squeezes the chamber, forcing blood through an open outlet valve. A second panel shows a closed valve resisting reverse flow.</desc><defs><marker id="grow_heart_route_rescue4-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><text font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="500" y="57">Muscle pumps; valves guide the flow</tspan></text><rect x="60" y="120" width="400" height="300" fill="#EFF7F3" stroke="#3F7D6E" stroke-width="3"/><rect x="540" y="120" width="400" height="300" fill="#EFF7F3" stroke="#3F7D6E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="260" y="168">Forward pumping</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="740" y="168">Reverse flow resisted</tspan></text><ellipse cx="180" cy="300" rx="75" ry="55" fill="#FBE9E7" stroke="#B64745" stroke-width="3"/><defs><marker id="grow_heart_route_rescue4-arrow-6" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#B64745"/></marker></defs><line x1="75" y1="300" x2="105" y2="300" fill="none" stroke="#B64745" stroke-width="5" marker-end="url(#grow_heart_route_rescue4-arrow-6)"/><defs><marker id="grow_heart_route_rescue4-arrow-7" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#B64745"/></marker></defs><line x1="255" y1="300" x2="405" y2="300" fill="none" stroke="#B64745" stroke-width="5" marker-end="url(#grow_heart_route_rescue4-arrow-7)"/><line x1="310" y1="255" x2="345" y2="280" fill="none" stroke="#3F7D6E" stroke-width="5"/><line x1="310" y1="345" x2="345" y2="320" fill="none" stroke="#3F7D6E" stroke-width="5"/><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="255" y="390">Muscle wall squeezes</tspan></text><defs><marker id="grow_heart_route_rescue4-arrow-11" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#4D82A0"/></marker></defs><line x1="865" y1="300" x2="745" y2="300" fill="none" stroke="#4D82A0" stroke-width="5" marker-end="url(#grow_heart_route_rescue4-arrow-11)"/><line x1="700" y1="245" x2="735" y2="300" fill="none" stroke="#3F7D6E" stroke-width="5"/><line x1="700" y1="355" x2="735" y2="300" fill="none" stroke="#3F7D6E" stroke-width="5"/><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="745" y="390">Closed valve limits backflow</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="500" y="490">Selective model: chamber shape and scale simplified.</tspan></text></svg>