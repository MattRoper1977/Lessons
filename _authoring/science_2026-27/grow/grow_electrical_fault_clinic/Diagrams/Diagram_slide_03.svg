<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="grow_electrical_fault_clinic2-title grow_electrical_fault_clinic2-desc"><title id="grow_electrical_fault_clinic2-title">A complete test loop</title><desc id="grow_electrical_fault_clinic2-desc">A simple series test circuit with one 1.5 V cell, a matching lamp, closed switch and sample bridging the gap. The lamp remains in the loop so the sample never directly joins the cell terminals.</desc><defs><marker id="grow_electrical_fault_clinic2-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><text font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="45" y="57">Every part must make a conducting connection</tspan></text><line x1="140" y1="150" x2="390" y2="150" fill="none" stroke="#1F2937" stroke-width="6"/><line x1="610" y1="150" x2="860" y2="150" fill="none" stroke="#1F2937" stroke-width="6"/><line x1="860" y1="150" x2="860" y2="250" fill="none" stroke="#1F2937" stroke-width="6"/><line x1="860" y1="330" x2="860" y2="430" fill="none" stroke="#1F2937" stroke-width="6"/><line x1="860" y1="430" x2="510" y2="430" fill="none" stroke="#1F2937" stroke-width="6"/><line x1="510" y1="430" x2="430" y2="430" fill="none" stroke="#1F2937" stroke-width="6"/><ellipse cx="430" cy="430" rx="8" ry="8" fill="#FFFFFF" stroke="#1F2937" stroke-width="3"/><ellipse cx="510" cy="430" rx="8" ry="8" fill="#FFFFFF" stroke="#1F2937" stroke-width="3"/><line x1="430" y1="430" x2="140" y2="430" fill="none" stroke="#1F2937" stroke-width="6"/><line x1="140" y1="430" x2="140" y2="285" fill="none" stroke="#1F2937" stroke-width="6"/><line x1="140" y1="255" x2="140" y2="150" fill="none" stroke="#1F2937" stroke-width="6"/><line x1="100" y1="255" x2="180" y2="255" fill="none" stroke="#1F2937" stroke-width="8"/><line x1="120" y1="285" x2="160" y2="285" fill="none" stroke="#1F2937" stroke-width="8"/><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="185" y="300">1.5 V cell</tspan><tspan x="185" y="330">in holder</tspan></text><rect x="390" y="125" width="220" height="50" fill="#CDE0D6" stroke="#3F7D6E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="375" y="217">Test sample</tspan></text><ellipse cx="860" cy="290" rx="40" ry="40" fill="#FFF0B3" stroke="#C9803B" stroke-width="3"/><line x1="832" y1="262" x2="888" y2="318" fill="none" stroke="#1F2937" stroke-width="3"/><line x1="888" y1="262" x2="832" y2="318" fill="none" stroke="#1F2937" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="640" y="305">Matching</tspan><tspan x="640" y="335">lamp</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="355" y="488">Switch closed for test</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="250" y="105">Crocodile clips touch the sample</tspan></text></svg>