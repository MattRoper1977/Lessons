<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="grow_electrical_fault_clinic4-title grow_electrical_fault_clinic4-desc"><title id="grow_electrical_fault_clinic4-title">A no-glow result needs a check</title><desc id="grow_electrical_fault_clinic4-desc">Two views of a coated metal sample. Clips touching the coating have no reliable connection to the metal core; clips touching prepared exposed ends can make contact. Only the teacher uses a ready-prepared safe sample.</desc><defs><marker id="grow_electrical_fault_clinic4-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><text font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="45" y="57">Are the clips touching the material we mean?</tspan></text><rect x="75" y="180" width="340" height="115" fill="#CDE0D6" stroke="#3F7D6E" stroke-width="3"/><rect x="110" y="220" width="270" height="35" fill="#B6BCC6" stroke="#66788A" stroke-width="3"/><line x1="155" y1="105" x2="155" y2="180" fill="none" stroke="#1F2937" stroke-width="6"/><line x1="335" y1="105" x2="335" y2="180" fill="none" stroke="#1F2937" stroke-width="6"/><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="55" y="360">Clips touch coating.</tspan><tspan x="55" y="390">Metal core is not connected.</tspan><tspan x="55" y="420">Result: uncertain for the metal.</tspan></text><rect x="575" y="180" width="340" height="115" fill="#CDE0D6" stroke="#3F7D6E" stroke-width="3"/><rect x="545" y="220" width="400" height="35" fill="#B6BCC6" stroke="#66788A" stroke-width="3"/><line x1="555" y1="105" x2="555" y2="220" fill="none" stroke="#1F2937" stroke-width="6"/><line x1="935" y1="105" x2="935" y2="220" fill="none" stroke="#1F2937" stroke-width="6"/><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="555" y="360">Clips touch exposed metal.</tspan><tspan x="555" y="390">Check with a known conductor.</tspan><tspan x="555" y="420">Then interpret the lamp.</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="60" y="506">Use prepared samples only. No scraping or cutting.</tspan></text></svg>