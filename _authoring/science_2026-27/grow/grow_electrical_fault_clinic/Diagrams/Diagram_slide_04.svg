<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="grow_electrical_fault_clinic3-title grow_electrical_fault_clinic3-desc"><title id="grow_electrical_fault_clinic3-title">Different jobs in one cable</title><desc id="grow_electrical_fault_clinic3-desc">Simplified cutaway of a low-voltage lead: copper inner conductor provides a current path; plastic outer insulation reduces unwanted contact. This is a diagram, not an instruction to strip a cable.</desc><defs><marker id="grow_electrical_fault_clinic3-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><text font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="45" y="59">Choose a material for its job</tspan></text><rect x="110" y="150" width="730" height="240" fill="#CDE0D6" stroke="#3F7D6E" stroke-width="3"/><rect x="110" y="230" width="730" height="80" fill="#CB854A" stroke="#83552F" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="150" y="188">Plastic outer layer: electrical insulation</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="175" y="278">Copper inner path: electrical conductor</tspan></text><defs><marker id="grow_electrical_fault_clinic3-arrow-5" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#C9803B"/></marker></defs><line x1="850" y1="270" x2="935" y2="270" fill="none" stroke="#C9803B" stroke-width="6" marker-end="url(#grow_electrical_fault_clinic3-arrow-5)"/><text font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="75" y="457">Cutaway model: sizes are enlarged.</tspan><tspan x="75" y="489.4">Do not cut or open real electrical cables.</tspan></text></svg>