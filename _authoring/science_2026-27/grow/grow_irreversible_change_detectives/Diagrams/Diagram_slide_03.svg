<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="grow_irreversible_change_detectives2-title grow_irreversible_change_detectives2-desc"><title id="grow_irreversible_change_detectives2-title">Two questions about a change</title><desc id="grow_irreversible_change_detectives2-desc">Two separate questions distinguish reversibility from substance identity. Melting ice can be reversed by cooling and makes no new substance; tearing paper is difficult to reverse but also makes no new substance.</desc><defs><marker id="grow_irreversible_change_detectives2-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><text font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="500" y="55">Can we undo it? Did it make a new substance?</tspan></text><rect x="50" y="120" width="410" height="290" fill="#EFF7F3" stroke="#3F7D6E" stroke-width="3"/><rect x="540" y="120" width="410" height="290" fill="#EFF7F3" stroke="#3F7D6E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="255" y="167">ICE → LIQUID WATER</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="745" y="167">PAPER → TORN PAPER</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="255" y="237">Cooling can reverse it.</tspan><tspan x="255" y="269.4">The substance is still water.</tspan><tspan x="255" y="301.8">Physical change.</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="745" y="237">Hard to restore the sheet.</tspan><tspan x="745" y="269.4">The paper is still paper.</tspan><tspan x="745" y="301.8">Physical change.</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="500" y="477">Being hard to undo is not enough evidence</tspan><tspan x="500" y="509.4">that a new substance formed.</tspan></text></svg>