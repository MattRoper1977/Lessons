<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="grow_irreversible_change_detectives4-title grow_irreversible_change_detectives4-desc"><title id="grow_irreversible_change_detectives4-title">One candle, two different changes</title><desc id="grow_irreversible_change_detectives4-desc">A top row shows reversible wax melting and solidifying. A separate bottom row shows wax vapour plus oxygen forming carbon dioxide and water; these chemical products are not turned back into wax by cooling.</desc><defs><marker id="grow_irreversible_change_detectives4-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><text font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="500" y="52">Melting is different from burning</tspan></text><rect x="60" y="100" width="310" height="100" fill="#EFF7F3" stroke="#3F7D6E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="215" y="148">SOLID WAX</tspan></text><rect x="630" y="100" width="310" height="100" fill="#EFF7F3" stroke="#3F7D6E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="785" y="148">LIQUID WAX</tspan></text><defs><marker id="grow_irreversible_change_detectives4-arrow-5" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#C9803B"/></marker></defs><line x1="380" y1="130" x2="620" y2="130" fill="none" stroke="#C9803B" stroke-width="5" marker-end="url(#grow_irreversible_change_detectives4-arrow-5)"/><text font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="500" y="110">warming</tspan></text><defs><marker id="grow_irreversible_change_detectives4-arrow-7" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#4D82A0"/></marker></defs><line x1="620" y1="177" x2="380" y2="177" fill="none" stroke="#4D82A0" stroke-width="5" marker-end="url(#grow_irreversible_change_detectives4-arrow-7)"/><text font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="500" y="222">cooling</tspan></text><rect x="55" y="290" width="360" height="135" fill="#EFF7F3" stroke="#3F7D6E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="235" y="339">WAX VAPOUR</tspan><tspan x="235" y="373.8">+ OXYGEN</tspan></text><defs><marker id="grow_irreversible_change_detectives4-arrow-11" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#C9803B"/></marker></defs><line x1="425" y1="355" x2="555" y2="355" fill="none" stroke="#C9803B" stroke-width="5" marker-end="url(#grow_irreversible_change_detectives4-arrow-11)"/><rect x="565" y="290" width="380" height="135" fill="#F7E9DD" stroke="#C9803B" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="755" y="339">CARBON DIOXIDE</tspan><tspan x="755" y="373.8">+ WATER</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="500" y="485">Burning forms new substances. This word model</tspan><tspan x="500" y="515">omits incomplete-combustion products.</tspan></text></svg>