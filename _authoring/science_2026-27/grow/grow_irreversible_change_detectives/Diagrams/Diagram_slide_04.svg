<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="grow_irreversible_change_detectives3-title grow_irreversible_change_detectives3-desc"><title id="grow_irreversible_change_detectives3-title">Iron reacts to form rust</title><desc id="grow_irreversible_change_detectives3-desc">A word model shows iron and oxygen with water forming rust; this is not a balanced equation and the shapes are labels, not particles.</desc><defs><marker id="grow_irreversible_change_detectives3-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><text font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="500" y="57">Rusting makes new substances</tspan></text><rect x="45" y="190" width="260" height="135" fill="#EFF7F3" stroke="#3F7D6E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="175" y="249">IRON</tspan><tspan x="175" y="283.8">starting material</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="36" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="347.5" y="261">+</tspan></text><rect x="385" y="190" width="260" height="135" fill="#EFF7F3" stroke="#3F7D6E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="515" y="244">OXYGEN</tspan><tspan x="515" y="278.8">and WATER</tspan></text><defs><marker id="grow_irreversible_change_detectives3-arrow-6" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><line x1="655" y1="258" x2="720" y2="258" fill="none" stroke="#1F2937" stroke-width="5" marker-end="url(#grow_irreversible_change_detectives3-arrow-6)"/><rect x="735" y="190" width="225" height="135" fill="#F7E9DD" stroke="#C9803B" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="847.5" y="248">RUST</tspan><tspan x="847.5" y="281.6">new material</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="500" y="405">Cooling or wiping rust does not make it iron again.</tspan><tspan x="500" y="435">Word model: not a balanced chemical equation.</tspan><tspan x="500" y="465">Rusting is gradual; animation time is not real time.</tspan></text></svg>