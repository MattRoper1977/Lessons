<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="build_light_source_detectives3-title build_light_source_detectives3-desc"><title id="build_light_source_detectives3-title">A mirror changes the light direction</title><desc id="build_light_source_detectives3-desc">A ray travels down and right onto a horizontal mirror, then up and right towards a screen; incident and reflected angles are equal in this schematic.</desc><defs><marker id="build_light_source_detectives3-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><rect x="70" y="70" width="170" height="80" fill="#EDF3F7" stroke="#4E7A9B" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="70" y="58">LED light</tspan></text><defs><marker id="build_light_source_detectives3-arrow-2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#E5AB37"/></marker></defs><line x1="240" y1="150" x2="500" y2="380" fill="none" stroke="#E5AB37" stroke-width="5" marker-end="url(#build_light_source_detectives3-arrow-2)"/><defs><marker id="build_light_source_detectives3-arrow-3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#E5AB37"/></marker></defs><line x1="500" y1="380" x2="760" y2="150" fill="none" stroke="#E5AB37" stroke-width="5" marker-end="url(#build_light_source_detectives3-arrow-3)"/><rect x="320" y="385" width="370" height="25" fill="#DDEAF1" stroke="#4E7A9B" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="360" y="465">Flat mirror</tspan></text><rect x="760" y="70" width="30" height="150" fill="white" stroke="#4E7A9B" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="795" y="123">Screen</tspan><tspan x="795" y="156.6">receives light</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="50" y="532">The mirror reflects light; it does not make the light.</tspan></text></svg>