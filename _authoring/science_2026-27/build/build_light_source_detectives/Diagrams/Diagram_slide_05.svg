<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="build_light_source_detectives4-title build_light_source_detectives4-desc"><title id="build_light_source_detectives4-title">Ordinary paper reflects light too</title><desc id="build_light_source_detectives4-desc">A source ray reaches a rough paper surface; reflected rays leave in several directions. This is a schematic of diffuse reflection, not a ray traced from one perfectly flat point.</desc><defs><marker id="build_light_source_detectives4-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><rect x="70" y="70" width="150" height="70" fill="#EDF3F7" stroke="#4E7A9B" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="50" y="53">LED light</tspan></text><defs><marker id="build_light_source_detectives4-arrow-2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#E5AB37"/></marker></defs><line x1="220" y1="140" x2="480" y2="320" fill="none" stroke="#E5AB37" stroke-width="5" marker-end="url(#build_light_source_detectives4-arrow-2)"/><rect x="300" y="330" width="400" height="50" fill="white" stroke="#4E7A9B" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="345" y="425">White paper</tspan></text><defs><marker id="build_light_source_detectives4-arrow-5" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#E5AB37"/></marker></defs><line x1="480" y1="320" x2="250" y2="205" fill="none" stroke="#E5AB37" stroke-width="5" marker-end="url(#build_light_source_detectives4-arrow-5)"/><defs><marker id="build_light_source_detectives4-arrow-6" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#E5AB37"/></marker></defs><line x1="490" y1="320" x2="530" y2="105" fill="none" stroke="#E5AB37" stroke-width="5" marker-end="url(#build_light_source_detectives4-arrow-6)"/><defs><marker id="build_light_source_detectives4-arrow-7" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#E5AB37"/></marker></defs><line x1="505" y1="320" x2="790" y2="170" fill="none" stroke="#E5AB37" stroke-width="5" marker-end="url(#build_light_source_detectives4-arrow-7)"/><text font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="730" y="336">Reflected light</tspan><tspan x="730" y="367.2">in many</tspan><tspan x="730" y="398.4">directions</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="50" y="508">A clear mirror image is not needed for reflection.</tspan></text></svg>