<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="build_light_source_detectives2-title build_light_source_detectives2-desc"><title id="build_light_source_detectives2-title">Make light or reflect it?</title><desc id="build_light_source_detectives2-desc">A lit lamp gives out its own visible light. A non-luminous card reflects some light arriving from that lamp. Both can be seen when light reaches an eye.</desc><defs><marker id="build_light_source_detectives2-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><rect x="70" y="200" width="180" height="100" fill="#EDF3F7" stroke="#4E7A9B" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="55" y="162">Lit lamp</tspan></text><defs><marker id="build_light_source_detectives2-arrow-2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#E5AB37"/></marker></defs><line x1="250" y1="250" x2="580" y2="250" fill="none" stroke="#E5AB37" stroke-width="5" marker-end="url(#build_light_source_detectives2-arrow-2)"/><rect x="580" y="180" width="130" height="140" fill="white" stroke="#4E7A9B" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="545" y="390">White card</tspan></text><defs><marker id="build_light_source_detectives2-arrow-5" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#E5AB37"/></marker></defs><line x1="580" y1="250" x2="380" y2="95" fill="none" stroke="#E5AB37" stroke-width="5" marker-end="url(#build_light_source_detectives2-arrow-5)"/><defs><marker id="build_light_source_detectives2-arrow-6" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#E5AB37"/></marker></defs><line x1="580" y1="250" x2="380" y2="385" fill="none" stroke="#E5AB37" stroke-width="5" marker-end="url(#build_light_source_detectives2-arrow-6)"/><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="50" y="448">Source: gives out</tspan><tspan x="50" y="481.6">its own light.</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="485" y="468">Reflector: returns some</tspan><tspan x="485" y="501.6">light that reaches it.</tspan></text></svg>