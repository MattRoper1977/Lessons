<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="build_growth_needs_clinic2-title build_growth_needs_clinic2-desc"><title id="build_growth_needs_clinic2-title">Requirements work together</title><desc id="build_growth_needs_clinic2-desc">A growing green plant receives light energy, water and mineral nutrients, and exchanges gases with air. Appropriate temperature and space also matter. Amounts vary by species and conditions.</desc><defs><marker id="build_growth_needs_clinic2-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><rect x="310" y="390" width="280" height="125" fill="#F3E8D7" stroke="#C9803B" stroke-width="3"/><line x1="440" y1="390" x2="440" y2="115" fill="none" stroke="#3F7D6E" stroke-width="12"/><ellipse cx="375" cy="232.5" rx="65" ry="32.5" fill="#DDEDE2" stroke="#3F7D6E" stroke-width="3"/><ellipse cx="511.5" cy="287.5" rx="67.5" ry="32.5" fill="#DDEDE2" stroke="#3F7D6E" stroke-width="3"/><line x1="440" y1="390" x2="360" y2="455" fill="none" stroke="#C9803B" stroke-width="6"/><line x1="440" y1="390" x2="530" y2="455" fill="none" stroke="#C9803B" stroke-width="6"/><line x1="440" y1="390" x2="400" y2="490" fill="none" stroke="#C9803B" stroke-width="6"/><line x1="440" y1="390" x2="475" y2="495" fill="none" stroke="#C9803B" stroke-width="6"/><text font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="40" y="70">Light energy</tspan></text><defs><marker id="build_growth_needs_clinic2-arrow-9" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#C9803B"/></marker></defs><line x1="235" y1="100" x2="360" y2="215" fill="none" stroke="#C9803B" stroke-width="4" marker-end="url(#build_growth_needs_clinic2-arrow-9)"/><text font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="675" y="104">Air around</tspan><tspan x="675" y="138.8">the plant</tspan></text><defs><marker id="build_growth_needs_clinic2-arrow-11" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#4E7A9B"/></marker></defs><line x1="695" y1="175" x2="560" y2="230" fill="none" stroke="#4E7A9B" stroke-width="4" marker-end="url(#build_growth_needs_clinic2-arrow-11)"/><text font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="40" y="387">Water + dissolved</tspan><tspan x="40" y="419.4">mineral nutrients</tspan></text><defs><marker id="build_growth_needs_clinic2-arrow-13" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#347EBC"/></marker></defs><line x1="260" y1="445" x2="380" y2="450" fill="none" stroke="#347EBC" stroke-width="4" marker-end="url(#build_growth_needs_clinic2-arrow-13)"/><text font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="665" y="339">Suitable warmth</tspan><tspan x="665" y="373.8">and enough space</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="35" y="545">More is not always better. Requirements vary.</tspan></text></svg>