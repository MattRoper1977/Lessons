<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="build_growth_needs_clinic3-title build_growth_needs_clinic3-desc"><title id="build_growth_needs_clinic3-title">Taller does not automatically mean healthier</title><desc id="build_growth_needs_clinic3-desc">Constructed day-7 examples: light-grown group A has an 8 cm green seedling; dark-grown group B has a 13 cm pale elongated seedling. Heights alone cannot indicate healthy sustained growth.</desc><defs><marker id="build_growth_needs_clinic3-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><text font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="50" y="59">Constructed examples: day 7</tspan></text><line x1="85" y1="445" x2="930" y2="445" fill="none" stroke="#C9803B" stroke-width="3"/><line x1="265" y1="440" x2="265" y2="250" fill="none" stroke="#3F7D6E" stroke-width="12"/><ellipse cx="225" cy="294" rx="40" ry="24" fill="#DDEDE2" stroke="#3F7D6E" stroke-width="3"/><ellipse cx="315" cy="359" rx="45" ry="24" fill="#DDEDE2" stroke="#3F7D6E" stroke-width="3"/><line x1="700" y1="440" x2="700" y2="120" fill="none" stroke="#A9A373" stroke-width="9"/><ellipse cx="677.5" cy="183.5" rx="22.5" ry="13.5" fill="#EEE8B7" stroke="#A9A373" stroke-width="3"/><ellipse cx="730" cy="264" rx="25" ry="14" fill="#EEE8B7" stroke="#A9A373" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="70" y="109">A: light available</tspan><tspan x="70" y="143.8">8 cm; green leaves</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="545" y="99">B: no light</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="775" y="212">13 cm; pale</tspan><tspan x="775" y="244.4">small leaves</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="60" y="507">Record height AND leaf condition before judging growth.</tspan></text></svg>