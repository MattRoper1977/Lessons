<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="build_growth_needs_clinic4-title build_growth_needs_clinic4-desc"><title id="build_growth_needs_clinic4-title">Starting from a seed is a different stage</title><desc id="build_growth_needs_clinic4-desc">A germinating seed can use stored food reserves. An established green plant needs light for sustained photosynthesis. Species differ in whether seeds need light to germinate.</desc><defs><marker id="build_growth_needs_clinic4-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><rect x="45" y="70" width="420" height="370" fill="#FFF2DC" stroke="#C9803B" stroke-width="3"/><ellipse cx="245" cy="210" rx="80" ry="55" fill="#DDBB87" stroke="#C9803B" stroke-width="3"/><line x1="235" y1="265" x2="210" y2="295" fill="none" stroke="#C9803B" stroke-width="8"/><text font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="75" y="119">Germinating seed</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="75" y="337">Uses stored reserves.</tspan><tspan x="75" y="369.4">Needs water, oxygen and</tspan><tspan x="75" y="401.8">suitable temperature.</tspan></text><rect x="535" y="70" width="420" height="370" fill="#E4F0E9" stroke="#3F7D6E" stroke-width="3"/><line x1="725" y1="315" x2="725" y2="195" fill="none" stroke="#3F7D6E" stroke-width="10"/><ellipse cx="685" cy="240" rx="40" ry="25" fill="#DDEDE2" stroke="#3F7D6E" stroke-width="3"/><ellipse cx="770" cy="290" rx="40" ry="25" fill="#DDEDE2" stroke="#3F7D6E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="560" y="117">Established green plant</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="560" y="367">Needs light for sustained</tspan><tspan x="560" y="399.4">sugar-making.</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="45" y="506">Some seeds also need light to germinate; check the species.</tspan></text></svg>