<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="build_shadow_fair_test3-title build_shadow_fair_test3-desc"><title id="build_shadow_fair_test3-title">One change at a time</title><desc id="build_shadow_fair_test3-desc">Two tests use cards with different heights. Both cards are placed 30 cm from the source, with a fixed screen 60 cm from the source.</desc><defs><marker id="build_shadow_fair_test3-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><text font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="40" y="55">REPAIRED PLAN</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="35" y="142">Test A</tspan></text><ellipse cx="100" cy="190" rx="10" ry="10" fill="#FFF3D6" stroke="#1F2937" stroke-width="3"/><defs><marker id="build_shadow_fair_test3-arrow-3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#E5AB37"/></marker></defs><line x1="110" y1="190" x2="390" y2="190" fill="none" stroke="#E5AB37" stroke-width="5" marker-end="url(#build_shadow_fair_test3-arrow-3)"/><rect x="393" y="170" width="14" height="40" fill="#1F2937" stroke="#1F2937" stroke-width="3"/><rect x="700" y="105" width="20" height="170" fill="white" stroke="#4E7A9B" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="165" y="249">Source to card: 30 cm</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="760" y="185">Card: 2 cm</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="35" y="332">Test B</tspan></text><ellipse cx="100" cy="380" rx="10" ry="10" fill="#FFF3D6" stroke="#1F2937" stroke-width="3"/><defs><marker id="build_shadow_fair_test3-arrow-10" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#E5AB37"/></marker></defs><line x1="110" y1="380" x2="390" y2="380" fill="none" stroke="#E5AB37" stroke-width="5" marker-end="url(#build_shadow_fair_test3-arrow-10)"/><rect x="393" y="340" width="14" height="80" fill="#1F2937" stroke="#1F2937" stroke-width="3"/><rect x="700" y="295" width="20" height="170" fill="white" stroke="#4E7A9B" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="165" y="459">Source to card: 30 cm</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="760" y="375">Card: 4 cm</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="40" y="516">Same screen position: 60 cm from the source.</tspan></text></svg>