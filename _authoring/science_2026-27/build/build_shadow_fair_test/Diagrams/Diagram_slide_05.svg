<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="build_shadow_fair_test4-title build_shadow_fair_test4-desc"><title id="build_shadow_fair_test4-title">Measure one height in centimetres</title><desc id="build_shadow_fair_test4-desc">Front-view screen with a rectangular shadow beside a ruler. The shadow runs from zero to eight centimetres; use the same top-to-bottom measure each time.</desc><defs><marker id="build_shadow_fair_test4-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><rect x="70" y="65" width="800" height="385" fill="white" stroke="#4E7A9B" stroke-width="3"/><rect x="345" y="130" width="190" height="240" fill="#626D7A" stroke="#4E7A9B" stroke-width="3"/><line x1="630" y1="370" x2="630" y2="130" fill="none" stroke="#4E7A9B" stroke-width="4"/><line x1="610" y1="370" x2="650" y2="370" fill="none" stroke="#4E7A9B" stroke-width="4"/><line x1="610" y1="130" x2="650" y2="130" fill="none" stroke="#4E7A9B" stroke-width="4"/><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="670" y="373">0 cm</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="670" y="133">8 cm</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="90" y="498">Measure from the bottom edge to the top edge.</tspan></text></svg>