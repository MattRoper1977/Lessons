<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="build_evidence_museum2-title build_evidence_museum2-desc"><title id="build_evidence_museum2-title">From living thing to preserved evidence</title><desc id="build_evidence_museum2-desc">A simplified three-stage sequence: shell-bearing animal dies, sediment buries its shell, and much later a shell fossil is preserved in rock. This is one possible route, not every fossil.</desc><defs><marker id="build_evidence_museum2-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><rect x="40" y="150" width="260" height="250" fill="#E2EEF6" stroke="#4E7A9B" stroke-width="3"/><ellipse cx="165" cy="290" rx="45" ry="35" fill="#F5DDBE" stroke="#C9803B" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="55" y="93">1  A shell remains</tspan></text><defs><marker id="build_evidence_museum2-arrow-3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#4E7A9B"/></marker></defs><line x1="315" y1="280" x2="350" y2="280" fill="none" stroke="#4E7A9B" stroke-width="4" marker-end="url(#build_evidence_museum2-arrow-3)"/><rect x="370" y="150" width="260" height="250" fill="#DECAB0" stroke="#C9803B" stroke-width="3"/><line x1="380" y1="205" x2="620" y2="205" fill="none" stroke="#C9803B" stroke-width="4"/><line x1="380" y1="245" x2="620" y2="245" fill="none" stroke="#C9803B" stroke-width="4"/><ellipse cx="500" cy="310" rx="40" ry="30" fill="#F5DDBE" stroke="#C9803B" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="375" y="92">2  Sediment</tspan><tspan x="375" y="124.4">buries it</tspan></text><defs><marker id="build_evidence_museum2-arrow-9" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#4E7A9B"/></marker></defs><line x1="645" y1="280" x2="680" y2="280" fill="none" stroke="#4E7A9B" stroke-width="4" marker-end="url(#build_evidence_museum2-arrow-9)"/><rect x="700" y="150" width="260" height="250" fill="#B7B1A9" stroke="#1F2937" stroke-width="3"/><ellipse cx="832.5" cy="302.5" rx="42.5" ry="32.5" fill="#DBD5CB" stroke="#1F2937" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="700" y="92">3  Preserved</tspan><tspan x="700" y="124.4">in rock</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="50" y="482">Much time passes. Most remains do not become fossils.</tspan></text></svg>