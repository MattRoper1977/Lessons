<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="build_evidence_museum3-title build_evidence_museum3-desc"><title id="build_evidence_museum3-title">Soil is a mixture</title><desc id="build_evidence_museum3-desc">Enlarged schematic components of soil: mineral particles, organic matter and pore spaces containing air or water. Positions and sizes are illustrative, not measured proportions.</desc><defs><marker id="build_evidence_museum3-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><rect x="45" y="95" width="490" height="360" fill="#F4ECDF" stroke="#C9803B" stroke-width="3"/><ellipse cx="135" cy="180" rx="60" ry="40" fill="#B5ABA0" stroke="#1F2937" stroke-width="3"/><ellipse cx="340" cy="327.5" rx="60" ry="47.5" fill="#B5ABA0" stroke="#1F2937" stroke-width="3"/><ellipse cx="210" cy="375" rx="40" ry="35" fill="#B5ABA0" stroke="#1F2937" stroke-width="3"/><ellipse cx="400" cy="167.5" rx="50" ry="42.5" fill="#A97B4F" stroke="#C9803B" stroke-width="3"/><ellipse cx="130" cy="310" rx="35" ry="30" fill="#B9DAEF" stroke="#347EBC" stroke-width="3"/><ellipse cx="272.5" cy="187.5" rx="32.5" ry="37.5" fill="white" stroke="#4E7A9B" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="650" y="134">Mineral particles</tspan><tspan x="650" y="168.8">from rocks</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="650" y="277">Organic matter:</tspan><tspan x="650" y="309.4">remains of living things</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="650" y="418">Spaces can hold</tspan><tspan x="650" y="451.6">air and water.</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="50" y="510">Not to scale. Living organisms can also occur in soil.</tspan></text></svg>