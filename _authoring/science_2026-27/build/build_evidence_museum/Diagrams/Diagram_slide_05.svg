<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="build_evidence_museum4-title build_evidence_museum4-desc"><title id="build_evidence_museum4-title">The exhibit needs a light path</title><desc id="build_evidence_museum4-desc">The lamp emits light onto the top surface of an opaque fossil exhibit; reflected light leaves that same lit surface and enters the eye. The eye is above the object surface.</desc><defs><marker id="build_evidence_museum4-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><rect x="70" y="130" width="150" height="85" fill="#EDF3F7" stroke="#4E7A9B" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="70" y="104">Lit lamp</tspan></text><rect x="420" y="280" width="160" height="110" fill="#B7B1A9" stroke="#1F2937" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="390" y="449">Fossil exhibit</tspan></text><ellipse cx="865" cy="175" rx="65" ry="40" fill="white" stroke="#1F2937" stroke-width="3"/><ellipse cx="832.5" cy="175" rx="17.5" ry="20" fill="#1F2937" stroke="#1F2937" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="810" y="104">Eye</tspan></text><defs><marker id="build_evidence_museum4-arrow-7" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#C9803B"/></marker></defs><line x1="220" y1="190" x2="500" y2="280" fill="none" stroke="#C9803B" stroke-width="4" marker-end="url(#build_evidence_museum4-arrow-7)"/><defs><marker id="build_evidence_museum4-arrow-8" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#C9803B"/></marker></defs><line x1="500" y1="280" x2="815" y2="190" fill="none" stroke="#C9803B" stroke-width="4" marker-end="url(#build_evidence_museum4-arrow-8)"/><text font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="210" y="356">Light arrives</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="610" y="327">Some reflected light</tspan><tspan x="610" y="359.4">enters the eye.</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="70" y="522">A plain fossil is a reflector, not a light source.</tspan></text></svg>