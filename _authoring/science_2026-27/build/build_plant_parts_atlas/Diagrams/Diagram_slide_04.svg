<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="build_plant_parts_atlas3-title build_plant_parts_atlas3-desc"><title id="build_plant_parts_atlas3-title">Identify by structure and position</title><desc id="build_plant_parts_atlas3-desc">Two simplified flowering plants have different leaf shapes and flower appearances, while both possess roots, stems, leaves and flowers. Colours alone do not define the part.</desc><defs><marker id="build_plant_parts_atlas3-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><text font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="60" y="59">Different shapes can have the same part name.</tspan></text><line x1="220" y1="430" x2="220" y2="150" fill="none" stroke="#3F7D6E" stroke-width="9"/><line x1="120" y1="435" x2="330" y2="435" fill="none" stroke="#C9803B" stroke-width="3"/><line x1="220" y1="435" x2="150" y2="485" fill="none" stroke="#C9803B" stroke-width="5"/><line x1="220" y1="435" x2="280" y2="490" fill="none" stroke="#C9803B" stroke-width="5"/><line x1="700" y1="430" x2="700" y2="150" fill="none" stroke="#3F7D6E" stroke-width="9"/><line x1="600" y1="435" x2="810" y2="435" fill="none" stroke="#C9803B" stroke-width="3"/><line x1="700" y1="435" x2="630" y2="485" fill="none" stroke="#C9803B" stroke-width="5"/><line x1="700" y1="435" x2="760" y2="490" fill="none" stroke="#C9803B" stroke-width="5"/><ellipse cx="160" cy="280" rx="60" ry="30" fill="#DDEDE2" stroke="#3F7D6E" stroke-width="3"/><ellipse cx="281.5" cy="347.5" rx="57.5" ry="27.5" fill="#DDEDE2" stroke="#3F7D6E" stroke-width="3"/><ellipse cx="652.5" cy="287.5" rx="47.5" ry="47.5" fill="#DDEDE2" stroke="#3F7D6E" stroke-width="3"/><ellipse cx="757.5" cy="350" rx="52.5" ry="45" fill="#DDEDE2" stroke="#3F7D6E" stroke-width="3"/><ellipse cx="221" cy="145" rx="39" ry="35" fill="#F5DDBE" stroke="#C9803B" stroke-width="3"/><ellipse cx="700" cy="144" rx="33" ry="29" fill="#DDEDE2" stroke="#3F7D6E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="70" y="119">Flower</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="765" y="125">Small green</tspan><tspan x="765" y="155">flower</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="80" y="537">Narrow leaves</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="565" y="537">Broad leaves</tspan></text></svg>