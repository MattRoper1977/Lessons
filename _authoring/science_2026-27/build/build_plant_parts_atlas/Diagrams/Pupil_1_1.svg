<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="08ac7b20e6b1-title 08ac7b20e6b1-desc"><title id="08ac7b20e6b1-title">Identify A–D on the plant</title><desc id="08ac7b20e6b1-desc">Simplified flowering plant with letter-only leaders: A points to branching roots below soil, B to upright stem, C to leaves, D to flower. Names are for pupils to supply.</desc><defs><marker id="08ac7b20e6b1-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><rect x="310" y="390" width="280" height="125" fill="#F3E8D7" stroke="#C9803B" stroke-width="3"/><line x1="440" y1="390" x2="440" y2="115" fill="none" stroke="#3F7D6E" stroke-width="12"/><ellipse cx="375" cy="232.5" rx="65" ry="32.5" fill="#DDEDE2" stroke="#3F7D6E" stroke-width="3"/><ellipse cx="511.5" cy="287.5" rx="67.5" ry="32.5" fill="#DDEDE2" stroke="#3F7D6E" stroke-width="3"/><line x1="440" y1="390" x2="360" y2="455" fill="none" stroke="#C9803B" stroke-width="6"/><line x1="440" y1="390" x2="530" y2="455" fill="none" stroke="#C9803B" stroke-width="6"/><line x1="440" y1="390" x2="400" y2="490" fill="none" stroke="#C9803B" stroke-width="6"/><line x1="440" y1="390" x2="475" y2="495" fill="none" stroke="#C9803B" stroke-width="6"/><ellipse cx="413" cy="108" rx="31" ry="31" fill="#F5DDBE" stroke="#C9803B" stroke-width="3"/><ellipse cx="478" cy="108" rx="31" ry="31" fill="#F5DDBE" stroke="#C9803B" stroke-width="3"/><ellipse cx="413" cy="163" rx="31" ry="31" fill="#F5DDBE" stroke="#C9803B" stroke-width="3"/><ellipse cx="478" cy="163" rx="31" ry="31" fill="#F5DDBE" stroke="#C9803B" stroke-width="3"/><ellipse cx="442" cy="135" rx="25" ry="25" fill="#FFECA8" stroke="#C9803B" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="31" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="50" y="471">A __________</tspan></text><line x1="275" y1="465" x2="385" y2="435" fill="none" stroke="#4E7A9B" stroke-width="4"/><text font-family="Segoe UI, Arial, sans-serif" font-size="31" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="690" y="356">B __________</tspan></text><line x1="675" y1="345" x2="450" y2="340" fill="none" stroke="#4E7A9B" stroke-width="4"/><text font-family="Segoe UI, Arial, sans-serif" font-size="31" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="60" y="246">C __________</tspan></text><line x1="275" y1="240" x2="345" y2="230" fill="none" stroke="#4E7A9B" stroke-width="4"/><text font-family="Segoe UI, Arial, sans-serif" font-size="31" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="690" y="101">D __________</tspan></text><line x1="675" y1="100" x2="492" y2="125" fill="none" stroke="#4E7A9B" stroke-width="4"/><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="45" y="540">Simplified flowering plant; shapes and sizes vary.</tspan></text></svg>