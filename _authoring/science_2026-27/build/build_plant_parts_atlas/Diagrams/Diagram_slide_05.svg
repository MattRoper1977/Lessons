<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="build_plant_parts_atlas4-title build_plant_parts_atlas4-desc"><title id="build_plant_parts_atlas4-title">Hidden is different from absent</title><desc id="build_plant_parts_atlas4-desc">A shoot appears above an opaque pot. The pot hides its roots. No flower is visible in this observation, which cannot establish that the plant never flowers.</desc><defs><marker id="build_plant_parts_atlas4-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><line x1="430" y1="340" x2="430" y2="130" fill="none" stroke="#3F7D6E" stroke-width="12"/><ellipse cx="367.5" cy="202.5" rx="62.5" ry="32.5" fill="#DDEDE2" stroke="#3F7D6E" stroke-width="3"/><ellipse cx="497.5" cy="272.5" rx="62.5" ry="32.5" fill="#DDEDE2" stroke="#3F7D6E" stroke-width="3"/><rect x="285" y="340" width="310" height="150" fill="#DECAB0" stroke="#C9803B" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="630" y="185">Leaves and stem</tspan><tspan x="630" y="221">are visible.</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="630" y="368">Roots are hidden</tspan><tspan x="630" y="401.6">inside the pot.</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="50" y="74">Observation: no flower is visible today.</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="60" y="534">This view cannot tell us whether it flowers at another time.</tspan></text></svg>