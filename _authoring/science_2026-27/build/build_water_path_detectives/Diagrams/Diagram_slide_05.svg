<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="build_water_path_detectives4-title build_water_path_detectives4-desc"><title id="build_water_path_detectives4-title">Inspect inside, not just outside</title><desc id="build_water_path_detectives4-desc">Simplified adult-prepared stem cross-sections from the dye and plain-water comparison. Coloured spots represent selected stained water-carrying bundles, not uniform colouring of every tissue. Positions are illustrative and not a precise anatomy atlas.</desc><defs><marker id="build_water_path_detectives4-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><text font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="40" y="59">Constructed observation: adult-cut sections</tspan></text><ellipse cx="255" cy="255" rx="145" ry="115" fill="#E4F0E9" stroke="#3F7D6E" stroke-width="3"/><ellipse cx="755" cy="255" rx="145" ry="115" fill="#E4F0E9" stroke="#3F7D6E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="95" y="437">Dye shoot:</tspan><tspan x="95" y="469.4">coloured internal paths</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="575" y="437">Plain-water shoot:</tspan><tspan x="575" y="469.4">no dye-coloured paths</tspan></text><ellipse cx="350" cy="255" rx="10" ry="10" fill="#B85865" stroke="#B85865" stroke-width="3"/><ellipse cx="306.329" cy="313.903" rx="10" ry="10" fill="#B85865" stroke="#B85865" stroke-width="3"/><ellipse cx="215.466" cy="318.651" rx="10" ry="10" fill="#B85865" stroke="#B85865" stroke-width="3"/><ellipse cx="160.951" cy="264.878" rx="10" ry="10" fill="#B85865" stroke="#B8