<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="build_water_path_detectives2-title build_water_path_detectives2-desc"><title id="build_water_path_detectives2-title">Water travels through internal pathways</title><desc id="build_water_path_detectives2-desc">Selected water path in a rooted plant: soil water enters roots, travels upward in xylem through the stem, reaches leaves, and some leaves as water vapour. Arrows do not imply that all absorbed water is lost or that root uptake was demonstrated by a cut shoot.</desc><defs><marker id="build_water_path_detectives2-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><rect x="310" y="390" width="280" height="125" fill="#F3E8D7" stroke="#C9803B" stroke-width="3"/><line x1="440" y1="390" x2="440" y2="115" fill="none" stroke="#3F7D6E" stroke-width="12"/><ellipse cx="375" cy="232.5" rx="65" ry="32.5" fill="#DDEDE2" stroke="#3F7D6E" stroke-width="3"/><ellipse cx="511.5" cy="287.5" rx="67.5" ry="32.5" fill="#DDEDE2" stroke="#3F7D6E" stroke-width="3"/><line x1="440" y1="390" x2="360" y2="455" fill="none" stroke="#C9803B" stroke-width="6"/><line x1="440" y1="390" x2="530" y2="455" fill="none" stroke="#C9803B" stroke-width="6"/><line x1="440" y1="390" x2="400" y2="490" fill="none" stroke="#C9803B" stroke-width="6"/><line x1="440" y1="390" x2="475" y2="495" fill="none" stroke="#C9803B" stroke-width="6"/><text font-family="Segoe UI, Arial, sans-serif" font-size="31" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="40" y="71">Rooted plant: water path</tspan></text><defs><marker id="build_water_path_detectives2-arrow-9" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#347EBC"/></marker></defs><line x1="180" y1="470" x2="380" y2="450" fill="none" stroke="#347EBC" stroke-width="4" marker-end="url(#build_water_path_detectives2-arrow-9)"/><defs><marker id="build_water_path_detectives2-arrow-10" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#347EBC"/></marker></defs><line x1="410" y1="430" x2="440" y2="390" fill="none" stroke="#347EBC" stroke-width="4" marker-end="url(#build_water_path_detectives2-arrow-10)"/><defs><marker id="build_water_path_detectives2-arrow-11" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#347EBC"/></marker></defs><line x1="440" y1="375" x2="440" y2="260" fill="none" stroke="#347EBC" stroke-width="4" marker-end="url(#build_water_path_detectives2-arrow-11)"/><defs><marker id="build_water_path_detectives2-arrow-12" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#347EBC"/></marker></defs><line x1="440" y1="245" x2="370" y2="225" fill="none" stroke="#347EBC" stroke-width="4" marker-end="url(#build_water_path_detectives2-arrow-12)"/><defs><marker id="build_water_path_detectives2-arrow-13" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#347EBC"/></marker></defs><line x1="360" y1="205" x2="305" y2="145" fill="none" stroke="#347EBC" stroke-width="4" marker-end="url(#build_water_path_detectives2-arrow-13)"/><text font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="45" y="367">Water enters</tspan><tspan x="45" y="399.4">the roots.</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="650" y="313">Water travels up</tspan><tspan x="650" y="346.6">inside the stem</tspan><tspan x="650" y="380.2">to leaves.</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="555" y="118">Some water leaves</tspan><tspan x="555" y="151.6">the leaves as vapour.</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="40" y="545">These water-carrying pathways are called xylem.</tspan></text></svg>