<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="build_water_path_detectives3-title build_water_path_detectives3-desc"><title id="build_water_path_detectives3-title">Follow a visible tracer</title><desc id="build_water_path_detectives3-desc">Two cut flower shoots stand in separate cups, one with coloured water and one with plain water. Dye can mark internal water routes in the shoot; neither shoot has roots. The plain-water cup is a comparison.</desc><defs><marker id="build_water_path_detectives3-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><text font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="40" y="59">Cut shoots: this demonstration has no roots.</tspan></text><rect x="135" y="300" width="220" height="160" fill="white" stroke="#4E7A9B" stroke-width="3"/><rect x="140" y="370" width="210" height="85" fill="#EDC3C8" stroke="#EDC3C8" stroke-width="1"/><rect x="226" y="135" width="28" height="280" fill="#DDEDE2" stroke="#3F7D6E" stroke-width="3"/><ellipse cx="240" cy="120" rx="50" ry="35" fill="#F8ECEA" stroke="#C9803B" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="70" y="512">Coloured water</tspan></text><rect x="605" y="300" width="220" height="160" fill="white" stroke="#4E7A9B" stroke-width="3"/><rect x="610" y="370" width="210" height="85" fill="#DCECF5" stroke="#DCECF5" stroke-width="1"/><rect x="696" y="135" width="28" height="280" fill="#DDEDE2" stroke="#3F7D6E" stroke-width="3"/><ellipse cx="710" cy="120" rx="50" ry="35" fill="#F8ECEA" stroke="#C9803B" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="540" y="512">Plain-water control</tspan></text><defs><marker id="build_water_path_detectives3-arrow-11" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#B85865"/></marker></defs><line x1="240" y1="390" x2="240" y2="170" fill="none" stroke="#B85865" stroke-width="4" marker-end="url(#build_water_path_detectives3-arrow-11)"/><text font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="375" y="221">Dye can mark</tspan><tspan x="375" y="252.2">water pathways.</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="55" y="125">Cut stem</tspan></text></svg>