<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="build_friction_surface_lab3-title build_friction_surface_lab3-desc"><title id="build_friction_surface_lab3-title">Change the horizontal test surface only</title><desc id="build_friction_surface_lab3-desc">Side-view fixed ramp feeds a sliding wooden block onto a horizontal test surface. The same block is released without a push from one marked point; ramp angle, release point, transition and block face stay fixed. Run-out is measured from the ramp end to the same chosen block edge when stopped.</desc><defs><marker id="build_friction_surface_lab3-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><line x1="75" y1="180" x2="395" y2="365" fill="none" stroke="#1F2937" stroke-width="8"/><line x1="395" y1="365" x2="940" y2="365" fill="none" stroke="#1F2937" stroke-width="8"/><rect x="400" y="370" width="540" height="40" fill="#DDE5EB" stroke="#4E7A9B" stroke-width="3"/><rect x="95" y="130" width="85" height="60" fill="#DECAB0" stroke="#C9803B" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="40" y="69">Same ramp and release mark</tspan></text><line x1="140" y1="120" x2="140" y2="160" fill="none" stroke="#C9803B" stroke-width="4"/><rect x="745" y="305" width="85" height="60" fill="#DECAB0" stroke="#C9803B" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="580" y="198">Block stops on</tspan><tspan x="580" y="231.6">test surface.</tspan></text><line x1="395" y1="435" x2="745" y2="435" fill="none" stroke="#4E7A9B" stroke-width="4"/><line x1="395" y1="420" x2="395" y2="450" fill="none" stroke="#4E7A9B" stroke-width="4"/><line x1="745" y1="420" x2="745" y2="450" fill="none" stroke="#4E7A9B" stroke-width="4"/><text font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="460" y="487">Run-out distance (cm)</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="45" y="534">Use the same trailing edge at ramp end and when stopped.</tspan></text></svg>