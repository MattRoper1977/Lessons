<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="build_friction_surface_lab2-title build_friction_surface_lab2-desc"><title id="build_friction_surface_lab2-title">Friction opposes sliding at the contact</title><desc id="build_friction_surface_lab2-desc">A wooden block is already sliding to the right on a stationary horizontal surface after leaving a ramp. Friction on the block points left. The movement arrow is distinct from a force arrow; vertical forces are omitted from this simplified focus diagram.</desc><defs><marker id="build_friction_surface_lab2-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><rect x="65" y="350" width="865" height="65" fill="#DDE5EB" stroke="#4E7A9B" stroke-width="3"/><rect x="395" y="235" width="195" height="115" fill="#DECAB0" stroke="#C9803B" stroke-width="3"/><defs><marker id="build_friction_surface_lab2-arrow-2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#C9803B"/></marker></defs><line x1="410" y1="155" x2="775" y2="155" fill="none" stroke="#C9803B" stroke-width="4" marker-end="url(#build_friction_surface_lab2-arrow-2)"/><text font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="430" y="120">Sliding direction</tspan></text><defs><marker id="build_friction_surface_lab2-arrow-4" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#4E7A9B"/></marker></defs><line x1="445" y1="330" x2="185" y2="330" fill="none" stroke="#4E7A9B" stroke-width="4" marker-end="url(#build_friction_surface_lab2-arrow-4)"/><text font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="65" y="272">Friction on the block</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="360" y="478">Stationary surface</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="40" y="535">After release: no hand keeps pushing the block.</tspan></text></svg>