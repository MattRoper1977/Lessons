<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="build_friction_surface_lab4-title build_friction_surface_lab4-desc"><title id="build_friction_surface_lab4-title">Compare distance after the same release</title><desc id="build_friction_surface_lab4-desc">Horizontal bars start at zero and show constructed means: card 60 cm, cloth 23 cm, rubber 15 cm. They summarise three supplied repeated runs on each surface, not universal material constants.</desc><defs><marker id="build_friction_surface_lab4-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><text font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="40" y="59">Constructed mean run-out distances</tspan></text><line x1="190" y1="425" x2="910" y2="425" fill="none" stroke="#1F2937" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="280" y="522">Run-out distance (cm)</tspan></text><line x1="190" y1="120" x2="190" y2="425" fill="none" stroke="#D6DEE4" stroke-width="2"/><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="160" y="460">0</tspan></text><line x1="410" y1="120" x2="410" y2="425" fill="none" stroke="#D6DEE4" stroke-width="2"/><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="380" y="460">20</tspan></text><line x1="630" y1="120" x2="630" y2="425" fill="none" stroke="#D6DEE4" stroke-width="2"/><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="600" y="460">40</tspan></text><line x1="850" y1="120" x2="850" y2="425" fill="none" stroke="#D6DEE4" stroke-width="2"/><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="820" y="460">60</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="40" y="168">Card</tspan></text><rect x="190" y="140" width="660" height="55" fill="#4E7A9B" stroke="#4E7A9B" stroke-width="1"/><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="865" y="168">60</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="40" y="273">Cloth</tspan></text><rect x="190" y="245" width="253" height="55" fill="#3F7D6E" stroke="#3F7D6E" stroke-width="1"/><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="458" y="273">23</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="40" y="378">Rubber</tspan></text><rect x="190" y="350" width="165" height="55" fill="#C9803B" stroke="#C9803B" stroke-width="1"/><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="370" y="378">15</tspan></text></svg>