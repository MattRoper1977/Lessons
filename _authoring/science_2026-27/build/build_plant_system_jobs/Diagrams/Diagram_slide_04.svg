<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="build_plant_system_jobs3-title build_plant_system_jobs3-desc"><title id="build_plant_system_jobs3-title">Green leaves make sugars</title><desc id="build_plant_system_jobs3-desc">Simplified photosynthesis input-output model: light provides energy; water and carbon dioxide from air are used to make sugars in green leaves. Only selected inputs and the sugar output are shown; oxygen is also produced.</desc><defs><marker id="build_plant_system_jobs3-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><ellipse cx="490" cy="285" rx="110" ry="75" fill="#DDEDE2" stroke="#3F7D6E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="410" y="284">Green leaf</tspan></text><rect x="40" y="50" width="240" height="90" fill="#FFF1D2" stroke="#C9803B" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="65" y="103">Light energy</tspan></text><rect x="40" y="360" width="240" height="90" fill="#DDEAF4" stroke="#347EBC" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="75" y="414">Water</tspan></text><rect x="710" y="50" width="245" height="110" fill="#EDF3F7" stroke="#4E7A9B" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="725" y="90">Carbon dioxide</tspan><tspan x="725" y="120">from air</tspan></text><rect x="710" y="360" width="245" height="105" fill="#F6E1C4" stroke="#C9803B" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="735" y="407">Sugars made</tspan><tspan x="735" y="439.4">by the plant</tspan></text><defs><marker id="build_plant_system_jobs3-arrow-10" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#C9803B"/></marker></defs><line x1="280" y1="125" x2="390" y2="230" fill="none" stroke="#C9803B" stroke-width="4" marker-end="url(#build_plant_system_jobs3-arrow-10)"/><defs><marker id="build_plant_system_jobs3-arrow-11" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#347EBC"/></marker></defs><line x1="280" y1="385" x2="395" y2="335" fill="none" stroke="#347EBC" stroke-width="4" marker-end="url(#build_plant_system_jobs3-arrow-11)"/><defs><marker id="build_plant_system_jobs3-arrow-12" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#4E7A9B"/></marker></defs><line x1="710" y1="150" x2="590" y2="235" fill="none" stroke="#4E7A9B" stroke-width="4" marker-end="url(#build_plant_system_jobs3-arrow-12)"/><defs><marker id="build_plant_system_jobs3-arrow-13" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#3F7D6E"/></marker></defs><line x1="590" y1="335" x2="710" y2="390" fill="none" stroke="#3F7D6E" stroke-width="4" marker-end="url(#build_plant_system_jobs3-arrow-13)"/><text font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="55" y="516">Roots supply water and minerals; the plant makes its sugars.</tspan></text></svg>