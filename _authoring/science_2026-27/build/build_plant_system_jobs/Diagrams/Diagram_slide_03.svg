<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="build_plant_system_jobs2-title build_plant_system_jobs2-desc"><title id="build_plant_system_jobs2-title">Roots take in water and minerals</title><desc id="build_plant_system_jobs2-desc">Schematic root system absorbs water with dissolved mineral nutrients from soil; selected arrows then lead upwards through the stem. Soil is not eaten as ready-made food.</desc><defs><marker id="build_plant_system_jobs2-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><rect x="310" y="390" width="280" height="125" fill="#F3E8D7" stroke="#C9803B" stroke-width="3"/><line x1="440" y1="390" x2="440" y2="115" fill="none" stroke="#3F7D6E" stroke-width="12"/><ellipse cx="375" cy="232.5" rx="65" ry="32.5" fill="#DDEDE2" stroke="#3F7D6E" stroke-width="3"/><ellipse cx="511.5" cy="287.5" rx="67.5" ry="32.5" fill="#DDEDE2" stroke="#3F7D6E" stroke-width="3"/><line x1="440" y1="390" x2="360" y2="455" fill="none" stroke="#C9803B" stroke-width="6"/><line x1="440" y1="390" x2="530" y2="455" fill="none" stroke="#C9803B" stroke-width="6"/><line x1="440" y1="390" x2="400" y2="490" fill="none" stroke="#C9803B" stroke-width="6"/><line x1="440" y1="390" x2="475" y2="495" fill="none" stroke="#C9803B" stroke-width="6"/><text font-family="Segoe UI, Arial, sans-serif" font-size="31" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="40" y="76">The root system anchors the plant.</tspan></text><defs><marker id="build_plant_system_jobs2-arrow-9" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#347EBC"/></marker></defs><line x1="160" y1="450" x2="365" y2="440" fill="none" stroke="#347EBC" stroke-width="4" marker-end="url(#build_plant_system_jobs2-arrow-9)"/><defs><marker id="build_plant_system_jobs2-arrow-10" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#347EBC"/></marker></defs><line x1="710" y1="450" x2="520" y2="440" fill="none" stroke="#347EBC" stroke-width="4" marker-end="url(#build_plant_system_jobs2-arrow-10)"/><defs><marker id="build_plant_system_jobs2-arrow-11" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#347EBC"/></marker></defs><line x1="435" y1="405" x2="435" y2="285" fill="none" stroke="#347EBC" stroke-width="4" marker-end="url(#build_plant_system_jobs2-arrow-11)"/><text font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="50" y="347">Water and dissolved</tspan><tspan x="50" y="379.4">mineral nutrients</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="670" y="342">Water moves into</tspan><tspan x="670" y="374.4">and through the plant.</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="40" y="544">Mineral nutrients are needed; they are not ready-made plant food.</tspan></text></svg>