<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="build_plant_system_jobs4-title build_plant_system_jobs4-desc"><title id="build_plant_system_jobs4-title">Flowers support the next generation</title><desc id="build_plant_system_jobs4-desc">Simplified flowering-plant sequence: a flower can develop into a fruit containing seeds after successful pollination and fertilisation. A seed can later germinate under suitable conditions. Not every flower successfully forms seeds.</desc><defs><marker id="build_plant_system_jobs4-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><ellipse cx="165" cy="215" rx="65" ry="65" fill="#F5DDBE" stroke="#C9803B" stroke-width="3"/><ellipse cx="165" cy="215" rx="30" ry="30" fill="#FFECA8" stroke="#C9803B" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="75" y="365">Flower</tspan></text><defs><marker id="build_plant_system_jobs4-arrow-3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#4E7A9B"/></marker></defs><line x1="280" y1="215" x2="410" y2="215" fill="none" stroke="#4E7A9B" stroke-width="4" marker-end="url(#build_plant_system_jobs4-arrow-3)"/><ellipse cx="517.5" cy="220" rx="87.5" ry="90" fill="#F3CE9F" stroke="#C9803B" stroke-width="3"/><ellipse cx="485" cy="222.5" rx="15" ry="27.5" fill="#805D40" stroke="#C9803B" stroke-width="3"/><ellipse cx="535" cy="232.5" rx="15" ry="27.5" fill="#805D40" stroke="#C9803B" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="400" y="373">Fruit containing</tspan><tspan x="400" y="406.6">seeds</tspan></text><defs><marker id="build_plant_system_jobs4-arrow-8" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#4E7A9B"/></marker></defs><line x1="630" y1="215" x2="750" y2="215" fill="none" stroke="#4E7A9B" stroke-width="4" marker-end="url(#build_plant_system_jobs4-arrow-8)"/><line x1="835" y1="320" x2="835" y2="235" fill="none" stroke="#3F7D6E" stroke-width="9"/><ellipse cx="802.5" cy="235" rx="32.5" ry="20" fill="#DDEDE2" stroke="#3F7D6E" stroke-width="3"/><ellipse cx="872.5" cy="210" rx="32.5" ry="20" fill="#DDEDE2" stroke="#3F7D6E" stroke-width="3"/><line x1="835" y1="325" x2="800" y2="370" fill="none" stroke="#C9803B" stroke-width="5"/><line x1="835" y1="325" x2="870" y2="370" fill="none" stroke="#C9803B" stroke-width="5"/><text font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="740" y="432">New plant</tspan><tspan x="740" y="464.4">may grow</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="45" y="63">After successful pollination and fertilisation</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="45" y="535">A simplified sequence; outcomes and timing vary.</tspan></text></svg>