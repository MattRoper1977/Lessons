<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="build_growth_record_studio3-title build_growth_record_studio3-desc"><title id="build_growth_record_studio3-title">Read growth over time</title><desc id="build_growth_record_studio3-desc">Axes start at zero. Horizontal spacing is proportional to elapsed days 0, 3, 7 and 10; height is in cm. Each plotted value is the exact mean of three supplied constructed readings; A is 3,4,5,6 and B is 3,5,8,11.</desc><defs><marker id="build_growth_record_studio3-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><text font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="45" y="54">Constructed group mean heights</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="45" y="105">Height (cm)</tspan></text><line x1="140" y1="430" x2="915" y2="430" fill="none" stroke="#1F2937" stroke-width="3"/><line x1="140" y1="430" x2="140" y2="120" fill="none" stroke="#1F2937" stroke-width="3"/><line x1="135" y1="430" x2="915" y2="430" fill="none" stroke="#D6DEE4" stroke-width="2"/><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="75" y="435">0</tspan></text><line x1="135" y1="330" x2="915" y2="330" fill="none" stroke="#D6DEE4" stroke-width="2"/><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="75" y="335">4</tspan></text><line x1="135" y1="230" x2="915" y2="230" fill="none" stroke="#D6DEE4" stroke-width="2"/><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="75" y="235">8</tspan></text><li