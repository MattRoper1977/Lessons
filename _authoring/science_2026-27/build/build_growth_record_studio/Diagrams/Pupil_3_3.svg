<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="5a009e9813ac-title 5a009e9813ac-desc"><title id="5a009e9813ac-title">Blank plotting axes</title><desc id="5a009e9813ac-desc">Axes start at zero. Horizontal spacing is proportional to elapsed days 0, 3, 7 and 10; height is in cm. The pupil can plot B1 values from the shared table; no answer points are shown.</desc><defs><marker id="5a009e9813ac-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><text font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="45" y="54">Plot B1: supplied dates and heights</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="45" y="105">Height (cm)</tspan></text><line x1="140" y1="430" x2="915" y2="430" fill="none" stroke="#1F2937" stroke-width="3"/><line x1="140" y1="430" x2="140" y2="120" fill="none" stroke="#1F2937" stroke-width="3"/><line x1="135" y1="430" x2="915" y2="430" fill="none" stroke="#D6DEE4" stroke-width="2"/><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="75" y="435">0</tspan></text><line x1="135" y1="330" x2="915" y2="330" fill="none" stroke="#D6DEE4" stroke-width="2"/><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="75" y="335">4</tspan></text><line x1="135" y1="230" x2="915" y2="230" fill="none" stroke="#D6DEE4" stroke-width="2"/><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="75" y="235">8</tspan></text><line x1="135" y1="130" x2="915" y2="130" fill="none" stroke="#D6DEE4" stroke-width="2"/><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="75" y="135">12</tspan></text><line x1="160" y1="430" x2="160" y2="440" fill="none" stroke="#1F2937" stroke-width="2"/><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="165" y="470">0</tspan></text><line x1="370" y1="430" x2="370" y2="440" fill="none" stroke="#1F2937" stroke-width="2"/><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="375" y="470">3</tspan></text><line x1="650" y1="430" x2="650" y2="440" fill="none" stroke="#1F2937" stroke-width="2"/><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="655" y="470">7</tspan></text><line x1="860" y1="430" x2="860" y2="440" fill="none" stroke="#1F2937" stroke-width="2"/><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="865" y="470">10</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="405" y="531">Days since 3 May</tspan></text></svg>