<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="build_growth_record_studio4-title build_growth_record_studio4-desc"><title id="build_growth_record_studio4-title">A missing value is not zero</title><desc id="build_growth_record_studio4-desc">Three example record states distinguish a valid measurement (6 cm), not measured (missing) and actual zero. A missing value must remain explicitly missing and should not be drawn as zero on a graph.</desc><defs><marker id="build_growth_record_studio4-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><rect x="45" y="100" width="280" height="280" fill="#E4F0E9" stroke="#3F7D6E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="70" y="160">Measured</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="38" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="75" y="253">6 cm</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="65" y="335">A valid height</tspan></text><rect x="360" y="100" width="280" height="280" fill="#FFF2DC" stroke="#C9803B" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="385" y="158">Not measured</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="410" y="249">Missing</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="385" y="325">Leave a gap;</tspan><tspan x="385" y="355">record the reason.</tspan></text><rect x="675" y="100" width="280" height="280" fill="#EDF3F7" stroke="#4E7A9B" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="700" y="160">Zero</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="38" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="715" y="253">0 cm</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="700" y="325">A number, not</tspan><tspan x="700" y="355">a missing mark.</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="45" y="467">These are record examples, separate from</tspan><tspan x="45" y="499.4">the complete growth table.</tspan></text></svg>