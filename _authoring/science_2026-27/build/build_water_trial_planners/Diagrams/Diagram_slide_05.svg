<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="build_water_trial_planners4-title build_water_trial_planners4-desc"><title id="build_water_trial_planners4-title">Plan observations before results exist</title><desc id="build_water_trial_planners4-desc">A timeline lays out the proposed record: baseline day 0 then days 3, 7 and 10. Each uses the same plant IDs, height rule and leaf-condition notes. Future results remain unknown.</desc><defs><marker id="build_water_trial_planners4-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><line x1="90" y1="245" x2="900" y2="245" fill="none" stroke="#4E7A9B" stroke-width="5"/><ellipse cx="110" cy="245" rx="16" ry="16" fill="#4E7A9B" stroke="#4E7A9B" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="40" y="159">Day 0</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="115" y="331">Label plants;</tspan><tspan x="115" y="362.2">record baseline</tspan></text><ellipse cx="335" cy="245" rx="16" ry="16" fill="#4E7A9B" stroke="#4E7A9B" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="265" y="159">Day 3</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="340" y="331">Height +</tspan><tspan x="340" y="362.2">leaf condition</tspan></text><ellipse cx="615" cy="245" rx="16" ry="16" fill="#4E7A9B" stroke="#4E7A9B" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="545" y="159">Day 7</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="620" y="331">Height +</tspan><tspan x="620" y="362.2">leaf condition</tspan></text><ellipse cx="865" cy="245" rx="16" ry="16" fill="#4E7A9B" stroke="#4E7A9B" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="795" y="159">Day 10</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="870" y="331">Height +</tspan><tspan x="870" y="362.2">leaf condition</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="45" y="74">The plan contains actions, not made-up results.</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="50" y="515">Same observation time; record every plant, including difficulties.</tspan></text></svg>