<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="build_water_trial_planners3-title build_water_trial_planners3-desc"><title id="build_water_trial_planners3-title">Use one height rule</title><desc id="build_water_trial_planners3-desc">A ruler begins at the soil surface beside a seedling. The main shoot tip reaches 6 cm; measure from soil surface to shoot tip, without including pot height or forcing the plant straight.</desc><defs><marker id="build_water_trial_planners3-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><rect x="190" y="375" width="320" height="110" fill="#DECAB0" stroke="#C9803B" stroke-width="3"/><line x1="350" y1="375" x2="350" y2="165" fill="none" stroke="#3F7D6E" stroke-width="10"/><ellipse cx="297.5" cy="257.5" rx="52.5" ry="27.5" fill="#DDEDE2" stroke="#3F7D6E" stroke-width="3"/><ellipse cx="405" cy="310" rx="50" ry="25" fill="#DDEDE2" stroke="#3F7D6E" stroke-width="3"/><rect x="555" y="125" width="85" height="300" fill="#FFF2DC" stroke="#C9803B" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="680" y="373">0 cm: soil level</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="680" y="158">6 cm: shoot tip</tspan></text><line x1="505" y1="375" x2="660" y2="375" fill="none" stroke="#4E7A9B" stroke-width="4"/><line x1="365" y1="165" x2="660" y2="165" fill="none" stroke="#4E7A9B" stroke-width="4"/><text font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="45" y="64">Measure the same part, from the same starting level.</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="50" y="530">Do not include the pot or straighten the shoot by force.</tspan></text><line x1="555" y1="375" x2="580" y2="375" fill="none" stroke="#C9803B" stroke-width="3"/><line x1="555" y1="340" x2="580" y2="340" fill="none" stroke="#C9803B" stroke-width="3"/><line x1="555" y1="305" x2="580" y2="305" fill="none" stroke="#C9803B" stroke-width="3"/><line x1="555" y1="270" x2="580" y2="270" fill="none" stroke="#C9803B" stroke-width="3"/><line x1="555" y1="235" x2="580" y2="235" fill="none" stroke="#C9803B" stroke-width="3"/><line x1="555" y1="200" x2="580" y2="200" fill="none" stroke="#C9803B" stroke-width="3"/><line x1="555" y1="165" x2="580" y2="165" fill="none" stroke="#C9803B" stroke-width="3"/></svg>