<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="build_water_trial_planners2-title build_water_trial_planners2-desc"><title id="build_water_trial_planners2-title">A plan with two changes</title><desc id="build_water_trial_planners2-desc">Two groups each have three matched young seedlings. Group A receives 5 mL in light; group B receives 15 mL in darkness. Water and light both vary, so their effects cannot be separated.</desc><defs><marker id="build_water_trial_planners2-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><text font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="45" y="59">Repair the comparison</tspan></text><rect x="110" y="315" width="70" height="85" fill="#DECAB0" stroke="#C9803B" stroke-width="3"/><line x1="145" y1="315" x2="145" y2="235" fill="none" stroke="#3F7D6E" stroke-width="7"/><ellipse cx="130" cy="260" rx="15" ry="10" fill="#DDEDE2" stroke="#3F7D6E" stroke-width="3"/><rect x="210" y="315" width="70" height="85" fill="#DECAB0" stroke="#C9803B" stroke-width="3"/><line x1="245" y1="315" x2="245" y2="235" fill="none" stroke="#3F7D6E" stroke-width="7"/><ellipse cx="230" cy="260" rx="15" ry="10" fill="#DDEDE2" stroke="#3F7D6E" stroke-width="3"/><rect x="310" y="315" width="70" height="85" fill="#DECAB0" stroke="#C9803B" stroke-width="3"/><line x1="345" y1="315" x2="345" y2="235" fill="none" stroke="#3F7D6E" stroke-width="7"/><ellipse cx="330" cy="260" rx="15" ry="10" fill="#DDEDE2" stroke="#3F7D6E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="110" y="163">Group A: 5 mL daily</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="95" y="455">Three matched seedlings</tspan></text><rect x="610" y="315" width="70" height="85" fill="#DECAB0" stroke="#C9803B" stroke-width="3"/><line x1="645" y1="315" x2="645" y2="235" fill="none" stroke="#3F7D6E" stroke-width="7"/><ellipse cx="630" cy="260" rx="15" ry="10" fill="#DDEDE2" stroke="#3F7D6E" stroke-width="3"/><rect x="710" y="315" width="70" height="85" fill="#DECAB0" stroke="#C9803B" stroke-width="3"/><line x1="745" y1="315" x2="745" y2="235" fill="none" stroke="#3F7D6E" stroke-width="7"/><ellipse cx="730" cy="260" rx="15" ry="10" fill="#DDEDE2" stroke="#3F7D6E" stroke-width="3"/><rect x="810" y="315" width="70" height="85" fill="#DECAB0" stroke="#C9803B" stroke-width="3"/><line x1="845" y1="315" x2="845" y2="235" fill="none" stroke="#3F7D6E" stroke-width="7"/><ellipse cx="830" cy="260" rx="15" ry="10" fill="#DDEDE2" stroke="#3F7D6E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="610" y="163">Group B: 15 mL daily</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="595" y="455">Three matched seedlings</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="65" y="102">Sunny window</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="580" y="102">Dark cupboard</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="45" y="530">Water AND light change: the cause becomes unclear.</tspan></text></svg>