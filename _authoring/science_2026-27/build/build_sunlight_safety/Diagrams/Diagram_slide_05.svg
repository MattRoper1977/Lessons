<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="build_sunlight_safety4-title build_sunlight_safety4-desc"><title id="build_sunlight_safety4-title">Sunlight can arrive from another direction</title><desc id="build_sunlight_safety4-desc">A schematic ray from the Sun reflects from water towards a person. This illustrates why reflected sunlight also matters for protection, without an instruction to look into the Sun or reflection.</desc><defs><marker id="build_sunlight_safety4-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><ellipse cx="105" cy="105" rx="50" ry="50" fill="#FBE9AA" stroke="#C9803B" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="50" y="203">Sun</tspan></text><defs><marker id="build_sunlight_safety4-arrow-2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#E5AB37"/></marker></defs><line x1="155" y1="155" x2="430" y2="380" fill="none" stroke="#E5AB37" stroke-width="5" marker-end="url(#build_sunlight_safety4-arrow-2)"/><rect x="290" y="385" width="360" height="45" fill="#DDEAF1" stroke="#4E7A9B" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="330" y="473">Water surface</tspan></text><defs><marker id="build_sunlight_safety4-arrow-5" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#E5AB37"/></marker></defs><line x1="430" y1="380" x2="720" y2="145" fill="none" stroke="#E5AB37" stroke-width="5" marker-end="url(#build_sunlight_safety4-arrow-5)"/><rect x="745" y="120" width="70" height="210" fill="#EDF3F7" stroke="#4E7A9B" stroke-width="3"/><ellipse cx="780.5" cy="102.5" rx="47.5" ry="42.5" fill="#EDF3F7" stroke="#1F2937" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="730" y="396">Reflected sunlight</tspan><tspan x="730" y="427.2">also reaches us.</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="45" y="535">Never look at the Sun or stare into its bright reflection.</tspan></text></svg>