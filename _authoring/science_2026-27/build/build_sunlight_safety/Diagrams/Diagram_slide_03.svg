<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="build_sunlight_safety2-title build_sunlight_safety2-desc"><title id="build_sunlight_safety2-title">Sunlight includes more than we can see</title><desc id="build_sunlight_safety2-desc">The diagram separates visible light and invisible ultraviolet in sunlight. The bands are categories, not proportions or a complete spectrum.</desc><defs><marker id="build_sunlight_safety2-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><ellipse cx="120" cy="230" rx="70" ry="70" fill="#FBE9AA" stroke="#C9803B" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="50" y="352">Sun</tspan></text><defs><marker id="build_sunlight_safety2-arrow-2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#E5AB37"/></marker></defs><line x1="195" y1="205" x2="420" y2="140" fill="none" stroke="#E5AB37" stroke-width="5" marker-end="url(#build_sunlight_safety2-arrow-2)"/><defs><marker id="build_sunlight_safety2-arrow-3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#E5AB37"/></marker></defs><line x1="195" y1="255" x2="420" y2="355" fill="none" stroke="#E5AB37" stroke-width="5" marker-end="url(#build_sunlight_safety2-arrow-3)"/><rect x="445" y="70" width="490" height="125" fill="#FFF3D6" stroke="#C9803B" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="470" y="120">Visible light</tspan><tspan x="470" y="156">Our eyes detect it.</tspan></text><rect x="445" y="280" width="490" height="145" fill="#EEE9F6" stroke="#7A5C9E" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="470" y="330">Ultraviolet (UV)</tspan><tspan x="470" y="366">We cannot see it.</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="50" y="505">Schematic categories: not amounts or a full spectrum.</tspan></text></svg>