<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="build_sunlight_safety3-title build_sunlight_safety3-desc"><title id="build_sunlight_safety3-title">UV protection is a property of the lens</title><desc id="build_sunlight_safety3-desc">Incoming UV is strongly reduced by a suitable UV-filtering lens. Some visible light passes through. The schematic is not a measured transmission graph.</desc><defs><marker id="build_sunlight_safety3-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><text font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="40" y="90">Incoming radiation</tspan></text><rect x="465" y="80" width="100" height="350" fill="#DDEAF1" stroke="#4E7A9B" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="395" y="468">UV-filtering lens</tspan></text><defs><marker id="build_sunlight_safety3-arrow-3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#7A5C9E"/></marker></defs><line x1="55" y1="190" x2="460" y2="190" fill="none" stroke="#7A5C9E" stroke-width="5" marker-end="url(#build_sunlight_safety3-arrow-3)"/><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="70" y="158">UV</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="600" y="183">UV strongly</tspan><tspan x="600" y="216.6">reduced</tspan></text><defs><marker id="build_sunlight_safety3-arrow-6" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#E5AB37"/></marker></defs><line x1="55" y1="330" x2="460" y2="330" fill="none" stroke="#E5AB37" stroke-width="5" marker-end="url(#build_sunlight_safety3-arrow-6)"/><defs><marker id="build_sunlight_safety3-arrow-7" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#E5AB37"/></marker></defs><line x1="570" y1="330" x2="900" y2="330" fill="none" stroke="#E5AB37" stroke-width="5" marker-end="url(#build_sunlight_safety3-arrow-7)"/><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="65" y="398">Visible light</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="610" y="403">Some passes</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="50" y="540">Lens darkness alone cannot confirm UV protection.</tspan></text></svg>