<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="build_shadow_screen4-title build_shadow_screen4-desc"><title id="build_shadow_screen4-title">Materials change the light reaching the screen</title><desc id="build_shadow_screen4-desc">Schematic comparison of opaque card, a translucent sheet and clear plastic. Arrow counts are qualitative, not measured percentages. Clear materials may still cast faint shadows.</desc><defs><marker id="build_shadow_screen4-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><text font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="55" y="60">Same source, screen and sample position</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="40" y="143">Opaque card</tspan></text><defs><marker id="build_shadow_screen4-arrow-2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#E5AB37"/></marker></defs><line x1="315" y1="150" x2="465" y2="150" fill="none" stroke="#E5AB37" stroke-width="5" marker-end="url(#build_shadow_screen4-arrow-2)"/><rect x="475" y="105" width="30" height="90" fill="#1F2937" stroke="#4E7A9B" stroke-width="3"/><rect x="900" y="105" width="20" height="90" fill="white" stroke="#4E7A9B" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="40" y="283">Translucent sheet</tspan></text><defs><marker id="build_shadow_screen4-arrow-6" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#E5AB37"/></marker></defs><line x1="315" y1="290" x2="465" y2="290" fill="none" stroke="#E5AB37" stroke-width="5" marker-end="url(#build_shadow_screen4-arrow-6)"/><rect x="475" y="245" width="30" height="90" fill="#BCC7CD" stroke="#4E7A9B" stroke-width="3"/><rect x="900" y="245" width="20" height="90" fill="white" stroke="#4E7A9B" stroke-width="3"/><defs><marker id="build_shadow_screen4-arrow-9" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#E5AB37"/></marker></defs><line x1="520" y1="290" x2="895" y2="255" fill="none" stroke="#E5AB37" stroke-width="3" marker-end="url(#build_shadow_screen4-arrow-9)"/><defs><marker id="build_shadow_screen4-arrow-10" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#E5AB37"/></marker></defs><line x1="520" y1="290" x2="895" y2="325" fill="none" stroke="#E5AB37" stroke-width="3" marker-end="url(#build_shadow_screen4-arrow-10)"/><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="40" y="423">Clear plastic</tspan></text><defs><marker id="build_shadow_screen4-arrow-12" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#E5AB37"/></marker></defs><line x1="315" y1="430" x2="465" y2="430" fill="none" stroke="#E5AB37" stroke-width="5" marker-end="url(#build_shadow_screen4-arrow-12)"/><rect x="475" y="385" width="30" height="90" fill="#E4EDF1" stroke="#4E7A9B" stroke-width="3"/><rect x="900" y="385" width="20" height="90" fill="white" stroke="#4E7A9B" stroke-width="3"/><defs><marker id="build_shadow_screen4-arrow-15" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#E5AB37"/></marker></defs><line x1="520" y1="418" x2="895" y2="418" fill="none" stroke="#E5AB37" stroke-width="3" marker-end="url(#build_shadow_screen4-arrow-15)"/><defs><marker id="build_shadow_screen4-arrow-16" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#E5AB37"/></marker></defs><line x1="520" y1="430" x2="895" y2="430" fill="none" stroke="#E5AB37" stroke-width="3" marker-end="url(#build_shadow_screen4-arrow-16)"/><defs><marker id="build_shadow_screen4-arrow-17" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#E5AB37"/></marker></defs><line x1="520" y1="442" x2="895" y2="442" fill="none" stroke="#E5AB37" stroke-width="3" marker-end="url(#build_shadow_screen4-arrow-17)"/><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="585" y="190">Light blocked</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="555" y="365">Some light passes</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="555" y="505">Much light passes</tspan></text></svg>