<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="build_shadow_screen2-title build_shadow_screen2-desc"><title id="build_shadow_screen2-title">An open light path</title><desc id="build_shadow_screen2-desc">Three rays from a small light source reach a screen with no card in the path.</desc><defs><marker id="build_shadow_screen2-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><ellipse cx="80" cy="270" rx="25" ry="25" fill="#FFF3D6" stroke="#C9803B" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="25" y="192">Small LED source</tspan></text><rect x="880" y="70" width="24" height="410" fill="white" stroke="#4E7A9B" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="770" y="518">Screen</tspan></text><defs><marker id="build_shadow_screen2-arrow-4" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#E5AB37"/></marker></defs><line x1="105" y1="270" x2="880" y2="120" fill="none" stroke="#E5AB37" stroke-width="5" marker-end="url(#build_shadow_screen2-arrow-4)"/><defs><marker id="build_shadow_screen2-arrow-5" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#E5AB37"/></marker></defs><line x1="105" y1="270" x2="880" y2="270" fill="none" stroke="#E5AB37" stroke-width="5" marker-end="url(#build_shadow_screen2-arrow-5)"/><defs><marker id="build_shadow_screen2-arrow-6" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#E5AB37"/></marker></defs><line x1="105" y1="270" x2="880" y2="430" fill="none" stroke="#E5AB37" stroke-width="5" marker-end="url(#build_shadow_screen2-arrow-6)"/><text font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="315" y="119">No card blocks the light.</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="245" y="408">The screen receives light</tspan><tspan x="245" y="441.6">from the source.</tspan></text></svg>