<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="build_blackout_box2-title build_blackout_box2-desc"><title id="build_blackout_box2-title">Light reaches your eye</title><desc id="build_blackout_box2-desc">A ray travels from the LED source to an object; reflected light then enters an eye. The eye does not send light out.</desc><defs><marker id="build_blackout_box2-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><rect x="50" y="170" width="160" height="95" fill="#EDF3F7" stroke="#4E7A9B" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="50" y="148">LED light</tspan></text><rect x="450" y="240" width="100" height="120" fill="#C9803B" stroke="#4E7A9B" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="540" y="433">Object</tspan></text><ellipse cx="862.5" cy="212.5" rx="72.5" ry="47.5" fill="white" stroke="#1F2937" stroke-width="3"/><ellipse cx="833" cy="212.5" rx="20" ry="22.5" fill="#1F2937" stroke="#1F2937" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="805" y="148">Eye</tspan></text><defs><marker id="build_blackout_box2-arrow-7" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#E5AB37"/></marker></defs><line x1="210" y1="220" x2="500" y2="240" fill="none" stroke="#E5AB37" stroke-width="5" marker-end="url(#build_blackout_box2-arrow-7)"/><defs><marker id="build_blackout_box2-arrow-8" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#E5AB37"/></marker></defs><line x1="500" y1="240" x2="810" y2="225" fill="none" stroke="#E5AB37" stroke-width="5" marker-end="url(#build_blackout_box2-arrow-8)"/><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="190" y="338">Light reaches</tspan><tspan x="190" y="371.6">the object.</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="615" y="343">Some reflected light</tspan><tspan x="615" y="376.6">enters the eye.</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="55" y="496">The eye receives light. Arrows show its direction.</tspan></text></svg>