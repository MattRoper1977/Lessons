<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="build_blackout_box3-title build_blackout_box3-desc"><title id="build_blackout_box3-title">No light: no visual information</title><desc id="build_blackout_box3-desc">An unlit LED, an object and an eye have no light-path arrows. This ideal model excludes all other light.</desc><defs><marker id="build_blackout_box3-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><rect x="50" y="170" width="160" height="95" fill="#EDF3F7" stroke="#4E7A9B" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="50" y="148">LED light</tspan></text><rect x="450" y="240" width="100" height="120" fill="#C9803B" stroke="#4E7A9B" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" text-anchor="middle" fill="#1F2937"><tspan x="540" y="433">Object</tspan></text><ellipse cx="862.5" cy="212.5" rx="72.5" ry="47.5" fill="white" stroke="#1F2937" stroke-width="3"/><ellipse cx="833" cy="212.5" rx="20" ry="22.5" fill="#1F2937" stroke="#1F2937" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="805" y="148">Eye</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="70" y="315">OFF</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="280" y="75">A model of complete darkness</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="230" y="493">No light reaches the object or the eye.</tspan></text></svg>