<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="build_soil_composition4-title build_soil_composition4-desc"><title id="build_soil_composition4-title">What could the bubbles tell us?</title><desc id="build_soil_composition4-desc">Before water is added, spaces between soil particles contain air. As water enters, some air escapes as bubbles. The drawing is a model, not a photograph or a measured result.</desc><defs><marker id="build_soil_composition4-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><text font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="70" y="65">Before: air in spaces</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="580" y="65">After: water enters</tspan></text><rect x="70" y="105" width="335" height="320" fill="#F6F0E5" stroke="#1F2937" stroke-width="2"/><rect x="580" y="105" width="335" height="320" fill="#D7ECF7" stroke="#1F2937" stroke-width="2"/><ellipse cx="127.5" cy="201" rx="37.5" ry="31" fill="#B89B78" stroke="#1F2937" stroke-width="2"/><ellipse cx="242.5" cy="186" rx="37.5" ry="31" fill="#B89B78" stroke="#1F2937" stroke-width="2"/><ellipse cx="332.5" cy="261" rx="37.5" ry="31" fill="#B89B78" stroke="#1F2937" stroke-width="2"/><ellipse cx="152.5" cy="341" rx="37.5" ry="31" fill="#B89B78" stroke="#1F2937" stroke-width="2"/><ellipse cx="257.5" cy="331" rx="37.5" ry="31" fill="#B89B78" stroke="#1F2937" stroke-width="2"/><ellipse cx="647.5" cy="201" rx="37.5" ry="31" fill="#B89B78" stroke="#1F2937" stroke-width="2"/><ellipse cx="762.5" cy="186" rx="37.5" ry="31" fill="#B89B78" stroke="#1F2937" stroke-width="2"/><ellipse cx="852.5" cy="261" rx="37.5" ry="31" fill="#B89B78" stroke="#1F2937" stroke-width="2"/><ellipse cx="672.5" cy="341" rx="37.5" ry="31" fill="#B89B78" stroke="#1F2937" stroke-width="2"/><ellipse cx="777.5" cy="331" rx="37.5" ry="31" fill="#B89B78" stroke="#1F2937" stroke-width="2"/><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="172" y="272">Air</tspan></text><ellipse cx="664" cy="137" rx="14" ry="14" fill="#FFFFFF" stroke="#4E7A9B" stroke-width="2"/><ellipse cx="714.5" cy="137.5" rx="12.5" ry="12.5" fill="#FFFFFF" stroke="#4E7A9B" stroke-width="2"/><ellipse cx="771" cy="119" rx="11" ry="11" fill="#FFFFFF" stroke="#4E7A9B" stroke-width="2"/><defs><marker id="build_soil_composition4-arrow-18" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><line x1="462" y1="240" x2="538" y2="240" fill="none" stroke="#1F2937" stroke-width="4" marker-end="url(#build_soil_composition4-arrow-18)"/><text font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="494.5" y="311">Add</tspan><tspan x="494.5" y="342.2">water</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="70" y="483">Bubbles support: there was gas in the spaces.</tspan></text></svg>