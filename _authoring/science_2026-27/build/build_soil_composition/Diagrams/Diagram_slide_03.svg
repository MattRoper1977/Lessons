<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="build_soil_composition2-title build_soil_composition2-desc"><title id="build_soil_composition2-title">Two sources of soil material</title><desc id="build_soil_composition2-desc">Rock weathering supplies mineral particles; living things supply organic material. These processes occur over time. Mixing this model does not instantly make mature soil.</desc><defs><marker id="build_soil_composition2-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><rect x="50" y="65" width="350" height="110" fill="#ECE5DD" stroke="#1F2937" stroke-width="2"/><text font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="75" y="127">Rock material</tspan></text><rect x="600" y="65" width="350" height="110" fill="#E8EEDC" stroke="#1F2937" stroke-width="2"/><text font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="620" y="127">Living things</tspan></text><defs><marker id="build_soil_composition2-arrow-4" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><line x1="220" y1="182" x2="220" y2="263" fill="none" stroke="#1F2937" stroke-width="4" marker-end="url(#build_soil_composition2-arrow-4)"/><defs><marker id="build_soil_composition2-arrow-5" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><line x1="775" y1="182" x2="775" y2="263" fill="none" stroke="#1F2937" stroke-width="4" marker-end="url(#build_soil_composition2-arrow-5)"/><text font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="50" y="220">Weathering</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="795" y="220">Remains</tspan><tspan x="795" y="248.8">break down</tspan></text><rect x="50" y="275" width="350" height="110" fill="#EFE2CC" stroke="#1F2937" stroke-width="2"/><text font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="70" y="329">Mineral particles</tspan></text><rect x="600" y="275" width="350" height="110" fill="#E1E6D4" stroke="#1F2937" stroke-width="2"/><text font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="620" y="329">Organic matter</tspan></text><defs><marker id="build_soil_composition2-arrow-12" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><line x1="400" y1="340" x2="465" y2="422" fill="none" stroke="#1F2937" stroke-width="4" marker-end="url(#build_soil_composition2-arrow-12)"/><defs><marker id="build_soil_composition2-arrow-13" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><line x1="600" y1="340" x2="535" y2="422" fill="none" stroke="#1F2937" stroke-width="4" marker-end="url(#build_soil_composition2-arrow-13)"/><rect x="300" y="433" width="400" height="80" fill="#DEE9EE" stroke="#1F2937" stroke-width="2"/><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="325" y="478">Parts of a soil mixture</tspan></text></svg>