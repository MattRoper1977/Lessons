<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="build_shadow_size_studio2-title build_shadow_size_studio2-desc"><title id="build_shadow_size_studio2-title">Change the card position</title><desc id="build_shadow_size_studio2-desc">Side-view light-ray model. Ray arrows point away from a small source. Boundary rays pass the top and bottom edges of an opaque card and locate the shadow on a screen.</desc><defs><marker id="build_shadow_size_studio2-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><ellipse cx="80" cy="270" rx="25" ry="25" fill="#FFF3D6" stroke="#C9803B" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="25" y="192">Small LED source</tspan></text><rect x="880" y="70" width="24" height="410" fill="white" stroke="#4E7A9B" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="770" y="518">Screen</tspan></text><defs><marker id="build_shadow_size_studio2-arrow-4" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#E5AB37"/></marker></defs><line x1="105" y1="270" x2="240" y2="270" fill="none" stroke="#E5AB37" stroke-width="5" marker-end="url(#build_shadow_size_studio2-arrow-4)"/><rect x="233" y="250" width="14" height="40" fill="#1F2937" stroke="#1F2937" stroke-width="3"/><defs><marker id="build_shadow_size_studio2-arrow-6" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#E5AB37"/></marker></defs><line x1="80" y1="270" x2="880" y2="170" fill="none" stroke="#E5AB37" stroke-width="5" marker-end="url(#build_shadow_size_studio2-arrow-6)"/><defs><marker id="build_shadow_size_studio2-arrow-7" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#E5AB37"/></marker></defs><line x1="80" y1="270" x2="880" y2="370" fill="none" stroke="#E5AB37" stroke-width="5" marker-end="url(#build_shadow_size_studio2-arrow-7)"/><text font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="135" y="127">Card blocks</tspan><tspan x="135" y="159.4">this light path.</tspan></text><rect x="880" y="170" width="24" height="200" fill="#626D7A" stroke="#1F2937" stroke-width="3"/><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="280" y="468">Card is 20 cm from the source.</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="190" y="57">Fixed source and screen: 100 cm apart</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="145" y="381">Same card:</tspan><tspan x="145" y="412.2">4 cm high</tspan></text></svg>