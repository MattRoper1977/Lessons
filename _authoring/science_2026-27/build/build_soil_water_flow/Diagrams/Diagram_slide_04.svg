<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="build_soil_water_flow3-title build_soil_water_flow3-desc"><title id="build_soil_water_flow3-title">Measure what passes through</title><desc id="build_soil_water_flow3-desc">A draining pot holds 100 cubic centimetres of loosely filled soil above a matching filter and support. Sixty millilitres of water is added over ten seconds. A graduated container collects the water for a fixed time.</desc><defs><marker id="build_soil_water_flow3-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><rect x="75" y="190" width="310" height="195" fill="#D4B893" stroke="#1F2937" stroke-width="2"/><rect x="75" y="160" width="310" height="225" fill="none" stroke="#1F2937" stroke-width="2"/><line x1="75" y1="388" x2="385" y2="388" fill="none" stroke="#1F2937" stroke-width="4"/><text font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="65" y="447">Identical pot + filter</tspan></text><defs><marker id="build_soil_water_flow3-arrow-4" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#4E7A9B"/></marker></defs><line x1="195" y1="65" x2="195" y2="145" fill="none" stroke="#4E7A9B" stroke-width="4" marker-end="url(#build_soil_water_flow3-arrow-4)"/><text font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="250" y="84">60 mL added</tspan><tspan x="250" y="118.8">over 10 seconds</tspan></text><rect x="495" y="290" width="210" height="195" fill="#FFFFFF" stroke="#1F2937" stroke-width="2"/><rect x="498" y="410" width="204" height="72" fill="#D7ECF7" stroke="#4E7A9B" stroke-width="2"/><text font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="745" y="336">Read collected</tspan><tspan x="745" y="368.4">water at the</tspan><tspan x="745" y="400.8">same time.</tspan></text><defs><marker id="build_soil_water_flow3-arrow-9" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#4E7A9B"/></marker></defs><line x1="389" y1="370" x2="487" y2="370" fill="none" stroke="#4E7A9B" stroke-width="4" marker-end="url(#build_soil_water_flow3-arrow-9)"/><text font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="60" y="124">Water</tspan><tspan x="60" y="152.8">enters</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="100" y="262">100 cm³ soil</tspan><tspan x="100" y="294.4">Loose; no tamping</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="490" y="520">Collection container</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="445" y="199">Diagram shows collection separately</tspan><tspan x="445" y="229">so all parts are visible.</tspan></text></svg>