<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="build_soil_water_flow4-title build_soil_water_flow4-desc"><title id="build_soil_water_flow4-title">Read a volume, not a height guess</title><desc id="build_soil_water_flow4-desc">A simplified upright measuring cylinder with a level at 30 millilitres. The zero is at the bottom; equal distances represent equal 20 millilitre intervals. Read the surface at eye level.</desc><defs><marker id="build_soil_water_flow4-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><rect x="260" y="100" width="220" height="340" fill="#FFFFFF" stroke="#1F2937" stroke-width="2"/><rect x="264" y="280" width="212" height="156" fill="#D7ECF7" stroke="#4E7A9B" stroke-width="2"/><line x1="425" y1="130" x2="480" y2="130" fill="none" stroke="#1F2937" stroke-width="4"/><line x1="425" y1="230" x2="480" y2="230" fill="none" stroke="#1F2937" stroke-width="4"/><line x1="425" y1="330" x2="480" y2="330" fill="none" stroke="#1F2937" stroke-width="4"/><line x1="425" y1="430" x2="480" y2="430" fill="none" stroke="#1F2937" stroke-width="4"/><text font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="500" y="137">60 mL</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="500" y="237">40 mL</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="500" y="337">20 mL</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="500" y="437">0 mL</tspan></text><defs><marker id="build_soil_water_flow4-arrow-10" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#4E7A9B"/></marker></defs><line x1="70" y1="280" x2="250" y2="280" fill="none" stroke="#4E7A9B" stroke-width="4" marker-end="url(#build_soil_water_flow4-arrow-10)"/><text font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="60" y="199">Look at</tspan><tspan x="60" y="233.8">water level</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="660" y="264">This level is</tspan><tspan x="660" y="304.8">30 mL.</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="60" y="503">Read between marks. Keep the container upright.</tspan></text></svg>