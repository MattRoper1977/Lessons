<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="build_soil_water_flow2-title build_soil_water_flow2-desc"><title id="build_soil_water_flow2-title">Water needs connected spaces</title><desc id="build_soil_water_flow2-desc">Two simplified pore networks. Broad connected paths permit easier flow than narrow connected paths in this model. Real soil also contains cracks, roots and aggregates; circle sizes are not to scale.</desc><defs><marker id="build_soil_water_flow2-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><text font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="55" y="65">Broad connected paths</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="550" y="65">Narrow connected paths</tspan></text><rect x="60" y="120" width="380" height="320" fill="#F1EADB" stroke="#1F2937" stroke-width="2"/><rect x="560" y="120" width="380" height="320" fill="#F1EADB" stroke="#1F2937" stroke-width="2"/><ellipse cx="122.5" cy="182.5" rx="52.5" ry="47.5" fill="#B89B78" stroke="#1F2937" stroke-width="2"/><ellipse cx="342.5" cy="182.5" rx="52.5" ry="47.5" fill="#B89B78" stroke="#1F2937" stroke-width="2"/><ellipse cx="122.5" cy="342.5" rx="52.5" ry="47.5" fill="#B89B78" stroke="#1F2937" stroke-width="2"/><ellipse cx="342.5" cy="342.5" rx="52.5" ry="47.5" fill="#B89B78" stroke="#1F2937" stroke-width="2"/><ellipse cx="602.5" cy="165" rx="32.5" ry="30" fill="#B89B78" stroke="#1F2937" stroke-width="2"/><ellipse cx="680.5" cy="165" rx="32.5" ry="30" fill="#B89B78" stroke="#1F2937" stroke-width="2"/><ellipse cx="760.5" cy="165" rx="32.5" ry="30" fill="#B89B78" stroke="#1F2937" stroke-width="2"/><ellipse cx="842.5" cy="165" rx="32.5" ry="30" fill="#B89B78" stroke="#1F2937" stroke-width="2"/><ellipse cx="602.5" cy="255" rx="32.5" ry="30" fill="#B89B78" stroke="#1F2937" stroke-width="2"/><ellipse cx="680.5" cy="255" rx="32.5" ry="30" fill="#B89B78" stroke="#1F2937" stroke-width="2"/><ellipse cx="760.5" cy="255" rx="32.5" ry="30" fill="#B89B78" stroke="#1F2937" stroke-width="2"/><ellipse cx="842.5" cy="255" rx="32.5" ry="30" fill="#B89B78" stroke="#1F2937" stroke-width="2"/><ellipse cx="602.5" cy="355" rx="32.5" ry="30" fill="#B89B78" stroke="#1F2937" stroke-width="2"/><ellipse cx="680.5" cy="355" rx="32.5" ry="30" fill="#B89B78" stroke="#1F2937" stroke-width="2"/><ellipse cx="760.5" cy="355" rx="32.5" ry="30" fill="#B89B78" stroke="#1F2937" stroke-width="2"/><ellipse cx="842.5" cy="355" rx="32.5" ry="30" fill="#B89B78" stroke="#1F2937" stroke-width="2"/><defs><marker id="build_soil_water_flow2-arrow-20" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#4E7A9B"/></marker></defs><line x1="235" y1="135" x2="235" y2="410" fill="none" stroke="#4E7A9B" stroke-width="4" marker-end="url(#build_soil_water_flow2-arrow-20)"/><defs><marker id="build_soil_water_flow2-arrow-21" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#4E7A9B"/></marker></defs><line x1="719" y1="137" x2="719" y2="408" fill="none" stroke="#4E7A9B" stroke-width="4" marker-end="url(#build_soil_water_flow2-arrow-21)"/><text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="55" y="494">A model of pathways, not a rule for every soil.</tspan></text></svg>