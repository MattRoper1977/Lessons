<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="build_soil_water_retention3-title build_soil_water_retention3-desc"><title id="build_soil_water_retention3-title">Not collected does not mean soil only</title><desc id="build_soil_water_retention3-desc">A simplified pot showing water above the soil, water in the soil pores, and water held by the filter. All three can contribute to the volume not collected. The illustration is not to scale.</desc><defs><marker id="build_soil_water_retention3-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><rect x="80" y="95" width="360" height="325" fill="#FFFFFF" stroke="#1F2937" stroke-width="2"/><rect x="84" y="160" width="352" height="70" fill="#D7ECF7" stroke="#4E7A9B" stroke-width="2"/><rect x="84" y="230" width="352" height="172" fill="#D4B893" stroke="#1F2937" stroke-width="2"/><rect x="84" y="402" width="352" height="14" fill="#ACCBDC" stroke="#4E7A9B" stroke-width="2"/><ellipse cx="145" cy="288.5" rx="35" ry="28.5" fill="#B89B78" stroke="#1F2937" stroke-width="2"/><ellipse cx="259" cy="283.5" rx="35" ry="28.5" fill="#B89B78" stroke="#1F2937" stroke-width="2"/><ellipse cx="373" cy="303.5" rx="35" ry="28.5" fill="#B89B78" stroke="#1F2937" stroke-width="2"/><ellipse cx="200" cy="364.5" rx="35" ry="28.5" fill="#B89B78" stroke="#1F2937" stroke-width="2"/><ellipse cx="325" cy="363.5" rx="35" ry="28.5" fill="#B89B78" stroke="#1F2937" stroke-width="2"/><rect x="200" y="315" width="45" height="35" fill="#D7ECF7" stroke="#4E7A9B" stroke-width="2"/><rect x="320" y="245" width="35" height="24" fill="#D7ECF7" stroke="#4E7A9B" stroke-width="2"/><text font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="580" y="164">Water may still be</tspan><tspan x="580" y="198.8">above the soil.</tspan></text><defs><marker id="build_soil_water_retention3-arrow-12" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#4E7A9B"/></marker></defs><line x1="565" y1="193" x2="447" y2="193" fill="none" stroke="#4E7A9B" stroke-width="4" marker-end="url(#build_soil_water_retention3-arrow-12)"/><text font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="580" y="295">Some water remains</tspan><tspan x="580" y="329.8">in soil pores.</tspan></text><defs><marker id="build_soil_water_retention3-arrow-14" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#4E7A9B"/></marker></defs><line x1="565" y1="320" x2="448" y2="320" fill="none" stroke="#4E7A9B" stroke-width="4" marker-end="url(#build_soil_water_retention3-arrow-14)"/><text font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="580" y="421">The filter may</tspan><tspan x="580" y="455.8">hold some water.</tspan></text><defs><marker id="build_soil_water_retention3-arrow-16" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#4E7A9B"/></marker></defs><line x1="565" y1="418" x2="448" y2="410" fill="none" stroke="#4E7A9B" stroke-width="4" marker-end="url(#build_soil_water_retention3-arrow-16)"/><text font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="60" y="516">Check for standing water, drips, leaks and spills.</tspan></text></svg>