<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="build_soil_water_retention4-title build_soil_water_retention4-desc"><title id="build_soil_water_retention4-title">Same input, different amounts out</title><desc id="build_soil_water_retention4-desc">Constructed sample data: each sample receives 60 millilitres. After five minutes, A collects 46, B 34 and C 22 millilitres. Equal-length bars show collected volume and the remainder, under the no-spill assumption.</desc><defs><marker id="build_soil_water_retention4-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><text font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="45" y="60">Constructed sample data • 60 mL in each</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="45" y="157">A</tspan></text><rect x="130" y="115" width="613.33" height="85" fill="#9AC2D8" stroke="#4E7A9B" stroke-width="2"/><rect x="743.33" y="115" width="186.67" height="85" fill="#D7DFC2" stroke="#617B40" stroke-width="2"/><text font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="155" y="168">46 collected</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="754" y="155">14 left</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="45" y="292">B</tspan></text><rect x="130" y="250" width="453.33" height="85" fill="#9AC2D8" stroke="#4E7A9B" stroke-width="2"/><rect x="583.33" y="250" width="346.67" height="85" fill="#D7DFC2" stroke="#617B40" stroke-width="2"/><text font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="155" y="303">34 collected</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="608" y="303">26 left</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="45" y="427">C</tspan></text><rect x="130" y="385" width="293.33" height="85" fill="#9AC2D8" stroke="#4E7A9B" stroke-width="2"/><rect x="423.33" y="385" width="506.67" height="85" fill="#D7DFC2" stroke="#617B40" stroke-width="2"/><text font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="150" y="437">22 collected</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="480" y="438">38 left</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="45" y="527">Left at 5 min; initial water/losses ignored.</tspan></text></svg>