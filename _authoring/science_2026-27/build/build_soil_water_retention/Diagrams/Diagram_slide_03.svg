<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="build_soil_water_retention2-title build_soil_water_retention2-desc"><title id="build_soil_water_retention2-title">Account for the same 60 mL</title><desc id="build_soil_water_retention2-desc">Constructed worked example. Sixty millilitres were added and 34 millilitres collected after five minutes. The difference is 26 millilitres not collected. With no spills and negligible evaporation and negligible initial water, this is approximately water remaining in the setup.</desc><defs><marker id="build_soil_water_retention2-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1F2937"/></marker></defs><text font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="55" y="69">60 mL added</tspan></text><rect x="55" y="115" width="900" height="105" fill="#D7ECF7" stroke="#4E7A9B" stroke-width="2"/><rect x="55" y="280" width="510" height="105" fill="#9AC2D8" stroke="#4E7A9B" stroke-width="2"/><rect x="565" y="280" width="390" height="105" fill="#D7DFC2" stroke="#617B40" stroke-width="2"/><text font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="70" y="326">34 mL collected</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#1F2937"><tspan x="580" y="322">26 mL not</tspan><tspan x="580" y="358">collected</tspan></text><line x1="55" y1="240" x2="955" y2="240" fill="none" stroke="#1F2937" stroke-width="4"/><text font-family="Segoe UI, Arial, sans-serif" font-size="43" font-weight="700" text-anchor="middle" fill="#1F2937"><tspan x="495" y="469">60 − 34 = 26 mL</tspan></text><text font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#1F2937"><tspan x="70" y="534">Model: initial water and losses ignored.</tspan></text></svg>