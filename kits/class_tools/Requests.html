<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Request box</title>
<style>
:root{--ink:#1d2433;--accent:#1f5fa8;--soft:#eef3fa;--line:#c9d3e3;--ok:#178841;--warn:#b36205;--bg:#ffffff}
@media (prefers-color-scheme: dark){:root{--ink:#e8edf5;--accent:#8db8f0;--soft:#1c2433;--line:#3a4658;--ok:#5fd08a;--warn:#f0b060;--bg:#11161f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.5 "Segoe UI",Arial,sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:24px;margin:0 0 4px;color:var(--accent)}
p{margin:8px 0}
.note{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:16px}
textarea{width:100%;min-height:300px;font:18px/1.6 inherit;padding:10px;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.row{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0}
button,label.btn{font:inherit;font-size:17px;padding:12px 16px;border-radius:10px;border:2px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.ghost,label.btn{background:transparent;color:var(--accent)}
input[type=file]{display:none}
#msg{min-height:1.5em;font-weight:600}
.ok{color:var(--ok)}.warn{color:var(--warn)}
ol{padding-left:22px}li{margin:4px 0}

select,input[type=text],input[type=date]{font:inherit;font-size:17px;padding:8px;border:2px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);max-width:100%}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media (max-width:520px){.grid{grid-template-columns:1fr}}
.field label{display:block;font-size:15px;font-weight:600;margin-bottom:2px}
table{border-collapse:collapse;width:100%;font-size:16px}td,th{border:1px solid var(--line);padding:6px;text-align:left}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin:12px 0}
.tile{display:block;padding:14px;border:2px solid var(--line);border-radius:12px;text-decoration:none;color:var(--ink);background:var(--soft)}
.tile b{display:block;color:var(--accent);font-size:19px}.tile span{font-size:15px}
h2{font-size:20px;margin-top:22px}
</style>
</head>
<body>
<main>
<h1>Request box</h1>
<p class="note">Ask for anything: a catch-up sheet, a fix, a new resource. No pupil names, please. Use pupil codes.</p>
<div class="field"><label for="req">What do you need?</label><textarea id="req" style="min-height:160px" placeholder="e.g. Catch-up sheet for TRACK Science week 3 lesson 2, ready by Thursday"></textarea></div>
<div class="grid" style="margin-top:10px">
 <div class="field"><label for="when">Needed by</label><select id="when"><option>No rush</option><option>This week</option><option>Tomorrow</option><option>Today</option></select></div>
</div>
<div class="row"><button id="save">Save request file</button></div>
<p id="msg" aria-live="polite"></p>
<h2>Then</h2>
<ol><li>Put the file in Drive › <b>_INBOX › Requests</b>.</li><li>The home laptop adds it to <b>_AUTOMATION › Requests.txt</b>, which the agents check.</li></ol>
</main>
<script>
(function(){"use strict";var $=function(i){return document.getElementById(i);};
function say(t,c){$("msg").textContent=t;$("msg").className=c||"";}
$("save").onclick=function(){var t=$("req").value.trim();if(!t){say("Type your request first.","warn");return;}
 var now=new Date(),body="Needed by: "+$("when").value+"\r\n"+t.replace(/\r?\n/g,"\r\n")+"\r\n";
 var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([body],{type:"text/plain"}));
 a.download="request_"+now.toISOString().slice(0,16).replace(/[:T]/g,"-")+".txt";document.body.appendChild(a);a.click();
 setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1000);$("req").value="";say("Saved. Put it in Drive: _INBOX › Requests.","ok");};
})();
</script>
</body>
</html>
