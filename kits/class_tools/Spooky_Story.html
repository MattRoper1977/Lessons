    {"id":"s01","title":"The tap in the dark","alt":"A fridge with two bright eyes, a slice of toast behind its door, and a bag on a chair.","body":["You slip into the dark kitchen for some toast. Tap. Tap. Tap. The fridge door cracks open. Two eyes glow in the gap. You spot your toast on a tiny plate.","“Make me laugh and you get it back,” says the fridge. A bag on a chair starts to shake. Then you hear a sniff under the table."],"choices":[{"label":"Look in the shaking bag","to":"s02a","icon":"look"},{"label":"Look under the table","to":"s02b","icon":"look"}]},
    {"id":"s02a","title":"A bag with a face","alt":"A pale ghost floats out of a striped bag on a chair.","body":["You peek into the bag. A ghost pops up like a bit of toast. “Boo,” it says. Then it says “Sorry” to the bag. Its name is Puff. Puff likes a good joke.","“Put on a very smart hat,” says Puff. “That always helps.” A knock comes from the cupboard. At the sink, a green bubble grows."],"choices":[{"label":"Open the cupboard","to":"s03a","icon":"look"},{"label":"Check the green bubble","to":"s03b","icon":"look"}]},
    {"id":"s02b","title":"Feet at the table","alt":"A green zombie sits under the table, holding a plate with one crumb.","body":["You bend down and see a pair of green feet. Crumb the zombie sits under the table. He holds up a plate with one sad crumb on it. “Just toast,” he says.","You tell him what the fridge wants. He puts the plate on his head and waits. A knock comes from the cupboard. A green bubble grows by the sink."],"word":"zombie","choices":[{"label":"Open the cupboard","to":"s03a","icon":"look"},{"label":"Check the green bubble","to":"s03b","icon":"look"}]},
    {"id":"s03a","title":"The little achoo","alt":"A small vampire in a cape holds a tissue inside an open cupboard.","body":["You pull the door wide. Sniff the vampire sits by the mugs. He lifts his cape to say boo. “Ah … ah … choo!” He blows his nose and tries to look cross.","You ask him what makes the fridge laugh. Sniff points to a bowl and a clean sock. “A hat for a head that has no head,” he says."],"word":"vampire","choices":[{"label":"Take the bowl","to":"s04a","icon":"act"},{"label":"Take the clean sock","to":"s04b","icon":"act"}]},
    {"id":"s03b","title":"The sink has lips","alt":"Green slime with round eyes blows a bubble in a sink.","body":["You lean over the sink. A blob of slime blinks up at you. It blows a huge green bubble. Pop! The bubble leaves a ring on its head. The slime makes a proud little bow.","You need a hat like that. You spot a bowl on the side. Next to it lies a clean sock with one long toe."],"word":"slime","choices":[{"label":"Take the bowl","to":"s04a","icon":"act"},{"label":"Take the clean sock","to":"s04b","icon":"act"}]},
    {"id":"s04a","title":"The bowl hat","alt":"An upside-down golden bowl gleams in a pool of light beside the fridge.","body":["You lift the bowl and turn it over. It looks like a hat fit for a king. There is one pea stuck to the side. You leave it there. All smart hats need a little green dot.","The fridge leans in for a look. “Who gets to wear it?” asks the fridge. Its door makes a slow creak."],"choices":[{"label":"Wear the bowl yourself","to":"s05a","icon":"act"},{"label":"Put the bowl on the fridge","to":"s05b","icon":"act"}]},
    {"id":"s04b","title":"The sock hat","alt":"A long striped sock curls like a drooping hat beside the fridge.","body":["You pick up the sock by the toe. It is so long that it swings like a tail. You fold the top up to make a hat. Now the toe sticks out like a duck's bill.","The fridge leans in for a look. “Who gets to wear it?” asks the fridge. Its door makes a slow creak."],"choices":[{"label":"Wear the sock yourself","to":"s05a","icon":"act"},{"label":"Put the sock on the fridge","to":"s05b","icon":"act"}]},
    {"id":"s05a","title":"A very smart hat","alt":"The fridge studies a bowl or a sock worn as a hat by the reader.","body":["You put on the hat and look down your nose. Puff the ghost drifts over. “Very smart hat,” says Puff. The fridge looks you up and down. “Why yes,” you say. “It has a very good job. It keeps my hair in.”","The fridge makes a small snort. You still need a real laugh. You think of a toast joke. You can also do your best silly walk."],"choices":[{"label":"Tell the toast joke","to":"s06a","icon":"toast"},{"label":"Do the silly walk","to":"s06b","icon":"act"}]},
    {"id":"s05b","title":"The fridge gets dressed","alt":"The fridge wears the bowl or sock and admires its shape in a shiny tray.","body":["You set the hat on top of the fridge. The fridge turns to see itself in a tray. Puff the ghost drifts over. “Very smart hat,” says Puff. The fridge tilts a bit. It wants to see its best side.","You can see its door shake. You still need a real laugh. You think of a toast joke. You can also do your best silly walk."],"choices":[{"label":"Tell the toast joke","to":"s06a","icon":"toast"},{"label":"Do the silly walk","to":"s06b","icon":"act"}]},
    {"id":"s06a","title":"A joke on toast","alt":"The fridge tries to keep a straight face while a ghost grins and a zombie holds a plate.","body":["You clear your throat. “What does toast wear in the rain?” The fridge goes very still. “A coat of jam!” you say. Puff lets out a squeak. Crumb shuffles up with a plate. “Just toast,” he says.","The fridge gives a tiny shake. It makes a wet sniff. “I'm close,” it says. “Give me a hand.” You see a box of soft white tissues."],"choices":[{"label":"Clap to help it laugh","to":"s07a","icon":"act"},{"label":"Offer the fridge a tissue","to":"s07b","icon":"act"}]},
    {"id":"s06b","title":"The bent knee walk","alt":"The fridge watches a pair of shoes take a big sideways step.","body":["You bend your knees and take one big step. Then you take one very small step. You act as if your shoes are full of peas. The fridge tries to do it too. It has no knees. It just rocks.","The fridge makes a wet sniff. “I'm close,” it says. “Give me a hand.” You see a box of soft white tissues."],"choices":[{"label":"Clap to help it laugh","to":"s07a","icon":"act"},{"label":"Offer the fridge a tissue","to":"s07b","icon":"act"}]},
    {"id":"s07a","title":"Hands for the fridge","alt":"Two hands clap beside a fridge with a paper note stuck to its door.","body":["You clap three times. The fridge nods. “Yes! More of that!” You clap one more time. The fridge tries to clap too. It has one door and no hands. It gives up and stamps one little foot.","A note slips down its door. A tray rolls out from under it. “One big laugh,” says the fridge. “This might help.”"],"choices":[{"label":"Read the note","to":"s08a","icon":"look"},{"label":"Look at the tray","to":"s08b","icon":"look"}]},
    {"id":"s07b","title":"One big sniff","alt":"The fridge holds a tissue in its door with a note and tray close by.","body":["You hold out a tissue. The fridge takes it with the edge of its door. It blows so hard that Puff spins round. “My nose is a door,” says the fridge. “How odd is that?”","A note slips down its door. A tray rolls out from under it. “One big laugh,” says the fridge. “This might help.”"],"choices":[{"label":"Read the note","to":"s08a","icon":"look"},{"label":"Look at the tray","to":"s08b","icon":"look"}]},
    {"id":"s08a","title":"Do it wrong","alt":"A large note that reads DO IT WRONG sits above a spoon, a box and a mat.","body":["You lift the note. It says “DO IT WRONG” in big red pen. You read it out. The fridge sighs. “My best jokes make no sense at all,” it says. “Like socks with no feet.”","You look down at the tray. It holds a spoon, a small box and a mat. You can do a lot wrong with those."],"choices":[{"label":"Grab the spoon","to":"s09a","icon":"act"},{"label":"Open the box","to":"s09b","icon":"look"},{"label":"Pick up the mat","to":"s09c","icon":"act"}]},
    {"id":"s08b","title":"Three odd things","alt":"A tray holds a large spoon, a small green box and a blue mat shaped like toast.","body":["You pull the tray into the light. It holds a spoon as big as your hand. Next to it sits a box with a loose lid. Last of all there is a mat shaped like toast.","“All good jokes start with a bit of junk,” says the fridge. It looks at the tray. “That is my best junk. Do something daft with it.”"],"choices":[{"label":"Grab the spoon","to":"s09a","icon":"act"},{"label":"Open the box","to":"s09b","icon":"look"},{"label":"Pick up the mat","to":"s09c","icon":"act"}]},
    {"id":"s09a","title":"The bendy spoon","alt":"A big spoon curls sideways over a tray as the fridge peeks on.","body":["You pick up the spoon. It bends to the left. Then it bends to the right. You hold it up like a singer. The fridge leans close to hear it sing. You hear a small squeak from its door.","You can tap the spoon on the tray to make a beat. Or you can give the spoon a big voice."],"choices":[{"label":"Tap a beat with the spoon","to":"s10a","icon":"act"},{"label":"Give the spoon a voice","to":"s10b","icon":"act"}]},
    {"id":"s09b","title":"The box with a crown","alt":"A green box has two paper eyes and a gold crown.","body":["You lift the lid. The box has two paper eyes stuck to one side. A little gold crown sits in it. You put the crown on the box. Now it looks like a king who has lost his legs.","The fridge lets out a squeak. You can make the box talk. Or you can make it march like a king."],"choices":[{"label":"Give the box a voice","to":"s10b","icon":"act"},{"label":"Make the box march","to":"s10c","icon":"act"}]},
    {"id":"s09c","title":"A stage for toast","alt":"A blue mat shaped like a slice of toast sits like a stage under a pool of light.","body":["You spread the mat on the floor. It looks like a slice of blue toast. You put one foot on it. Puff calls out, “You are on!” The fridge leans in like it has a seat at a show.","You can tap out a beat with your feet. Or you can lead a march. Puff can be your band."],"choices":[{"label":"Tap a beat with your feet","to":"s10a","icon":"act"},{"label":"Lead a march","to":"s10c","icon":"act"}]},
    {"id":"s10a","title":"The beat goes plop","alt":"Music notes surround the laughing fridge as toast slides out onto a tray.","body":["You tap out a beat. Tap, tap, plop! You pause as if the plop is part of the tune. The fridge tries to hold its laugh in. Then its whole door shakes. “HA!” it says.","Your toast slides out with a stack of spare slices. Crumb brings his plate. Sniff pops out with jam. The fridge asks what you do first."],"choices":[{"label":"Make a plate for all","to":"s11a","icon":"toast"},{"label":"Give Crumb the first slice","to":"s11b","icon":"toast"},{"label":"Let the fridge pick a prize","to":"s11c","icon":"act"}]},
    {"id":"s10b","title":"A voice fit for a king","alt":"A speech bubble floats by the laughing fridge as toast slides out onto a tray.","body":["You give a tiny thing a big voice. “Who put my socks in the soup?” you roar. The fridge tries to keep a straight face. Then its whole door shakes. “HA!” it says.","Your toast slides out with a stack of spare slices. Crumb brings his plate. Sniff pops out with jam. The fridge asks what you do first."],"choices":[{"label":"Make a plate for all","to":"s11a","icon":"toast"},{"label":"Give Crumb the first slice","to":"s11b","icon":"toast"},{"label":"Let the fridge pick a prize","to":"s11c","icon":"act"}]},
    {"id":"s10c","title":"The march of the feet","alt":"Footprints and music notes loop past the laughing fridge and a tray of toast.","body":["You start a grand march. Left, right, left. Puff hums a tune and Crumb taps his plate. You end with a bow to one loose pea. The fridge lets out a great big “HA!”","Your toast slides out with a stack of spare slices. Crumb brings his plate. Sniff pops out with jam. The fridge asks what you do first."],"choices":[{"label":"Make a plate for all","to":"s11a","icon":"toast"},{"label":"Give Crumb the first slice","to":"s11b","icon":"toast"},{"label":"Let the fridge pick a prize","to":"s11c","icon":"act"}]},
    {"id":"s11a","title":"A plate for all","alt":"A round plate of toast is set on a table with a chair beside it.","body":["You put the toast in the middle of the table. Puff adds a crumb to each plate. “Just toast,” says Crumb. Sniff sets down his pot of jam. He has a dab of it on his nose.","You pull up a spare chair. The fridge looks at the seat. Then it looks at the tallest slice of toast. Both look keen to join in."],"choices":[{"label":"Save the fridge a seat","to":"end-a","icon":"act"},{"label":"Give the toast a smart hat","to":"end-b","icon":"toast"}]},
    {"id":"s11b","title":"Crumb gets first pick","alt":"Crumb holds a plate piled with warm toast, with more slices on the tray.","body":["You give Crumb the first slice. He holds it up to the light. “Just toast,” he says. A huge grin spreads across his face. You give him the tray so he can share it out.","Crumb points to a sign with a blank bit at the top. He can run a toast shop. He can also make a tall toast stack."],"choices":[{"label":"Let Crumb run the shop","to":"end-c","icon":"toast"},{"label":"Help Crumb stack the toast","to":"end-d","icon":"toast"}]},
    {"id":"s11c","title":"A prize for the fridge","alt":"The fridge grins at a prize tray with a gold paper badge.","body":["You tell the fridge it gets a prize for the best laugh. The fridge stands up as tall as it can. “A small prize for a big fridge,” it says. “I want to be part of the show.”","You can give it a clap. Or you can write a name on a badge. There is a gold one on the tray."],"word":"badge","choices":[{"label":"Give the fridge a tiny clap","to":"end-e","icon":"act"},{"label":"Give the fridge a name badge","to":"end-f","icon":"act"}]},
    {"id":"end-a","title":"Best ending — Toast for the whole crew","alt":"The fridge joins Crumb, Puff and Sniff at a table full of toast and jam.","body":["You move the chair so the fridge can fit at the table. The fridge brings out more toast. It even has jam for Sniff. Crumb takes one bite. “Just toast,” he says. “With friends.”","Puff puts a pea on the fridge. “Very smart hat.” You all laugh. The fridge makes a tiny burp. Then it asks if you can come back for lunch."],"ending":true,"reason":"You save the fridge a seat, so it shares its toast with the whole crew.","choices":[]},
    {"id":"end-b","title":"The king of toast","alt":"A tall slice of toast wears a gold bowl like a crown in front of the fridge.","body":["You give the tallest slice a hat. Puff makes a low bow. “Very smart hat,” says Puff. Sniff bows so low that the jam drops off his nose. Crumb catches it on his plate.","The fridge calls for a toast to the toast. You hold up your slice. Then you eat it. The tall slice gets its own seat and a dot of jam."],"ending":true,"reason":"You give the toast a hat, so the whole crew treats it like a king.","choices":[]},
    {"id":"end-c","title":"Crumb's toast shop","alt":"Crumb serves a slice at a counter with a hand-drawn TOAST SHOP sign.","body":["You write TOAST SHOP on the sign. Crumb puts it on the table and takes his first order. You ask for toast. Puff asks for a bit of toast. Sniff asks if he can get jam.","“Just toast,” says Crumb. He gives Sniff two slices and a pot of jam. You pay with a clap. The fridge wants a job on the till."],"ending":true,"reason":"You let Crumb run the shop, so he gets to say “Just toast” to each guest.","choices":[]},
    {"id":"end-d","title":"The great toast stack","alt":"A tall stack of toast leans towards Crumb, who holds out a plate.","body":["You and Crumb stack the toast on a plate. It goes up past his chin. It tips to the left. Puff gasps. It tips to the right. Sniff grabs the jam to keep it safe.","The stack slides down in a neat row. One slice lands on each plate. Crumb nods. “Just toast,” he says. You both take a bow."],"ending":true,"reason":"You help Crumb stack the toast, so the falling stack serves a slice to each guest.","choices":[]},
    {"id":"end-e","title":"A clap for a snack","alt":"Two clapping hands are beside a grinning fridge that hands out toast.","body":["You give the fridge one tiny clap. The fridge gives you one tiny slice. You clap twice. Out come two more. Puff starts to clap very fast. The fridge has to ask for a rest.","Crumb holds up his plate. “Just toast?” The fridge gives him the big slice it saves for guests. Then it gives itself a clap with the door."],"ending":true,"reason":"You give the fridge a tiny clap, so it hands out toast for each clap.","choices":[]},
    {"id":"end-f","title":"Chef Cold Feet","alt":"The fridge has a chef hat and a gold name badge, with toast on its tray.","body":["You write CHEF COLD FEET in big letters. The fridge wears the badge on its door. It says, “I make the best cold toast in the room.” You take a bite. The toast is still warm.","“Shh,” says the fridge. “You'll give my secret away.” Puff puts a clean sock on top. “Very smart hat, Chef.” The chef takes a bow."],"ending":true,"reason":"You give the fridge a name badge, so it turns into Chef Cold Feet.","choices":[]}
  ]
}

const story = JSON.parse(document.getElementById("story-data").textContent);
const scenes = new Map(story.scenes.map(scene => [scene.id, scene]));
const endings = story.scenes.filter(scene => scene.ending);
const byId = id => document.getElementById(id);
const keyPrefix = "mbm_story_";
const readButton = byId("read-aloud");
const calmButton = byId("calm");
const motionPreference = window.matchMedia("(prefers-reduced-motion: reduce)");
const synth = "speechSynthesis" in window && "SpeechSynthesisUtterance" in window
  ? window.speechSynthesis
  : null;

function readLocal(name, fallback) {
  try {
    return JSON.parse(localStorage.getItem(keyPrefix + name)) ?? fallback;
  } catch {
    return fallback;
  }
}

function saveLocal(name, value) {
  try {
    localStorage.setItem(keyPrefix + name, JSON.stringify(value));
  } catch {
    // Some browsers block storage for local files. Keep the current session usable.
  }
}

function restorePath() {
  const saved = readLocal("path", []);
  const restored = [story.start];
  if (!Array.isArray(saved) || saved[0] !== story.start) return restored;
  for (const id of saved.slice(1)) {
    if (!scenes.get(restored.at(-1)).choices.some(choice => choice.to === id)) break;
    restored.push(id);
  }
  return restored;
}

const savedEndings = readLocal("endings", []);
const found = new Set(Array.isArray(savedEndings)
  ? savedEndings.filter(id => scenes.get(id)?.ending)
  : []);
let path = restorePath();
let textBoost = 0;
let calmRequested = false;
let offlineVoice = null;
let speaking = false;
let speechRun = 0;
let currentUtterance = null;

function voiceState(active) {
  speaking = active;
  readButton.setAttribute("aria-pressed", String(active));
  readButton.querySelector("span").textContent = active ? "Stop reading" : "Read to me";
}

function stopSpeech() {
  speechRun += 1;
  if (speaking) synth.cancel();
  currentUtterance = null;
  voiceState(false);
}

function updateOfflineVoice() {
  const voices = synth.getVoices().filter(voice => voice.localService && /^en(?:[-_]|$)/i.test(voice.lang));
  offlineVoice = voices.find(voice => /^en[-_]gb$/i.test(voice.lang)) ?? voices[0] ?? null;
  readButton.hidden = !offlineVoice;
}

function readScene() {
  if (speaking) {
    stopSpeech();
    return;
  }
  if (!offlineVoice) return;

  const scene = scenes.get(path.at(-1));
  const lines = [scene.title + ".", ...scene.body];
  if (scene.ending) {
    lines.push("Why did that happen? " + scene.reason);
  } else {
    lines.push(...scene.choices.map((choice, index) => "Choice " + (index + 1) + ". " + choice.label + "."));
  }

  const run = ++speechRun;
  const voice = offlineVoice;
  voiceState(true);
  const speakLine = index => {
    if (run !== speechRun) return;
    if (index === lines.length) {
      currentUtterance = null;
      voiceState(false);
      return;
    }
    currentUtterance = new SpeechSynthesisUtterance(lines[index]);
    currentUtterance.voice = voice;
    currentUtterance.lang = voice.lang;
    currentUtterance.rate = .88;
    currentUtterance.onend = () => speakLine(index + 1);
    currentUtterance.onerror = () => {
      if (run === speechRun) stopSpeech();
    };
    synth.speak(currentUtterance);
  };
  speakLine(0);
}

function setCalm() {
  const calm = motionPreference.matches || calmRequested;
  document.documentElement.classList.toggle("calm", calm);
  calmButton.setAttribute("aria-pressed", String(calm));
  calmButton.setAttribute("aria-disabled", String(motionPreference.matches));
  calmButton.title = motionPreference.matches ? "On because your device uses reduced motion" : "";
  calmButton.querySelector("span").textContent = calm ? "On" : "Off";
}

function setTextSize(change) {
  textBoost = Math.min(12, Math.max(0, textBoost + change));
  document.documentElement.style.setProperty("--text-boost", textBoost + "px");
  byId("smaller").setAttribute("aria-disabled", String(textBoost === 0));
  byId("bigger").setAttribute("aria-disabled", String(textBoost === 12));
}

function choose(id) {
  path.push(id);
  render(true);
}

function back() {
  if (path.length <= 1) return;
  path.pop();
  render(true);
}

function restart() {
  path = [story.start];
  render(true);
}

function makeChoice(label, icon, action, number) {
  const button = document.createElement("button");
  button.type = "button";
  button.className = "choice";
  const graphic = document.createElement("span");
  graphic.className = "choice-icon";
  graphic.setAttribute("aria-hidden", "true");
  graphic.innerHTML = '<svg><use href="#icon-' + icon + '"></use></svg>';
  const words = document.createElement("span");
  words.textContent = label;
  button.append(graphic, words);
  if (number) {
    const key = document.createElement("kbd");
    key.textContent = number;
    key.setAttribute("aria-hidden", "true");
    button.setAttribute("aria-keyshortcuts", String(number));
    button.append(key);
  }
  button.addEventListener("click", action);
  return button;
}

function render(moveFocus = false) {
  stopSpeech();
  const scene = scenes.get(path.at(-1));
  if (scene.ending && !found.has(scene.id)) {
    found.add(scene.id);
    saveLocal("endings", [...found]);
  }
  saveLocal("path", path);
  byId("progress").textContent = "Scene " + path.length + " of about 12";
  byId("endings").textContent = "Endings found: " + found.size + " of " + endings.length;

  const title = byId("scene-title");
  title.textContent = scene.title;
  const picture = byId("picture");
  picture.innerHTML = sceneArt(scene.id, path);
  const alt = scene.alt.replace("bowl or sock", path.includes("s04b") ? "sock" : "bowl");
  picture.firstElementChild.setAttribute("aria-label", alt);
  byId("story-text").replaceChildren(...scene.body.map(line => {
    const paragraph = document.createElement("p");
    paragraph.textContent = line;
    return paragraph;
  }));
  byId("ending-reason").hidden = !scene.ending;
  byId("reason-text").textContent = scene.reason ?? "";
  byId("back").hidden = Boolean(scene.ending);
  byId("back").setAttribute("aria-disabled", String(path.length <= 1));
  byId("restart").hidden = Boolean(scene.ending);
  const buttons = scene.ending
    ? [makeChoice("Try a different path", "back", back, 1), makeChoice("Start again", "again", restart, 2)]
    : scene.choices.map((choice, index) =>
        makeChoice(choice.label, choice.icon, () => choose(choice.to), index + 1));
  byId("choices").replaceChildren(...buttons);

  if (moveFocus) {
    title.focus({ preventScroll: true });
    window.scrollTo(0, 0);
  }
}

byId("back").addEventListener("click", back);
byId("restart").addEventListener("click", restart);
byId("bigger").addEventListener("click", () => setTextSize(2));
byId("smaller").addEventListener("click", () => setTextSize(-2));
calmButton.addEventListener("click", () => {
  if (motionPreference.matches) return;
  calmRequested = !calmRequested;
  setCalm();
});
motionPreference.addEventListener("change", setCalm);
readButton.addEventListener("click", readScene);
if (synth) {
  synth.addEventListener("voiceschanged", updateOfflineVoice);
  updateOfflineVoice();
}
window.addEventListener("pagehide", stopSpeech);

const teacherButton = byId("teacher");
teacherButton.addEventListener("click", () => {
  const panel = byId("teacher-panel");
  panel.hidden = !panel.hidden;
  teacherButton.setAttribute("aria-expanded", String(!panel.hidden));
});
byId("teacher-summary").textContent = "About 10 minutes per path. " + story.scenes.length +
  " scenes in all, 12 per path, and " + endings.length + " endings.";
const trickyWords = new Set(story.scenes.flatMap(scene => scene.word ? [scene.word] : []));
byId("teacher-words").textContent = "Tricky words — " + [...trickyWords].join(", ") + ".";

document.addEventListener("keydown", event => {
  if (event.defaultPrevented || event.repeat || event.altKey || event.ctrlKey || event.metaKey ||
      !/^[123]$/.test(event.key) || event.target.closest("input, textarea, select, [contenteditable]")) return;
  const button = byId("choices").children[Number(event.key) - 1];
  if (button) {
    event.preventDefault();
    button.click();
  }
});

setCalm();
setTextSize(0);
render();
</script>
