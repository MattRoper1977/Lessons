<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 220" role="img" aria-label="Two teaching pictures. A: “I think… because…”. B: “Just because.”."><rect width="820" height="220" fill="#fff"></rect><g transform="translate(90,5)"><path d="M25 25 H175 V100 H90 L70 125 V100 H25Z" fill="none" stroke="#172033" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" ></path><text x="100" y="58" font-family="Arial" font-size="22" font-weight="700" fill="#172033" text-anchor="middle">I think…</text><text x="100" y="86" font-family="Arial" font-size="22" font-weight="700" fill="#172033" text-anchor="middle">because…</text></g><g transform="translate(535,5)"><path d="M25 25 H175 V100 H90 L70 125 V100 H25Z" fill="none" stroke="#172033" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" ></path><text x="100" y="70" font-family="Arial" font-size="19" font-weight="700" fill="#172033" text-anchor="middle">Just because.</text></g><g font-family="Arial" font-size="23" fill="#172033" text-anchor="middle"><text x="190" y="198">A · “I think… because…”</text><text x="635" y="198">B · “Just because.”</text></g></svg>