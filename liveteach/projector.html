<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live-Teach Projector Kit · Projector</title>
<style>
/* Dark-first: a projector in a lit classroom needs strong figure/ground.
   High-lumen (correction S5) swaps to a light palette for washed-out
   projectors; the page fill is painted on BOTH html and body — the estate's
   recorded gotcha is that the fill lives on <html>. */
html { background: #0b0f1d; }
html.highlumen { background: #f6f4ec; }
body {
  margin: 0; background: #0b0f1d; color: #e8e2d4; overflow: hidden;
  font-family: "Segoe UI", system-ui, sans-serif;
  min-height: 100vh;
}
body.highlumen { background: #f6f4ec; color: #1c2337; }
canvas#sim { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }

/* Overlays. Hidden state uses visibility, never opacity alone (R-E22). */
.overlay {
  position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
  background: rgba(10, 14, 30, .92); color: #e8e2d4;
  border: 3px solid #f2a24a; border-radius: 18px; padding: 28px 44px;
  text-align: center; z-index: 40; max-width: 80vw;
  visibility: hidden;
}
.overlay.show { visibility: visible; }
body.highlumen .overlay { background: rgba(255,255,255,.96); color: #1c2337; border-color: #b0731f; }
#timerOverlay .clock { font-size: 16vmin; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: .04em; }
#timerOverlay.done { border-color: #b9e6cd; }
#timerOverlay.done .clock { color: #b9e6cd; }
body.highlumen #timerOverlay.done .clock { color: #1e6e46; }
#hintOverlay .hint-text { font-size: 6vmin; font-weight: 700; line-height: 1.3; }
#hintOverlay .tag, #pollOverlay .tag, #timerOverlay .tag {
  font-size: 2.6vmin; letter-spacing: .2em; text-transform: uppercase; opacity: .85; margin-bottom: 1vmin;
}
#pollOverlay .opts { display: flex; gap: 3vmin; justify-content: center; margin-top: 2vmin; }
#pollOverlay .opt {
  border: 2px solid currentColor; border-radius: 12px; padding: 2vmin 3.4vmin;
  font-size: 5vmin; font-weight: 800;
}

/* Control strip: auto-hides in the flow of teaching, returns on pointer or
   keyboard focus. Every teaching action lives HERE too, so the projector view
   is complete with no HUD window (order LT-GO D1: single-window first-class). */
#strip {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 60;
  display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
  padding: 10px 12px; box-sizing: border-box;
  background: rgba(8, 11, 24, .92); border-top: 1px solid #2c3763;
  transition: transform .35s ease, visibility .35s;
}
body.highlumen #strip { background: rgba(255,255,255,.95); border-top-color: #c9c2ae; }
#strip.hidden { transform: translateY(110%); visibility: hidden; }
#strip.hidden:focus-within { transform: none; visibility: visible; }
#strip .grp { display: flex; gap: 6px; align-items: center; padding: 0 8px; border-right: 1px solid #2c3763; }
body.highlumen #strip .grp { border-right-color: #c9c2ae; }
#strip .grp:last-child { border-right: none; }
#strip button, #strip a.navback {
  min-width: 44px; min-height: 44px; border-radius: 10px; border: 1px solid #43518c;
  background: #16204a; color: #e8e2d4; font: inherit; font-size: 14px; font-weight: 600;
  padding: 6px 12px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
  text-decoration: none; box-sizing: border-box;
}
body.highlumen #strip button, body.highlumen #strip a.navback { background: #fffdf6; color: #1c2337; border-color: #8a7f5e; }
#strip button[aria-pressed="true"] { background: #f2a24a; color: #131313; border-color: #f2a24a; }
#strip button:focus-visible, #strip a.navback:focus-visible, #fsBtn:focus-visible { outline: 3px solid #b9e6cd; outline-offset: 2px; }
#strip .lbl { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; opacity: .7; margin-right: 4px; }
#hintInput { min-height: 44px; border-radius: 10px; border: 1px solid #43518c; background: #0d1430; color: inherit; font: inherit; padding: 6px 10px; width: 200px; }
body.highlumen #hintInput { background: #fff; border-color: #8a7f5e; }

#status { position: fixed; top: 10px; right: 12px; z-index: 55; font-size: 13px; opacity: .75; text-align: right; }
#status .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #566; margin-right: 6px; }
#status.linked .dot { background: #b9e6cd; }
#status .word { letter-spacing: .06em; }

@media print { #strip, #status, #fsBtn { display: none; } }

/* The canonical splash ships its skip button a whisker under the estate's
   44px floor; this override lives OUTSIDE the pinned region so the canonical
   bytes stay verbatim. */
.mbm-skip { min-height: 44px; min-width: 44px; }

/* Stage engine (LT3). The banner is safe-DOM-built from manifest text (G6);
   labels are DOM elements at normalised positions (G3), so screen readers get
   real text, not canvas paint. */
#stageBanner {
  position: fixed; top: 0; left: 0; right: 0; z-index: 45;
  padding: 12px 20px; background: rgba(8, 11, 24, .9);
  border-bottom: 1px solid #2c3763; visibility: hidden;
}
#stageBanner.show { visibility: visible; }
body.highlumen #stageBanner { background: rgba(255,255,255,.95); border-bottom-color: #c9c2ae; }
#stageBanner .st-title { font-size: 3.4vmin; font-weight: 800; }
#stageBanner .st-copy { font-size: 2.3vmin; opacity: .92; max-width: 72ch; line-height: 1.4; }
#stageLabels { position: fixed; inset: 0; z-index: 42; pointer-events: none; }
#stageLabels .lbl {
  position: absolute; transform: translate(-50%, -50%);
  background: rgba(8, 11, 24, .88); border: 2px solid #b9e6cd; color: #e8e2d4;
  border-radius: 10px; padding: 6px 12px; font-size: 2.3vmin; font-weight: 700;
  max-width: min(40ch, 88vw);
}
body.highlumen #stageLabels .lbl { background: rgba(255,255,255,.94); border-color: #1e6e46; color: #1c2337; }
#playChip {
  position: fixed; top: 44px; right: 12px; z-index: 55;
  background: #f2a24a; color: #131313; font-weight: 800;
  border-radius: 999px; padding: 8px 14px; visibility: hidden;
}
#playChip.show { visibility: visible; }
#manifestError {
  position: fixed; top: 30%; left: 50%; transform: translateX(-50%); z-index: 70;
  background: #5b1f24; color: #ffdfe2; border: 2px solid #ff9aa2;
  border-radius: 12px; padding: 16px 22px; visibility: hidden; max-width: 80vw; text-align: center;
  pointer-events: none; /* informs, never intercepts a lesson's taps */
}
#manifestError.show { visibility: visible; }
#stageReadout { font-size: 13px; opacity: .85; min-width: 52px; text-align: center; }
#strip button:disabled { opacity: .4; cursor: default; }

/* Telestrator ink layer (LT5): above the sim, banner and labels so the
   teacher can annotate anything; below status, blackout and the strip. It
   only accepts the pointer while draw mode is on. */
#teleCanvas { position: fixed; inset: 0; z-index: 50; pointer-events: none; }
body.teleActive #teleCanvas { pointer-events: auto; cursor: crosshair; touch-action: none; }
#strip button.swatch { min-width: 44px; }
#strip button.swatch .dotc { display: inline-block; width: 14px; height: 14px; border-radius: 50%; margin-right: 6px; border: 1px solid #0008; vertical-align: -2px; }

/* Blackout curtain (LT4): sits over every teaching surface but UNDER the
   control strip, so the way back out stays reachable by pointer and key. */
#blackout {
  position: fixed; inset: 0; z-index: 58; background: #000;
  visibility: hidden; display: flex; align-items: center; justify-content: center;
}
#blackout.show { visibility: visible; }
#blackout .hintline { color: #333; font-size: 14px; letter-spacing: .1em; }
#toast {
  position: fixed; bottom: 88px; left: 50%; transform: translateX(-50%); z-index: 72;
  background: #16204a; color: #e8e2d4; border: 1px solid #43518c; border-radius: 12px;
  padding: 12px 18px; max-width: 80vw; text-align: center;
  /* A live region hidden with visibility never announces (the same rule the
     timer region documents above) — so the toast hides by opacity and stays
     in the accessibility tree, with pointer-events off so the invisible box
     never eats a tap. */
  opacity: 0; pointer-events: none;
}
body.highlumen #toast { background: #fffdf6; color: #1c2337; border-color: #8a7f5e; }
#toast.show { opacity: 1; }

/* Reduced motion, both halves of the house rule. The blanket form (no
   enumerated class list to rot): every part stays visible, every label on —
   only the motion goes. body.reduce is set by the JS half (OS setting, live
   change subscription, OR the Calm choice) — so the keep-the-strip rule below
   is written against body.reduce AND the media query, or Calm alone would
   still auto-hide the very button that turned it on. */
body.reduce *, body.reduce *::before, body.reduce *::after {
  animation-duration: .01ms !important; animation-iteration-count: 1 !important;
  transition-duration: .01ms !important;
}
body.reduce #strip.hidden { transform: none; visibility: visible; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important; animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
  }
  #strip.hidden { transform: none; visibility: visible; }
}
</style>
</head>
<body>
<canvas id="sim" aria-hidden="true"></canvas>
<canvas id="teleCanvas" aria-hidden="true"></canvas>

<div id="status" aria-hidden="true"><span class="dot"></span><span class="word">solo</span></div>

<section id="timerOverlay" class="overlay" role="timer" aria-label="Class timer">
  <div class="tag">⏱ Timer</div>
  <div class="clock">0:00</div>
</section>
<!-- The live region lives OUTSIDE the visibility-hidden overlay (a subtree
     under visibility:hidden is out of the accessibility tree, so announcements
     from inside it never fire) and hides by clipping, never visibility. -->
<div id="timerSaid" aria-live="polite" style="position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap"></div>
<div id="stageSaid" aria-live="polite" style="position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap"></div>

<nav id="strip" class="" aria-label="Teaching controls">
  <div class="grp">
    <a class="navback mbmhome" href="../index.html" aria-label="Back to the Lessons catalogue">← Lessons</a>
  </div>
  <div class="grp" aria-label="Simulation">
    <span class="lbl">Sim</span>
    <button id="btnPause" aria-pressed="false">⏸ Pause</button>
    <button id="btnStop">⏹ Stop</button>
    <button class="spd" data-spd="0.5" aria-pressed="false">½×</button>
    <button class="spd" data-spd="1" aria-pressed="true">1×</button>
    <button class="spd" data-spd="2" aria-pressed="false">2×</button>
  </div>
  <div class="grp" aria-label="Lesson stages">
    <span class="lbl">Stage</span>
    <button id="btnPrev" aria-label="Previous stage">◀</button>
    <span id="stageReadout">–/–</span>
    <button id="btnNext" aria-label="Next stage">▶</button>
  </div>
  <div class="grp" aria-label="Timers">
    <span class="lbl">Timer</span>
    <button class="tmr" data-min="1">1 min</button>
    <button class="tmr" data-min="3">3 min</button>
    <button class="tmr" data-min="5">5 min</button>
  </div>
  <div class="grp" aria-label="Overlays">
    <input id="hintInput" type="text" placeholder="Hint text…" aria-label="Hint text">
    <button id="btnHint" aria-pressed="false">💡 Hint</button>
    <button id="btnPoll" aria-pressed="false">🙋 Poll</button>
    <button id="btnClear">✖ Clear</button>
  </div>
  <div class="grp" aria-label="Telestrator">
    <span class="lbl">Ink</span>
    <button id="btnDraw" aria-pressed="false">🖊 Draw</button>
    <button id="btnInkClear">🧽 Clear ink</button>
    <button class="swatch" data-ink="#f2a24a" aria-pressed="true"><span class="dotc" style="background:#f2a24a"></span>Amber</button>
    <button class="swatch" data-ink="#b9e6cd" aria-pressed="false"><span class="dotc" style="background:#b9e6cd"></span>Mint</button>
    <button class="swatch" data-ink="#7fb8ff" aria-pressed="false"><span class="dotc" style="background:#7fb8ff"></span>Sky</button>
    <button class="wid" data-wid="0.006" aria-pressed="true">Thin</button>
    <button class="wid" data-wid="0.014" aria-pressed="false">Thick</button>
  </div>
  <div class="grp" aria-label="Display">
    <button id="btnLumen" aria-pressed="false">☀ High lumen</button>
    <button id="btnCalm" aria-pressed="false">🌙 Calm</button>
    <button id="btnBlackout" aria-pressed="false">✖ Blackout</button>
    <button id="fsBtn">⛶ Fullscreen</button>
  </div>
</nav>

     One key, JSON, display preferences only. Pupil data NEVER enters storage
     from liveteach (order LT-GO D2: rosters live in memory for the lesson and

  }

     A washed-out classroom projector loses dark themes; highlumen swaps to a

<script>
/* Init immediately after the module it initialises, never above it, never in
   a bare catch — the estate's TDZ rule, three times bitten. */
LT.boot();

(function () {
  'use strict';

  /* ---------- state: the projector is the single source of truth ----------
     Everything the HUD shows comes from PROJECTOR_STATE broadcasts — the HUD
     holds no independent counters (spec G2 groundwork). */
  var state = {
    stage: 0, stageCount: 0, stageTitle: '', mode: 'field',
    running: true, speed: 1,
    blackout: false,                   // curtain lands in LT4
    hint: { on: false, text: '' },
    poll: { on: false },
    telestrator: false,                // lands in LT5
    timer: null,                       // {remaining, total} while active
    aspect: 16 / 9
  };
  function broadcast() {
    state.aspect = innerWidth / Math.max(1, innerHeight);
    LT.send('PROJECTOR_STATE', JSON.parse(JSON.stringify(state)));
  }

  /* ---------- particle wave sim (corrections S1–S5) ---------- */
  var canvas = document.getElementById('sim');
  var ctx = canvas.getContext('2d');
  var PARTICLE_CAP = 150;              // S1: hard cap; pulses recycle the oldest
  var PAIR_BUDGET = 400;               // S1: connection lines drawn per frame, at most
  var CELL = 90;                       // spatial grid cell for the connection pass
  var parts = [];
  var born = 0;

  function sizeCanvas() {
    var dpr = Math.min(2, window.devicePixelRatio || 1);
    canvas.width = Math.round(innerWidth * dpr);
    canvas.height = Math.round(innerHeight * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', function () { sizeCanvas(); draw(); broadcast(); });
  sizeCanvas();

  function spawn(x, y) {
    /* S4: velocity is stored UNSCALED — simSpeed multiplies in update() only,
       never at construction, so changing speed never bakes into particles. */
    var a = Math.random() * Math.PI * 2;
    var p = { x: x, y: y, vx: Math.cos(a) * 40, vy: Math.sin(a) * 40, age: 0, id: born++ };
    if (parts.length >= PARTICLE_CAP) parts.shift();  // recycle the oldest
    parts.push(p);
  }
  function pulse(x, y) { for (var i = 0; i < 12; i++) spawn(x, y); }
  canvas.addEventListener('pointerdown', function (e) {
    pulse(e.clientX, e.clientY);
    /* Under Calm/reduced motion or pause the loop skips draw(), so a tap
       would otherwise be invisible — one repaint is content, not motion. */
    if (LT.reduced() || !state.running) draw();
  });

  function seed() {
    parts.length = 0;
    for (var i = 0; i < 60; i++) spawn(Math.random() * innerWidth, Math.random() * innerHeight);
  }
  seed();
  /* First frame is painted unconditionally (draw is a hoisted declaration):
     under reduced motion the loop skips draw(), and a never-painted canvas
     would lose the CONTENT, not just the motion — the house rule's exact
     failure. */
  draw();

  function update(dt) {
    /* S4: the one and only speed application. The wave takes dt UNCLAMPED
       (capped at 1 s only against tab-restore phase jumps) — clamping it to
       50 ms silently slowed the clock under load and made "f is real hertz"
       untrue. The decorative field keeps the 50 ms integration clamp. */
    if (state.mode === 'wave') { wave.t += Math.min(1, dt) * state.speed; return; }
    var k = Math.min(.05, dt) * state.speed;
    for (var i = 0; i < parts.length; i++) {
      var p = parts[i];
      p.x += p.vx * k; p.y += p.vy * k; p.age += k;
      if (p.x < 0 || p.x > innerWidth) p.vx *= -1;
      if (p.y < 0 || p.y > innerHeight) p.vy *= -1;
      p.x = Math.max(0, Math.min(innerWidth, p.x));
      p.y = Math.max(0, Math.min(innerHeight, p.y));
    }
  }

  function draw() {
    if (state.mode === 'wave') drawWave();
    else drawField();
    drawSpotlight(); // G1: dimming happens OVER the sim, never through it
    /* The units apparatus (scale bar, caption, wavelength bracket) paints
       AFTER the veil: the measurement a pupil reads must never be dimmed. */
    if (state.mode === 'wave') drawScale();
  }
  function drawField() {
    var lumen = LT.highlumen();
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    /* S5: figure/ground holds on a washed-out projector — line and dot
       colours are picked per theme, never low-alpha-on-dark alone. */
    var dot = lumen ? '#1c2337' : '#e8e2d4';
    var line = lumen ? 'rgba(28,35,55,.45)' : 'rgba(232,226,212,.35)';
    // connection pass: spatial grid + hard pair budget (S1 — never O(n²) free-run)
    var grid = new Map();
    for (var i = 0; i < parts.length; i++) {
      var p = parts[i];
      var key = ((p.x / CELL) | 0) + ':' + ((p.y / CELL) | 0);
      if (!grid.has(key)) grid.set(key, []);
      grid.get(key).push(p);
    }
    var drawn = 0;
    ctx.strokeStyle = line; ctx.lineWidth = 1;
    ctx.beginPath();
    outer:
    for (var gi = 0; gi < parts.length; gi++) {
      var a = parts[gi];
      var cx = (a.x / CELL) | 0, cy = (a.y / CELL) | 0;
      for (var ox = -1; ox <= 1; ox++) for (var oy = -1; oy <= 1; oy++) {
        var cell = grid.get((cx + ox) + ':' + (cy + oy));
        if (!cell) continue;
        for (var ci = 0; ci < cell.length; ci++) {
          var b = cell[ci];
          if (b.id <= a.id) continue;
          var dx = a.x - b.x, dy = a.y - b.y;
          if (dx * dx + dy * dy < CELL * CELL) {
            ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);
            if (++drawn >= PAIR_BUDGET) break outer;
          }
        }
      }
    }
    ctx.stroke();
    ctx.fillStyle = dot;
    for (var di = 0; di < parts.length; di++) {
      var d = parts[di];
      ctx.beginPath(); ctx.arc(d.x, d.y, 2.5, 0, Math.PI * 2); ctx.fill();
    }
  }

  /* ---------- wave renderer (LT3, honest units per W2) -------------------
     The animation clock is real seconds, so f is real hertz; lengths map to
     metres through PX_PER_M, and the scale bar states that mapping on screen.
     Pixels are never labelled as physical units. */
  var wave = { f: 1, lambda: 2, A: 0.6, t: 0 };
  var PX_PER_M = 100;
  function drawWave() {
    var lumen = LT.highlumen();
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    var stroke = lumen ? '#1c2337' : '#e8e2d4';
    var accent = lumen ? '#b0731f' : '#f2a24a';
    var midY = innerHeight * 0.55;
    var Apx = wave.A * PX_PER_M;
    var Lpx = wave.lambda * PX_PER_M;
    ctx.strokeStyle = stroke; ctx.lineWidth = 4;
    ctx.beginPath();
    for (var x = 0; x <= innerWidth; x += 4) {
      var y = midY - Apx * Math.sin(2 * Math.PI * (x / Lpx - wave.f * wave.t));
      if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
    // the medium's own particles, riding the wave — energy travels, they don't
    ctx.fillStyle = accent;
    for (var mx = 20; mx < innerWidth; mx += 60) {
      var my = midY - Apx * Math.sin(2 * Math.PI * (mx / Lpx - wave.f * wave.t));
      ctx.beginPath(); ctx.arc(mx, my, 6, 0, Math.PI * 2); ctx.fill();
    }
  }
  function drawScale() {
    /* Painted after the spotlight veil, clear of the control strip, so the
       measurement apparatus is never dimmed and never covered. */
    var lumen = LT.highlumen();
    var stroke = lumen ? '#1c2337' : '#e8e2d4';
    var midY = innerHeight * 0.55;
    var Apx = wave.A * PX_PER_M;
    var Lpx = wave.lambda * PX_PER_M;
    // the honest scale bar: PX_PER_M pixels IS one metre on this screen
    var bx = 24, by = innerHeight - 150;
    ctx.strokeStyle = stroke; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(bx + PX_PER_M, by); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(bx, by - 8); ctx.lineTo(bx, by + 8); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(bx + PX_PER_M, by - 8); ctx.lineTo(bx + PX_PER_M, by + 8); ctx.stroke();
    ctx.fillStyle = stroke; ctx.font = '600 16px system-ui, sans-serif';
    ctx.fillText('1 m', bx + PX_PER_M / 2 - 12, by - 14);
    ctx.fillText('f = ' + wave.f + ' Hz · λ = ' + wave.lambda + ' m', bx, by + 30);
    /* The wavelength bracket lives in WAVE space — two ticks exactly Lpx
       apart, anchored to a real crest — so the labelled span IS one
       wavelength at every viewport. (A viewport-relative DOM label claiming a
       physical length was the review's blocking find: at 1280 px wide it
       captioned 2.88 wavelengths as "one".) */
    if (curStage && curStage.showBracket) {
      var frac = (0.25 + wave.f * wave.t) % 1;
      if (frac < 0) frac += 1;
      var xc = frac * Lpx;
      while (xc < 40) xc += Lpx;
      if (xc + Lpx < innerWidth - 20) {
        var byr = midY - Apx - 26;
        ctx.strokeStyle = stroke; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(xc, byr); ctx.lineTo(xc + Lpx, byr); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(xc, byr - 8); ctx.lineTo(xc, byr + 8); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(xc + Lpx, byr - 8); ctx.lineTo(xc + Lpx, byr + 8); ctx.stroke();
        ctx.fillStyle = stroke;
        ctx.fillText('λ = ' + wave.lambda + ' m', xc + Lpx / 2 - 30, byr - 12);
      }
    }
  }
  function drawSpotlight() {
    var sp = curStage && curStage.spotlight;
    if (!sp) return;
    /* G1: dim everything EXCEPT the region of interest with a single evenodd
       fill — outer rect plus inner ROI, one path. The reviewed fragment's
       destination-out deleted the very pixels being highlighted; this paints
       shadow AROUND them and touches nothing beneath. Coordinates arrive
       normalised 0–1 (G3) and scale here at draw time. */
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, 0, innerWidth, innerHeight);
    ctx.rect(sp.x * innerWidth, sp.y * innerHeight, sp.w * innerWidth, sp.h * innerHeight);
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fill('evenodd');
    ctx.restore();
  }

  /* ---------- stage engine (LT3: G1–G7) ---------- */
  var manifest = null;
  var curStage = null;
  var banner = document.getElementById('stageBanner');
  var labelsBox = document.getElementById('stageLabels');
  var chip = document.getElementById('playChip');
  var errBox = document.getElementById('manifestError');
  var btnPrev = document.getElementById('btnPrev');
  var btnNext = document.getElementById('btnNext');
  var readout = document.getElementById('stageReadout');

  function updateChip() {
    /* Honest copy under playback speed: the manifest's f is the MODEL value;
       whenever the wave is played at ≠1×, the chip says so on screen. */
    chip.textContent = 'playback ×' + state.speed;
    chip.classList.toggle('show', state.mode === 'wave' && state.speed !== 1);
  }
  function syncStageButtons() {
    btnPrev.disabled = !manifest || state.stage <= 0;
    btnNext.disabled = !manifest || state.stage >= state.stageCount - 1;
    readout.textContent = manifest ? (state.stage + 1) + '/' + state.stageCount : '–/–';
  }
  function applyStage(i) {
    if (!manifest) return;
    /* G2: clamp first, so Next at the last stage is a no-op immediately on
       both sides — no unbounded counter exists anywhere. */
    state.stage = Math.max(0, Math.min(state.stageCount - 1, i));
    curStage = manifest.stages[state.stage];
    state.stageTitle = curStage.title;
    state.mode = curStage.mode === 'wave' ? 'wave' : 'field';
    if (state.mode === 'wave') {
      wave.f = curStage.params.f;
      wave.lambda = curStage.params.lambda;
      wave.A = curStage.params.A;
    }
    /* G6: banner and labels are DOM-built from manifest text with
       createElement/textContent only — manifests are authored per-lesson data
       and must never reach innerHTML. */
    banner.querySelector('.st-title').textContent = curStage.title;
    banner.querySelector('.st-copy').textContent = curStage.copy || '';
    banner.classList.add('show');
    while (labelsBox.firstChild) labelsBox.removeChild(labelsBox.firstChild);
    (curStage.labels || []).forEach(function (l) {
      var d = document.createElement('div');
      d.className = 'lbl';
      d.textContent = l.text;
      d.style.left = (l.x * 100) + '%';
      d.style.top = (l.y * 100) + '%';
      labelsBox.appendChild(d);
    });
    /* Concise stage announcement for keyboard/screen-reader users — the
       banner itself stays aria-live=off so multi-sentence copy is not
       re-read; this one line is. */
    document.getElementById('stageSaid').textContent = 'Stage ' + (state.stage + 1) + ' of ' + state.stageCount + ': ' + curStage.title;
    updateChip();
    syncStageButtons();
    draw();
    broadcast();
  }
  function validManifest(m) {
    if (!m || !Array.isArray(m.stages) || !m.stages.length) return false;
    return m.stages.every(function (s) {
      if (!s || typeof s !== 'object') return false;
      if (s.mode === 'wave') {
        if (!s.params) return false;
        return ['f', 'lambda', 'A'].every(function (k) {
          var v = s.params[k];
          return typeof v === 'number' && isFinite(v) && v > 0;
        });
      }
      return true;
    });
  }
  function initStages(m) {
    if (!validManifest(m)) { showManifestError(lessonId, 'broken'); return; }
    m.stages.forEach(function (s) { if (typeof s.title !== 'string') s.title = ''; });
    manifest = m;
    PX_PER_M = (m.units && m.units.px_per_m) || 100;
    state.stageCount = m.stages.length;
    applyStage(0);
  }
  function showManifestError(which, kind) {
    /* A failed load is a VISIBLE error, never a silent catch — the estate's
       swallowed-init lesson, generalised. Two honest messages: a file that
       never arrived points at the address bar; a file that arrived broken
       points at the manifest itself. The projector still teaches (field
       mode, timers, hint, poll); only the stages are absent. */
    errBox.textContent = kind === 'broken'
      ? 'The lesson file manifests/' + which + '.js loaded but is empty or broken — fix the manifest. Timers, hint and poll still work; stages are off.'
      : 'Lesson "' + which + '" could not be loaded — check the ?lesson= name in the address bar. Timers, hint and poll still work; stages are off.';
    errBox.classList.add('show');
    syncStageButtons();
    broadcast();
  }
  btnPrev.addEventListener('click', function () { applyStage(state.stage - 1); });
  btnNext.addEventListener('click', function () { applyStage(state.stage + 1); });
  syncStageButtons();

  /* ---------- the one animation loop (G4: overlays draw inside it too) ----
     Under reduced motion the sim holds its last frame — content stays
     visible, only the motion goes. Frames are counted as harness evidence. */
  var frames = 0;
  var last = performance.now();
  function loop(now) {
    var dt = (now - last) / 1000;   // raw; update() clamps per mode
    last = now;
    if (state.running && !LT.reduced()) {
      update(dt);
      draw();
      frames++;
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
  LT.onMotion.push(function () { draw(); });  // repaint the static frame on toggle

  /* ---------- sim controls (S2: Pause/Resume and Stop are different verbs) */
  var btnPause = document.getElementById('btnPause');
  function setRunning(on) {
    state.running = !!on;
    btnPause.setAttribute('aria-pressed', String(!state.running));
    btnPause.textContent = state.running ? '⏸ Pause' : '▶ Resume';
    broadcast();
  }
  function stopSim() { setRunning(false); seed(); draw(); broadcast(); }
  function setSpeed(v) {
    state.speed = v;
    /* S3: the buttons follow the state, and the state travels in
       PROJECTOR_STATE so a HUD shows the same highlight. */
    document.querySelectorAll('#strip .spd').forEach(function (b) {
      b.setAttribute('aria-pressed', String(Number(b.dataset.spd) === v));
    });
    updateChip();
    broadcast();
  }
  btnPause.addEventListener('click', function () { setRunning(!state.running); });
  document.getElementById('btnStop').addEventListener('click', stopSim);
  document.querySelectorAll('#strip .spd').forEach(function (b) {
    b.addEventListener('click', function () { setSpeed(Number(b.dataset.spd)); });
  });

  /* ---------- timer (no aria-live on the ticking clock — announcements at
     start and end only, the estate's named wrong-fix) ---------- */
  var timerBox = document.getElementById('timerOverlay');
  var timerClock = timerBox.querySelector('.clock');
  var timerSaid = document.getElementById('timerSaid');
  var timerInt = null;
  function fmt(s) { return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
  function startTimer(mins) {
    clearInterval(timerInt);
    var total = mins * 60;
    state.timer = { remaining: total, total: total };
    timerBox.classList.remove('done');
    timerBox.classList.add('show');
    timerClock.textContent = fmt(total);
    timerSaid.textContent = mins + ' minute timer started';
    broadcast();
    timerInt = setInterval(function () {
      if (!state.timer) return;
      state.timer.remaining--;
      timerClock.textContent = fmt(Math.max(0, state.timer.remaining));
      if (state.timer.remaining <= 0) {
        clearInterval(timerInt); timerInt = null;
        timerBox.classList.add('done');
        timerClock.textContent = '0:00';
        timerSaid.textContent = 'Timer finished';
        state.timer = null;
      }
      broadcast();
    }, 1000);
  }
  function clearTimer() {
    clearInterval(timerInt); timerInt = null;
    state.timer = null;
    timerBox.classList.remove('show', 'done');
    broadcast();
  }
  document.querySelectorAll('#strip .tmr').forEach(function (b) {
    b.addEventListener('click', function () { startTimer(Number(b.dataset.min)); });
  });

  /* ---------- hint & poll (H/P state lives HERE, never read back from DOM
     copies — the spec's toggle-state rule) ---------- */
  var hintBox = document.getElementById('hintOverlay');
  var hintText = hintBox.querySelector('.hint-text');
  var hintInput = document.getElementById('hintInput');
  var btnHint = document.getElementById('btnHint');
  var pollBox = document.getElementById('pollOverlay');
  var btnPoll = document.getElementById('btnPoll');
  function setHint(on, text) {
    state.hint.on = !!on;
    if (typeof text === 'string' && text.trim()) state.hint.text = text.trim();
    if (state.hint.text) hintText.textContent = state.hint.text;
    hintBox.classList.toggle('show', state.hint.on);
    btnHint.setAttribute('aria-pressed', String(state.hint.on));
    broadcast();
  }
  function setPoll(on) {
    state.poll.on = !!on;
    pollBox.classList.toggle('show', state.poll.on);
    btnPoll.setAttribute('aria-pressed', String(state.poll.on));
    broadcast();
  }
  function clearOverlays() { setHint(false); setPoll(false); clearTimer(); }
  btnHint.addEventListener('click', function () { setHint(!state.hint.on, hintInput.value); });
  btnPoll.addEventListener('click', function () { setPoll(!state.poll.on); });
  document.getElementById('btnClear').addEventListener('click', clearOverlays);

  /* ---------- display toggles ---------- */
  var btnLumen = document.getElementById('btnLumen');
  var btnCalm = document.getElementById('btnCalm');
  function syncDisplayButtons() {
    btnLumen.setAttribute('aria-pressed', String(LT.highlumen()));
    btnCalm.setAttribute('aria-pressed', String(LT.calm()));
  }
  btnLumen.addEventListener('click', function () { LT.setHighlumen(!LT.highlumen()); syncDisplayButtons(); draw(); });
  btnCalm.addEventListener('click', function () { LT.setCalm(!LT.calm()); syncDisplayButtons(); });
  syncDisplayButtons();

  /* ---------- control strip auto-hide ---------- */
  var strip = document.getElementById('strip');
  var hideT = null;
  function stripShow() {
    strip.classList.remove('hidden');
    clearTimeout(hideT);
    hideT = setTimeout(function () {
      if (!strip.contains(document.activeElement)) strip.classList.add('hidden');
    }, 4000);
  }
  ['pointermove', 'pointerdown', 'keydown'].forEach(function (ev) {
    window.addEventListener(ev, stripShow, { passive: true });
  });
  stripShow();

  /* ---------- keyboard (registry: one listener, collisions throw) -------- */
  LT.registerKey('Space', function (e) { e.preventDefault(); setRunning(!state.running); }, 'Sim pause / resume');
  LT.registerKey('Digit1', function () { startTimer(1); }, 'Timer 1 min');
  LT.registerKey('Digit2', function () { startTimer(3); }, 'Timer 3 min');
  LT.registerKey('Digit3', function () { startTimer(5); }, 'Timer 5 min');
  LT.registerKey('Digit0', function () { clearOverlays(); }, 'Clear all overlays');
  LT.registerKey('KeyH', function () { setHint(!state.hint.on); }, 'Hint toggle');
  LT.registerKey('KeyP', function () { setPoll(!state.poll.on); }, 'Poll toggle');
  /* ---------- blackout + toast + fullscreen (LT4: C1–C4) ---------- */
  var blackoutEl = document.getElementById('blackout');
  var btnBlackout = document.getElementById('btnBlackout');
  var toastEl = document.getElementById('toast');
  var toastT = null;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastT);
    /* Reading time scales with the message: never less than 6 s, plus
       ~400 ms a word for longer advice. */
    var hold = Math.max(6000, msg.split(/\s+/).length * 400 + 2000);
    toastT = setTimeout(function () { toastEl.classList.remove('show'); }, hold);
  }
  function setBlackout(on) {
    state.blackout = !!on;
    blackoutEl.classList.toggle('show', state.blackout);
    btnBlackout.setAttribute('aria-pressed', String(state.blackout));
    document.getElementById('blackoutSaid').textContent = state.blackout
      ? 'Screen blacked out — B, full stop or Escape restores it'
      : 'Screen restored';
    broadcast();
  }
  btnBlackout.addEventListener('click', function () { setBlackout(!state.blackout); });
  /* C2, the honest half that works: a REAL click on this view is a user
     gesture, so requestFullscreen is allowed here — and only here. A refusal
     (managed classroom Chrome can forbid it) gets an honest toast, never a
     silent unhandled rejection. */
  document.getElementById('fsBtn').addEventListener('click', function () {
    if (document.fullscreenElement) {
      document.exitFullscreen().catch(function () {});
    } else {
      document.documentElement.requestFullscreen().catch(function () {
        toast('Your browser refused fullscreen — press F11 instead.');
      });
    }
  });

  /* ---------- telestrator (LT5: T1–T5) ----------
     T2: local and remote strokes converge on ONE message type, TELE_STROKE.
     T3: every coordinate is normalised 0–1 at capture and scaled at draw;
         line width travels as a fraction of canvas height.
     T4: strokes are vectors replayed on resize — never a getImageData backup,
         which loses ink the moment the canvas grows. */
  var tele = {
    canvas: document.getElementById('teleCanvas'),
    strokes: [],
    STROKE_CAP: 200,           // oldest ink recycles — memory stays bounded
    color: '#f2a24a',
    width: 0.006,
    drawing: null
  };
  var tctx = tele.canvas.getContext('2d');
  function sizeTele() {
    var dpr = Math.min(2, window.devicePixelRatio || 1);
    tele.canvas.width = Math.round(innerWidth * dpr);
    tele.canvas.height = Math.round(innerHeight * dpr);
    tctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    teleReplay();
  }
  function drawStrokeOn(s) {
    if (!s.pts.length) return;
    if (s.pts.length < 2) {
      tctx.fillStyle = s.color;
      tctx.beginPath();
      tctx.arc(s.pts[0][0] * innerWidth, s.pts[0][1] * innerHeight, Math.max(1.5, s.width * innerHeight / 2), 0, Math.PI * 2);
      tctx.fill();
      return;
    }
    tctx.strokeStyle = s.color;
    tctx.lineWidth = Math.max(1.5, s.width * innerHeight);
    tctx.lineCap = 'round';
    tctx.lineJoin = 'round';
    tctx.beginPath();
    for (var i = 0; i < s.pts.length; i++) {
      var x = s.pts[i][0] * innerWidth, y = s.pts[i][1] * innerHeight;
      if (i === 0) tctx.moveTo(x, y); else tctx.lineTo(x, y);
    }
    tctx.stroke();
  }
  function teleReplay() {
    tctx.clearRect(0, 0, innerWidth, innerHeight);
    tele.strokes.forEach(drawStrokeOn);
  }
  function teleAdd(s) {
    if (tele.strokes.length >= tele.STROKE_CAP) tele.strokes.shift();
    tele.strokes.push(s);
    teleReplay();
  }
  /* Incoming strokes are external data: validate shape, clamp coordinates,
     ignore anything malformed silently (the bus contract's posture). */
  function saneStroke(p) {
    if (!p || !Array.isArray(p.pts) || !p.pts.length || p.pts.length > 2000) return null;
    if (typeof p.color !== 'string' || !/^#[0-9a-fA-F]{6}$/.test(p.color)) return null;
    var w = Number(p.width);
    if (!(w > 0.0005 && w < 0.06)) return null;
    var pts = [];
    for (var i = 0; i < p.pts.length; i++) {
      var x = Number(p.pts[i][0]), y = Number(p.pts[i][1]);
      if (!isFinite(x) || !isFinite(y)) return null;
      pts.push([Math.min(1, Math.max(0, x)), Math.min(1, Math.max(0, y))]);
    }
    return { pts: pts, color: p.color, width: w };
  }
  var savedRun = null;
  function setTele(on) {
    on = !!on;
    if (on === state.telestrator) { broadcast(); return; }
    state.telestrator = on;
    document.body.classList.toggle('teleActive', on);
    document.getElementById('btnDraw').setAttribute('aria-pressed', String(on));
    /* T5: draw mode freezes the sim so the ink annotates a still frame —
       controlled, reversible (the previous running state comes back on
       toggle-off), and synced (both flags ride PROJECTOR_STATE). */
    if (on) {
      savedRun = state.running;
      if (state.running) setRunning(false);
    } else if (savedRun !== null) {
      if (savedRun) setRunning(true);
      savedRun = null;
    }
    broadcast();
  }
  function teleClear(fromBus) {
    tele.strokes = [];
    teleReplay();
    if (!fromBus) LT.send('TELE_CLEAR', {});
  }
  tele.canvas.addEventListener('pointerdown', function (e) {
    if (!state.telestrator) return;
    tele.canvas.setPointerCapture(e.pointerId);
    tele.drawing = { pts: [[e.clientX / innerWidth, e.clientY / innerHeight]], color: tele.color, width: tele.width };
  });
  tele.canvas.addEventListener('pointermove', function (e) {
    if (!tele.drawing) return;
    tele.drawing.pts.push([e.clientX / innerWidth, e.clientY / innerHeight]);
    teleReplay();
    drawStrokeOn(tele.drawing);
  });
  function teleFinish() {
    if (!tele.drawing) return;
    teleAdd(tele.drawing);
    LT.send('TELE_STROKE', tele.drawing);
    tele.drawing = null;
  }
  tele.canvas.addEventListener('pointerup', teleFinish);
  tele.canvas.addEventListener('pointercancel', function () { tele.drawing = null; teleReplay(); });
  document.getElementById('btnDraw').addEventListener('click', function () { setTele(!state.telestrator); });
  document.getElementById('btnInkClear').addEventListener('click', function () { teleClear(false); });
  document.querySelectorAll('#strip .swatch').forEach(function (b) {
    b.addEventListener('click', function () {
      tele.color = b.dataset.ink;
      document.querySelectorAll('#strip .swatch').forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); });
    });
  });
