<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400"><rect width="640" height="400" fill="white"/><rect x="10" y="10" width="300" height="175" rx="12" fill="#F0CC76"/><text x="28" y="45" font-family="Liberation Sans,sans-serif" font-size="22" font-weight="700" fill="#17263B">1  Plan sections</text><text x="28" y="82" font-family="Liberation Sans,sans-serif" font-size="22" font-weight="400" fill="#17263B">Sort facts by topic.</text><rect x="330" y="10" width="300" height="175" rx="12" fill="#B0D8D1"/><text x="348" y="45" font-family="Liberation Sans,sans-serif" font-size="22" font-weight="700" fill="#17263B">2  Add headings</text><text x="348" y="82" font-family="Liberation Sans,sans-serif" font-size="22" font-weight="400" fill="#17263B">One title</text><text x="348" y="112" font-family="Liberation Sans,sans-serif" font-size="22" font-weight="400" fill="#17263B">Two main sections</text><rect x="10" y="210" width="300" height="175" rx="12" fill="#B0D8D1"/><text x="28" y="245" font-family="Liberation Sans,sans-serif" font-size="22" font-weight="700" fill="#17263B">3  Write paragraphs</text><text x="28" y="282" font-family="Liberation Sans,sans-serif" font-size="22" font-weight="400" fill="#17263B">One topic in each</text><text x="28" y="312" font-family="Liberation Sans,sans-serif" font-size="22" font-weight="400" fill="#17263B">Short, clear sentences</text><rect x="330" y="210" width="300" height="175" rx="12" fill="#F0CC76"/><text x="348" y="245" font-family="Liberation Sans,sans-serif" font-size="22" font-weight="700" fill="#17263B">4  Check and save</text><text x="348" y="282" font-family="Liberation Sans,sans-serif" font-size="22" font-weight="400" fill="#17263B">Test with a reader.</text><text x="348" y="312" font-family="Liberation Sans,sans-serif" font-size="22" font-weight="400" fill="#17263B">Reopen your file.</text></svg>