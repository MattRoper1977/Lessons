<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400"><rect width="640" height="400" fill="white"/><rect x="10" y="15" width="300" height="170" rx="12" fill="#F0CC76"/><text x="28" y="50" font-family="Liberation Sans,sans-serif" font-size="22" font-weight="700" fill="#17263B">Reader test</text><text x="28" y="87" font-family="Liberation Sans,sans-serif" font-size="22" font-weight="400" fill="#17263B">Find who can join.</text><text x="28" y="117" font-family="Liberation Sans,sans-serif" font-size="22" font-weight="400" fill="#17263B">What helped you?</text><rect x="330" y="15" width="300" height="170" rx="12" fill="#B0D8D1"/><text x="348" y="50" font-family="Liberation Sans,sans-serif" font-size="22" font-weight="700" fill="#17263B">Read it aloud</text><text x="348" y="87" font-family="Liberation Sans,sans-serif" font-size="22" font-weight="400" fill="#17263B">Does it make sense?</text><text x="348" y="117" font-family="Liberation Sans,sans-serif" font-size="22" font-weight="400" fill="#17263B">Check the source.</text><rect x="10" y="215" width="300" height="170" rx="12" fill="#B0D8D1"/><text x="28" y="250" font-family="Liberation Sans,sans-serif" font-size="22" font-weight="700" fill="#17263B">One useful change</text><text x="28" y="287" font-family="Liberation Sans,sans-serif" font-size="22" font-weight="400" fill="#17263B">Move a fact.</text><text x="28" y="317" font-family="Liberation Sans,sans-serif" font-size="22" font-weight="400" fill="#17263B">Fix a full stop.</text><rect x="330" y="215" width="300" height="170" rx="12" fill="#F0CC76"/><text x="348" y="250" font-family="Liberation Sans,sans-serif" font-size="22" font-weight="700" fill="#17263B">Final saved check</text><text x="348" y="287" font-family="Liberation Sans,sans-serif" font-size="22" font-weight="400" fill="#17263B">Save the file.</text><text x="348" y="317" font-family="Liberation Sans,sans-serif" font-size="22" font-weight="400" fill="#17263B">Reopen and read it.