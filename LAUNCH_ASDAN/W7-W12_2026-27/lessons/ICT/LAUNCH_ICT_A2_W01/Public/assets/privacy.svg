<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400"><rect width="640" height="400" fill="white"/><rect x="20" y="15" width="600" height="145" rx="12" fill="#F0CC76"/><text x="38" y="50" font-family="Liberation Sans,sans-serif" font-size="22" font-weight="700" fill="#17263B">A folder called Private</text><text x="38" y="87" font-family="Liberation Sans,sans-serif" font-size="22" font-weight="400" fill="#17263B">The name alone does not restrict access.</text><rect x="20" y="195" width="600" height="180" rx="12" fill="#B0D8D1"/><text x="38" y="230" font-family="Liberation Sans,sans-serif" font-size="22" font-weight="700" fill="#17263B">Check before you share</text><text x="38" y="267" font-family="Liberation Sans,sans-serif" font-size="22" font-weight="400" fill="#17263B">Who can open the file or link?</text><text x="38" y="297" font-family="Liberation Sans,sans-serif" font-size="22" font-weight="400" fill="#17263B">Ask staff to check the real settings.</text></svg>