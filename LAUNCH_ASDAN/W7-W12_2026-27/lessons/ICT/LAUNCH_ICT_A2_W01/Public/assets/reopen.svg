<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400"><rect width="640" height="400" fill="white"/><rect x="15" y="20" width="290" height="160" rx="12" fill="#F0CC76"/><text x="33" y="55" font-family="Liberation Sans,sans-serif" font-size="22" font-weight="700" fill="#17263B">1  Save and close</text><text x="33" y="92" font-family="Liberation Sans,sans-serif" font-size="22" font-weight="400" fill="#17263B">Keep your work.</text><rect x="335" y="20" width="290" height="160" rx="12" fill="#B0D8D1"/><text x="353" y="55" font-family="Liberation Sans,sans-serif" font-size="22" font-weight="700" fill="#17263B">2  Find the folder</text><text x="353" y="92" font-family="Liberation Sans,sans-serif" font-size="22" font-weight="400" fill="#17263B">Use the agreed place.</text><rect x="15" y="215" width="290" height="160" rx="12" fill="#B0D8D1"/><text x="33" y="250" font-family="Liberation Sans,sans-serif" font-size="22" font-weight="700" fill="#17263B">3  Open your file</text><text x="33" y="287" font-family="Liberation Sans,sans-serif" font-size="22" font-weight="400" fill="#17263B">Choose the right name.</text><rect x="335" y="215" width="290" height="160" rx="12" fill="#F0CC76"/><text x="353" y="250" font-family="Liberation Sans,sans-serif" font-size="22" font-weight="700" fill="#17263B">4  Check the text</text><text x="353" y="287" font-family="Liberation Sans,sans-serif" font-size="22" font-weight="400" fill="#17263B">Is your work there?</text></svg>