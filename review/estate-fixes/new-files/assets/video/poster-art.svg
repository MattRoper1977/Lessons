  <title id="title">Teesside Art Studio Suite video poster</title>
  <desc id="desc">Made by Matt branded poster for the sixty-second tour of the Teesside Art Studio Suite.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161d3d"/>
      <stop offset="1" stop-color="#232c55"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="55%">
      <stop offset="0" stop-color="#b9e6cd" stop-opacity=".28"/>
      <stop offset="1" stop-color="#b9e6cd" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="720" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="720" rx="28" fill="url(#glow)"/>
  <g opacity=".18" fill="none" stroke="#b9e6cd" stroke-width="3">
