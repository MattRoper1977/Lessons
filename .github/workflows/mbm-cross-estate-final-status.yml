name: MBM cross-estate final status capture

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out current Lessons main
        uses: actions/checkout@v4
        with:
          repository: MattRoper1977/Lessons
          ref: main
          path: sources/lessons
          fetch-depth: 1

      - name: Check out current Apps main
        uses: actions/checkout@v4
        with:
          repository: MattRoper1977/Matt-s-Apps-
          ref: main
          path: sources/apps
          fetch-depth: 1

      - name: Capture repository, workflow and served state
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p final-status
          python - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import subprocess
          import urllib.error
          import urllib.parse
          import urllib.request

          sentinel='mbm-cross-estate-unification-lessons-apps-2026-08-08'
          token=os.environ.get('GH_TOKEN','')
          repos={
            'lessons':{
              'repo':'MattRoper1977/Lessons',
              'root':pathlib.Path('sources/lessons'),
              'base':'https://madebymatt.uk/Lessons/',
              'manifest':'resources.json',
              'release_pr':95,
              'bootstrap_pr':99,
            },
            'apps':{
              'repo':'MattRoper1977/Matt-s-Apps-',
              'root':pathlib.Path('sources/apps'),
              'base':'https://madebymatt.uk/Matt-s-Apps-/',
              'manifest':'apps.json',
              'release_pr':5,
              'bootstrap_pr':8,
            },
          }

          def request(url, *, accept='application/vnd.github+json', no_cache=False, parse_json=True):
            headers={'Accept':accept,'User-Agent':'Made-by-Matt-final-status/1','X-GitHub-Api-Version':'2022-11-28'}
            if token and 'api.github.com' in url:
              headers['Authorization']=f'Bearer {token}'
            if no_cache:
              headers['Cache-Control']='no-cache, no-store, max-age=0'
              headers['Pragma']='no-cache'
            req=urllib.request.Request(url,headers=headers)
            try:
              with urllib.request.urlopen(req,timeout=45) as response:
                raw=response.read(); status=response.status; final=response.geturl(); response_headers=dict(response.headers.items())
            except urllib.error.HTTPError as exc:
              raw=exc.read(); status=exc.code; final=exc.geturl(); response_headers=dict(exc.headers.items())
            text=raw.decode('utf-8','replace')
            if parse_json:
              try: body=json.loads(text)
              except json.JSONDecodeError: body=text
            else:
              body=text
            return {'url':url,'final_url':final,'status':status,'headers':response_headers,'raw':raw,'body':body}

          def compact_run(run):
            return {k:run.get(k) for k in ['id','name','event','status','conclusion','head_sha','run_number','run_attempt','created_at','updated_at','html_url']}

          def compact_job(job):
            return {
              **{k:job.get(k) for k in ['id','name','status','conclusion','started_at','completed_at','html_url']},
              'steps':[{k:s.get(k) for k in ['name','status','conclusion','number']} for s in job.get('steps',[])],
            }

          result={'sentinel':sentinel,'repositories':{},'primary_routes':{}}
          for key,meta in repos.items():
            root=meta['root']
            sha=subprocess.check_output(['git','-C',str(root),'rev-parse','HEAD'],text=True).strip()
            browser=(root/'tools/verify_cross_estate_browser.mjs').read_text(encoding='utf-8')
            workflow=(root/'.github/workflows/mbm-cross-estate-unification.yml').read_text(encoding='utf-8')
            index=(root/'index.html').read_text(encoding='utf-8')
            manifest_path=root/meta['manifest']
            manifest=json.loads(manifest_path.read_text(encoding='utf-8'))
            state={
              'repo':meta['repo'],
              'main_sha':sha,
              'cache_safe_browser':all(marker in browser for marker in ['MBM_CACHE_BUST','prepareContext(context)','cacheBust,widths:[]']),
              'cache_safe_workflow':all(marker in workflow for marker in ['versioned="${base}?mbm=${GITHUB_SHA}"','${base}assets/$asset?mbm=${GITHUB_SHA}','MBM_CACHE_BUST="$GITHUB_SHA"']),
              'bootstrap_present':(root/'.github/workflows/mbm-cross-estate-cache-safe-finalize.yml').exists(),
              'hub_sentinel_in_source':sentinel in index,
              'source_count_markers':{'Thirty-one':'Thirty-one' in index,'Twenty-eight':'Twenty-eight' in index},
              'manifest_type':type(manifest).__name__,
              'manifest_items':len(manifest) if isinstance(manifest,list) else len(manifest.get('apps',manifest.get('resources',[]))) if isinstance(manifest,dict) else None,
              'local_hashes':{},
            }
            for rel in ['index.html',meta['manifest'],'assets/mbm-platform.css','assets/mbm-platform.js','assets/mbm-theme.js','assets/mbm-hub.css','tools/verify_cross_estate_browser.mjs','.github/workflows/mbm-cross-estate-unification.yml']:
              path=root/rel
              state['local_hashes'][rel]=hashlib.sha256(path.read_bytes()).hexdigest()

            api_base=f"https://api.github.com/repos/{meta['repo']}"
            runs_response=request(f'{api_base}/actions/runs?branch=main&per_page=50')
            runs=runs_response['body'].get('workflow_runs',[]) if isinstance(runs_response['body'],dict) else []
            relevant=[r for r in runs if r.get('name') in {'Finalise cache-safe Lessons production proof','Finalise cache-safe Apps production proof','Made by Matt cross-estate unification'}]
            state['actions_api_status']=runs_response['status']
            state['relevant_runs']=[]
            for run in relevant[:8]:
              item=compact_run(run)
              jobs_response=request(f"{api_base}/actions/runs/{run['id']}/jobs?per_page=100")
              jobs=jobs_response['body'].get('jobs',[]) if isinstance(jobs_response['body'],dict) else []
              item['jobs_api_status']=jobs_response['status']
              item['jobs']=[compact_job(job) for job in jobs]
              artifacts_response=request(f"{api_base}/actions/runs/{run['id']}/artifacts?per_page=100")
              artifacts=artifacts_response['body'].get('artifacts',[]) if isinstance(artifacts_response['body'],dict) else []
              item['artifacts_api_status']=artifacts_response['status']
              item['artifacts']=[{k:a.get(k) for k in ['id','name','size_in_bytes','expired','created_at','expires_at','archive_download_url']} for a in artifacts]
              state['relevant_runs'].append(item)

            for label,number in [('release_pr',meta['release_pr']),('bootstrap_pr',meta['bootstrap_pr'])]:
              pr_response=request(f'{api_base}/pulls/{number}')
              pr=pr_response['body'] if isinstance(pr_response['body'],dict) else {}
              comments_response=request(f'{api_base}/issues/{number}/comments?per_page=100')
              comments=comments_response['body'] if isinstance(comments_response['body'],list) else []
              state[label]={
                'api_status':pr_response['status'],
                'number':number,
                'state':pr.get('state'),
                'merged':pr.get('merged'),
                'merge_commit_sha':pr.get('merge_commit_sha'),
                'head_sha':(pr.get('head') or {}).get('sha'),
                'merged_at':pr.get('merged_at'),
                'html_url':pr.get('html_url'),
                'comments_api_status':comments_response['status'],
                'comments':[{
                  'id':c.get('id'),'created_at':c.get('created_at'),'updated_at':c.get('updated_at'),'html_url':c.get('html_url'),'body':c.get('body')
                } for c in comments],
              }

            base=meta['base']
            versioned=f"{base}?mbm={urllib.parse.quote(sha)}"
            for label,url in [('normal',base),('versioned',versioned)]:
              response=request(url,accept='text/html,*/*',no_cache=True,parse_json=False)
              body=response.pop('body'); raw=response.pop('raw')
              state[f'served_{label}']={
                **response,
                'bytes':len(raw),
                'sha256':hashlib.sha256(raw).hexdigest(),
                'sentinel':sentinel in body,
                'Thirty-one':'Thirty-one' in body,
                'Twenty-eight':'Twenty-eight' in body,
                'platform_css':'assets/mbm-platform.css' in body,
                'platform_js':'assets/mbm-platform.js' in body,
              }
            manifest_response=request(f"{base}{meta['manifest']}?mbm={urllib.parse.quote(sha)}",accept='application/json,*/*',no_cache=True,parse_json=False)
            manifest_raw=manifest_response.pop('raw'); manifest_text=manifest_response.pop('body')
            try:
              served_manifest=json.loads(manifest_text); manifest_valid=True
            except json.JSONDecodeError:
              served_manifest=None; manifest_valid=False
            state['served_manifest']={
              **manifest_response,
              'bytes':len(manifest_raw),
              'sha256':hashlib.sha256(manifest_raw).hexdigest(),
              'valid_json':manifest_valid,
              'matches_local':manifest_raw==manifest_path.read_bytes(),
              'items':len(served_manifest) if isinstance(served_manifest,list) else len(served_manifest.get('apps',served_manifest.get('resources',[]))) if isinstance(served_manifest,dict) else None,
            }
            state['served_assets']={}
            for asset in ['mbm-platform.css','mbm-platform.js','mbm-theme.js','mbm-hub.css']:
              response=request(f"{base}assets/{asset}?mbm={urllib.parse.quote(sha)}",accept='*/*',no_cache=True,parse_json=False)
              raw=response.pop('raw'); response.pop('body')
              local=(root/'assets'/asset).read_bytes()
              state['served_assets'][asset]={
                **response,
                'bytes':len(raw),
                'sha256':hashlib.sha256(raw).hexdigest(),
                'matches_local':raw==local,
              }
            result['repositories'][key]=state

          for route in ['','games/','Lessons/','Matt-s-Apps-/','tools/','resources/']:
            url='https://madebymatt.uk/'+route
            response=request(url,accept='text/html,*/*',no_cache=True,parse_json=False)
            raw=response.pop('raw'); response.pop('body')
            result['primary_routes'][url]={**response,'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest()}

          path=pathlib.Path('final-status/final-status.json')
          path.write_text(json.dumps(result,indent=2)+'\n',encoding='utf-8')
          print(path.read_text(encoding='utf-8'))
          PY

      - name: Upload final status evidence
        uses: actions/upload-artifact@v4
        with:
          name: mbm-cross-estate-final-status-${{ github.run_id }}
          path: final-status/
          if-no-files-found: error
          retention-days: 14
