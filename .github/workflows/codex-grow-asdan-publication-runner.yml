name: Run diagnostic-safe GROW publication

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/codex-grow-asdan-publication-runner.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out publication branch
        uses: actions/checkout@v4
        with:
          ref: codex/grow-asdan-interactions-motion
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install browser driver
        run: npm install --no-save puppeteer-core@24

      - name: Extract and run final publication script
        id: publication
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          git show 86b37b29932d808eb607e3571ec9d491e61a4f11:.github/workflows/codex-grow-asdan-final-publication.yml > /tmp/original-publication.yml
          python3 - <<'PY'
          from pathlib import Path

          source = Path('/tmp/original-publication.yml')
          lines = source.read_text(encoding='utf-8').splitlines()
          blocks = []
          index = 0
          while index < len(lines):
              if lines[index] == '        run: |':
                  index += 1
                  block = []
                  while index < len(lines) and (lines[index].startswith('          ') or not lines[index].strip()):
                      line = lines[index]
                      block.append(line[10:] if line.startswith('          ') else '')
                      index += 1
                  blocks.append('\n'.join(block) + '\n')
                  continue
              index += 1

          if len(blocks) != 1:
              raise SystemExit(f'Expected one publication shell block, found {len(blocks)}')

          script = blocks[0]
          old = 'rm -f .github/workflows/codex-grow-asdan-final-publication.yml\n'
          new = (
              'rm -f .github/workflows/codex-grow-asdan-final-publication.yml\n'
              'rm -f .github/workflows/codex-grow-asdan-publication-runner.yml\n'
              'rm -rf node_modules package-lock.json npm-shrinkwrap.json\n'
          )
          if old not in script:
              raise SystemExit('Self-removal signature not found in publication script')
          script = script.replace(old, new, 1)
          Path('/tmp/grow-publication.sh').write_text(script, encoding='utf-8')
          PY

          set +e
          bash /tmp/grow-publication.sh 2>&1 | tee /tmp/grow-publication.log
          code=${PIPESTATUS[0]}
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload publication diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grow-publication-log
          path: /tmp/grow-publication.log
          if-no-files-found: warn
          retention-days: 2

      - name: Enforce publication result
        if: steps.publication.outputs.exit_code != '0'
        run: |
          echo 'GROW ASDAN publication failed; see grow-publication-log artifact.' >&2
          exit 1
