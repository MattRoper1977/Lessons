name: PH-1 final executor dry run
on:
  push:
    branches: [pass-ph1-peq-hardening]
    paths:
      - '.github/workflows/ph1-final-dryrun.yml'
permissions:
  contents: write
jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install isolated jsdom gate dependency
        run: |
          set -euo pipefail
          rm -rf /tmp/ph1-node
          mkdir -p /tmp/ph1-node
          cd /tmp/ph1-node
          npm init -y >/dev/null
          npm install --no-audit --no-fund jsdom@26 >/dev/null
      - name: Execute against a local fake origin only
        shell: bash
        run: |
          set -euo pipefail
          BASE=ae1d3c7af2526781aad6fb82e7cbbf6b87ded380
          BRANCH=pass-ph1-peq-hardening
          rm -rf /tmp/ph1-fake-origin.git
          git init --bare /tmp/ph1-fake-origin.git >/dev/null
          git --git-dir=/tmp/ph1-fake-origin.git update-ref refs/heads/main "$BASE"
          git --git-dir=/tmp/ph1-fake-origin.git update-ref refs/heads/$BRANCH "$(git rev-parse HEAD)"
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path
          spec=importlib.util.spec_from_file_location('ph1','.github/ph1_final_executor.py')
          module=importlib.util.module_from_spec(spec); spec.loader.exec_module(module)
          original=module.repo_gate
          def checked_fake_gate():
              original()
              module.git('remote','set-url','origin','/tmp/ph1-fake-origin.git')
          module.repo_gate=checked_fake_gate
          module.TRANSPORTS.append(Path('.github/workflows/ph1-final-dryrun.yml'))
          module.main()
          PY
          git --git-dir=/tmp/ph1-fake-origin.git rev-parse refs/heads/$BRANCH > /tmp/ph1-dryrun-tip.txt
          git --git-dir=/tmp/ph1-fake-origin.git log --oneline --decorate -30 refs/heads/$BRANCH > /tmp/ph1-dryrun-log.txt
      - name: Preserve dry-run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ph1-final-dryrun-evidence
          path: |
            /tmp/ph1-dryrun-tip.txt
            /tmp/ph1-dryrun-log.txt
          if-no-files-found: warn
          retention-days: 2
