name: Finalize GROW ASDAN publication

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/codex-grow-asdan-finalize.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out publication branch
        uses: actions/checkout@v4
        with:
          ref: codex/grow-asdan-interactions-motion
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install browser driver
        run: npm install --no-save puppeteer-core@24

      - name: Re-run validated publisher with corrected staged-diff accounting
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          source = Path('.github/workflows/codex-grow-asdan-publish.yml')
          payload = source.read_text(encoding='utf-8')
          old = 'changed="$(git diff --name-only origin/main)"'
          new = 'changed="$(git diff --cached --name-only origin/main)"'
          if payload.count(old) != 1:
              raise SystemExit(f'Expected one final diff-accounting signature, found {payload.count(old)}')
          payload = payload.replace(old, new, 1)

          lines = payload.splitlines()
          blocks = []
          index = 0
          while index < len(lines):
              if lines[index] == '        run: |':
                  index += 1
                  block = []
                  while index < len(lines) and (lines[index].startswith('          ') or not lines[index].strip()):
                      line = lines[index]
                      block.append(line[10:] if line.startswith('          ') else '')
                      index += 1
                  blocks.append('\n'.join(block) + '\n')
                  continue
              index += 1

          if len(blocks) != 3:
              raise SystemExit(f'Expected three publisher shell blocks, found {len(blocks)}')

          Path('.github/workflows/codex-grow-asdan-finalize.yml').unlink()
          for block in blocks:
              subprocess.run(block, shell=True, executable='/bin/bash', check=True)
          PY
