name: Publish and validate GROW ASDAN upgrade

on:
  pull_request:
    branches: [main]
    paths:
      - 'GROW_ASDAN/**'
      - '.github/workflows/codex-grow-asdan-publish.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out publication branch
        uses: actions/checkout@v4
        with:
          ref: codex/grow-asdan-interactions-motion
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install browser driver
        run: npm install --no-save puppeteer-core@24

      - name: Apply shared layer and run static validation
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          python3 - <<'PY'
          from __future__ import annotations

          import re
          import subprocess
          import tempfile
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import unquote, urlsplit

          root = Path.cwd()
          suite = root / 'GROW_ASDAN'
          css_path = suite / 'visual-upgrade.css'
          js_path = suite / 'visual-upgrade.js'
          guide_path = suite / 'VISUAL_UPGRADE_GUIDE.md'

          for path in (css_path, js_path, guide_path):
              if not path.is_file():
                  raise SystemExit(f'Missing shared upgrade file: {path}')

          html_files = sorted(suite.rglob('*.html'))
          lesson_files = [path for path in html_files if path.parent != suite and path.name != 'START_HERE.html']
          if len(html_files) != 24:
              raise SystemExit(f'Expected 24 GROW ASDAN HTML entry points, found {len(html_files)}')
          if len(lesson_files) != 18:
              raise SystemExit(f'Expected 18 GROW ASDAN lesson pages, found {len(lesson_files)}')

          class RefCollector(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.refs: list[str] = []
              def handle_starttag(self, tag, attrs):
                  for name, value in attrs:
                      if name.lower() in {'href', 'src'} and value:
                          self.refs.append(value.strip())

          def missing_local_refs(path: Path, text: str) -> set[str]:
              parser = RefCollector()
              parser.feed(text)
              parser.close()
              missing: set[str] = set()
              for raw in parser.refs:
                  if not raw or raw.startswith(('#','data:','mailto:','tel:','javascript:','//')):
                      continue
                  split = urlsplit(raw)
                  if split.scheme or split.netloc:
                      continue
                  rel = unquote(split.path)
                  if not rel:
                      continue
                  candidate = root / rel.lstrip('/') if rel.startswith('/') else path.parent / rel
                  try:
                      candidate.resolve().relative_to(root.resolve())
                  except ValueError:
                      missing.add(raw)
                      continue
                  if not candidate.resolve().exists():
                      missing.add(raw)
              return missing

          originals: dict[Path, str] = {}
          pre_missing: dict[str, list[str]] = {}
          modified = 0

          for path in html_files:
              original = path.read_text(encoding='utf-8')
              originals[path] = original
              before_missing = missing_local_refs(path, original)
              if before_missing:
                  pre_missing[str(path.relative_to(root))] = sorted(before_missing)

              depth = len(path.relative_to(suite).parts) - 1
              prefix = '../' * depth
              css_ref = prefix + 'visual-upgrade.css'
              js_ref = prefix + 'visual-upgrade.js'

              if 'visual-upgrade.css' in original or 'visual-upgrade.js' in original:
                  if original.count(css_ref) == 1 and original.count(js_ref) == 1:
                      continue
                  raise SystemExit(f'Partial or incorrect shared references in {path}')

              linked, head_count = re.subn(
                  r'(?i)</head>',
                  f'<link rel="stylesheet" href="{css_ref}">\n</head>',
                  original,
                  count=1,
              )
              if head_count != 1:
                  raise SystemExit(f'Missing unique closing head tag in {path}')

              enhanced, body_count = re.subn(
                  r'(?i)</body>',
                  f'<script src="{js_ref}" defer></script>\n</body>',
                  linked,
                  count=1,
              )
              if body_count != 1:
                  raise SystemExit(f'Missing unique closing body tag in {path}')

              restored = enhanced.replace(f'<link rel="stylesheet" href="{css_ref}">\n', '', 1)
              restored = restored.replace(f'<script src="{js_ref}" defer></script>\n', '', 1)
              if restored != original:
                  raise SystemExit(f'Content round-trip changed in {path}')

              path.write_text(enhanced, encoding='utf-8')
              modified += 1

          if modified != 24:
              raise SystemExit(f'Expected to modify 24 HTML files, modified {modified}')

          print('PASS exact content round-trip: all 24 HTML entry points unchanged except shared asset tags')

          post_missing: dict[str, list[str]] = {}
          for path in html_files:
              current = path.read_text(encoding='utf-8')
              depth = len(path.relative_to(suite).parts) - 1
              prefix = '../' * depth
              if current.count(prefix + 'visual-upgrade.css') != 1:
                  raise SystemExit(f'Stylesheet coverage failed for {path}')
              if current.count(prefix + 'visual-upgrade.js') != 1:
                  raise SystemExit(f'Script coverage failed for {path}')
              after_missing = missing_local_refs(path, current)
              if after_missing:
                  post_missing[str(path.relative_to(root))] = sorted(after_missing)

          if post_missing != pre_missing:
              raise SystemExit(f'Local-reference set changed: before={pre_missing}, after={post_missing}')
          if pre_missing:
              print(f'PRE-EXISTING local references: {pre_missing}')
          else:
              print('PASS local asset resolution')

          subprocess.run(['node', '--check', str(js_path)], check=True)
          print('PASS node --check GROW_ASDAN/visual-upgrade.js')

          script_pattern = re.compile(r'(?is)<script\b([^>]*)>(.*?)</script>')
          type_pattern = re.compile(r'\btype\s*=\s*([\'\"])(.*?)\1', re.I)

          def inline_failures(mapping: dict[Path, str], label: str) -> set[str]:
              failures: set[str] = set()
              with tempfile.TemporaryDirectory() as td:
                  temp = Path(td)
                  for path, text in mapping.items():
                      for index, match in enumerate(script_pattern.finditer(text), start=1):
                          attrs, body = match.groups()
                          if re.search(r'\bsrc\s*=', attrs, re.I):
                              continue
                          type_match = type_pattern.search(attrs)
                          script_type = type_match.group(2).strip().lower() if type_match else ''
                          if script_type not in {'', 'text/javascript', 'application/javascript', 'module'}:
                              continue
                          suffix = '.mjs' if script_type == 'module' else '.js'
                          target = temp / f'{label}-{path.stem}-{index}{suffix}'
                          target.write_text(body, encoding='utf-8')
                          result = subprocess.run(['node','--check',str(target)], capture_output=True, text=True)
                          if result.returncode:
                              failures.add(f'{path.relative_to(root)}#script-{index}')
              return failures

          before_inline = inline_failures(originals, 'before')
          after_inline = inline_failures({path:path.read_text(encoding='utf-8') for path in html_files}, 'after')
          if before_inline != after_inline:
              raise SystemExit(f'Inline JavaScript syntax changed: before={before_inline}, after={after_inline}')
          if before_inline:
              print(f'PRE-EXISTING inline JavaScript failures: {sorted(before_inline)}')
          else:
              print('PASS inline JavaScript syntax across all 24 entry points')

          css = css_path.read_text(encoding='utf-8')
          stripped = re.sub(r'/\*.*?\*/', '', css, flags=re.S)
          stripped = re.sub(r'(["\'])(?:\\.|(?!\1).)*\1', '', stripped)
          depth = 0
          for char in stripped:
              if char == '{':
                  depth += 1
              elif char == '}':
                  depth -= 1
              if depth < 0:
                  raise SystemExit('Shared CSS closes before it opens')
          if depth:
              raise SystemExit(f'Unbalanced shared CSS braces: {depth}')

          shared_text = '\n'.join(path.read_text(encoding='utf-8') for path in (css_path, js_path, guide_path))
          hygiene = re.compile(r'<<<<<<<|=======|>>>>>>>|\bTODO\b|\bFIXME\b|\bdebugger\b|console\.log\s*\(', re.I)
          if hygiene.search(shared_text):
              raise SystemExit('Conflict, unfinished or debug artefact in shared files')

          required_js = [
              'attributeOldValue: true', 'wasActive !== isActive', 'grow-activity-bar',
              'grow-random-pick', 'grow-pair-trail', 'grow-diagram-replaying'
          ]
          js = js_path.read_text(encoding='utf-8')
          for marker in required_js:
              if marker not in js:
                  raise SystemExit(f'Missing shared interaction marker: {marker}')

          feature_checks = {
              'navigation': re.compile(r'nextSlide|prevSlide|class="controls"', re.I),
              'answer reveals': re.compile(r'show-ans|class="answer"|reveal', re.I),
              'timers': re.compile(r'timer-widget|auto-timer|startTimer', re.I),
              'presentation activities': re.compile(r'presTap\(|class="pres-card"', re.I),
              'matching activities': re.compile(r'selectKW\(|class="match-pill"', re.I),
          }
          for label, pattern in feature_checks.items():
              missing = [str(path.relative_to(root)) for path in lesson_files if not pattern.search(path.read_text(encoding='utf-8'))]
              if missing:
                  raise SystemExit(f'Existing {label} hook missing: {missing}')

          print('PASS shared CSS structure, lifecycle guard and interaction hooks')
          print('PASS existing navigation, answer, timer, presentation and matching hooks retained')
          PY

      - name: Run Chromium interaction and motion validation
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/grow-http.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT

          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const cp = require('child_process');
          const puppeteer = require('puppeteer-core');
          const delay = ms => new Promise(resolve => setTimeout(resolve, ms));

          const chrome = ['google-chrome','chromium','chromium-browser']
            .map(name => { try { return cp.execFileSync('bash',['-lc',`command -v ${name}`],{encoding:'utf8'}).trim(); } catch { return ''; } })
            .find(Boolean);
          if (!chrome) throw new Error('No Chrome/Chromium executable found');

          const walk = dir => fs.readdirSync(dir,{withFileTypes:true}).flatMap(entry => entry.isDirectory() ? walk(path.join(dir,entry.name)) : [path.join(dir,entry.name)]);
          const htmlFiles = walk('GROW_ASDAN').filter(file => file.endsWith('.html')).map(file => file.replaceAll('\\','/'));
          const lessonFiles = htmlFiles.filter(file => /GROW_ASDAN\/(PEQ|Community_Project|Enterprise)\/[^/]+\.html$/.test(file) && !file.endsWith('/START_HERE.html'));
          if (htmlFiles.length !== 24 || lessonFiles.length !== 18) throw new Error(`Bad census ${htmlFiles.length}/${lessonFiles.length}`);
          const representatives = ['PEQ','Community_Project','Enterprise'].map(folder => lessonFiles.find(file => file.includes(`/${folder}/`)));
          const urlFor = file => `http://127.0.0.1:4173/${encodeURI(file)}`;

          (async () => {
            const browser = await puppeteer.launch({
              executablePath: chrome,
              headless: true,
              protocolTimeout: 120000,
              args: ['--no-sandbox','--disable-dev-shm-usage']
            });
            const failures = [];

            for (const file of representatives) {
              const page = await browser.newPage();
              await page.setViewport({width:1280,height:800});
              const pageErrors = [];
              const failedResponses = [];
              page.on('pageerror', error => pageErrors.push(String(error)));
              page.on('response', response => {
                if (response.status() >= 400) failedResponses.push(`${response.status()} ${response.url()}`);
              });
              await page.goto(urlFor(file), {waitUntil:'load',timeout:30000});
              await page.waitForFunction(() => document.documentElement.dataset.growUpgrade === 'ready', {timeout:5000});

              await page.evaluate(() => {
                window.__growMutations = 0;
                new MutationObserver(records => {
                  window.__growMutations += records.filter(record => record.type === 'attributes' && record.target.classList?.contains('slide')).length;
                }).observe(document.body,{subtree:true,attributes:true,attributeFilter:['class']});
              });
              await delay(1400);

              const before = await page.evaluate(() => ({
                index: [...document.querySelectorAll('.slide')].findIndex(slide => slide.classList.contains('active')),
                active: document.querySelectorAll('.slide.active').length,
                mutations: window.__growMutations,
                hidden: [...document.querySelectorAll('.slide.active .grow-reveal')].some(element => parseFloat(getComputedStyle(element).opacity) < .99),
                cssLoaded: [...document.styleSheets].some(sheet => sheet.href?.includes('visual-upgrade.css')),
                scriptReady: document.documentElement.dataset.growUpgrade
              }));
              if (before.active !== 1) failures.push(`${file}: active slide count ${before.active}`);
              if (before.mutations > 18) failures.push(`${file}: idle slide mutations ${before.mutations}`);
              if (before.hidden) failures.push(`${file}: active teaching content remained hidden`);
              if (!before.cssLoaded || before.scriptReady !== 'ready') failures.push(`${file}: shared layer not loaded`);
              if (pageErrors.length) failures.push(`${file}: page errors ${pageErrors.join(' | ')}`);
              const sharedFailures = failedResponses.filter(item => item.includes('visual-upgrade'));
              if (sharedFailures.length) failures.push(`${file}: shared asset response failures ${sharedFailures.join(' | ')}`);

              const controls = await page.$$('.controls button');
              const next = await page.$('button[onclick*="nextSlide"]') || controls.at(-1);
              if (!next) failures.push(`${file}: no Next control`);
              else {
                await next.focus();
                await page.keyboard.press('Enter');
                await delay(350);
                const forward = await page.evaluate(() => ({
                  index: [...document.querySelectorAll('.slide')].findIndex(slide => slide.classList.contains('active')),
                  active: document.querySelectorAll('.slide.active').length,
                  mutations: window.__growMutations
                }));
                if (forward.active !== 1 || forward.index !== before.index + 1) failures.push(`${file}: Next ${before.index}->${forward.index}, active=${forward.active}`);
                if (forward.mutations - before.mutations > 20) failures.push(`${file}: excessive navigation mutations ${forward.mutations - before.mutations}`);
                const previous = await page.$('button[onclick*="prevSlide"]') || controls[0];
                await previous.click();
                await delay(350);
                const back = await page.evaluate(() => [...document.querySelectorAll('.slide')].findIndex(slide => slide.classList.contains('active')));
                if (back !== before.index) failures.push(`${file}: Previous returned to ${back}, expected ${before.index}`);
              }

              const diagramState = await page.evaluate(async () => {
                const diagram = document.querySelector('.ilm');
                if (!diagram) return {found:false};
                diagram.click();
                await new Promise(resolve => setTimeout(resolve,40));
                return {
                  found:true,
                  enhanced:diagram.dataset.growDiagram,
                  replaying:diagram.classList.contains('grow-diagram-replaying'),
                  icon:Boolean(diagram.querySelector('.grow-diagram-replay-icon')),
                  sweep:Boolean(diagram.querySelector('.grow-diagram-sweep'))
                };
              });
              if (!diagramState.found || diagramState.enhanced !== 'true' || !diagramState.replaying || !diagramState.icon || !diagramState.sweep) {
                failures.push(`${file}: diagram replay enhancement failed ${JSON.stringify(diagramState)}`);
              }

              await page.setViewport({width:390,height:844});
              await delay(200);
              const mobile = await page.evaluate(() => {
                const buttons = [...document.querySelectorAll('.controls button')].map(button => {
                  const rect = button.getBoundingClientRect();
                  return {text:button.textContent.trim(),left:rect.left,right:rect.right,top:rect.top,bottom:rect.bottom};
                });
                return {buttons,visible:buttons.every(rect => rect.right>0&&rect.left<innerWidth&&rect.bottom>0&&rect.top<innerHeight)};
              });
              if (!mobile.visible) failures.push(`${file}: navigation controls off-screen at 390px`);
              console.log('REPRESENTATIVE', JSON.stringify({file,before,mobile,diagramState,failedResponses}));
              await page.close();
            }

            const reduced = await browser.newPage();
            await reduced.emulateMediaFeatures([{name:'prefers-reduced-motion',value:'reduce'}]);
            await reduced.goto(urlFor(representatives[0]), {waitUntil:'load'});
            await reduced.waitForFunction(() => document.documentElement.dataset.growUpgrade === 'ready');
            await delay(150);
            const reducedState = await reduced.evaluate(() => ({
              hidden: [...document.querySelectorAll('.slide.active .grow-reveal')].some(element => parseFloat(getComputedStyle(element).opacity) < .99),
              sweep: document.querySelector('.grow-diagram-sweep') ? getComputedStyle(document.querySelector('.grow-diagram-sweep')).display : 'none'
            }));
            if (reducedState.hidden || reducedState.sweep !== 'none') failures.push(`Reduced motion hidden=${reducedState.hidden} sweep=${reducedState.sweep}`);
            await reduced.close();

            let totalWeDo = 0;
            let enhancedWeDo = 0;
            let activityBars = 0;
            let presentationSlides = 0;
            let matchingSlides = 0;
            let randomPickers = 0;
            let discussionTrails = 0;
            let pairTrails = 0;
            let presentationResponded = 0;
            let matchingResponded = 0;

            for (const file of lessonFiles) {
              const page = await browser.newPage();
              const pageErrors = [];
              page.on('pageerror', error => pageErrors.push(String(error)));
              await page.goto(urlFor(file), {waitUntil:'domcontentloaded',timeout:30000});
              await page.waitForFunction(() => document.documentElement.dataset.growUpgrade === 'ready', {timeout:5000});

              const result = await page.evaluate(async () => {
                const slides = [...document.querySelectorAll('.slide')].filter(slide => /\bwe do\b/i.test(`${slide.dataset.title||''} ${slide.querySelector('.slide-tag')?.textContent||''}`));
                const presentation = slides.find(slide => slide.dataset.growActivity === 'presentation');
                const matching = slides.find(slide => slide.dataset.growActivity === 'matching');

                let presentationResponded = false;
                if (presentation) {
                  presentation.querySelector('.grow-random-pick')?.click();
                  await new Promise(resolve => setTimeout(resolve,30));
                  const picked = presentation.querySelector('.pres-card.grow-picked');
                  picked?.click();
                  await new Promise(resolve => setTimeout(resolve,70));
                  presentationResponded = Number(presentation.querySelector('.grow-activity-rail')?.getAttribute('aria-valuenow') || 0) > 0 && Boolean(presentation.querySelector('.pres-card.done'));
                }

                let matchingResponded = false;
                if (matching) {
                  const pill = matching.querySelector('.match-pill');
                  const inline = pill?.getAttribute('onclick') || '';
                  const id = inline.match(/selectKW\(this\s*,\s*['"]([^'"]+)['"]\)/)?.[1];
                  const target = id ? matching.querySelector(`.match-target[data-correct="${id}"]`) : null;
                  pill?.click();
                  target?.click();
                  await new Promise(resolve => setTimeout(resolve,80));
                  matchingResponded = Number(matching.querySelector('.grow-activity-rail')?.getAttribute('aria-valuenow') || 0) > 0 && matching.querySelectorAll('.grow-pair-chip').length > 0;
                }

                return {
                  total:slides.length,
                  enhanced:slides.filter(slide => slide.dataset.growWeDo === 'true').length,
                  bars:slides.reduce((sum,slide) => sum + slide.querySelectorAll('.grow-activity-bar').length,0),
                  presentation:slides.filter(slide => slide.dataset.growActivity === 'presentation').length,
                  matching:slides.filter(slide => slide.dataset.growActivity === 'matching').length,
                  random:slides.reduce((sum,slide) => sum + slide.querySelectorAll('.grow-random-pick').length,0),
                  discussion:slides.reduce((sum,slide) => sum + slide.querySelectorAll('.grow-discussion-trail').length,0),
                  pair:slides.reduce((sum,slide) => sum + slide.querySelectorAll('.grow-pair-trail').length,0),
                  presentationResponded,
                  matchingResponded
                };
              });

              totalWeDo += result.total;
              enhancedWeDo += result.enhanced;
              activityBars += result.bars;
              presentationSlides += result.presentation;
              matchingSlides += result.matching;
              randomPickers += result.random;
              discussionTrails += result.discussion;
              pairTrails += result.pair;
              presentationResponded += Number(result.presentationResponded);
              matchingResponded += Number(result.matchingResponded);
              if (pageErrors.length) failures.push(`${file}: page errors ${pageErrors.join(' | ')}`);
              await page.close();
            }

            const expected = 18;
            if (totalWeDo !== 36 || enhancedWeDo !== 36 || activityBars !== 36) failures.push(`We Do coverage total=${totalWeDo} enhanced=${enhancedWeDo} bars=${activityBars}`);
            if (presentationSlides !== expected || matchingSlides !== expected) failures.push(`Activity families presentation=${presentationSlides} matching=${matchingSlides}`);
            if (randomPickers !== expected || discussionTrails !== expected || pairTrails !== expected) failures.push(`Interaction surfaces random=${randomPickers} discussion=${discussionTrails} pair=${pairTrails}`);
            if (presentationResponded !== expected || matchingResponded !== expected) failures.push(`Interaction response presentation=${presentationResponded} matching=${matchingResponded}`);

            console.log('WE_DO_VALIDATION', JSON.stringify({totalWeDo,enhancedWeDo,activityBars,presentationSlides,matchingSlides,randomPickers,discussionTrails,pairTrails,presentationResponded,matchingResponded}));
            console.log('REDUCED_MOTION', JSON.stringify(reducedState));
            console.log('VALIDATION_FAILURES', JSON.stringify(failures));
            await browser.close();
            if (failures.length) throw new Error(failures.join('\n'));
          })().catch(error => { console.error(error); process.exit(1); });
          NODE

      - name: Commit and publish completed upgrade
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/codex-grow-asdan-audit.yml
          rm -f .github/workflows/codex-grow-asdan-publish.yml
          git add -A

          changed="$(git diff --name-only origin/main)"
          test -n "$changed"
          invalid="$(printf '%s\n' "$changed" | grep -v '^GROW_ASDAN/' || true)"
          if [ -n "$invalid" ]; then
            printf 'Final diff contains out-of-scope paths:\n%s\n' "$invalid" >&2
            exit 1
          fi
          test "$(printf '%s\n' "$changed" | wc -l | tr -d ' ')" = "27"
          test "$(printf '%s\n' "$changed" | grep -c '\.html$')" = "24"
          git diff --cached --check
          git diff --check origin/main
          printf 'PASS final scope: 27 files, all under GROW_ASDAN/\n'

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: upgrade GROW ASDAN interactive teaching and motion"
          git push origin HEAD:codex/grow-asdan-interactions-motion
