name: Verify merged GROW ASDAN deployment

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/codex-grow-asdan-deployment-verify.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out merged main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify live project-site deployment
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations
          import hashlib, time, urllib.parse, urllib.request
          from html.parser import HTMLParser
          from pathlib import Path

          base='https://madebymatt.uk/Lessons/'
          expected_commit='313fe8a1c831fe15b2e20304364009001a6192b4'
          suite=Path('GROW_ASDAN')
          html=sorted(suite.rglob('*.html'))
          if len(html)!=24: raise SystemExit(f'Expected 24 HTML files, found {len(html)}')
          deployed=html+[suite/'visual-upgrade.css',suite/'visual-upgrade.js']
          primary=[suite/'GROW_ASDAN_Hub.html',suite/'visual-upgrade.css',suite/'visual-upgrade.js']

          def url_for(path, bust=True):
              url=urllib.parse.urljoin(base,urllib.parse.quote(path.as_posix(),safe='/'))
              return url+(f'?revision={expected_commit}' if bust else '')

          def fetch_url(url):
              request=urllib.request.Request(url,headers={'User-Agent':'GROW-ASDAN-postmerge-verifier/1.0','Cache-Control':'no-cache','Pragma':'no-cache'})
              with urllib.request.urlopen(request,timeout=30) as response:
                  return response.status,response.read(),response.geturl()

          failures=[]
          for attempt in range(1,19):
              failures=[]
              for path in primary:
                  try: status,body,final=fetch_url(url_for(path))
                  except Exception as exc: failures.append(f'{path}: {type(exc).__name__}: {exc}'); continue
                  expected=path.read_bytes()
                  if status!=200: failures.append(f'{path}: HTTP {status} via {final}')
                  elif body!=expected: failures.append(f'{path}: SHA deployed={hashlib.sha256(body).hexdigest()} expected={hashlib.sha256(expected).hexdigest()}')
              if not failures:
                  print(f'PASS deployment propagation on attempt {attempt}')
                  break
              print(f'Attempt {attempt}: '+ '; '.join(failures))
              if attempt<18: time.sleep(10)
          else: raise SystemExit('Primary deployment mismatch: '+'; '.join(failures))

          bodies={}; mismatches=[]
          for path in deployed:
              try: status,body,final=fetch_url(url_for(path))
              except Exception as exc: mismatches.append(f'{path}: {type(exc).__name__}: {exc}'); continue
              expected=path.read_bytes()
              if status!=200: mismatches.append(f'{path}: HTTP {status} via {final}')
              elif body!=expected: mismatches.append(f'{path}: byte mismatch deployed={hashlib.sha256(body).hexdigest()} expected={hashlib.sha256(expected).hexdigest()}')
              else: bodies[path]=body
          if mismatches: raise SystemExit('Deployment mismatches: '+'; '.join(mismatches))

          class Refs(HTMLParser):
              def __init__(self): super().__init__(convert_charrefs=True); self.refs=[]
              def handle_starttag(self,tag,attrs): self.refs += [value.strip() for name,value in attrs if name.lower() in {'href','src'} and value]

          same_origin=set(); html_links=set()
          for path in html:
              parser=Refs(); parser.feed(bodies[path].decode('utf-8')); parser.close()
              page_url=url_for(path,bust=False)
              for raw in parser.refs:
                  if not raw or raw.startswith(('#','data:','mailto:','tel:','javascript:','//')): continue
                  absolute=urllib.parse.urljoin(page_url,raw)
                  parsed=urllib.parse.urlsplit(absolute)
                  if parsed.scheme not in {'http','https'} or parsed.netloc.lower()!='madebymatt.uk': continue
                  clean=urllib.parse.urlunsplit((parsed.scheme,parsed.netloc,parsed.path,parsed.query,''))
                  same_origin.add(clean)
                  if parsed.path.lower().endswith('.html'): html_links.add(clean)

          ref_failures=[]
          for url in sorted(same_origin):
              try: status,_,final=fetch_url(url+('&' if '?' in url else '?')+f'revision={expected_commit}')
              except Exception as exc: ref_failures.append(f'{url}: {type(exc).__name__}: {exc}'); continue
              if status!=200: ref_failures.append(f'{url}: HTTP {status} via {final}')
          if ref_failures: raise SystemExit('Missing deployment references: '+'; '.join(ref_failures))

          print('PASS live hub, all 24 HTML entry points, shared CSS and shared JS match merged main byte for byte')
          print(f'PASS deployment references: {len(same_origin)} same-origin links/assets returned HTTP 200')
          print(f'PASS lesson links: {len(html_links)} linked HTML targets returned HTTP 200')
          print(f'DEPLOYED_COMMIT={expected_commit}')
          print('VERIFIED_PUBLIC_URL=https://madebymatt.uk/Lessons/GROW_ASDAN/GROW_ASDAN_Hub.html')
          PY

      - name: Delete temporary branches
        shell: bash
        run: |
          git push origin --delete codex/grow-asdan-interactions-motion || true
          git push origin --delete codex/grow-asdan-deployment-verify || true
