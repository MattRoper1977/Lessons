name: Audit LAUNCH ASDAN browser interactions

on:
  push:
    branches:
      - codex/launch-asdan-navigation-interactions
    paths:
      - .github/workflows/codex-launch-asdan-browser-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install browser driver
        run: npm install --no-save puppeteer-core@24

      - name: Run local browser audit
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/launch-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const { execFileSync } = require('child_process');
          const puppeteer = require('puppeteer-core');

          const root = process.cwd();
          const suite = path.join(root, 'LAUNCH_ASDAN');
          const browserPath = ['google-chrome', 'chromium', 'chromium-browser']
            .map(name => {
              try { return execFileSync('bash', ['-lc', `command -v ${name}`], {encoding:'utf8'}).trim(); }
              catch { return ''; }
            })
            .find(Boolean);
          if (!browserPath) throw new Error('No Chrome/Chromium executable found');

          function walk(dir) {
            return fs.readdirSync(dir, {withFileTypes:true}).flatMap(entry => {
              const full = path.join(dir, entry.name);
              return entry.isDirectory() ? walk(full) : [full];
            });
          }

          const htmlFiles = walk(suite)
            .filter(file => file.endsWith('.html'))
            .map(file => path.relative(root, file).replaceAll(path.sep, '/'));
          const lessons = htmlFiles.filter(file => !file.endsWith('/START_HERE.html') && !file.endsWith('LAUNCH_ASDAN_Hub.html') && !file.endsWith('Scheme_of_Work.html') && !file.endsWith('Resources_and_Tools.html'));
          if (htmlFiles.length !== 38 || lessons.length !== 30) {
            throw new Error(`Unexpected suite census: html=${htmlFiles.length}, lessons=${lessons.length}`);
          }

          const representative = [];
          for (const folder of ['PEQ','Careers','Living_Independently','Vocational','Community_Enterprise']) {
            const match = lessons.find(file => file.includes(`/LAUNCH_ASDAN/${folder}/`)) || lessons.find(file => file.includes(`LAUNCH_ASDAN/${folder}/`));
            if (match) representative.push(match);
          }

          (async () => {
            const browser = await puppeteer.launch({
              executablePath: browserPath,
              headless: true,
              args: ['--no-sandbox','--disable-dev-shm-usage','--allow-file-access-from-files']
            });
            const failures = [];
            const activityInventory = [];

            for (const file of representative) {
              const page = await browser.newPage();
              await page.setViewport({width: 1280, height: 800, deviceScaleFactor: 1});
              const consoleErrors = [];
              const pageErrors = [];
              page.on('console', msg => { if (msg.type() === 'error') consoleErrors.push(msg.text()); });
              page.on('pageerror', error => pageErrors.push(String(error)));
              const url = `http://127.0.0.1:4173/${encodeURI(file)}`;
              await page.goto(url, {waitUntil:'load', timeout:30000});
              await page.waitForTimeout(400);

              await page.evaluate(() => {
                window.__vuSlideClassMutations = 0;
                window.__vuObserver = new MutationObserver(records => {
                  window.__vuSlideClassMutations += records.filter(record => record.type === 'attributes' && record.target.classList?.contains('slide')).length;
                });
                window.__vuObserver.observe(document.body, {subtree:true, attributes:true, attributeFilter:['class']});
              });
              await page.waitForTimeout(1200);

              const before = await page.evaluate(() => ({
                slideCount: document.querySelectorAll('.slide').length,
                active: Array.from(document.querySelectorAll('.slide')).findIndex(slide => slide.classList.contains('active')),
                activeCount: document.querySelectorAll('.slide.active').length,
                mutations: window.__vuSlideClassMutations,
                ready: document.documentElement.dataset.visualUpgrade,
                controls: Array.from(document.querySelectorAll('.controls button')).map(button => ({
                  text: button.textContent.trim(),
                  onclick: button.getAttribute('onclick'),
                  disabled: button.disabled,
                  rect: button.getBoundingClientRect().toJSON()
                }))
              }));

              if (before.activeCount !== 1) failures.push(`${file}: expected one active slide, found ${before.activeCount}`);
              if (before.mutations > 30) failures.push(`${file}: runaway slide class mutations while idle (${before.mutations}/1.2s)`);
              if (pageErrors.length) failures.push(`${file}: page errors ${pageErrors.join(' | ')}`);
              if (consoleErrors.length) failures.push(`${file}: console errors ${consoleErrors.join(' | ')}`);

              const next = page.locator('.controls button').last();
              if (await next.count()) {
                try {
                  await next.click({timeout:3000});
                  await page.waitForTimeout(300);
                  const after = await page.evaluate(() => ({
                    active: Array.from(document.querySelectorAll('.slide')).findIndex(slide => slide.classList.contains('active')),
                    activeCount: document.querySelectorAll('.slide.active').length,
                    mutations: window.__vuSlideClassMutations
                  }));
                  if (after.activeCount !== 1 || after.active === before.active) failures.push(`${file}: next navigation did not advance cleanly (${before.active} -> ${after.active}, activeCount=${after.activeCount})`);
                } catch (error) {
                  failures.push(`${file}: next control click failed: ${error.message}`);
                }
              } else failures.push(`${file}: no .controls button found`);

              await page.setViewport({width: 390, height: 844, deviceScaleFactor: 1});
              await page.waitForTimeout(200);
              const mobile = await page.evaluate(() => {
                const viewport = {width: innerWidth, height: innerHeight};
                const buttons = Array.from(document.querySelectorAll('.controls button')).map(button => {
                  const rect = button.getBoundingClientRect();
                  return {text: button.textContent.trim(), left:rect.left, right:rect.right, top:rect.top, bottom:rect.bottom};
                });
                return {
                  viewport,
                  buttons,
                  allVisible: buttons.every(button => button.right > 0 && button.left < viewport.width && button.bottom > 0 && button.top < viewport.height),
                  controlsScrollWidth: document.querySelector('.controls')?.scrollWidth || 0,
                  controlsClientWidth: document.querySelector('.controls')?.clientWidth || 0
                };
              });
              if (!mobile.allVisible) failures.push(`${file}: one or more navigation controls are off-screen at 390px`);

              console.log('REPRESENTATIVE', JSON.stringify({file, before, mobile, pageErrors, consoleErrors}));
              await page.close();
            }

            for (const file of lessons) {
              const page = await browser.newPage();
              await page.setViewport({width: 1100, height: 760});
              await page.goto(`http://127.0.0.1:4173/${encodeURI(file)}`, {waitUntil:'domcontentloaded', timeout:30000});
              const inventory = await page.evaluate(() => Array.from(document.querySelectorAll('.slide')).filter(slide => /we do/i.test(slide.dataset.title || slide.querySelector('.slide-tag')?.textContent || '')).map(slide => ({
                title: slide.dataset.title || slide.querySelector('h1,h2')?.textContent?.trim() || 'We Do',
                buttons: slide.querySelectorAll('button').length,
                inputs: slide.querySelectorAll('input,textarea,select').length,
                onclick: slide.querySelectorAll('[onclick]').length,
                matchPills: slide.querySelectorAll('.match-pill').length,
                matchTargets: slide.querySelectorAll('.match-target').length,
                presCards: slide.querySelectorAll('.pres-card').length,
                highlightSentences: slide.querySelectorAll('.hl-sentence').length,
                factCarousels: slide.querySelectorAll('.fact-carousel').length,
                stepControls: slide.querySelectorAll('.v5-step-controls').length,
                captures: slide.querySelectorAll('.wedo-capture').length
              })));
              activityInventory.push({file, weDo: inventory});
              await page.close();
            }

            const staticWeDo = activityInventory.flatMap(item => item.weDo.map(slide => ({file:item.file, ...slide}))).filter(slide => slide.buttons + slide.inputs + slide.onclick + slide.matchPills + slide.matchTargets + slide.presCards + slide.highlightSentences + slide.factCarousels + slide.stepControls === 0);
            console.log('WE_DO_INVENTORY', JSON.stringify(activityInventory));
            console.log('STATIC_WE_DO', JSON.stringify(staticWeDo));
            console.log('AUDIT_FAILURES', JSON.stringify(failures));

            await browser.close();
            if (!failures.some(failure => failure.includes('runaway slide class mutations'))) {
              throw new Error('Positive control failed: expected the current shared layer to exhibit the known mutation-loop defect');
            }
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE
