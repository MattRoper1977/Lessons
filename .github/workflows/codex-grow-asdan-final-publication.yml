name: Final GROW ASDAN publication

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/codex-grow-asdan-final-publication.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out publication branch
        uses: actions/checkout@v4
        with:
          ref: codex/grow-asdan-interactions-motion
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install browser driver
        run: npm install --no-save puppeteer-core@24

      - name: Integrate, validate and publish
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main

          python3 - <<'PY'
          from __future__ import annotations
          import re, subprocess, tempfile
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import unquote, urlsplit

          root=Path.cwd(); suite=root/'GROW_ASDAN'
          css=suite/'visual-upgrade.css'; js=suite/'visual-upgrade.js'; guide=suite/'VISUAL_UPGRADE_GUIDE.md'
          for path in (css,js,guide):
              if not path.is_file(): raise SystemExit(f'Missing shared file: {path}')

          pages=sorted(suite.rglob('*.html'))
          lessons=[p for p in pages if p.parent!=suite and p.name!='START_HERE.html']
          if (len(pages),len(lessons))!=(24,18): raise SystemExit(f'Unexpected census: pages={len(pages)} lessons={len(lessons)}')

          class RefParser(HTMLParser):
              def __init__(self): super().__init__(convert_charrefs=True); self.refs=[]
              def handle_starttag(self,tag,attrs):
                  self.refs += [value.strip() for name,value in attrs if name.lower() in {'href','src'} and value]

          def missing_refs(page,text):
              parser=RefParser(); parser.feed(text); parser.close(); missing=set()
              for raw in parser.refs:
                  if not raw or raw.startswith(('#','data:','mailto:','tel:','javascript:','//')): continue
                  split=urlsplit(raw)
                  if split.scheme or split.netloc: continue
                  rel=unquote(split.path)
                  if not rel: continue
                  target=(root/rel.lstrip('/')) if rel.startswith('/') else (page.parent/rel)
                  try: target.resolve().relative_to(root.resolve())
                  except ValueError: missing.add(raw); continue
                  if not target.resolve().exists(): missing.add(raw)
              return missing

          originals={}; before_missing={}; modified=0
          for page in pages:
              original=subprocess.check_output(['git','show',f'origin/main:{page.relative_to(root).as_posix()}'],text=True)
              originals[page]=original
              missing=missing_refs(page,original)
              if missing: before_missing[str(page.relative_to(root))]=sorted(missing)
              depth=len(page.relative_to(suite).parts)-1
              prefix='../'*depth
              css_ref=prefix+'visual-upgrade.css'; js_ref=prefix+'visual-upgrade.js'
              current=page.read_text(encoding='utf-8')

              if 'visual-upgrade.css' in current or 'visual-upgrade.js' in current:
                  if current.count(css_ref)!=1 or current.count(js_ref)!=1: raise SystemExit(f'Incorrect shared references: {page}')
                  enhanced=current
              else:
                  enhanced,n=re.subn(r'(?i)</head>',f'<link rel="stylesheet" href="{css_ref}">\n</head>',current,count=1)
                  if n!=1: raise SystemExit(f'Missing closing head: {page}')
                  enhanced,n=re.subn(r'(?i)</body>',f'<script src="{js_ref}" defer></script>\n</body>',enhanced,count=1)
                  if n!=1: raise SystemExit(f'Missing closing body: {page}')
                  page.write_text(enhanced,encoding='utf-8'); modified+=1

              restored=enhanced.replace(f'<link rel="stylesheet" href="{css_ref}">\n','',1)
              restored=restored.replace(f'<script src="{js_ref}" defer></script>\n','',1)
              if restored!=original: raise SystemExit(f'Exact content round-trip failed: {page}')

          if modified!=24: raise SystemExit(f'Expected 24 new integrations, made {modified}')

          after_missing={}
          for page in pages:
              text=page.read_text(encoding='utf-8')
              depth=len(page.relative_to(suite).parts)-1; prefix='../'*depth
              if text.count(prefix+'visual-upgrade.css')!=1 or text.count(prefix+'visual-upgrade.js')!=1:
                  raise SystemExit(f'Shared coverage failed: {page}')
              missing=missing_refs(page,text)
              if missing: after_missing[str(page.relative_to(root))]=sorted(missing)
          if after_missing!=before_missing: raise SystemExit(f'Local-reference set changed: before={before_missing}, after={after_missing}')

          subprocess.run(['node','--check',str(js)],check=True)
          script_re=re.compile(r'(?is)<script\b([^>]*)>(.*?)</script>'); type_re=re.compile(r'\btype\s*=\s*([\'\"])(.*?)\1',re.I)
          def inline_failures(mapping,label):
              failures=set()
              with tempfile.TemporaryDirectory() as td:
                  temp=Path(td)
                  for page,text in mapping.items():
                      for i,match in enumerate(script_re.finditer(text),1):
                          attrs,body=match.groups()
                          if re.search(r'\bsrc\s*=',attrs,re.I): continue
                          tm=type_re.search(attrs); kind=tm.group(2).strip().lower() if tm else ''
                          if kind not in {'','text/javascript','application/javascript','module'}: continue
                          target=temp/f'{label}-{page.stem}-{i}.js'; target.write_text(body,encoding='utf-8')
                          result=subprocess.run(['node','--check',str(target)],capture_output=True,text=True)
                          if result.returncode: failures.add(f'{page.relative_to(root)}#script-{i}')
              return failures
          before_inline=inline_failures(originals,'before')
          after_inline=inline_failures({p:p.read_text(encoding='utf-8') for p in pages},'after')
          if after_inline!=before_inline: raise SystemExit(f'Inline JavaScript changed: before={before_inline}, after={after_inline}')

          css_text=css.read_text(encoding='utf-8')
          clean=re.sub(r'/\*.*?\*/','',css_text,flags=re.S); clean=re.sub(r'(["\'])(?:\\.|(?!\1).)*\1','',clean)
          depth=0
          for char in clean:
              depth+=(char=='{')-(char=='}')
              if depth<0: raise SystemExit('CSS closes before it opens')
          if depth: raise SystemExit(f'Unbalanced CSS braces: {depth}')

          shared='\n'.join(p.read_text(encoding='utf-8') for p in (css,js,guide))
          hygiene=re.compile(r'<<<<<<<|=======|>>>>>>>|\bTODO\b|\bFIXME\b|\bdebugger\b|console\.log\s*\(',re.I)
          if hygiene.search(shared): raise SystemExit('Conflict, unfinished or debug artefact in shared files')
          for marker in ['attributeOldValue: true','wasActive !== isActive','grow-activity-bar','grow-random-pick','grow-pair-trail','grow-diagram-replaying']:
              if marker not in js.read_text(encoding='utf-8'): raise SystemExit(f'Missing interaction marker: {marker}')

          checks={
              'navigation':re.compile(r'nextSlide|prevSlide|class="controls"',re.I),
              'answer':re.compile(r'show-ans|class="answer"|reveal',re.I),
              'timer':re.compile(r'timer-widget|auto-timer|startTimer',re.I),
              'presentation':re.compile(r'presTap\(|class="pres-card"',re.I),
              'matching':re.compile(r'selectKW\(|class="match-pill"',re.I),
          }
          for label,pattern in checks.items():
              absent=[str(p.relative_to(root)) for p in lessons if not pattern.search(p.read_text(encoding='utf-8'))]
              if absent: raise SystemExit(f'Existing {label} hooks missing: {absent}')

          print('PASS static: 24 HTML, 18 lessons, exact content round-trip')
          print('PASS shared references, local assets, inline scripts, CSS, lifecycle and existing interaction hooks')
          PY

          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/grow-http.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT

          node <<'NODE'
          const fs=require('fs'),path=require('path'),cp=require('child_process');
          const puppeteer=require('puppeteer-core');
          const delay=ms=>new Promise(resolve=>setTimeout(resolve,ms));
          const chrome=['google-chrome','chromium','chromium-browser'].map(n=>{try{return cp.execFileSync('bash',['-lc',`command -v ${n}`],{encoding:'utf8'}).trim()}catch{return''}}).find(Boolean);
          if(!chrome)throw new Error('No browser executable');
          const walk=d=>fs.readdirSync(d,{withFileTypes:true}).flatMap(e=>e.isDirectory()?walk(path.join(d,e.name)):[path.join(d,e.name)]);
          const html=walk('GROW_ASDAN').filter(f=>f.endsWith('.html')).map(f=>f.replaceAll('\\','/'));
          const lessons=html.filter(f=>/GROW_ASDAN\/(PEQ|Community_Project|Enterprise)\/[^/]+\.html$/.test(f)&&!f.endsWith('/START_HERE.html'));
          const reps=['PEQ','Community_Project','Enterprise'].map(folder=>lessons.find(f=>f.includes(`/${folder}/`)));
          const url=file=>`http://127.0.0.1:4173/${encodeURI(file)}`;
          (async()=>{
            const browser=await puppeteer.launch({executablePath:chrome,headless:true,protocolTimeout:120000,args:['--no-sandbox','--disable-dev-shm-usage']});
            const failures=[];
            for(const file of reps){
              const page=await browser.newPage();await page.setViewport({width:1280,height:800});const errors=[];page.on('pageerror',e=>errors.push(String(e)));
              await page.goto(url(file),{waitUntil:'load',timeout:30000});await page.waitForFunction(()=>document.documentElement.dataset.growUpgrade==='ready',{timeout:5000});
              await page.evaluate(()=>{window.__gm=0;new MutationObserver(rs=>window.__gm+=rs.filter(r=>r.type==='attributes'&&r.target.classList?.contains('slide')).length).observe(document.body,{subtree:true,attributes:true,attributeFilter:['class']})});
              await delay(1400);
              const before=await page.evaluate(()=>({idx:[...document.querySelectorAll('.slide')].findIndex(s=>s.classList.contains('active')),active:document.querySelectorAll('.slide.active').length,m:window.__gm,hidden:[...document.querySelectorAll('.slide.active .grow-reveal')].some(e=>parseFloat(getComputedStyle(e).opacity)<.99),css:[...document.styleSheets].some(s=>s.href?.includes('visual-upgrade.css'))}));
              if(before.active!==1||before.m>18||before.hidden||!before.css||errors.length)failures.push(`${file}: ${JSON.stringify({before,errors})}`);
              const buttons=await page.$$('.controls button');const next=await page.$('button[onclick*="nextSlide"]')||buttons.at(-1);
              if(!next)failures.push(`${file}: no Next`);else{await next.focus();await page.keyboard.press('Enter');await delay(350);const forward=await page.evaluate(()=>({idx:[...document.querySelectorAll('.slide')].findIndex(s=>s.classList.contains('active')),active:document.querySelectorAll('.slide.active').length,m:window.__gm}));if(forward.active!==1||forward.idx!==before.idx+1||forward.m-before.m>20)failures.push(`${file}: forward ${JSON.stringify({before,forward})}`);const prev=await page.$('button[onclick*="prevSlide"]')||buttons[0];await prev.click();await delay(350);const back=await page.evaluate(()=>[...document.querySelectorAll('.slide')].findIndex(s=>s.classList.contains('active')));if(back!==before.idx)failures.push(`${file}: Previous=${back}`)}
              const diagram=await page.evaluate(async()=>{const d=document.querySelector('.ilm');if(!d)return{found:false};d.click();await new Promise(r=>setTimeout(r,40));return{found:true,enhanced:d.dataset.growDiagram,replaying:d.classList.contains('grow-diagram-replaying'),icon:!!d.querySelector('.grow-diagram-replay-icon'),sweep:!!d.querySelector('.grow-diagram-sweep')}});if(!diagram.found||diagram.enhanced!=='true'||!diagram.replaying||!diagram.icon||!diagram.sweep)failures.push(`${file}: diagram ${JSON.stringify(diagram)}`);
              await page.setViewport({width:390,height:844});await delay(200);const mobile=await page.evaluate(()=>[...document.querySelectorAll('.controls button')].every(b=>{const r=b.getBoundingClientRect();return r.right>0&&r.left<innerWidth&&r.bottom>0&&r.top<innerHeight}));if(!mobile)failures.push(`${file}: mobile controls off-screen`);await page.close();
            }
            const reduced=await browser.newPage();await reduced.emulateMediaFeatures([{name:'prefers-reduced-motion',value:'reduce'}]);await reduced.goto(url(reps[0]),{waitUntil:'load'});await reduced.waitForFunction(()=>document.documentElement.dataset.growUpgrade==='ready');await delay(150);const rm=await reduced.evaluate(()=>({hidden:[...document.querySelectorAll('.slide.active .grow-reveal')].some(e=>parseFloat(getComputedStyle(e).opacity)<.99),sweep:document.querySelector('.grow-diagram-sweep')?getComputedStyle(document.querySelector('.grow-diagram-sweep')).display:'none'}));if(rm.hidden||rm.sweep!=='none')failures.push(`Reduced motion ${JSON.stringify(rm)}`);await reduced.close();
            let total=0,enhanced=0,bars=0,pres=0,match=0,random=0,discussion=0,pairs=0,presOK=0,matchOK=0;
            for(const file of lessons){const page=await browser.newPage();const errors=[];page.on('pageerror',e=>errors.push(String(e)));await page.goto(url(file),{waitUntil:'domcontentloaded',timeout:30000});await page.waitForFunction(()=>document.documentElement.dataset.growUpgrade==='ready',{timeout:5000});const r=await page.evaluate(async()=>{const slides=[...document.querySelectorAll('.slide')].filter(s=>/\bwe do\b/i.test(`${s.dataset.title||''} ${s.querySelector('.slide-tag')?.textContent||''}`));const p=slides.find(s=>s.dataset.growActivity==='presentation'),m=slides.find(s=>s.dataset.growActivity==='matching');let po=false,mo=false;if(p){p.querySelector('.grow-random-pick')?.click();await new Promise(x=>setTimeout(x,30));p.querySelector('.pres-card.grow-picked')?.click();await new Promise(x=>setTimeout(x,70));po=Number(p.querySelector('.grow-activity-rail')?.getAttribute('aria-valuenow')||0)>0&&!!p.querySelector('.pres-card.done')}if(m){const pill=m.querySelector('.match-pill'),inline=pill?.getAttribute('onclick')||'',id=inline.match(/selectKW\(this\s*,\s*['"]([^'"]+)['"]\)/)?.[1],target=id?m.querySelector(`.match-target[data-correct="${id}"]`):null;pill?.click();target?.click();await new Promise(x=>setTimeout(x,80));mo=Number(m.querySelector('.grow-activity-rail')?.getAttribute('aria-valuenow')||0)>0&&m.querySelectorAll('.grow-pair-chip').length>0}return{total:slides.length,enhanced:slides.filter(s=>s.dataset.growWeDo==='true').length,bars:slides.reduce((n,s)=>n+s.querySelectorAll('.grow-activity-bar').length,0),pres:slides.filter(s=>s.dataset.growActivity==='presentation').length,match:slides.filter(s=>s.dataset.growActivity==='matching').length,random:slides.reduce((n,s)=>n+s.querySelectorAll('.grow-random-pick').length,0),discussion:slides.reduce((n,s)=>n+s.querySelectorAll('.grow-discussion-trail').length,0),pairs:slides.reduce((n,s)=>n+s.querySelectorAll('.grow-pair-trail').length,0),po,mo}});total+=r.total;enhanced+=r.enhanced;bars+=r.bars;pres+=r.pres;match+=r.match;random+=r.random;discussion+=r.discussion;pairs+=r.pairs;presOK+=Number(r.po);matchOK+=Number(r.mo);if(errors.length)failures.push(`${file}: ${errors.join(' | ')}`);await page.close()}
            const summary={total,enhanced,bars,pres,match,random,discussion,pairs,presOK,matchOK};if(JSON.stringify(summary)!==JSON.stringify({total:36,enhanced:36,bars:36,pres:18,match:18,random:18,discussion:18,pairs:18,presOK:18,matchOK:18}))failures.push(`We Do ${JSON.stringify(summary)}`);
            console.log('GROW_VALIDATION',JSON.stringify({summary,reducedMotion:rm,failures}));await browser.close();if(failures.length)throw new Error(failures.join('\n'));
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

          rm -f .github/workflows/codex-grow-asdan-final-publication.yml
          git add -A
          changed="$(git diff --cached --name-only origin/main)"
          invalid="$(printf '%s\n' "$changed" | grep -v '^GROW_ASDAN/' || true)"
          [ -z "$invalid" ] || { printf 'Out-of-scope staged paths:\n%s\n' "$invalid" >&2; exit 1; }
          count="$(printf '%s\n' "$changed" | wc -l | tr -d ' ')"; html_count="$(printf '%s\n' "$changed" | grep -c '\.html$')"
          [ "$count" = "27" ] && [ "$html_count" = "24" ] || { printf 'Bad final scope files=%s html=%s\n%s\n' "$count" "$html_count" "$changed" >&2; exit 1; }
          git diff --cached --check
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: upgrade GROW ASDAN interactive teaching and motion"
          git push origin HEAD:codex/grow-asdan-interactions-motion
