name: LAUNCH ASDAN PR browser audit

on:
  pull_request:
    branches:
      - main
    paths:
      - 'LAUNCH_ASDAN/**'
      - '.github/workflows/codex-launch-asdan-pr-audit.yml'
      - '.github/workflows/codex-launch-asdan-browser-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save puppeteer-core@24
      - name: Reproduce navigation and inventory We Do interactions
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          node <<'NODE'
          const fs=require('fs'), path=require('path'), cp=require('child_process');
          const puppeteer=require('puppeteer-core');
          const chrome=['google-chrome','chromium','chromium-browser'].map(n=>{try{return cp.execFileSync('bash',['-lc',`command -v ${n}`],{encoding:'utf8'}).trim()}catch{return''}}).find(Boolean);
          if(!chrome) throw new Error('No browser executable');
          const walk=d=>fs.readdirSync(d,{withFileTypes:true}).flatMap(e=>e.isDirectory()?walk(path.join(d,e.name)):[path.join(d,e.name)]);
          const all=walk('LAUNCH_ASDAN').filter(f=>f.endsWith('.html')).map(f=>f.replaceAll('\\','/'));
          const lessons=all.filter(f=>!/(START_HERE|LAUNCH_ASDAN_Hub|Scheme_of_Work|Resources_and_Tools)\.html$/.test(f));
          if(all.length!==38||lessons.length!==30) throw new Error(`Bad census ${all.length}/${lessons.length}`);
          const reps=['PEQ','Careers','Living_Independently','Vocational','Community_Enterprise'].map(folder=>lessons.find(f=>f.includes(`/${folder}/`)));
          (async()=>{
            const browser=await puppeteer.launch({executablePath:chrome,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            const defects=[];
            for(const file of reps){
              const page=await browser.newPage();
              await page.setViewport({width:1280,height:800});
              const pageErrors=[]; page.on('pageerror',e=>pageErrors.push(String(e)));
              await page.goto(`http://127.0.0.1:4173/${encodeURI(file)}`,{waitUntil:'load'});
              await page.evaluate(()=>{window.__m=0;new MutationObserver(rs=>window.__m+=rs.filter(r=>r.type==='attributes'&&r.target.classList?.contains('slide')).length).observe(document.body,{subtree:true,attributes:true,attributeFilter:['class']})});
              await page.waitForTimeout(1000);
              const before=await page.evaluate(()=>({idx:[...document.querySelectorAll('.slide')].findIndex(s=>s.classList.contains('active')),active:document.querySelectorAll('.slide.active').length,mutations:window.__m,ready:document.documentElement.dataset.visualUpgrade,buttons:[...document.querySelectorAll('.controls button')].map(b=>({text:b.textContent.trim(),onclick:b.getAttribute('onclick')}))}));
              if(before.mutations>30) defects.push(`${file}: runaway class mutations ${before.mutations}/s`);
              if(before.active!==1) defects.push(`${file}: active slide count ${before.active}`);
              if(pageErrors.length) defects.push(`${file}: ${pageErrors.join(' | ')}`);
              const nav=page.locator('.controls button').last();
              try{await nav.click({timeout:3000});await page.waitForTimeout(250)}catch(e){defects.push(`${file}: navigation click failed ${e.message}`)}
              const after=await page.evaluate(()=>({idx:[...document.querySelectorAll('.slide')].findIndex(s=>s.classList.contains('active')),active:document.querySelectorAll('.slide.active').length,mutations:window.__m}));
              if(after.idx===before.idx||after.active!==1) defects.push(`${file}: navigation did not advance ${before.idx}->${after.idx}, active=${after.active}`);
              await page.setViewport({width:390,height:844}); await page.waitForTimeout(150);
              const mobile=await page.evaluate(()=>{const bs=[...document.querySelectorAll('.controls button')].map(b=>{const r=b.getBoundingClientRect();return{text:b.textContent.trim(),left:r.left,right:r.right,top:r.top,bottom:r.bottom}});return{buttons:bs,visible:bs.every(r=>r.right>0&&r.left<innerWidth&&r.bottom>0&&r.top<innerHeight),sw:document.querySelector('.controls')?.scrollWidth,cw:document.querySelector('.controls')?.clientWidth}});
              if(!mobile.visible) defects.push(`${file}: mobile controls off-screen`);
              console.log('REP',JSON.stringify({file,before,after,mobile}));
              await page.close();
            }
            const inventory=[];
            for(const file of lessons){
              const page=await browser.newPage();
              await page.goto(`http://127.0.0.1:4173/${encodeURI(file)}`,{waitUntil:'domcontentloaded'});
              const weDo=await page.evaluate(()=>[...document.querySelectorAll('.slide')].filter(s=>/we do/i.test(s.dataset.title||s.querySelector('.slide-tag')?.textContent||'')).map(s=>({title:s.dataset.title||'We Do',buttons:s.querySelectorAll('button').length,fields:s.querySelectorAll('input,textarea,select').length,onclick:s.querySelectorAll('[onclick]').length,match:s.querySelectorAll('.match-pill,.match-target').length,pres:s.querySelectorAll('.pres-card').length,highlight:s.querySelectorAll('.hl-sentence').length,carousel:s.querySelectorAll('.fact-carousel').length,steps:s.querySelectorAll('.v5-step-controls').length,capture:s.querySelectorAll('.wedo-capture').length})));
              inventory.push({file,weDo}); await page.close();
            }
            const slides=inventory.flatMap(x=>x.weDo.map(s=>({file:x.file,...s})));
            const staticSlides=slides.filter(s=>s.buttons+s.fields+s.onclick+s.match+s.pres+s.highlight+s.carousel+s.steps===0);
            console.log('WE_DO_SUMMARY',JSON.stringify({lessonCount:lessons.length,weDoSlides:slides.length,staticCount:staticSlides.length,staticSlides}));
            console.log('DEFECTS',JSON.stringify(defects));
            await browser.close();
            if(!defects.some(d=>d.includes('runaway class mutations'))) throw new Error('Positive control failed: mutation loop not reproduced');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
