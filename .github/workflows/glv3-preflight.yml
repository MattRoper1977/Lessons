name: GROW LAUNCH v3 generator preflight

on:
  push:
    branches:
      - claude/gl-estate-v3
    paths:
      - .github/workflows/glv3-preflight.yml
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: glv3-generator-preflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  inspect-generator:
    runs-on: ubuntu-latest
    steps:
      - name: Check out recovery branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct proven deterministic source transport
        shell: bash
        run: |
          set -euo pipefail
          for f in _glv3/input/valid.part{00..09}.b64; do test -s "$f"; done
          cat _glv3/input/valid.part{00..09}.b64 | tr -d '[:space:]' | base64 --decode > /tmp/glv3-packs.tar.xz
          echo '782ff5865e1406c159c78081bcc218bdaa46678e5c42448a6f298f696ca73f5e  /tmp/glv3-packs.tar.xz' | sha256sum -c -
          xz --test /tmp/glv3-packs.tar.xz
          mkdir -p /tmp/glv3-packs
          tar -xJf /tmp/glv3-packs.tar.xz -C /tmp/glv3-packs
          test "$(find /tmp/glv3-packs/grow -type f | wc -l)" = 51
          test "$(find /tmp/glv3-packs/launch -type f | wc -l)" = 63

      - name: Inspect available runtimes and generator interfaces
        shell: bash
        run: |
          set -euo pipefail
          python --version
          node --version
          npm --version
          echo '--- deploy.py help ---'
          python _glv3/tools/deploy.py --help || true
          echo '--- closeout_prep.py help ---'
          python _glv3/tools/closeout_prep.py --help || true
          echo '--- generator entry points ---'
          grep -nE 'ArgumentParser|add_argument|def main|if __name__' _glv3/tools/deploy.py _glv3/tools/closeout_prep.py || true
          echo '--- deploy.py tail ---'
          tail -n 180 _glv3/tools/deploy.py
          echo '--- browser verifier package imports ---'
          sed -n '1,120p' _glv3/tools/browser_verify.mjs
          echo '--- chip verifier package imports ---'
          sed -n '1,120p' _glv3/tools/chip_gate.mjs

      - name: Attempt generator in disposable checkout
        id: attempt
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/glv3-work
          cp -a "$GITHUB_WORKSPACE" /tmp/glv3-work
          cd /tmp/glv3-work
          python _glv3/tools/deploy.py /tmp/glv3-packs/grow /tmp/glv3-packs/launch .

      - name: Record preflight result and clean-tree proof
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo "generator_attempt_outcome=${{ steps.attempt.outcome }}"
          git status --short
          test -z "$(git status --short)"

      - name: Publish SHA-bound preflight status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          ATTEMPT_OUTCOME: ${{ steps.attempt.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          state=success
          description="Generator interface inspected; attempt=${ATTEMPT_OUTCOME}"
          if [[ "$JOB_STATUS" != success ]]; then
            state=failure
            description='Generator preflight infrastructure failed; inspect exact run logs'
          fi
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$(jq -nc --arg state "$state" --arg context 'glv3/generator-preflight' --arg description "$description" --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" '{state:$state,context:$context,description:$description,target_url:$target_url}')"
