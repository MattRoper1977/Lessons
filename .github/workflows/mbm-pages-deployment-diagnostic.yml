name: MBM cross-estate verifier source capture

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out current Lessons main
        uses: actions/checkout@v4
        with:
          repository: MattRoper1977/Lessons
          ref: main
          path: sources/lessons
          fetch-depth: 1

      - name: Check out current Apps main
        uses: actions/checkout@v4
        with:
          repository: MattRoper1977/Matt-s-Apps-
          ref: main
          path: sources/apps
          fetch-depth: 1

      - name: Capture exact permanent verifier sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p capture/lessons/tools capture/lessons/.github/workflows
          mkdir -p capture/apps/tools capture/apps/.github/workflows
          cp sources/lessons/tools/verify_cross_estate_browser.mjs capture/lessons/tools/
          cp sources/lessons/.github/workflows/mbm-cross-estate-unification.yml capture/lessons/.github/workflows/
          cp sources/apps/tools/verify_cross_estate_browser.mjs capture/apps/tools/
          cp sources/apps/.github/workflows/mbm-cross-estate-unification.yml capture/apps/.github/workflows/
          {
            echo "sentinel=mbm-cross-estate-unification-lessons-apps-2026-08-08"
            echo "lessons_head=$(git -C sources/lessons rev-parse HEAD)"
            echo "apps_head=$(git -C sources/apps rev-parse HEAD)"
            sha256sum \
              capture/lessons/tools/verify_cross_estate_browser.mjs \
              capture/lessons/.github/workflows/mbm-cross-estate-unification.yml \
              capture/apps/tools/verify_cross_estate_browser.mjs \
              capture/apps/.github/workflows/mbm-cross-estate-unification.yml
          } | tee capture/source-state.txt

      - name: Upload exact verifier sources
        uses: actions/upload-artifact@v4
        with:
          name: mbm-cross-estate-verifier-sources-${{ github.run_id }}
          path: capture/
          if-no-files-found: error
          retention-days: 7
