name: MBM Pages deployment diagnostic

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Capture Pages and workflow state for both project repositories
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostic-output
          python - <<'PY'
          import json, pathlib, urllib.error, urllib.request

          repos = ['MattRoper1977/Lessons', 'MattRoper1977/Matt-s-Apps-']
          endpoints = [
              ('pages', 'pages'),
              ('latest_pages_build', 'pages/builds/latest'),
              ('main_workflow_runs', 'actions/runs?branch=main&per_page=20'),
              ('pages_deployments', 'deployments?environment=github-pages&per_page=20'),
          ]
          result = {}
          for repo in repos:
              result[repo] = {}
              for key, suffix in endpoints:
                  url = f'https://api.github.com/repos/{repo}/{suffix}'
                  req = urllib.request.Request(url, headers={
                      'Accept': 'application/vnd.github+json',
                      'User-Agent': 'Made-by-Matt-Pages-diagnostic/1',
                      'X-GitHub-Api-Version': '2022-11-28',
                  })
                  try:
                      with urllib.request.urlopen(req, timeout=30) as response:
                          raw = response.read().decode('utf-8', 'replace')
                          status = response.status
                  except urllib.error.HTTPError as exc:
                      raw = exc.read().decode('utf-8', 'replace')
                      status = exc.code
                  try:
                      body = json.loads(raw)
                  except json.JSONDecodeError:
                      body = raw
                  result[repo][key] = {'url': url, 'status': status, 'body': body}
          path = pathlib.Path('diagnostic-output/pages-diagnostic.json')
          path.write_text(json.dumps(result, indent=2) + '\n', encoding='utf-8')
          print(path.read_text(encoding='utf-8'))
          PY

      - name: Upload diagnostic evidence
        uses: actions/upload-artifact@v4
        with:
          name: mbm-pages-deployment-diagnostic-${{ github.run_id }}
          path: diagnostic-output/
          if-no-files-found: error
          retention-days: 7
