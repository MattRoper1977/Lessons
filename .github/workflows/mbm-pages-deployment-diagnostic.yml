name: MBM Pages deployment diagnostic

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Capture Pages, deployment and served-cache state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostic-output
          python - <<'PY'
          import json, pathlib, time, urllib.error, urllib.request

          sentinel = 'mbm-cross-estate-unification-lessons-apps-2026-08-08'
          repos = {
              'MattRoper1977/Lessons': {
                  'path': 'Lessons',
                  'custom': 'https://madebymatt.uk/Lessons/',
                  'project': 'https://mattroper1977.github.io/Lessons/',
              },
              'MattRoper1977/Matt-s-Apps-': {
                  'path': 'Matt-s-Apps-',
                  'custom': 'https://madebymatt.uk/Matt-s-Apps-/',
                  'project': 'https://mattroper1977.github.io/Matt-s-Apps-/',
              },
          }

          def fetch(url, *, json_body=True, no_cache=False):
              headers = {
                  'Accept': 'application/vnd.github+json' if json_body else 'text/html,*/*',
                  'User-Agent': 'Made-by-Matt-Pages-diagnostic/2',
                  'X-GitHub-Api-Version': '2022-11-28',
              }
              if no_cache:
                  headers['Cache-Control'] = 'no-cache, no-store, max-age=0'
                  headers['Pragma'] = 'no-cache'
              req = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=45) as response:
                      raw = response.read()
                      status = response.status
                      final_url = response.geturl()
                      response_headers = dict(response.headers.items())
              except urllib.error.HTTPError as exc:
                  raw = exc.read()
                  status = exc.code
                  final_url = exc.geturl()
                  response_headers = dict(exc.headers.items())
              text = raw.decode('utf-8', 'replace')
              if json_body:
                  try:
                      body = json.loads(text)
                  except json.JSONDecodeError:
                      body = text
              else:
                  body = {
                      'bytes': len(raw),
                      'sentinel': sentinel in text,
                      'thirty_one': 'Thirty-one' in text,
                      'twenty_eight': 'Twenty-eight' in text,
                      'platform_css': 'assets/mbm-platform.css' in text,
                      'platform_js': 'assets/mbm-platform.js' in text,
                      'head': text[:500],
                  }
              return {
                  'url': url,
                  'final_url': final_url,
                  'status': status,
                  'headers': response_headers,
                  'body': body,
              }

          result = {}
          nonce = int(time.time())
          for repo, meta in repos.items():
              result[repo] = {}
              endpoints = [
                  ('pages', f'https://api.github.com/repos/{repo}/pages'),
                  ('latest_pages_build', f'https://api.github.com/repos/{repo}/pages/builds/latest'),
                  ('main_workflow_runs', f'https://api.github.com/repos/{repo}/actions/runs?branch=main&per_page=20'),
                  ('pages_deployments', f'https://api.github.com/repos/{repo}/deployments?environment=github-pages&per_page=20'),
              ]
              for key, url in endpoints:
                  result[repo][key] = fetch(url)
              deployments = result[repo]['pages_deployments']['body']
              if isinstance(deployments, list) and deployments:
                  result[repo]['latest_deployment_statuses'] = fetch(deployments[0]['statuses_url'])
                  sha = deployments[0].get('sha', '')
              else:
                  sha = ''
              result[repo]['source_main'] = fetch(
                  f'https://raw.githubusercontent.com/{repo}/main/index.html?mbm={nonce}',
                  json_body=False,
                  no_cache=True,
              )
              result[repo]['served_custom'] = fetch(
                  f"{meta['custom']}?mbm={sha or nonce}",
                  json_body=False,
                  no_cache=True,
              )
              result[repo]['served_project'] = fetch(
                  f"{meta['project']}?mbm={sha or nonce}",
                  json_body=False,
                  no_cache=True,
              )
          path = pathlib.Path('diagnostic-output/pages-diagnostic.json')
          path.write_text(json.dumps(result, indent=2) + '\n', encoding='utf-8')
          print(path.read_text(encoding='utf-8'))
          PY

      - name: Upload diagnostic evidence
        uses: actions/upload-artifact@v4
        with:
          name: mbm-pages-deployment-diagnostic-${{ github.run_id }}
          path: diagnostic-output/
          if-no-files-found: error
          retention-days: 7
