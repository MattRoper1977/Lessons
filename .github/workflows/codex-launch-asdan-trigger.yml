name: Trigger LAUNCH ASDAN publisher

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/codex-launch-asdan-publish.yml
      - .github/workflows/codex-launch-asdan-trigger.yml

permissions:
  contents: write

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out publication branch
        uses: actions/checkout@v4
        with:
          ref: codex/launch-asdan-visual-upgrade
          fetch-depth: 0

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Execute the self-removing publisher
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          source = Path('.github/workflows/codex-launch-asdan-publish.yml')
          payload = source.read_text(encoding='utf-8')
          old = r'''              if visible_text(original) != visible_text(enhanced):
                  raise SystemExit(f"Visible text changed in {path}")'''
          new = r'''              restored = enhanced.replace(f'<link rel="stylesheet" href="{css_ref}">\n', '', 1)
              restored = restored.replace(f'<script src="{js_ref}" defer></script>\n', '', 1)
              if restored != original:
                  raise SystemExit(f"Content round-trip changed in {path}")'''
          if old not in payload:
              raise SystemExit('Publisher content-integrity check signature not found')
          payload = payload.replace(old, new, 1)

          lines = payload.splitlines()
          blocks = []
          index = 0
          while index < len(lines):
              if lines[index] == '        run: |':
                  index += 1
                  block = []
                  while index < len(lines) and (lines[index].startswith('          ') or not lines[index].strip()):
                      line = lines[index]
                      block.append(line[10:] if line.startswith('          ') else '')
                      index += 1
                  blocks.append('\n'.join(block) + '\n')
                  continue
              index += 1

          if len(blocks) != 2:
              raise SystemExit(f'Expected two publisher shell blocks, found {len(blocks)}')

          Path('.github/workflows/codex-launch-asdan-trigger.yml').unlink()
          for block in blocks:
              subprocess.run(block, shell=True, executable='/bin/bash', check=True)
          PY
