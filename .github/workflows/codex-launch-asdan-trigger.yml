name: Trigger LAUNCH ASDAN publisher

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/codex-launch-asdan-publish.yml
      - .github/workflows/codex-launch-asdan-trigger.yml

permissions:
  contents: write

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out publication branch
        uses: actions/checkout@v4
        with:
          ref: codex/launch-asdan-visual-upgrade
          fetch-depth: 0

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Execute the self-removing publisher
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          source = Path('.github/workflows/codex-launch-asdan-publish.yml')
          payload = source.read_text(encoding='utf-8')
          pattern = re.compile(
              r'(?m)^(?P<indent>[ ]*)if visible_text\(original\) != visible_text\(enhanced\):\n'
              r'(?P=indent)    raise SystemExit\(f"Visible text changed in \{path\}"\)'
          )

          def replace_check(match):
              indent = match.group('indent')
              return (
                  f"{indent}restored = enhanced.replace(f'<link rel=\"stylesheet\" href=\"{{css_ref}}\">\\n', '', 1)\n"
                  f"{indent}restored = restored.replace(f'<script src=\"{{js_ref}}\" defer></script>\\n', '', 1)\n"
                  f"{indent}if restored != original:\n"
                  f"{indent}    raise SystemExit(f\"Content round-trip changed in {{path}}\")"
              )

          payload, replacements = pattern.subn(replace_check, payload, count=1)
          if replacements != 1:
              raise SystemExit(f'Expected one content-integrity check replacement, made {replacements}')

          lines = payload.splitlines()
          blocks = []
          index = 0
          while index < len(lines):
              if lines[index] == '        run: |':
                  index += 1
                  block = []
                  while index < len(lines) and (lines[index].startswith('          ') or not lines[index].strip()):
                      line = lines[index]
                      block.append(line[10:] if line.startswith('          ') else '')
                      index += 1
                  blocks.append('\n'.join(block) + '\n')
                  continue
              index += 1

          if len(blocks) != 2:
              raise SystemExit(f'Expected two publisher shell blocks, found {len(blocks)}')

          Path('.github/workflows/codex-launch-asdan-trigger.yml').unlink()
          for block in blocks:
              subprocess.run(block, shell=True, executable='/bin/bash', check=True)
          PY
