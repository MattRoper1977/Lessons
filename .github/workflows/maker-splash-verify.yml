name: Maker splash application contract

on:
  pull_request:
    branches: [main]
    paths:
      - '**/*.html'
      - 'data/hud-coverage.json'
      - 'tools/render_maker_splash.py'
      - 'tools/verify_maker_splash.mjs'
      - '.github/workflows/maker-splash-verify.yml'
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - 'data/hud-coverage.json'
      - 'tools/render_maker_splash.py'
      - 'tools/verify_maker_splash.mjs'
      - '.github/workflows/maker-splash-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maker-splash-lessons-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  serial-proof:
    name: Generator, suppression, routes, and lesson timing
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }

      - name: Check out the in-flight canonical Site estate
        uses: actions/checkout@v4
        with:
          repository: MattRoper1977/mattroper1977.github.io
          ref: codex/splash-canon-evidence-20260827-1
          path: _site
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      - name: Install the measured browser engine
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Syntax, declarations, clean check, idempotence, and positive control
        run: |
          set -euo pipefail
          mkdir -p artifacts/maker-splash
          python3 -m py_compile tools/render_maker_splash.py
          node --check tools/verify_maker_splash.mjs
          python3 -m json.tool data/hud-coverage.json >/dev/null
          python3 tools/render_maker_splash.py --root . --check | tee artifacts/maker-splash/generator-check.log
          before=$(git status --porcelain)
          python3 tools/render_maker_splash.py --root . --write >/dev/null
          python3 tools/render_maker_splash.py --root . --write >/dev/null
          after=$(git status --porcelain)
          test "$before" = "$after"
          control=$(mktemp -d)
          mkdir -p "$control/tools" "$control/data"
          cp tools/render_maker_splash.py "$control/tools/"
          cp data/hud-coverage.json "$control/data/"
          cp index.html "$control/"
          python3 - "$control/data/hud-coverage.json" <<'PY'
          import json,sys
          p=sys.argv[1]; d=json.load(open(p)); d['makerSplash']={
            '_what':'temporary real-route removal control',
            'applied':[{'route':'/Lessons/'}],
            'declined-with-reason':[], 'variant-retained-with-reason':[]}
          open(p,'w').write(json.dumps(d,indent=2)+'\n')
          PY
          python3 "$control/tools/render_maker_splash.py" --root "$control" --write >/dev/null
          python3 - "$control/index.html" <<'PY'
          import re,sys
          p=sys.argv[1]; s=open(p).read(); b='<!-- MBM-MAKER-SPLASH:BEGIN generated by tools/render_maker_splash.py, do not edit by hand -->'; e='<!-- MBM-MAKER-SPLASH:END -->'
          s,n=re.subn(r'(?:\r?\n)?'+re.escape(b)+r'.*?'+re.escape(e)+r'(?:\r?\n)?','',s,count=1,flags=re.S); assert n==1; open(p,'w').write(s)
          PY
          if python3 "$control/tools/render_maker_splash.py" --root "$control" --check > artifacts/maker-splash/generator-positive.log 2>&1; then
            echo 'positive removal control unexpectedly passed'; exit 1
          fi
          grep -F 'missing   /Lessons/' artifacts/maker-splash/generator-positive.log

      - name: Known-state SS1–SS8 controls
        run: |
          set -o pipefail
          applied=$(node -e "const d=require('./data/hud-coverage.json');process.stdout.write(String(d.makerSplash.applied.length))")
          if [ "$applied" -eq 0 ]; then
            echo 'UNMEASURED: no contract-permitted Lessons route remains for a real cross-repository suppression control' | tee artifacts/maker-splash/controls.log
          else
            node tools/verify_maker_splash.mjs \
              --mode=controls --scope=lessons \
              --site-root="$GITHUB_WORKSPACE/_site" --lessons-root="$GITHUB_WORKSPACE" \
              --report=artifacts/maker-splash/controls.json | tee artifacts/maker-splash/controls.log
          fi

      - name: Every applied Lessons route behaves
        run: |
          set -o pipefail
          node tools/verify_maker_splash.mjs \
            --mode=verify --scope=lessons \
            --site-root="$GITHUB_WORKSPACE/_site" --lessons-root="$GITHUB_WORKSPACE" \
            --report=artifacts/maker-splash/routes.json | tee artifacts/maker-splash/routes.log

      - name: Every declared lesson keeps first-slide timing and daily suppression
        run: |
          set -o pipefail
          applied=$(node -e "const d=require('./data/hud-coverage.json');process.stdout.write(String(d.makerSplash.applied.length))")
          if [ "$applied" -eq 0 ]; then
            echo 'UNMEASURED: no contract-permitted Lessons route remains for lesson timing' | tee artifacts/maker-splash/lesson-timing.log
          else
            node tools/verify_maker_splash.mjs \
              --mode=lesson-timing --scope=lessons \
              --site-root="$GITHUB_WORKSPACE/_site" --lessons-root="$GITHUB_WORKSPACE" \
              --report=artifacts/maker-splash/lesson-timing.json | tee artifacts/maker-splash/lesson-timing.log
          fi

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maker-splash-lessons-${{ github.run_id }}
          path: artifacts/maker-splash/
          if-no-files-found: error
          retention-days: 30
