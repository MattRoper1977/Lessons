name: PH-1 commit proven G2 and G4 detectors
on:
  push:
    branches:
      - pass-ph1-peq-hardening
    paths:
      - '.github/workflows/ph1-gate-proofs.yml'
permissions:
  contents: write
jobs:
  prove-and-commit:
    if: "${{ github.event.head_commit.message != 'PH-1 transport cleanup: gate proofs' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install pinned jsdom in an isolated temporary prefix
        run: |
          set -euo pipefail
          NPM_DIR="$(mktemp -d)"
          npm install --prefix "$NPM_DIR" --no-package-lock --no-save jsdom@26.1.0
          echo "PH1_NODE_PATH=$NPM_DIR/node_modules" >> "$GITHUB_ENV"
          RESOLVED="$(NODE_PATH="$NPM_DIR/node_modules" node -p "require('jsdom/package.json').version")"
          echo "PH1_JSDOM_VERSION=$RESOLVED" >> "$GITHUB_ENV"
      - name: Prove detectors and commit proof artefacts separately
        run: |
          set -euo pipefail
          BASE=ae1d3c7af2526781aad6fb82e7cbbf6b87ded380
          BASE_WORKTREE="$(mktemp -d)"
          cleanup() {
            git worktree remove --force "$BASE_WORKTREE" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          git worktree add --detach "$BASE_WORKTREE" "$BASE"
          SCRIPT="$GITHUB_WORKSPACE/.github/ph1_gate_proofs.py"
          (cd "$BASE_WORKTREE" && NODE_PATH="$PH1_NODE_PATH" JSDOM_VERSION="$PH1_JSDOM_VERSION" python3 "$SCRIPT")
          cleanup
          trap - EXIT

          test ! -e _passph1/G2_HARNESS.cjs
          test ! -e _passph1/G2_HARNESS_PROOF.md
          test ! -e _passph1/G4_WITNESS_COMPARATOR.py
          test ! -e _passph1/G4_MUTATION_PROOF.md
          git config user.name 'PH-1 Executor'
          git config user.email 'ph1@madebymatt.invalid'

          cp /tmp/ph1-gate-proofs/G2_HARNESS.cjs _passph1/G2_HARNESS.cjs
          cp /tmp/ph1-gate-proofs/G2_HARNESS_PROOF.md _passph1/G2_HARNESS_PROOF.md
          git add _passph1/G2_HARNESS.cjs _passph1/G2_HARNESS_PROOF.md
          git commit -m 'PH-1 G2 harness proven: jsdom 26.1.0; broken 1/1; clean 1/1'

          cp /tmp/ph1-gate-proofs/G4_WITNESS_COMPARATOR.py _passph1/G4_WITNESS_COMPARATOR.py
          cp /tmp/ph1-gate-proofs/G4_MUTATION_PROOF.md _passph1/G4_MUTATION_PROOF.md
          git add _passph1/G4_WITNESS_COMPARATOR.py _passph1/G4_MUTATION_PROOF.md
          git commit -m 'PH-1 G4 comparator proven: 147 surfaces; delete red; content red; whitespace green'

          git push origin HEAD:pass-ph1-peq-hardening
