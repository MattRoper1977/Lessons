name: GROW LAUNCH v3 generated-tree verification

on:
  workflow_dispatch:
  push:
    branches:
      - claude/gl-estate-v3
      - main
    paths:
      - GROW_Estate_v3/**
      - LAUNCH_Estate_v3/**
      - resources.json
      - _finish/ROUTES.md
      - _glv3/**
      - .github/workflows/glv3-verify.yml
  pull_request:
    branches: [main]
    paths:
      - GROW_Estate_v3/**
      - LAUNCH_Estate_v3/**
      - resources.json
      - _finish/ROUTES.md
      - _glv3/**
      - .github/workflows/glv3-verify.yml

permissions:
  contents: read
  statuses: write

concurrency:
  group: glv3-generated-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-generated-tree:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Confirm generated estate inputs exist
        shell: bash
        run: |
          set -euo pipefail
          test -n "$(find GROW_Estate_v3 -type f -name '*.html' -print -quit)"
          test -n "$(find LAUNCH_Estate_v3 -type f -name '*.html' -print -quit)"

      - name: Deterministic generated-tree static verification
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          python - <<'PY'
          import hashlib, json, pathlib, re, sys
          from html.parser import HTMLParser
          from urllib.parse import unquote, urlsplit
          root=pathlib.Path('.').resolve(); estates=[root/'GROW_Estate_v3',root/'LAUNCH_Estate_v3']
          html=[p for e in estates for p in e.rglob('*.html')]
          assert len(html)==94, len(html)
          resources=json.loads((root/'resources.json').read_text())
          rows=resources if isinstance(resources,list) else resources.get('resources') or resources.get('items') or resources.get('records')
          assert isinstance(rows,list)
          gl=[r for r in rows if str(r.get('id','')).startswith('glv3-')]
          assert len(gl)==88 and len({r['id'] for r in gl})==88
          lessons=[r for r in gl if str(r.get('type','')).lower()=='lesson']
          assert len(lessons)==80, len(lessons)
          assert sum('grow' in str(r.get('family','')).lower() for r in lessons)==34
          assert sum('launch' in str(r.get('family','')).lower() for r in lessons)==46
          text='\n'.join(p.read_text(encoding='utf-8',errors='replace') for p in html)
          for token in ['_OUTSTANDING_V3_TEST','localStorage','sessionStorage','indexedDB','XMLHttpRequest','sendBeacon','WebSocket']:
              assert token not in text, token
          assert not re.search(r'\bfetch\s*\(',text)
          assert not re.search(r'\beval\s*\(',text)
          assert not re.search(r'<form\b',text,re.I)
          launch='\n'.join(p.read_text(encoding='utf-8',errors='replace') for p in (root/'LAUNCH_Estate_v3').rglob('*.html'))
          assert not re.search(r'\b(?:mark scheme|band descriptors?|level descriptors?|grade boundaries?|AO[1-9]|\d+\s+marks?)\b',launch,re.I)
          assert not re.search(r'\b(?:minimum|at least|required)\s+\d+(?:\.\d+)?\s*(?:hours?|GLH|TQT)\b',text,re.I)
          assert 'new art form' not in text.casefold()
          class P(HTMLParser):
              def __init__(self): super().__init__(); self.links=[]
              def handle_starttag(self,tag,attrs):
                  for k,v in attrs:
                      if k.lower() in {'href','src'} and v: self.links.append(v)
          # Link resolution knows about the deployed mounts: this repository is
          # served at /Lessons/, the site repo at the domain root. A "/"-absolute
          # href is therefore not always repo-relative. See _glv3/tools/mount_map.py.
          sys.path.insert(0, str(root/'_glv3'/'tools'))
          from mount_map import SiteMount, pin_site_sha, resolve, BROKEN, UNVERIFIED
          site_sha = pin_site_sha()
          print('mount map · site repo pinned at ' + site_sha)
          site = SiteMount(site_sha)
          broken=[]; unverified=[]
          for p in html:
              q=P(); q.feed(p.read_text(encoding='utf-8',errors='replace'))
              for raw in q.links:
                  u=urlsplit(raw.strip())
                  if u.scheme or u.netloc or raw.startswith(('mailto:','tel:','data:','javascript:','#')): continue
                  status, detail = resolve(raw, p, root, site)
                  if status == BROKEN:
                      broken.append({'from':p.relative_to(root).as_posix(),'link':raw,'detail':detail})
                  elif status == UNVERIFIED:
                      unverified.append({'from':p.relative_to(root).as_posix(),'link':raw,'detail':detail})
          assert not broken, broken[:20]
          # Fail-safe: a mount we could not reach is red on its own message, never
          # a silent pass. A gate that goes quiet on a network hiccup looks green.
          assert not unverified, ['UNVERIFIED — site mount unreachable, not a pass'] + unverified[:20]
          required=['_glv3/GATES_STATIC.json','_glv3/GATES_BROWSER.json','_glv3/GATES_CHIPS.json','_glv3/INPUT_INTEGRITY.json','_glv3/COUNT_RECONCILIATION.json','_glv3/AUTONOMOUS_SENTINEL.json','_glv3/POSITIVE_CONTROLS.json']
          for rel in required: assert (root/rel).is_file() and (root/rel).stat().st_size>0, rel
          contacts=list((root/'_glv3/contact_sheet').rglob('*.png'))
          assert len(contacts)>=83, len(contacts)
          print(json.dumps({'html':len(html),'resources':len(gl),'lessons':len(lessons),'contacts':len(contacts)}))
          PY
          ! find GROW_Estate_v3 LAUNCH_Estate_v3 -type f \( -name '*.md' -o -name '*.markdown' \) -print -quit | grep -q .
          git diff --check
          if [[ "${GITHUB_REF_NAME}" != main ]]; then
            test -z "$(git diff --name-only origin/main...HEAD -- Art_Teesside GROW_ASDAN LAUNCH_ASDAN Grow/Slideshows Launch/Slideshows Science_Teesside Humanities_Teesside Baseline_Weeks BUILD_Estate_v3)"
          fi

      - name: Run disposable tamper controls
        shell: bash
        run: |
          set -euo pipefail
          before=$(git status --porcelain)
          python _glv3/tools/positive_controls.py --repo "$GITHUB_WORKSPACE"
          after=$(git status --porcelain)
          test "$before" = "$after" || { git status --short; exit 1; }

      - name: Install print and contact-sheet system dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils imagemagick
          command -v pdftoppm
          command -v montage

      - name: Install Chromium verifier dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir pillow beautifulsoup4 lxml
          npm install --no-save --no-package-lock playwright sharp pngjs pdfjs-dist
          npx playwright install --with-deps chromium

      - name: Re-run exact-tree browser, print and catalogue gates
        env:
          BASE_URL: http://127.0.0.1:4173
          GLV3_BASE_URL: http://127.0.0.1:4173
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 4173 --bind 127.0.0.1 --directory "$GITHUB_WORKSPACE" >/tmp/glv3-http.log 2>&1 & server=$!
          trap 'kill "$server" 2>/dev/null || true; cat /tmp/glv3-http.log || true' EXIT
          for _ in $(seq 1 40); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 0.25; done
          timeout 50m node _glv3/tools/browser_verify.mjs http://127.0.0.1:4173
          timeout 20m node _glv3/tools/chip_gate.mjs http://127.0.0.1:4173
          kill "$server" 2>/dev/null || true; wait "$server" 2>/dev/null || true; trap - EXIT
          rm -rf node_modules
          git diff --check

      - name: Upload exact-SHA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: glv3-exact-tree-${{ github.sha }}
          path: |
            _glv3/*.json
            _glv3/*.md
            _glv3/*.zip
            _glv3/contact_sheet
          if-no-files-found: warn
          retention-days: 30

      - name: Publish exact-SHA status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          state=success; description='Generated GLV3 tree passed static, tamper, Chromium, print and chip gates'
          if [[ "$JOB_STATUS" != success ]]; then state=failure; description='Generated GLV3 exact-tree verification failed'; fi
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$(jq -nc --arg state "$state" --arg context 'glv3/exact-tree' --arg description "$description" --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" '{state:$state,context:$context,description:$description,target_url:$target_url}')"
