name: Cross-estate contract on lesson content

# The cross-estate contract already guards the catalogue's lesson-order projection,
# but it only ran on PR shapes that touch a PIN1-pinned path. A PR that changes only
# Science_Teesside lesson content did not trigger it, so the projection could move -
# dropping a lesson's term and week binding - with every check on the PR green, and
# the red would surface later on main's scheduled run. This fires the same contract
# on those PRs. Trigger only: no job, threshold, scope or assertion is changed here.

on:
  pull_request:
    branches: [main]
    paths:
      - 'Science_Teesside/**'

# A called workflow cannot be granted more than the caller holds, and the called workflow
# declares contents: read, issues: write, pull-requests: write at workflow level. This caller
# declared none, so it passed the repository default and every call ended in startup_failure
# before a job ran. Granting exactly what the callee declares - no more - lets the call start.
permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  cross-estate:
    uses: ./.github/workflows/mbm-cross-estate-unification.yml
    permissions:
      contents: read
      issues: write
      pull-requests: write
