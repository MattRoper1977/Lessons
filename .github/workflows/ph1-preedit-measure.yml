name: PH-1 commit G4 and sign-off measurements
on:
  push:
    branches:
      - pass-ph1-peq-hardening
    paths:
      - '.github/workflows/ph1-preedit-measure.yml'
permissions:
  contents: write
jobs:
  measure-and-commit:
    if: "${{ github.event.head_commit.message != 'PH-1 transport cleanup: pre-edit measurements' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate final reports and commit them separately
        run: |
          set -euo pipefail
          BASE=ae1d3c7af2526781aad6fb82e7cbbf6b87ded380
          BASE_WORKTREE="$(mktemp -d)"
          cleanup() {
            git worktree remove --force "$BASE_WORKTREE" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          git worktree add --detach "$BASE_WORKTREE" "$BASE"
          V2="$GITHUB_WORKSPACE/.github/ph1_preedit_measure_v2.py"
          FINAL="$GITHUB_WORKSPACE/.github/ph1_preedit_finalize.py"
          (cd "$BASE_WORKTREE" && python3 "$V2" && python3 "$FINAL")
          cleanup
          trap - EXIT

          test ! -e _passph1/G4_DETECTOR_FINDING.md
          test ! -e _passph1/SIGNOFF_CLASSIFICATION.md
          git config user.name 'PH-1 Executor'
          git config user.email 'ph1@madebymatt.invalid'

          cp /tmp/ph1-preedit-final/G4_DETECTOR_FINDING.md _passph1/G4_DETECTOR_FINDING.md
          git add _passph1/G4_DETECTOR_FINDING.md
          git commit -m 'PH-1 G4 detector finding: 3/3 real surfaces carry Sections 4 and 5'

          cp /tmp/ph1-preedit-final/SIGNOFF_CLASSIFICATION.md _passph1/SIGNOFF_CLASSIFICATION.md
          git add _passph1/SIGNOFF_CLASSIFICATION.md
          git commit -m 'PH-1 sign-off census classified: B1 20; B2 80; B3 1; B4 0'

          git push origin HEAD:pass-ph1-peq-hardening
