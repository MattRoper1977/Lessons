name: PH-1 apply P1-P7
on:
  push:
    branches:
      - pass-ph1-peq-hardening
    paths:
      - '.github/workflows/ph1-p1-p7-apply.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply the green seven-commit sequence
        shell: bash
        run: |
          set -euo pipefail
          START="$(git rev-parse HEAD)"
          cp .github/ph1_apply.py /tmp/ph1_apply_runtime.py
          python3 .github/ph1_runtime_patch.py /tmp/ph1_apply_runtime.py
          DRY_RUN=0 PH1_OUT=/tmp/ph1-apply-real python3 /tmp/ph1_apply_runtime.py
          TIP="$(git rev-parse HEAD)"
          test "$TIP" != "$START"
          git push origin HEAD:pass-ph1-peq-hardening
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ph1-p1-p7-apply-evidence
          path: /tmp/ph1-apply-real
          retention-days: 2
