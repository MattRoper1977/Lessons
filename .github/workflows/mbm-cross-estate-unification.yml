      - 'tools/catalogue/verify_education_navigation.cjs'
      - 'tools/easter/science_original_browser.cjs'
      - 'tools/humanities_resources/CONTENT.json'
      - 'tools/humanities_resources/DOWNLOAD_MANIFEST.json'
      - 'tools/humanities_resources/ORIGINAL_MEMBER_MANIFEST.json'
      - 'tools/humanities_resources/PUBLIC_LABEL_CHANGES.json'
      - 'tools/humanities_resources/SOURCE_MANIFEST.json'
      - 'tools/humanities_resources/build_resources.py'
      - 'tools/humanities_resources/check_resources.py'
      - 'tools/humanities_resources/resource.css'
      - 'tools/humanities_resources/resource.js'
      - 'tools/pin1/derive_triggers.py'
      - 'tools/pin1/test_derive_triggers.py'
      - 'tools/prepare_served_publications.py'
      - 'tools/science_pack/browser_checks.cjs'
      - 'tools/science_teaching_packs/BUILD_QA.json'
      - 'tools/science_teaching_packs/BUILD_SOURCE_PROVENANCE.json'
      - 'tools/science_teaching_packs/GROW_QA.json'
      - 'tools/science_teaching_packs/VISUAL_REFRESH_QA.json'
      - 'tools/science_teaching_packs/build_hub.py'
      - 'tools/science_teaching_packs/check_hub_browser.cjs'
      - 'tools/science_teaching_packs/check_packs.py'
      - 'tools/science_teaching_packs/refresh_packs.py'
      - 'tools/test_served_publications.py'
      - 'tools/test_verify_served.mjs'
      - 'tools/ux2/resource_sizes.py'
      - 'tools/ux2/s1m_published_input_proof.py'
      - 'tools/verify_cross_estate_browser.mjs'
      - 'tools/verify_cross_estate_unification.py'
      - 'tools/verify_served.mjs'
      - 'tools/verify_v6fin_w7_r1_r7.py'
      # END PIN1 DERIVED PATHS
  # Every trigger above is a path filter over files THIS repository owns. The
  # thing this workflow exists to catch is divergence from the canonical site
  # platform, and the canonical lives in another repository — so the change that
  # matters most is precisely the one that moves no file here and fires nothing.
  #
  # That is not hypothetical. 91a16b8 synced this repository to the canonical on
  # 2026-08-13. The site moved on 08-14 (6bdeafa, which inverted the adult
  # affordance boundary to fail closed) and again on 08-15 (bc67b82). Nothing
  # here changed on either date, so this workflow did not run, and the gate was
  # green for two days while this repository served the fail-OPEN platform copy.
  #
  # theme-parity.yml already carries a daily schedule for exactly this reason and
  # says so in its own comment: nothing here changes at that moment, so the
  # scheduled run is what notices that the canonical moved and this copy did not.
  # Daily rather than weekly because the canonical moved twice in two days.
  # Offset off :17 (theme-parity) so the two do not queue together.
  schedule:
    - cron: '53 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: mbm-cross-estate-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  announce-live-run:
    # Was `!= 'pull_request'`, which was exact while push, workflow_dispatch and
    # pull_request were the only triggers. Adding the schedule made it wrong:
    # this job posts to PR 95, so a daily cron would have left two comments a
    # day there forever. Named positively now, so a future trigger has to opt in
    # rather than be swept in.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Index this production run on the release PR
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh pr comment 95 --repo "$GITHUB_REPOSITORY" --body "Production cross-estate verification started for source \`$GITHUB_SHA\`. Run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

  static-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out exact branch under review
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify registry-derived PIN1 triggers and firing controls
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/pin1/test_derive_triggers.py
          python3 tools/pin1/derive_triggers.py --check --report "$RUNNER_TEMP/pin1-trigger-census.json"

      - name: Check out the canonical Made by Matt platform
        uses: actions/checkout@v4
        with:
          repository: MattRoper1977/mattroper1977.github.io
          ref: main
          path: _reference/site
          fetch-depth: 1

      - name: Install the teaching pack HTML parser
        run: python -m pip install lxml==6.0.1

      - name: Verify preservation, local shell and positive control
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          python tools/verify_cross_estate_unification.py --base origin/main --canonical _reference/site --self-test
          if [ -f resources.json ]; then python tools/science_teaching_packs/check_packs.py; fi
          python -m json.tool "$([ -f resources.json ] && echo resources.json || echo apps.json)" >/dev/null
          node --check assets/mbm-platform.js
          node --check assets/mbm-theme.js
          node --check tools/verify_cross_estate_browser.mjs
          python - <<'PY'
          import pathlib, re
          text=pathlib.Path('index.html').read_text(encoding='utf-8')
          out=pathlib.Path('/tmp/mbm-inline-scripts');out.mkdir(exist_ok=True)
          count=0
          for body in re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,re.S|re.I):
              if body.strip():
                  (out/f'inline-{count}.js').write_text(body,encoding='utf-8')
                  count+=1
          print(f'extracted {count} inline script(s)')
          PY
          for script in /tmp/mbm-inline-scripts/*.js; do node --check "$script"; done
          git diff --check origin/main...HEAD

      - name: Preserve the PIN1 trigger-versus-assertion census
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pin1-trigger-census-${{ github.run_id }}
          path: ${{ runner.temp }}/pin1-trigger-census.json
          if-no-files-found: error
          retention-days: 14

  browser-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out exact branch under review
        uses: actions/checkout@v4

      - name: Check out canonical root for an accurate mounted-origin test
        uses: actions/checkout@v4
        with:
          repository: MattRoper1977/mattroper1977.github.io
          ref: main
          path: _reference/site
          fetch-depth: 1

      - name: Assemble the same-origin project mount
        shell: bash
        run: |
          set -euo pipefail
          if [ -f resources.json ]; then prefix=Lessons; else prefix=Matt-s-Apps-; fi
          mkdir -p "_served/$prefix"
          rsync -a --exclude=.git _reference/site/ _served/
          rsync -a --exclude=.git --exclude=_reference --exclude=_served --exclude=audit-output ./ "_served/$prefix/"
          echo "$prefix" > /tmp/mbm-prefix

      - name: Install the browser harness
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Run responsive, interaction and unchanged-standalone checks
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 4173 --bind 127.0.0.1 --directory _served >/tmp/mbm-http.log 2>&1 &
          server=$!
          trap 'kill $server || true' EXIT
          prefix=$(cat /tmp/mbm-prefix)
          for _ in $(seq 1 30); do curl -fsS "http://127.0.0.1:4173/$prefix/" >/dev/null && break; sleep 1; done
          MBM_BASE_URL="http://127.0.0.1:4173/$prefix/" node tools/verify_cross_estate_browser.mjs

      # The estate HUD is the only shared chrome these pages carry, and it is
      # served from the site origin - so this is the one job that can prove it,
      # because it is the one job that assembles both repositories onto a single
      # origin. A tool nobody runs is a doc asserting coverage that does not
      # exist. !cancelled() because this step owns coverage nothing else has.
      - name: HUD back and chosen-homepage controls on every Lessons game
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          prefix=$(cat /tmp/mbm-prefix)
          if [ "$prefix" != "Lessons" ]; then echo "not the Lessons estate; nothing to check"; exit 0; fi
          python -m http.server 4176 --bind 127.0.0.1 --directory _served >/tmp/mbm-hud-http.log 2>&1 &
          server=$!
          trap 'kill $server || true' EXIT
          for _ in $(seq 1 30); do curl -fsS "http://127.0.0.1:4176/" >/dev/null && break; sleep 1; done
          export MBM_SEARCH_INDEX="$PWD/_reference/site/data/mbm-search-index.json"
          node tools/verify_hud_on_lessons_games.mjs --self-test
          MBM_BASE_URL="http://127.0.0.1:4176/" node tools/verify_hud_on_lessons_games.mjs

      - name: Verify the published Education menu and unchanged standalone pages
        shell: bash
        run: |
          if [ -f resources.json ]; then prefix=Lessons; else prefix=Matt-s-Apps-; fi
          MBM_NAVIGATION_MODE=education MBM_BASE_URL="https://madebymatt.uk/$prefix/" MBM_BROWSER_OUTPUT=audit-output/published-navigation node tools/verify_cross_estate_browser.mjs

      - name: Print browser evidence
        if: always()
        shell: bash
        run: |
          test ! -f audit-output/browser-results.json || cat audit-output/browser-results.json

      - name: Upload responsive evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mbm-cross-estate-${{ github.event.pull_request.number || github.run_id }}-${{ github.run_id }}
          path: audit-output/
          if-no-files-found: error
          retention-days: 14

  live-proof:
    # Was `!= 'pull_request'`, which was exact while push, workflow_dispatch and
    # pull_request were the only triggers. Adding the schedule made it wrong:
    # this job posts to PR 95, so a daily cron would have left two comments a
    # day there forever. Named positively now, so a future trigger has to opt in
    # rather than be swept in.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: [static-contract, browser-matrix]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out the merged source
        uses: actions/checkout@v4

      - name: Install the production browser harness
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Wait for the exact project deployment
        shell: bash
        run: |
          set -euo pipefail
          if [ -f resources.json ]; then prefix=Lessons; manifest=resources.json; else prefix=Matt-s-Apps-; manifest=apps.json; fi
          base="https://madebymatt.uk/$prefix/"
          versioned="${base}?mbm=${GITHUB_SHA}"
          mkdir -p audit-output
          printf '{"source":"%s","base":"%s","versioned":"%s"}\n' "$GITHUB_SHA" "$base" "$versioned" > audit-output/deployment-target.json
          ready=0
          for _ in $(seq 1 60); do
            if curl -fsS --retry 2 -H 'Cache-Control: no-cache, no-store, max-age=0' -H 'Pragma: no-cache' "$versioned" -o /tmp/mbm-live-index.html && grep -Fq 'mbm-cross-estate-unification-lessons-apps-2026-08-08' /tmp/mbm-live-index.html; then
              ready=1
              break
            fi
            sleep 10
          done
          test "$ready" -eq 1
          for route in / /games/ /Lessons/ /Matt-s-Apps-/ /tools/ /resources/; do
            curl -fsS --retry 3 "https://madebymatt.uk$route" >/dev/null
          done
          curl -fsS --retry 3 -H 'Cache-Control: no-cache, no-store, max-age=0' "${base}${manifest}?mbm=${GITHUB_SHA}" | python -m json.tool >/dev/null
          for asset in mbm-platform.css mbm-platform.js mbm-theme.js mbm-hub.css; do
            curl -fsS --retry 3 -H 'Cache-Control: no-cache, no-store, max-age=0' "${base}assets/$asset?mbm=${GITHUB_SHA}" -o "/tmp/$asset"
            cmp "assets/$asset" "/tmp/$asset"
          done
          echo "$base" > /tmp/mbm-live-base

      - name: Prove the served responsive and standalone estate
        shell: bash
        run: |
          set -euo pipefail
          MBM_NAVIGATION_MODE=education MBM_BASE_URL="$(cat /tmp/mbm-live-base)" MBM_CACHE_BUST="$GITHUB_SHA" node tools/verify_cross_estate_browser.mjs

      - name: Record production proof on the release PR
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh pr comment 95 --repo "$GITHUB_REPOSITORY" --body "Production cross-estate proof passed on merged source \`$GITHUB_SHA\`. Run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Print live evidence
        if: always()
        shell: bash
        run: |
          test ! -f audit-output/browser-results.json || cat audit-output/browser-results.json

      - name: Upload production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mbm-cross-estate-live-${{ github.repository_id }}-${{ github.run_id }}
          path: audit-output/
          if-no-files-found: error
          retention-days: 30
