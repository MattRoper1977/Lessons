name: Science teaching pack downloads
on:
  pull_request:
    branches: [main]
    paths:
      - Science_Teesside/Teaching_Packs/**
      - Science_Teesside/index.html
      - assets/catalogue/science-download-bindings.json
      - tools/science_teaching_packs/**
      - .github/workflows/science-teaching-packs.yml
  workflow_run:
    workflows: [Education Pages publication]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      verify_live:
        description: Verify the published hub and exact download bytes after publication
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  responsive-downloads:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SCIENCE_PACK_SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      SCIENCE_PACK_PUBLICATION_RUN: ${{ github.event.workflow_run.id || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the existing estate browser dependencies
        run: |
          python -m pip install lxml==6.0.1
          npm install --no-save --no-package-lock playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: Verify source downloads and archive companions
        run: python tools/science_teaching_packs/check_packs.py
      - name: Check the local hub at phone and desktop widths
        if: github.event_name != 'workflow_run'
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 4187 --bind 127.0.0.1 >/tmp/science-pack-http.log 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4187/Science_Teesside/Teaching_Packs/ >/dev/null; then break; fi
            sleep 1
          done
          node tools/science_teaching_packs/check_hub_browser.cjs
      - name: Verify the published hub and all refreshed downloads
        if: github.event_name == 'workflow_run' || (github.event_name == 'workflow_dispatch' && inputs.verify_live)
        env:
          SCIENCE_PACK_BASE_URL: https://madebymatt.uk/Lessons/Science_Teesside/Teaching_Packs/
          SCIENCE_PACK_BROWSER_OUTPUT: audit-output/science-teaching-packs-live
        run: node tools/science_teaching_packs/check_hub_browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: science-teaching-packs-${{ github.run_id }}
          path: audit-output/science-teaching-packs*
          if-no-files-found: error
          retention-days: 30
