name: MBM cross-estate source audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mbm-cross-estate-lessons-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact branch under review
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build measured text-source snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit-output
          python - <<'PY'
          import hashlib, json, os, pathlib, subprocess, zipfile

          root = pathlib.Path('.').resolve()
          tracked = subprocess.check_output(['git', 'ls-files', '-z']).split(b'\0')
          tracked = [p.decode('utf-8', 'surrogateescape') for p in tracked if p]
          text_ext = {
              '.html', '.htm', '.css', '.js', '.mjs', '.cjs', '.json', '.md',
              '.txt', '.py', '.yml', '.yaml', '.xml', '.svg', '.csv', '.tsv',
              '.toml', '.ini', '.cfg', '.sh', '.ps1'
          }
          text_names = {'CNAME', 'LICENSE', 'README', '.nojekyll', '.gitignore'}
          inventory = []
          selected = []
          for rel in tracked:
              path = root / rel
              if not path.is_file():
                  continue
              size = path.stat().st_size
              suffix = path.suffix.lower()
              include = suffix in text_ext or path.name in text_names
              inventory.append({
                  'path': rel,
                  'size': size,
                  'suffix': suffix,
                  'selected': bool(include),
                  'sha256': hashlib.sha256(path.read_bytes()).hexdigest(),
              })
              if include:
                  selected.append(rel)

          state = {
              'sentinel': 'mbm-cross-estate-unification-lessons-apps-2026-08-08',
              'repository': os.environ.get('GITHUB_REPOSITORY'),
              'head': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'branch': subprocess.check_output(['git', 'branch', '--show-current'], text=True).strip(),
              'tracked_files': len(inventory),
              'selected_text_files': len(selected),
              'html_files': sum(1 for item in inventory if item['suffix'] in {'.html', '.htm'}),
              'css_files': sum(1 for item in inventory if item['suffix'] == '.css'),
              'js_files': sum(1 for item in inventory if item['suffix'] in {'.js', '.mjs', '.cjs'}),
              'json_files': sum(1 for item in inventory if item['suffix'] == '.json'),
              'top_level': sorted({item['path'].split('/', 1)[0] for item in inventory}),
          }
          pathlib.Path('audit-output/repository-state.json').write_text(json.dumps(state, indent=2) + '\n', encoding='utf-8')
          pathlib.Path('audit-output/file-inventory.json').write_text(json.dumps(inventory, indent=2) + '\n', encoding='utf-8')
          pathlib.Path('audit-output/selected-files.txt').write_text('\n'.join(selected) + '\n', encoding='utf-8')
          with zipfile.ZipFile('audit-output/text-source.zip', 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as zf:
              for rel in selected:
                  zf.write(root / rel, rel)
              zf.write('audit-output/repository-state.json', '_audit/repository-state.json')
              zf.write('audit-output/file-inventory.json', '_audit/file-inventory.json')
          print(json.dumps(state, indent=2))
          PY

      - name: Upload measured source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: mbm-cross-estate-lessons-source-${{ github.run_id }}
          path: audit-output/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
