name: MBM cross-estate source audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mbm-cross-estate-lessons-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  publish-verified-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BRANCH: codex/mbm-cross-estate-unification-lessons-apps-2026-08-08
    steps:
      - name: Check out the authorised Lessons branch
        uses: actions/checkout@v4
        with:
          ref: codex/mbm-cross-estate-unification-lessons-apps-2026-08-08
          fetch-depth: 0

      - name: Check out the canonical Made by Matt platform
        uses: actions/checkout@v4
        with:
          repository: MattRoper1977/mattroper1977.github.io
          ref: main
          path: _reference/site
          fetch-depth: 1

      - name: Apply the hash-locked release
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main "$BRANCH"
          git reset --hard "origin/$BRANCH"
          git merge-base --is-ancestor aad7b5017bbf517915304e2280894e9874647822 HEAD

          cat .github/mbm-cross-estate-delta.part-* | base64 -d > /tmp/mbm-lessons-delta.tar.gz
          echo "e943558a2cfd417959065561eb008ccf20ca2907480b8d4692c5dc63f548246e  /tmp/mbm-lessons-delta.tar.gz" | sha256sum -c -
          rm -rf /tmp/mbm-lessons-delta
          mkdir -p /tmp/mbm-lessons-delta
          tar -xzf /tmp/mbm-lessons-delta.tar.gz -C /tmp/mbm-lessons-delta
          test "$(find /tmp/mbm-lessons-delta -type f | wc -l)" -eq 6
          patch --batch --forward -p1 < /tmp/mbm-lessons-delta/index.patch
          rsync -a /tmp/mbm-lessons-delta/files/ ./

          mkdir -p assets
          cp _reference/site/assets/mbm-platform.css assets/mbm-platform.css
          cp _reference/site/assets/mbm-platform.js assets/mbm-platform.js
          cp _reference/site/theme.js assets/mbm-theme.js

          git rm -f --ignore-unmatch \
            .github/workflows/mbm-cross-estate-audit.yml \
            .github/workflows/mbm-cross-estate-reference-audit.yml \
            .github/workflows/mbm-cross-estate-release.yml \
            .github/mbm-cross-estate-payload.part-00 \
            .github/mbm-cross-estate-delta.part-00 \
            .github/mbm-cross-estate-delta.part-01 \
            .github/mbm-cross-estate-delta.part-02 \
            .github/mbm-cross-estate-delta.part-03
          git add \
            index.html \
            assets/mbm-platform.css \
            assets/mbm-platform.js \
            assets/mbm-theme.js \
            assets/mbm-hub.css \
            tools/verify_cross_estate_unification.py \
            tools/verify_cross_estate_browser.mjs \
            .github/workflows/mbm-cross-estate-unification.yml \
            docs/MBM_CROSS_ESTATE_UNIFICATION.md
          git diff --cached --check
          git config user.name "Made by Matt cross-estate release"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "feat: unify Lessons with the Made by Matt platform"

      - name: Run preservation, source-of-truth and positive-control gates
        shell: bash
        run: |
          set -euo pipefail
          python tools/verify_cross_estate_unification.py --base origin/main --canonical _reference/site --self-test
          python -m py_compile tools/verify_cross_estate_unification.py
          python -m json.tool resources.json >/dev/null
          node --check assets/mbm-platform.js
          node --check assets/mbm-theme.js
          node --check tools/verify_cross_estate_browser.mjs
          python - <<'PY'
          import pathlib, re
          text=pathlib.Path('index.html').read_text(encoding='utf-8')
          out=pathlib.Path('/tmp/mbm-inline-scripts'); out.mkdir(exist_ok=True)
          for i,body in enumerate(re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,re.S|re.I)):
              if body.strip(): (out/f'inline-{i}.js').write_text(body,encoding='utf-8')
          PY
          for script in /tmp/mbm-inline-scripts/*.js; do node --check "$script"; done
          git diff --check origin/main...HEAD

      - name: Push the verified release commit
        shell: bash
        run: |
          set -euo pipefail
          git push origin "HEAD:$BRANCH"
