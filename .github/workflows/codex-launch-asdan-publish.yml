name: Publish LAUNCH ASDAN visual upgrade

on:
  push:
    branches:
      - codex/launch-asdan-visual-upgrade
    paths:
      - .github/workflows/codex-launch-asdan-publish.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out publication branch
        uses: actions/checkout@v4
        with:
          ref: codex/launch-asdan-visual-upgrade
          fetch-depth: 0

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply and validate the shared visual layer
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          python3 - <<'PY'
          from __future__ import annotations

          import re
          import subprocess
          import tempfile
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import unquote, urlsplit

          root = Path.cwd()
          suite = root / "LAUNCH_ASDAN"
          css_path = suite / "visual-upgrade.css"
          js_path = suite / "visual-upgrade.js"
          guide_path = suite / "VISUAL_UPGRADE_GUIDE.md"

          CSS = r'''/* LAUNCH ASDAN shared visual-teaching layer
             Progressive enhancement only: existing strand colours, wording and controls remain authoritative. */
          :root {
            --vu-focus: var(--task-border, #D3A03C);
            --vu-primary: var(--lo-border, #4A6FA5);
            --vu-model: var(--ido-border, #C0784A);
            --vu-together: var(--wedo-border, #2E8F7B);
            --vu-surface: rgba(255,255,255,.96);
            --vu-ink: var(--text, #1f2937);
            --vu-shadow: 0 18px 42px rgba(15,23,42,.14);
            --vu-shadow-raised: 0 24px 60px rgba(15,23,42,.2);
            --vu-ease: cubic-bezier(.2,.7,.2,1);
          }

          html[data-visual-upgrade="ready"] {
            scroll-behavior: smooth;
          }

          html[data-visual-upgrade="ready"] body {
            text-rendering: optimizeLegibility;
            -webkit-font-smoothing: antialiased;
          }

          .slide-container {
            background:
              radial-gradient(circle at 12% 14%, color-mix(in srgb, var(--vu-primary) 8%, transparent), transparent 34%),
              radial-gradient(circle at 88% 86%, color-mix(in srgb, var(--vu-model) 7%, transparent), transparent 32%),
              var(--bg, #fff);
          }

          .slide {
            isolation: isolate;
            scrollbar-gutter: stable;
            box-shadow: var(--vu-shadow);
            transition: box-shadow .28s var(--vu-ease), border-color .28s var(--vu-ease);
          }

          .slide.active {
            box-shadow: var(--vu-shadow-raised);
          }

          .slide.active::after {
            content: "";
            position: absolute;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            border-radius: inherit;
            background: linear-gradient(135deg, color-mix(in srgb, var(--vu-primary) 4%, transparent), transparent 38%);
          }

          .slide h1,
          .slide h2 {
            text-wrap: balance;
          }

          .slide p,
          .slide li,
          .note,
          .bank {
            text-wrap: pretty;
          }

          .li-box,
          .ido-box,
          .task-box,
          .scaffold-box,
          .aspire-box,
          .sc-box,
          .wedo-capture,
          .compare-card,
          .react-q,
          .bio-block,
          .lundy-box,
          .card,
          .note,
          .bank {
            box-shadow: 0 7px 18px rgba(15,23,42,.07);
          }

          .controls,
          .fact-nav,
          .timer-btns,
          .level-toggle,
          .v5-step-controls {
            align-items: center;
          }

          .controls {
            padding: 8px;
            border: 1px solid rgba(148,163,184,.55);
            border-radius: 14px;
            background: rgba(255,255,255,.9);
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 28px rgba(15,23,42,.16);
          }

          :where(button, a, [role="button"], [tabindex]):focus-visible {
            outline: 4px solid var(--vu-focus) !important;
            outline-offset: 4px !important;
            box-shadow: 0 0 0 7px rgba(255,255,255,.94) !important;
          }

          :where(button, [role="button"], .match-pill, .match-target, .pres-card, .hl-sentence) {
            min-height: 44px;
          }

          :where(button, [role="button"], .match-pill, .match-target, .pres-card, .hl-sentence):active {
            transform: translateY(1px) scale(.99) !important;
          }

          .match-pill.selected,
          .pres-card[aria-pressed="true"],
          [aria-expanded="true"] {
            outline: 4px double currentColor;
            outline-offset: 3px;
          }

          .match-target.correct {
            border-style: double !important;
            border-width: 4px !important;
            box-shadow: inset 0 0 0 3px rgba(255,255,255,.78), 0 0 0 2px currentColor;
          }

          .match-target.wrong {
            border-style: dashed !important;
            border-width: 4px !important;
            box-shadow: inset 0 0 0 3px rgba(255,255,255,.78);
          }

          .v5-step.revealed,
          .answer[aria-hidden="false"],
          .hint-box.show,
          .wagoll-panel.visible {
            border-left-style: double;
            border-left-width: 7px;
          }

          .vu-reveal {
            opacity: 0;
            transform: translateY(12px);
          }

          .slide.active.vu-ready .vu-reveal {
            opacity: 1;
            transform: none;
            transition:
              opacity .38s var(--vu-ease),
              transform .38s var(--vu-ease);
            transition-delay: min(calc(var(--vu-order, 0) * 55ms), 440ms);
          }

          .slide:not(.active) *,
          .slide:not(.active) *::before,
          .slide:not(.active) *::after {
            animation-play-state: paused !important;
          }

          .slide.vu-motion-settled :where(.glow, .spin, .hand, .ride, .rip, .sweep, .title-dot) {
            animation-play-state: paused !important;
          }

          .vu-live-region {
            position: fixed !important;
            width: 1px !important;
            height: 1px !important;
            padding: 0 !important;
            margin: -1px !important;
            overflow: hidden !important;
            clip: rect(0 0 0 0) !important;
            white-space: nowrap !important;
            border: 0 !important;
          }

          @media (max-width: 900px) {
            .slide {
              width: 96%;
              height: 94%;
              padding: 28px;
              border-radius: 16px;
            }

            .controls {
              right: 10px;
              bottom: 14px;
              gap: 6px;
            }

            .controls button {
              padding: 9px 13px;
            }

            .content-grid,
            .arrival-grid,
            .compare-grid-3,
            .react-panel,
            .lundy-grid {
              gap: 14px;
            }
          }

          @media (max-width: 640px) {
            .slide {
              width: 100%;
              height: 100%;
              border-radius: 0;
              border-top-width: 7px;
              padding: 22px 18px 88px;
            }

            .slide h1 {
              font-size: clamp(1.65rem, 8vw, 2.15rem);
            }

            .slide h2 {
              margin-right: 0;
              font-size: clamp(1.35rem, 6.5vw, 1.8rem);
            }

            .content-grid,
            .arrival-grid,
            .compare-grid-3,
            .react-panel,
            .lundy-grid,
            .pres-wrap {
              grid-template-columns: 1fr !important;
            }

            .controls {
              left: 8px;
              right: 8px;
              justify-content: flex-end;
              overflow-x: auto;
            }

            .xp-wrap {
              max-width: calc(100vw - 28px);
            }
          }

          @media (prefers-reduced-motion: reduce) {
            html[data-visual-upgrade="ready"] {
              scroll-behavior: auto;
            }

            *, *::before, *::after {
              animation-duration: .01ms !important;
              animation-delay: 0ms !important;
              animation-iteration-count: 1 !important;
              transition-duration: .01ms !important;
              scroll-behavior: auto !important;
            }

            .vu-reveal,
            .slide.active.vu-ready .vu-reveal {
              opacity: 1 !important;
              transform: none !important;
            }
          }

          @media print {
            *, *::before, *::after {
              animation: none !important;
              transition: none !important;
              filter: none !important;
            }

            .slide,
            .card,
            .note,
            .bank,
            .li-box,
            .ido-box,
            .task-box,
            .scaffold-box,
            .aspire-box,
            .sc-box,
            .wedo-capture {
              box-shadow: none !important;
            }

            .vu-live-region {
              display: none !important;
            }
          }
          '''

          JS = r'''(() => {
            'use strict';

            const root = document.documentElement;
            if (root.dataset.visualUpgrade === 'ready' || root.dataset.visualUpgrade === 'loading') return;
            root.dataset.visualUpgrade = 'loading';

            const reducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            const motionTimers = new WeakMap();
            let liveRegion;
            let announceTimer;

            const nativeInteractive = (element) =>
              /^(A|BUTTON|INPUT|SELECT|TEXTAREA|SUMMARY)$/.test(element.tagName);

            function announce(message) {
              if (!message || !liveRegion) return;
              window.clearTimeout(announceTimer);
              liveRegion.textContent = '';
              announceTimer = window.setTimeout(() => {
                liveRegion.textContent = message;
              }, 30);
            }

            function createLiveRegion() {
              liveRegion = document.getElementById('vu-live-region');
              if (liveRegion) return;
              liveRegion = document.createElement('div');
              liveRegion.id = 'vu-live-region';
              liveRegion.className = 'vu-live-region';
              liveRegion.setAttribute('role', 'status');
              liveRegion.setAttribute('aria-live', 'polite');
              liveRegion.setAttribute('aria-atomic', 'true');
              document.body.appendChild(liveRegion);
            }

            function makeKeyboardOperable(element) {
              if (!element || element.dataset.vuKeyboard === 'true' || nativeInteractive(element)) return;
              element.dataset.vuKeyboard = 'true';
              if (!element.hasAttribute('role')) element.setAttribute('role', 'button');
              if (!element.hasAttribute('tabindex')) element.setAttribute('tabindex', '0');
              element.addEventListener('keydown', (event) => {
                if (event.key !== 'Enter' && event.key !== ' ') return;
                event.preventDefault();
                element.click();
              });
            }

            function syncInteractiveState(element) {
              if (!(element instanceof Element)) return;

              if (element.matches('.match-pill, .pres-card, .hint-btn, .wagoll-trigger, .v5-step-controls button')) {
                const pressed = element.classList.contains('selected') ||
                  element.classList.contains('done') ||
                  element.classList.contains('active') ||
                  element.getAttribute('aria-expanded') === 'true';
                element.setAttribute('aria-pressed', String(pressed));
              }

              if (element.matches('.answer')) {
                const visible = getComputedStyle(element).display !== 'none';
                element.setAttribute('aria-hidden', String(!visible));
              }

              if (element.matches('.hint-box, .wagoll-panel, .v5-step')) {
                const visible = element.classList.contains('show') ||
                  element.classList.contains('visible') ||
                  element.classList.contains('revealed');
                element.setAttribute('aria-hidden', String(!visible));
              }

              if (element.matches('.match-target.correct')) element.dataset.vuState = 'correct';
              else if (element.matches('.match-target.wrong')) element.dataset.vuState = 'incorrect';
              else if (element.matches('.match-target')) delete element.dataset.vuState;
            }

            function enhanceInteractive(scope = document) {
              const selector = [
                'button',
                'a[href]',
                '.match-pill',
                '.match-target',
                '.pres-card',
                '.hl-sentence',
                '.fact-dot',
                '[onclick]'
              ].join(',');

              scope.querySelectorAll(selector).forEach((element) => {
                makeKeyboardOperable(element);
                if (!element.getAttribute('aria-label') && element.getAttribute('title') && !element.textContent.trim()) {
                  element.setAttribute('aria-label', element.getAttribute('title'));
                }
                syncInteractiveState(element);
              });
            }

            function prepareReveal(slide) {
              const selectors = [
                '.slide-tag',
                'h1',
                'h2',
                '.li-box',
                '.ido-box',
                '.task-box',
                '.wedo-capture',
                '.scaffold-box',
                '.aspire-box',
                '.sc-box',
                '.ilm',
                '.content-grid > *',
                '.arrival-grid > *',
                '.compare-grid-3 > *',
                '.lundy-grid > *'
              ].join(',');

              let order = 0;
              slide.querySelectorAll(selectors).forEach((element) => {
                if (element.closest('.slide') !== slide || element.classList.contains('vu-reveal')) return;
                element.classList.add('vu-reveal');
                element.style.setProperty('--vu-order', String(Math.min(order++, 8)));
              });
            }

            function settleMotion(slide) {
              const previous = motionTimers.get(slide);
              if (previous) window.clearTimeout(previous);
              slide.classList.remove('vu-motion-settled');
              if (reducedMotion) {
                slide.classList.add('vu-motion-settled');
                return;
              }
              motionTimers.set(slide, window.setTimeout(() => {
                slide.classList.add('vu-motion-settled');
              }, 6500));
            }

            function syncSlides({ announceCurrent = false } = {}) {
              const slides = Array.from(document.querySelectorAll('.slide'));
              slides.forEach((slide, index) => {
                const active = slide.classList.contains('active');
                slide.setAttribute('aria-hidden', String(!active));
                slide.dataset.vuIndex = String(index + 1);
                prepareReveal(slide);
                if (active) {
                  slide.classList.remove('vu-ready');
                  requestAnimationFrame(() => slide.classList.add('vu-ready'));
                  settleMotion(slide);
                  if (announceCurrent) {
                    const title = slide.getAttribute('data-title') || slide.querySelector('h1,h2')?.textContent?.trim() || `Slide ${index + 1}`;
                    announce(`${title}. Slide ${index + 1} of ${slides.length}.`);
                  }
                }
              });

              const progress = document.getElementById('progressLabel');
              if (progress) {
                progress.setAttribute('role', 'status');
                progress.setAttribute('aria-live', 'polite');
              }
            }

            function describeInteraction(target) {
              if (!(target instanceof Element)) return;
              const matchTarget = target.closest('.match-target');
              if (matchTarget?.classList.contains('correct')) announce('Correct selection confirmed.');
              else if (matchTarget?.classList.contains('wrong')) announce('That selection is not correct yet. Try again.');
              else if (target.closest('.v5-step-controls')) announce('Next teaching step revealed.');
              else if (target.closest('.hint-btn')) {
                const box = target.closest('.hint-btn')?.nextElementSibling;
                announce(box?.classList.contains('show') ? 'Hint shown.' : 'Hint hidden.');
              } else if (target.closest('.wagoll-trigger')) announce('Model example shown.');
            }

            function installObservers() {
              const observer = new MutationObserver((mutations) => {
                let slidesChanged = false;
                for (const mutation of mutations) {
                  if (mutation.type === 'attributes') {
                    const element = mutation.target;
                    syncInteractiveState(element);
                    if (element.classList?.contains('slide')) slidesChanged = true;
                  }
                  mutation.addedNodes.forEach((node) => {
                    if (!(node instanceof Element)) return;
                    enhanceInteractive(node);
                    syncInteractiveState(node);
                  });
                }
                if (slidesChanged) syncSlides({ announceCurrent: true });
              });

              observer.observe(document.body, {
                subtree: true,
                childList: true,
                attributes: true,
                attributeFilter: ['class', 'aria-expanded', 'hidden']
              });
            }

            function init() {
              if (!document.body || root.dataset.visualUpgrade === 'ready') return;
              createLiveRegion();
              enhanceInteractive();
              syncSlides();
              installObservers();
              document.addEventListener('click', (event) => {
                window.setTimeout(() => {
                  enhanceInteractive();
                  document.querySelectorAll('.answer, .hint-box, .wagoll-panel, .v5-step, .match-target').forEach(syncInteractiveState);
                  describeInteraction(event.target);
                }, 0);
              }, true);
              root.dataset.visualUpgrade = 'ready';
            }

            if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init, { once: true });
            else init();
          })();
          '''

          GUIDE = r'''# LAUNCH ASDAN visual upgrade guide

          ## Purpose

          `visual-upgrade.css` and `visual-upgrade.js` form a progressive-enhancement layer for the complete LAUNCH ASDAN suite. They strengthen visual hierarchy, teacher-led pacing, interaction-state clarity, keyboard access, reduced-motion behaviour and print stability without replacing the existing v5 lesson chassis or changing curriculum content.

          ## Integration contract

          All 38 HTML entry points load both shared assets. Files at the root of `LAUNCH_ASDAN/` use `visual-upgrade.css` and `visual-upgrade.js`; strand pages one directory deeper use `../visual-upgrade.css` and `../visual-upgrade.js`.

          The shared layer must remain additive:

          - preserve every existing word, question, answer, instruction, link and activity sequence;
          - keep strand palettes and existing CSS custom properties authoritative;
          - keep all existing navigation, timers, print controls, answer reveals and teacher controls;
          - avoid frameworks and external animation dependencies;
          - put state information into structure, border treatment and accessibility attributes rather than colour alone;
          - keep runtime announcements non-visible and meaning-neutral.

          ## Motion policy

          Motion is tied to the active teaching slide. Off-screen slides are paused, visual elements reveal in a short controlled sequence, and continuous decorative motion settles after a brief teaching window. `prefers-reduced-motion` removes reveal movement and collapses animation and transition durations. Print output suppresses all motion and shadows.

          ## Accessibility behaviour

          The script is guarded and idempotent. It adds keyboard activation to non-native clickable controls, synchronises common pressed, revealed and hidden states, marks inactive slides as hidden from assistive technology, and announces slide and interaction changes through a visually hidden polite live region. Existing native semantics are retained.

          ## Maintenance checklist

          1. Keep both shared references in every new LAUNCH ASDAN HTML entry point.
          2. Use existing strand variables before adding any new colour value.
          3. Prefer a short reveal or state transition to looping motion.
          4. Test keyboard focus, answer and hint states, timers, printing and reduced-motion mode.
          5. Run `node --check LAUNCH_ASDAN/visual-upgrade.js` and the repository's available HTML and asset checks before publication.
          6. Confirm visible text is unchanged whenever shared references are added to generated lesson pages.
          '''

          css_path.write_text(CSS.strip() + "\n", encoding="utf-8")
          js_path.write_text(JS.strip() + "\n", encoding="utf-8")
          guide_path.write_text(GUIDE.strip() + "\n", encoding="utf-8")

          html_files = sorted(suite.rglob("*.html"))
          if len(html_files) != 38:
              raise SystemExit(f"Expected 38 LAUNCH ASDAN HTML entry points, found {len(html_files)}")

          class TextCollector(HTMLParser):
              ignored = {"script", "style", "template", "noscript"}
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.depth = 0
                  self.parts: list[str] = []
              def handle_starttag(self, tag, attrs):
                  if tag.lower() in self.ignored:
                      self.depth += 1
              def handle_endtag(self, tag):
                  if tag.lower() in self.ignored and self.depth:
                      self.depth -= 1
              def handle_data(self, data):
                  if not self.depth:
                      self.parts.append(data)

          class RefCollector(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.refs: list[str] = []
              def handle_starttag(self, tag, attrs):
                  for name, value in attrs:
                      if name.lower() in {"href", "src"} and value:
                          self.refs.append(value)

          def visible_text(text: str) -> list[str]:
              parser = TextCollector()
              parser.feed(text)
              parser.close()
              return parser.parts

          originals: dict[Path, str] = {}
          modified = 0
          for path in html_files:
              original = path.read_text(encoding="utf-8")
              originals[path] = original
              depth = len(path.relative_to(suite).parts) - 1
              prefix = "../" * depth
              css_ref = prefix + "visual-upgrade.css"
              js_ref = prefix + "visual-upgrade.js"

              if "visual-upgrade.css" in original or "visual-upgrade.js" in original:
                  if css_ref in original and js_ref in original:
                      continue
                  raise SystemExit(f"Partial or incorrect shared references in {path}")

              linked, count = re.subn(
                  r"(?i)</head>",
                  f'<link rel="stylesheet" href="{css_ref}">\n</head>',
                  original,
                  count=1,
              )
              if count != 1:
                  raise SystemExit(f"Missing unique closing head tag in {path}")

              enhanced, count = re.subn(
                  r"(?i)</body>",
                  f'<script src="{js_ref}" defer></script>\n</body>',
                  linked,
                  count=1,
              )
              if count != 1:
                  raise SystemExit(f"Missing unique closing body tag in {path}")

              if visible_text(original) != visible_text(enhanced):
                  raise SystemExit(f"Visible text changed in {path}")

              path.write_text(enhanced, encoding="utf-8")
              modified += 1

          if modified != 38:
              raise SystemExit(f"Expected to modify 38 HTML files, modified {modified}")

          print(f"PASS HTML coverage: {len(html_files)} entry points")
          print("PASS visible-text comparison: all 38 entry points unchanged")

          for path in html_files:
              current = path.read_text(encoding="utf-8")
              parser = TextCollector()
              parser.feed(current)
              parser.close()
              depth = len(path.relative_to(suite).parts) - 1
              prefix = "../" * depth
              if current.count(prefix + "visual-upgrade.css") != 1:
                  raise SystemExit(f"Shared stylesheet coverage failed for {path}")
              if current.count(prefix + "visual-upgrade.js") != 1:
                  raise SystemExit(f"Shared script coverage failed for {path}")
          print("PASS HTML parsing and shared-asset reference coverage")

          def missing_local_refs(path: Path, text: str) -> set[str]:
              parser = RefCollector()
              parser.feed(text)
              parser.close()
              missing: set[str] = set()
              for raw in parser.refs:
                  raw = raw.strip()
                  if not raw or raw.startswith(('#', 'data:', 'mailto:', 'tel:', 'javascript:', '//')):
                      continue
                  split = urlsplit(raw)
                  if split.scheme or split.netloc:
                      continue
                  rel = unquote(split.path)
                  if not rel:
                      continue
                  candidate = (path.parent / rel).resolve()
                  try:
                      candidate.relative_to(root.resolve())
                  except ValueError:
                      missing.add(raw)
                      continue
                  if not candidate.exists():
                      missing.add(raw)
              return missing

          pre_missing: dict[str, list[str]] = {}
          post_missing: dict[str, list[str]] = {}
          for path in html_files:
              before = missing_local_refs(path, originals[path])
              after = missing_local_refs(path, path.read_text(encoding="utf-8"))
              if before:
                  pre_missing[str(path.relative_to(root))] = sorted(before)
              if after:
                  post_missing[str(path.relative_to(root))] = sorted(after)
          if post_missing != pre_missing:
              raise SystemExit(f"New or changed unresolved local assets: before={pre_missing}, after={post_missing}")
          if pre_missing:
              print(f"PRE-EXISTING FAILURE local asset resolution: {pre_missing}")
          else:
              print("PASS local asset resolution")

          subprocess.run(["node", "--check", str(js_path)], check=True)
          print("PASS node --check LAUNCH_ASDAN/visual-upgrade.js")

          script_pattern = re.compile(r"(?is)<script\b([^>]*)>(.*?)</script>")
          type_pattern = re.compile(r"\btype\s*=\s*(['\"])(.*?)\1", re.I)

          def inline_failures(label: str, mapping: dict[Path, str]) -> set[str]:
              failures: set[str] = set()
              with tempfile.TemporaryDirectory() as td:
                  temp = Path(td)
                  for path, text in mapping.items():
                      for index, match in enumerate(script_pattern.finditer(text), start=1):
                          attrs, body = match.groups()
                          if re.search(r"\bsrc\s*=", attrs, re.I):
                              continue
                          type_match = type_pattern.search(attrs)
                          script_type = type_match.group(2).strip().lower() if type_match else ""
                          if script_type not in {"", "text/javascript", "application/javascript", "module"}:
                              continue
                          suffix = ".mjs" if script_type == "module" else ".js"
                          target = temp / f"{label}-{path.stem}-{index}{suffix}"
                          target.write_text(body, encoding="utf-8")
                          result = subprocess.run(["node", "--check", str(target)], capture_output=True, text=True)
                          if result.returncode:
                              failures.add(f"{path.relative_to(root)}#script-{index}")
              return failures

          before_inline = inline_failures("before", originals)
          after_inline = inline_failures("after", {p: p.read_text(encoding='utf-8') for p in html_files})
          if after_inline != before_inline:
              raise SystemExit(f"Inline JavaScript syntax changed: before={before_inline}, after={after_inline}")
          if before_inline:
              print(f"PRE-EXISTING FAILURE inline JavaScript syntax: {sorted(before_inline)}")
          else:
              print("PASS inline JavaScript syntax across all entry points")

          def balanced_css(text: str) -> bool:
              text = re.sub(r"/\*.*?\*/", "", text, flags=re.S)
              text = re.sub(r"(['\"])(?:\\.|(?!\1).)*\1", "", text)
              depth = 0
              for char in text:
                  if char == '{':
                      depth += 1
                  elif char == '}':
                      depth -= 1
                      if depth < 0:
                          return False
              return depth == 0

          if not balanced_css(css_path.read_text(encoding="utf-8")):
              raise SystemExit("Unbalanced CSS braces")
          if "dataset.visualUpgrade" not in js_path.read_text(encoding="utf-8"):
              raise SystemExit("JavaScript idempotency guard missing")
          print("PASS shared CSS structure and JavaScript idempotency guard")

          hygiene = re.compile(r"<<<<<<<|=======|>>>>>>>|\bTODO\b|\bFIXME\b|\bdebugger\b|console\.log\s*\(", re.I)
          for path in [css_path, js_path, guide_path]:
              if hygiene.search(path.read_text(encoding="utf-8")):
                  raise SystemExit(f"Conflict, unfinished or debug artefact in {path}")
          print("PASS conflict-marker and unfinished/debug artefact scan")

          lesson_files = [p for p in html_files if p.parent != suite and p.name != "START_HERE.html"]
          if len(lesson_files) != 30:
              raise SystemExit(f"Expected 30 lesson pages, found {len(lesson_files)}")
          feature_checks = {
              "navigation": re.compile(r"nextSlide|prevSlide|class=\"controls\"", re.I),
              "answer reveals": re.compile(r"show-ans|class=\"answer\"|reveal", re.I),
              "timers": re.compile(r"timer-widget|auto-timer|startTimer", re.I),
          }
          for label, pattern in feature_checks.items():
              missing = [str(p.relative_to(root)) for p in lesson_files if not pattern.search(p.read_text(encoding="utf-8"))]
              if missing:
                  raise SystemExit(f"Existing {label} hook missing from lesson pages: {missing}")
          print("PASS existing navigation, answer-reveal and timer hooks retained")

          if "focus-visible" not in CSS or "prefers-reduced-motion" not in CSS or "@media print" not in CSS:
              raise SystemExit("Focus, reduced-motion or print safeguards missing")
          if "border-style: double" not in CSS or "border-style: dashed" not in CSS:
              raise SystemExit("Non-colour state cues missing")
          print("PASS focus, non-colour state, reduced-motion and print safeguards")
          PY

          rm -f .github/workflows/codex-launch-asdan-publish.yml

          changed="$(git diff --name-only origin/main)"
          test -n "$changed"
          invalid="$(printf '%s\n' "$changed" | grep -v '^LAUNCH_ASDAN/' || true)"
          if [ -n "$invalid" ]; then
            printf 'Final diff contains out-of-scope paths:\n%s\n' "$invalid" >&2
            exit 1
          fi

          test "$(printf '%s\n' "$changed" | wc -l | tr -d ' ')" = "41"
          test "$(printf '%s\n' "$changed" | grep -c '\.html$')" = "38"
          printf 'PASS final changed-file scope: 41 files, all under LAUNCH_ASDAN/\n'

          if grep -RInE '^(<<<<<<<|=======|>>>>>>>)' LAUNCH_ASDAN; then
            echo 'Conflict markers detected' >&2
            exit 1
          fi

          git diff --check origin/main
          printf 'PASS git diff --check\n'
          printf 'NOT AVAILABLE browser viewport and reduced-motion rendering: no browser tooling installed in this runner\n'

      - name: Commit and publish the completed upgrade
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: upgrade LAUNCH ASDAN visual and interaction design"
          git push origin HEAD:codex/launch-asdan-visual-upgrade
