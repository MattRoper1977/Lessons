name: Audit GROW ASDAN teaching interactions

on:
  pull_request:
    branches: [main]
    paths:
      - 'GROW_ASDAN/**'
      - '.github/workflows/codex-grow-asdan-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install browser driver
        run: npm install --no-save puppeteer-core@24

      - name: Inventory lessons, We Do activities and authored motion
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/grow-http.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT

          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const cp = require('child_process');
          const puppeteer = require('puppeteer-core');
          const delay = ms => new Promise(resolve => setTimeout(resolve, ms));

          const chrome = ['google-chrome','chromium','chromium-browser']
            .map(name => { try { return cp.execFileSync('bash',['-lc',`command -v ${name}`],{encoding:'utf8'}).trim(); } catch { return ''; } })
            .find(Boolean);
          if (!chrome) throw new Error('No Chrome/Chromium executable found');

          const walk = dir => fs.readdirSync(dir,{withFileTypes:true}).flatMap(entry => entry.isDirectory() ? walk(path.join(dir,entry.name)) : [path.join(dir,entry.name)]);
          const allFiles = walk('GROW_ASDAN').map(file => file.replaceAll('\\','/'));
          const htmlFiles = allFiles.filter(file => file.endsWith('.html'));
          const lessonFiles = htmlFiles.filter(file => !/(START_HERE|GROW_ASDAN_Hub|Scheme_and_Resources)\.html$/.test(file));
          console.log('FILE_CENSUS', JSON.stringify({htmlFiles, lessonFiles, allFiles}));

          const staticMotion = {};
          for (const file of lessonFiles) {
            const text = fs.readFileSync(file,'utf8');
            staticMotion[file] = {
              keyframes: [...text.matchAll(/@keyframes\s+([\w-]+)/g)].map(match => match[1]),
              animationDeclarations: [...text.matchAll(/animation(?:-name)?\s*:\s*([^;}]+)/g)].map(match => match[1].trim()).slice(0,120),
              svgCount: (text.match(/<svg\b/gi)||[]).length,
              reducedMotion: /prefers-reduced-motion\s*:\s*reduce/i.test(text),
              printRules: (text.match(/@media\s+print/gi)||[]).length,
              continuousClassMentions: Object.fromEntries(['glow','spin','hand','ride','rip','sweep','float','pulse','confetti','title-dot'].map(name => [name,(text.match(new RegExp(`class=["'][^"']*\\b${name}\\b`,'g'))||[]).length]))
            };
          }
          console.log('STATIC_MOTION', JSON.stringify(staticMotion));

          (async () => {
            const browser = await puppeteer.launch({
              executablePath: chrome,
              headless: true,
              protocolTimeout: 120000,
              args: ['--no-sandbox','--disable-dev-shm-usage']
            });

            const failures = [];
            const inventories = [];
            const representative = ['PEQ','Community_Project','Enterprise'].map(folder => lessonFiles.find(file => file.includes(`/${folder}/`)));

            for (const file of representative) {
              const page = await browser.newPage();
              await page.setViewport({width:1280,height:800});
              const errors = [];
              const consoleErrors = [];
              page.on('pageerror', error => errors.push(String(error)));
              page.on('console', message => { if (message.type()==='error') consoleErrors.push(message.text()); });
              await page.goto(`http://127.0.0.1:4173/${encodeURI(file)}`,{waitUntil:'load',timeout:30000});
              await delay(500);

              const before = await page.evaluate(() => ({
                slides: document.querySelectorAll('.slide').length,
                activeIndex: [...document.querySelectorAll('.slide')].findIndex(slide => slide.classList.contains('active')),
                activeCount: document.querySelectorAll('.slide.active').length,
                controls: [...document.querySelectorAll('.controls button')].map(button => ({text:button.textContent.trim(),onclick:button.getAttribute('onclick')})),
                progress: document.getElementById('progressLabel')?.textContent || null
              }));
              if (before.activeCount!==1) failures.push(`${file}: active slide count ${before.activeCount}`);
              if (errors.length) failures.push(`${file}: page errors ${errors.join(' | ')}`);
              if (consoleErrors.length) failures.push(`${file}: console errors ${consoleErrors.join(' | ')}`);

              const buttons = await page.$$('.controls button');
              const next = await page.$('button[onclick*="nextSlide"]') || buttons.at(-1);
              if (!next) failures.push(`${file}: no next navigation control`);
              else {
                await next.click();
                await delay(350);
                const after = await page.evaluate(() => ({
                  activeIndex: [...document.querySelectorAll('.slide')].findIndex(slide => slide.classList.contains('active')),
                  activeCount: document.querySelectorAll('.slide.active').length
                }));
                if (after.activeCount!==1 || after.activeIndex!==before.activeIndex+1) failures.push(`${file}: next navigation ${before.activeIndex}->${after.activeIndex}, active=${after.activeCount}`);
                console.log('NAVIGATION', JSON.stringify({file,before,after}));
              }

              await page.setViewport({width:390,height:844});
              await delay(200);
              const mobile = await page.evaluate(() => {
                const buttons = [...document.querySelectorAll('.controls button')].map(button => {
                  const rect = button.getBoundingClientRect();
                  return {text:button.textContent.trim(),left:rect.left,right:rect.right,top:rect.top,bottom:rect.bottom};
                });
                return {buttons,visible:buttons.every(rect => rect.right>0&&rect.left<innerWidth&&rect.bottom>0&&rect.top<innerHeight)};
              });
              if (!mobile.visible) failures.push(`${file}: navigation control off-screen at 390px`);
              console.log('MOBILE', JSON.stringify({file,mobile}));
              await page.close();
            }

            for (const file of lessonFiles) {
              const page = await browser.newPage();
              await page.setViewport({width:1200,height:800});
              const errors = [];
              page.on('pageerror', error => errors.push(String(error)));
              await page.goto(`http://127.0.0.1:4173/${encodeURI(file)}`,{waitUntil:'domcontentloaded',timeout:30000});
              await delay(100);
              const inventory = await page.evaluate(() => {
                const weDoSlides = [...document.querySelectorAll('.slide')].filter(slide => /\bwe do\b/i.test(`${slide.dataset.title||''} ${slide.querySelector('.slide-tag')?.textContent||''}`) || slide.dataset.type==='wedo');
                const describe = slide => {
                  const classes = [...new Set([...slide.querySelectorAll('[class]')].flatMap(element => [...element.classList]))].sort();
                  const onclick = [...slide.querySelectorAll('[onclick]')].map(element => element.getAttribute('onclick')).filter(Boolean);
                  const buttons = [...slide.querySelectorAll('button')].map(button => button.textContent.trim()).filter(Boolean);
                  const text = (slide.innerText||'').replace(/\s+/g,' ').trim();
                  const interactiveCount = slide.querySelectorAll('button,input,textarea,select,[onclick],.match-pill,.match-target,.pres-card,.hl-sentence,[role="button"],[tabindex]').length;
                  return {
                    title: slide.dataset.title || slide.querySelector('h1,h2')?.textContent?.trim() || 'We Do',
                    dataType: slide.dataset.type || null,
                    id: slide.id || null,
                    textPreview: text.slice(0,420),
                    interactiveCount,
                    buttons,
                    onclick,
                    classes,
                    counts: {
                      buttons: slide.querySelectorAll('button').length,
                      fields: slide.querySelectorAll('input,textarea,select').length,
                      matchPills: slide.querySelectorAll('.match-pill').length,
                      matchTargets: slide.querySelectorAll('.match-target').length,
                      presCards: slide.querySelectorAll('.pres-card').length,
                      highlights: slide.querySelectorAll('.hl-sentence').length,
                      carousels: slide.querySelectorAll('.fact-carousel').length,
                      steps: slide.querySelectorAll('.v5-step').length,
                      captures: slide.querySelectorAll('.wedo-capture').length,
                      compareCards: slide.querySelectorAll('.compare-card').length,
                      taskBoxes: slide.querySelectorAll('.task-box').length,
                      svg: slide.querySelectorAll('svg').length
                    }
                  };
                };
                return {
                  slides: document.querySelectorAll('.slide').length,
                  weDo: weDoSlides.map(describe),
                  svg: [...document.querySelectorAll('svg')].map(svg => ({
                    className: svg.getAttribute('class'),
                    ariaHidden: svg.getAttribute('aria-hidden'),
                    ariaLabel: svg.getAttribute('aria-label'),
                    descendantClasses: [...new Set([...svg.querySelectorAll('[class]')].flatMap(element => [...element.classList]))].sort()
                  }))
                };
              });
              inventories.push({file,...inventory,pageErrors:errors});
              if (errors.length) failures.push(`${file}: page errors ${errors.join(' | ')}`);
              await page.close();
            }

            const weDo = inventories.flatMap(item => item.weDo.map(slide => ({file:item.file,...slide})));
            const classCounts = {};
            for (const slide of weDo) for (const name of slide.classes) classCounts[name]=(classCounts[name]||0)+1;
            const interactionSummary = {
              lessons: lessonFiles.length,
              totalWeDo: weDo.length,
              staticWeDo: weDo.filter(slide => slide.interactiveCount===0).map(slide => ({file:slide.file,title:slide.title,preview:slide.textPreview,counts:slide.counts})),
              typeCounts: {
                matching: weDo.filter(slide => slide.counts.matchPills||slide.counts.matchTargets).length,
                presentationCards: weDo.filter(slide => slide.counts.presCards).length,
                highlighting: weDo.filter(slide => slide.counts.highlights).length,
                carousel: weDo.filter(slide => slide.counts.carousels).length,
                staged: weDo.filter(slide => slide.counts.steps).length,
                fields: weDo.filter(slide => slide.counts.fields).length
              },
              classCounts
            };

            console.log('WE_DO_INVENTORY', JSON.stringify(inventories));
            console.log('INTERACTION_SUMMARY', JSON.stringify(interactionSummary));
            console.log('AUDIT_FAILURES', JSON.stringify(failures));
            await browser.close();
            if (failures.length) throw new Error(failures.join('\n'));
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
