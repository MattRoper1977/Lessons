name: GROW LAUNCH v3 generation and browser gate

on:
  push:
    branches:
      - claude/gl-estate-v3
    paths:
      - .github/workflows/glv3-generation-gate.yml
      - _glv3/tools/closeout_reconcile.py
      - _glv3/tools/deploy.py
      - _glv3/tools/browser_verify.mjs
      - _glv3/tools/chip_gate.mjs
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: glv3-generation-gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out exact recovery head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record exact integration base
        id: base
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          printf 'sha=%s\n' "$(git rev-parse origin/main)" >> "$GITHUB_OUTPUT"
          printf 'branch_sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git merge-base --is-ancestor origin/main HEAD

      - name: Reconstruct proven source transport
        shell: bash
        run: |
          set -euo pipefail
          for f in _glv3/input/valid.part{00..09}.b64; do test -s "$f"; done
          cat _glv3/input/valid.part{00..09}.b64 | tr -d '[:space:]' | base64 --decode > /tmp/glv3-packs.tar.xz
          echo '782ff5865e1406c159c78081bcc218bdaa46678e5c42448a6f298f696ca73f5e  /tmp/glv3-packs.tar.xz' | sha256sum -c -
          test "$(stat -c '%s' /tmp/glv3-packs.tar.xz)" = 102160
          xz --test /tmp/glv3-packs.tar.xz
          rm -rf /tmp/glv3-packs
          mkdir -p /tmp/glv3-packs
          tar -xJf /tmp/glv3-packs.tar.xz -C /tmp/glv3-packs
          test "$(find /tmp/glv3-packs/grow -type f | wc -l)" = 51
          test "$(find /tmp/glv3-packs/launch -type f | wc -l)" = 63

      - name: Reconcile exact input, counts and protected baselines
        shell: bash
        run: |
          set -euo pipefail
          python _glv3/tools/closeout_reconcile.py \
            --repo "$GITHUB_WORKSPACE" \
            --grow /tmp/glv3-packs/grow \
            --launch /tmp/glv3-packs/launch \
            --historic-sha 1e8a428b523d1b970a8a3a2ab2a99f48a8271d09 \
            --integration-sha '${{ steps.base.outputs.sha }}' \
            --starting-branch-sha '${{ steps.base.outputs.branch_sha }}' \
            --transport /tmp/glv3-packs.tar.xz

      - name: Prepare current static verifier interface
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir beautifulsoup4==4.13.4
          python - <<'PYPATCH'
          from pathlib import Path
          p = Path('_glv3/tools/deploy.py')
          text = p.read_text('utf-8')
          old = '        require(source and git_exists(source), f"{pathway}: live counterpart missing/unknown for {pack_rel}: {source}")'
          new = '''        require(source, f"{pathway}: live counterpart missing/unknown for {pack_rel}: {source}")
        if not git_exists(source):
            tree_paths = sh("git", "ls-tree", "-r", "--name-only", ROLLBACK).stdout.splitlines()
            matches = [candidate for candidate in tree_paths if candidate.casefold() == source.casefold()]
            require(len(matches) == 1,
                    f"{pathway}: live counterpart missing/ambiguous after exact casefold lookup for {pack_rel}: {source}; matches={matches[:5]}")
            source = matches[0]'''
          if old in text:
              text = text.replace(old, new, 1)
              p.write_text(text, 'utf-8')
          elif 'exact casefold lookup' not in text:
              raise SystemExit('deploy.py live-counterpart guard no longer matches expected interface; refusing blind patch')
          PYPATCH
          python -m py_compile _glv3/tools/deploy.py

      - name: Generate both parallel estates and static dossier
        env:
          GLV3_GROW_SRC: /tmp/glv3-packs/grow
          GLV3_LAUNCH_SRC: /tmp/glv3-packs/launch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf GROW_Estate_v3 LAUNCH_Estate_v3 _glv3/contact_sheet
          python _glv3/tools/deploy.py

      - name: Prove generated count and union invariants
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib
          root=pathlib.Path('.')
          grow=list((root/'GROW_Estate_v3').rglob('*.html'))
          launch=list((root/'LAUNCH_Estate_v3').rglob('*.html'))
          assert len(grow)+len(launch)==94, (len(grow),len(launch))
          assert (root/'_glv3/GATES_STATIC.json').is_file()
          assert (root/'_glv3/REPORT.md').is_file()
          assert (root/'_glv3/AMBERS.md').is_file()
          assert (root/'_glv3/run_manifest.json').is_file()
          resources=json.loads((root/'resources.json').read_text())
          rows=resources if isinstance(resources,list) else resources.get('resources') or resources.get('items') or resources.get('records')
          assert isinstance(rows,list), type(rows)
          glv3=[r for r in rows if str(r.get('id','')).startswith('glv3-')]
          assert len(glv3)==88, len(glv3)
          assert len({r['id'] for r in glv3})==88
          assert sum(1 for r in glv3 if str(r.get('type','')).lower()=='lesson')==80
          for required in ['_glv3/INPUT_INTEGRITY.json','_glv3/COUNT_RECONCILIATION.json','_glv3/PROTECTED_TREES.json','_glv3/AUTONOMOUS_SENTINEL.json']:
              assert (root/required).is_file(), required
          print(json.dumps({'grow_html':len(grow),'launch_html':len(launch),'html_total':len(grow)+len(launch),'glv3_resources':len(glv3)}))
          PY
          ! grep -RIl --exclude-dir=.git '_OUTSTANDING_V3_TEST' GROW_Estate_v3 LAUNCH_Estate_v3
          ! find GROW_Estate_v3 LAUNCH_Estate_v3 -type f \( -name '*.md' -o -name '*.markdown' \) -print -quit | grep -q .
          ! find GROW_Estate_v3 LAUNCH_Estate_v3 -type d -iname 'science' -print -quit | grep -q .
          test -z "$(git diff --name-only -- Art_Teesside GROW_ASDAN LAUNCH_ASDAN Grow/Slideshows Launch/Slideshows Science_Teesside Humanities_Teesside Baseline_Weeks BUILD_Estate_v3)"
          git diff --check

      - name: Install browser gate dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir pillow lxml
          npm install --no-save --no-package-lock playwright@1.55.0 sharp pngjs pdfjs-dist
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends imagemagick poppler-utils

      - name: Run all-page Chromium, interaction, mobile, print and contact-sheet gate
        env:
          BASE_URL: http://127.0.0.1:4173
          GLV3_BASE_URL: http://127.0.0.1:4173
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 4173 --bind 127.0.0.1 --directory "$GITHUB_WORKSPACE" >/tmp/glv3-http.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true; cat /tmp/glv3-http.log || true' EXIT
          for _ in $(seq 1 40); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 0.25; done
          timeout 50m node _glv3/tools/browser_verify.mjs
          kill "$server" 2>/dev/null || true
          wait "$server" 2>/dev/null || true
          trap - EXIT

      - name: Run catalogue chip count gate
        env:
          BASE_URL: http://127.0.0.1:4174
          GLV3_BASE_URL: http://127.0.0.1:4174
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 4174 --bind 127.0.0.1 --directory "$GITHUB_WORKSPACE" >/tmp/glv3-chip-http.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true; cat /tmp/glv3-chip-http.log || true' EXIT
          for _ in $(seq 1 40); do curl -fsS http://127.0.0.1:4174/ >/dev/null && break; sleep 0.25; done
          timeout 20m node _glv3/tools/chip_gate.mjs
          kill "$server" 2>/dev/null || true
          wait "$server" 2>/dev/null || true
          trap - EXIT

      - name: Prove evidence outputs and keep repository source clean
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          test -s _glv3/GATES_BROWSER.json
          test -s _glv3/GATES_CHIPS.json
          test -d _glv3/contact_sheet
          test "$(find _glv3/contact_sheet -type f -name '*.png' | wc -l)" -ge 83
          find _glv3/contact_sheet -type f -name '*.png' -size 0 -print -quit | (! grep -q .)
          rm -rf node_modules
          git diff --check
          test -z "$(git diff --name-only -- Art_Teesside GROW_ASDAN LAUNCH_ASDAN Grow/Slideshows Launch/Slideshows Science_Teesside Humanities_Teesside Baseline_Weeks BUILD_Estate_v3)"

      - name: Upload generated candidate evidence without publishing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: glv3-generated-preflight-${{ github.sha }}
          path: |
            GROW_Estate_v3
            LAUNCH_Estate_v3
            resources.json
            _finish/ROUTES.md
            _glv3/REPORT.md
            _glv3/AMBERS.md
            _glv3/DECISIONS.md
            _glv3/run_manifest.json
            _glv3/GATES_STATIC.json
            _glv3/GATES_BROWSER.json
            _glv3/GATES_CHIPS.json
            _glv3/INPUT_INTEGRITY.json
            _glv3/COUNT_RECONCILIATION.json
            _glv3/PROTECTED_TREES.json
            _glv3/AUTONOMOUS_SENTINEL.json
            _glv3/contact_sheet
          if-no-files-found: warn
          retention-days: 30

      - name: Publish SHA-bound full-generation status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          state=success
          description='34/46 generation, static, browser, print and chips passed'
          if [[ "$JOB_STATUS" != success ]]; then state=failure; description='GLV3 generation gate failed; inspect exact run logs'; fi
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$(jq -nc --arg state "$state" --arg context 'glv3/full-generation' --arg description "$description" --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" '{state:$state,context:$context,description:$description,target_url:$target_url}')"