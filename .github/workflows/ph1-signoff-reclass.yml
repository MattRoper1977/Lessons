name: PH-1 reclassify witness-protected sign-off rows
on:
  push:
    branches:
      - pass-ph1-peq-hardening
    paths:
      - '.github/workflows/ph1-signoff-reclass.yml'
permissions:
  contents: write
jobs:
  reclassify:
    if: "${{ github.event.head_commit.message != 'PH-1 transport cleanup: sign-off reclassification' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply measured G4 conflict to the committed classification
        run: |
          set -euo pipefail
          python3 .github/ph1_signoff_reclass.py
          git config user.name 'PH-1 Executor'
          git config user.email 'ph1@madebymatt.invalid'
          git add _passph1/SIGNOFF_CLASSIFICATION.md
          git commit -m 'PH-1 sign-off classification corrected: B1 18; B2 80; B3 3; B4 0'
          git push origin HEAD:pass-ph1-peq-hardening
