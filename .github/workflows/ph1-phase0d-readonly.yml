name: PH-1 Phase 0d read-only measurement
on:
  push:
    branches:
      - pass-ph1-peq-hardening
    paths:
      - '.github/workflows/ph1-phase0d-readonly.yml'
permissions:
  contents: read
jobs:
  measure:
    if: "${{ github.event.head_commit.message != 'PH-1 transport cleanup: Phase 0d' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate Phase 0d reports without changing the worktree
        run: |
          python3 .github/ph1_phase0d_measure.py
          test -z "$(git status --porcelain=v1)"
      - uses: actions/upload-artifact@v4
        with:
          name: ph1-phase0d-measurements
          path: /tmp/ph1-phase0d
          retention-days: 2
