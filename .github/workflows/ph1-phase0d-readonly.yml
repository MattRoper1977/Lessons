name: PH-1 Phase 0d read-only measurement
on:
  push:
    branches:
      - pass-ph1-peq-hardening
    paths:
      - '.github/workflows/ph1-phase0d-readonly.yml'
permissions:
  contents: read
jobs:
  measure:
    if: "${{ github.event.head_commit.message != 'PH-1 transport cleanup: Phase 0d' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate Phase 0d reports from immutable BASE
        run: |
          BASE=ae1d3c7af2526781aad6fb82e7cbbf6b87ded380
          BASE_WORKTREE="$(mktemp -d)"
          cleanup() {
            git worktree remove --force "$BASE_WORKTREE" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          git worktree add --detach "$BASE_WORKTREE" "$BASE"
          SCRIPT="$GITHUB_WORKSPACE/.github/ph1_phase0d_measure.py"
          (cd "$BASE_WORKTREE" && python3 "$SCRIPT")
          cleanup
          trap - EXIT
          test -z "$(git status --porcelain=v1)"
      - uses: actions/upload-artifact@v4
        with:
          name: ph1-phase0d-measurements
          path: /tmp/ph1-phase0d
          retention-days: 2
