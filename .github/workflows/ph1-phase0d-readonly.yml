name: PH-1 Phase 0d commit measurements
on:
  push:
    branches:
      - pass-ph1-peq-hardening
    paths:
      - '.github/workflows/ph1-phase0d-readonly.yml'
permissions:
  contents: write
jobs:
  measure-and-commit:
    if: "${{ github.event.head_commit.message != 'PH-1 transport cleanup: Phase 0d' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate reports from immutable BASE and commit them separately
        run: |
          set -euo pipefail
          BASE=ae1d3c7af2526781aad6fb82e7cbbf6b87ded380
          BASE_WORKTREE="$(mktemp -d)"
          cleanup() {
            git worktree remove --force "$BASE_WORKTREE" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          git worktree add --detach "$BASE_WORKTREE" "$BASE"
          SCRIPT="$GITHUB_WORKSPACE/.github/ph1_phase0d_measure.py"
          (cd "$BASE_WORKTREE" && python3 "$SCRIPT")
          cleanup
          trap - EXIT

          test ! -e _passph1/TEST_COPY_DIVERGENCE.md
          test ! -e _passph1/SCOPE_GUARD_PROOF.md
          git config user.name 'PH-1 Executor'
          git config user.email 'ph1@madebymatt.invalid'

          cp /tmp/ph1-phase0d/TEST_COPY_DIVERGENCE.md _passph1/TEST_COPY_DIVERGENCE.md
          git add _passph1/TEST_COPY_DIVERGENCE.md
          git commit -m 'PH-1 Phase 0d: 167 test-copy surfaces; ComSk1 gap 228; 4 path sets material'

          cp /tmp/ph1-phase0d/SCOPE_GUARD_PROOF.md _passph1/SCOPE_GUARD_PROOF.md
          git add _passph1/SCOPE_GUARD_PROOF.md
          git commit -m 'PH-1 scope guard: 1 test-copy write refused; 0 writes after'

          git push origin HEAD:pass-ph1-peq-hardening
