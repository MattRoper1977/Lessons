name: GROW LAUNCH v3 build verified candidate

on:
  push:
    branches: [claude/gl-estate-v3]
    paths:
      - .github/workflows/glv3-candidate.yml
  pull_request:
    branches: [main]
    types: [reopened]
  workflow_dispatch:

permissions:
  contents: write
  statuses: write
  pull-requests: write
  actions: write

concurrency:
  group: glv3-registered-candidate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-candidate:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.ref == 'claude/gl-estate-v3'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out the exact recovery head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: claude/gl-estate-v3

      - name: Bind the real event head and one-run replay cleanup
        env:
          GLV3_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path=Path('_glv3/tools/run_registered_candidate.sh')
          text=path.read_text()
          old='if [[ -n "${GITHUB_SHA:-}" ]]; then test "$STARTING_SHA" = "$GITHUB_SHA"; fi'
          new='EXPECTED_EVENT_HEAD="${GLV3_EXPECTED_HEAD:-${GITHUB_SHA:-}}"\nif [[ -n "$EXPECTED_EVENT_HEAD" ]]; then test "$STARTING_SHA" = "$EXPECTED_EVENT_HEAD"; fi'
          if old not in text:
              raise SystemExit('event-head binding source did not match')
          text=text.replace(old,new,1)
          text=text.replace('set -euo pipefail','set -euxo pipefail',1)
          old_generate='log "Generate parallel estates and static evidence"\nrm -rf GROW_Estate_v3 LAUNCH_Estate_v3 _glv3/contact_sheet'
          new_generate='log "Generate parallel estates and static evidence"\nrm -f _glv3/tools/hashlib.py\nrm -rf GROW_Estate_v3 LAUNCH_Estate_v3 _glv3/contact_sheet'
          if old_generate not in text:
              raise SystemExit('generation boundary source did not match')
          text=text.replace(old_generate,new_generate,1)
          old_cleanup='rm -f _glv3/tools/bs4.py _glv3/tools/shutil.py _glv3/tools/closeout_prep.py _glv3/tools/run_registered_candidate.sh'
          new_cleanup='rm -f _glv3/tools/bs4.py _glv3/tools/shutil.py _glv3/tools/hashlib.py _glv3/tools/closeout_prep.py _glv3/tools/run_registered_candidate.sh'
          if old_cleanup not in text:
              raise SystemExit('one-run cleanup source did not match')
          path.write_text(text.replace(old_cleanup,new_cleanup,1))
          PY
          test "$(git rev-parse HEAD)" = "$GLV3_EXPECTED_HEAD"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate, verify, commit and exact-tree re-prove the candidate
        id: candidate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GLV3_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: bash _glv3/tools/run_registered_candidate.sh

      - name: Upload candidate evidence dossier
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: glv3-candidate-${{ steps.candidate.outputs.candidate_sha || github.event.pull_request.head.sha || github.sha }}
          path: |
            _glv3/GROW_LAUNCH_v3_DEPLOY_FINAL_REPORT.md
            _glv3/GROW_LAUNCH_v3_DEPLOY_PROOF.json
            _glv3/GROW_LAUNCH_v3_REPORT_AND_PROOF.zip
            _glv3/EVIDENCE_ZIP_INTEGRITY.json
            _glv3/GATES_STATIC.json
            _glv3/GATES_BROWSER.json
            _glv3/GATES_CHIPS.json
            _glv3/INPUT_INTEGRITY.json
            _glv3/COUNT_RECONCILIATION.json
            _glv3/PROTECTED_TREES.json
            _glv3/POSITIVE_CONTROLS.json
            _glv3/CONTACT_SHEET_INVENTORY.json
            _glv3/AUTONOMOUS_SENTINEL.json
            _glv3/REPORT.md
            _glv3/AMBERS.md
            _glv3/DECISIONS.md
            _glv3/run_manifest.json
            _glv3/contact_sheet
          if-no-files-found: warn
          retention-days: 30
