name: GROW LAUNCH v3 build verified candidate

on:
  push:
    branches: [claude/gl-estate-v3]
    paths:
      - .github/workflows/glv3-candidate.yml
      - _glv3/tools/run_registered_candidate.sh
      - _glv3/tools/prepare_registered_candidate.py
      - _glv3/tools/finalize_filename_references.py
  pull_request:
    branches: [main]
    types: [reopened]
  workflow_dispatch:

permissions:
  contents: write
  statuses: write
  pull-requests: write
  actions: write

concurrency:
  group: glv3-registered-candidate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-candidate:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.ref == 'claude/gl-estate-v3'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out the exact recovery head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: claude/gl-estate-v3

      - name: Bind the real event head and prepare one-run replay
        env:
          GLV3_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python _glv3/tools/prepare_registered_candidate.py
          python - <<'PY'
          from pathlib import Path
          path=Path('_glv3/tools/run_registered_candidate.sh')
          text=path.read_text()
          old='python _glv3/tools/deploy.py\ntest "$(find GROW_Estate_v3 LAUNCH_Estate_v3 -type f -name \'*.html\' | wc -l)" = 94'
          new='python _glv3/tools/deploy.py\npython _glv3/tools/finalize_filename_references.py --repo "$ROOT"\ntest "$(find GROW_Estate_v3 LAUNCH_Estate_v3 -type f -name \'*.html\' | wc -l)" = 94'
          if text.count(old) != 1:
              raise SystemExit(f'candidate runner generation boundary count={text.count(old)}')
          path.write_text(text.replace(old,new,1))
          PY
          test "$(git rev-parse HEAD)" = "$GLV3_EXPECTED_HEAD"
          grep -q 'source_lesson_paths_with_token' _glv3/tools/browser_verify.mjs
          grep -q '/tmp/glv3-diagnostics/browser-primary.log' _glv3/tools/run_registered_candidate.sh
          grep -q 'finalize_filename_references.py' _glv3/tools/run_registered_candidate.sh

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install print and contact-sheet system dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils imagemagick
          command -v pdftoppm
          command -v montage

      - name: Generate, verify, commit and exact-tree re-prove the candidate
        id: candidate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GLV3_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: bash _glv3/tools/run_registered_candidate.sh

      - name: Upload candidate evidence dossier and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: glv3-candidate-${{ steps.candidate.outputs.candidate_sha || github.event.pull_request.head.sha || github.sha }}
          path: |
            _glv3/GROW_LAUNCH_v3_DEPLOY_FINAL_REPORT.md
            _glv3/GROW_LAUNCH_v3_DEPLOY_PROOF.json
            _glv3/GROW_LAUNCH_v3_REPORT_AND_PROOF.zip
            _glv3/EVIDENCE_ZIP_INTEGRITY.json
            _glv3/GATES_STATIC.json
            _glv3/GATES_BROWSER.json
            _glv3/GATES_CHIPS.json
            _glv3/INPUT_INTEGRITY.json
            _glv3/COUNT_RECONCILIATION.json
            _glv3/PROTECTED_TREES.json
            _glv3/POSITIVE_CONTROLS.json
            _glv3/CONTACT_SHEET_INVENTORY.json
            _glv3/AUTONOMOUS_SENTINEL.json
            _glv3/REPORT.md
            _glv3/AMBERS.md
            _glv3/DECISIONS.md
            _glv3/run_manifest.json
            _glv3/contact_sheet
            /tmp/glv3-diagnostics
          if-no-files-found: warn
          retention-days: 30

      - name: Publish inspectable orchestration status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          START_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          state=success
          description='Registered GLV3 candidate orchestration passed'
          if [[ "$JOB_STATUS" != success ]]; then
            state=failure
            description='Registered GLV3 candidate orchestration failed; inspect run'
          fi
          target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          payload="$(jq -nc --arg state "$state" --arg context 'glv3/candidate-orchestration' --arg description "$description" --arg target_url "$target_url" '{state:$state,context:$context,description:$description,target_url:$target_url}')"
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${START_SHA}" \
            -d "$payload" >/dev/null
