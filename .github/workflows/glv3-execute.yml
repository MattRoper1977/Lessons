name: GROW LAUNCH v3 autonomous closeout candidate

on:
  push:
    branches: [claude/gl-estate-v3]
    paths:
      - .github/workflows/glv3-execute.yml
  workflow_dispatch:

permissions:
  contents: write
  statuses: write
  actions: write
  pull-requests: read

concurrency:
  group: glv3-autonomous-closeout
  cancel-in-progress: true

jobs:
  generate-verify-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out exact recovery head
        uses: actions/checkout@v4
        with:
          ref: claude/gl-estate-v3
          fetch-depth: 0

      - name: Bind integration base and current proven repairs
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          base="$(git rev-parse refs/remotes/origin/main)"
          start="$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$base" "$start"
          test -s _glv3/tools/bs4.py
          grep -q 'Deterministic Humanities print-surface reconstruction' _glv3/tools/bs4.py
          grep -q 'Source-authored PEQ code provenance' _glv3/tools/bs4.py
          grep -q '#cards article.card' _glv3/tools/browser_verify.mjs
          grep -q '.ytab\[data-year="2026-27"\]' _glv3/tools/browser_verify.mjs
          printf 'base=%s\nstart=%s\n' "$base" "$start" >> "$GITHUB_OUTPUT"
          printf 'integration_base=%s\nstarting_head=%s\n' "$base" "$start"

      - name: Set up Python and Node
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Reconstruct and safely extract verified source transport
        shell: bash
        run: |
          set -euo pipefail
          for part in _glv3/input/valid.part{00..09}.b64; do test -s "$part"; done
          cat _glv3/input/valid.part{00..09}.b64 | tr -d '[:space:]' | base64 --decode > /tmp/glv3-packs.tar.xz
          python _glv3/tools/safe_extract_transport.py /tmp/glv3-packs.tar.xz /tmp/glv3-packs --sha256 782ff5865e1406c159c78081bcc218bdaa46678e5c42448a6f298f696ca73f5e --size 102160
          test "$(find /tmp/glv3-packs/grow -type f | wc -l)" = 51
          test "$(find /tmp/glv3-packs/launch -type f | wc -l)" = 63

      - name: Reconcile exact inputs counts and protected baselines
        shell: bash
        run: |
          set -euo pipefail
          python _glv3/tools/closeout_reconcile.py --repo "$GITHUB_WORKSPACE" --grow /tmp/glv3-packs/grow --launch /tmp/glv3-packs/launch --historic-sha 1e8a428b523d1b970a8a3a2ab2a99f48a8271d09 --integration-sha '${{ steps.identity.outputs.base }}' --starting-branch-sha '${{ steps.identity.outputs.start }}' --transport /tmp/glv3-packs.tar.xz
          python -m pip install --disable-pip-version-check --no-cache-dir beautifulsoup4==4.13.4 pillow lxml

      - name: Generate parallel estates and static dossier
        env:
          GLV3_GROW_SRC: /tmp/glv3-packs/grow
          GLV3_LAUNCH_SRC: /tmp/glv3-packs/launch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf GROW_Estate_v3 LAUNCH_Estate_v3 _glv3/contact_sheet
          python _glv3/tools/deploy.py
          test "$(find GROW_Estate_v3 LAUNCH_Estate_v3 -type f -name '*.html' | wc -l)" = 94
          test -s _glv3/GATES_STATIC.json
          test -s _glv3/REPORT.md
          test -s _glv3/AMBERS.md
          test -s _glv3/run_manifest.json
          test -z "$(git diff --name-only -- Art_Teesside GROW_ASDAN LAUNCH_ASDAN Grow/Slideshows Launch/Slideshows Science_Teesside Humanities_Teesside Baseline_Weeks BUILD_Estate_v3)"
          git diff --check

      - name: Run all disposable tamper controls
        shell: bash
        run: |
          set -euo pipefail
          python _glv3/tools/positive_controls.py --repo "$GITHUB_WORKSPACE"
          test -s _glv3/POSITIVE_CONTROLS.json

      - name: Install Chromium verifier dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.55.0 sharp pngjs pdfjs-dist
          npx playwright install --with-deps chromium

      - name: Run all-page browser mobile print contact and chip gates
        env:
          BASE_URL: http://127.0.0.1:4173
          GLV3_BASE_URL: http://127.0.0.1:4173
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 4173 --bind 127.0.0.1 --directory "$GITHUB_WORKSPACE" >/tmp/glv3-http.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true; cat /tmp/glv3-http.log || true' EXIT
          for attempt in $(seq 1 40); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 0.25; done
          timeout 55m node _glv3/tools/browser_verify.mjs http://127.0.0.1:4173
          timeout 20m node _glv3/tools/chip_gate.mjs http://127.0.0.1:4173
          kill "$server" 2>/dev/null || true
          wait "$server" 2>/dev/null || true
          trap - EXIT
          test -s _glv3/GATES_BROWSER.json
          test -s _glv3/GATES_CHIPS.json
          test "$(find _glv3/contact_sheet -type f -name '*.png' | wc -l)" = 83

      - name: Build truthful candidate dossier
        shell: bash
        run: |
          set -euo pipefail
          python _glv3/tools/build_candidate_dossier.py --repo "$GITHUB_WORKSPACE" --integration-sha '${{ steps.identity.outputs.base }}' --starting-branch-sha '${{ steps.identity.outputs.start }}'
          test -s _glv3/GROW_LAUNCH_v3_DEPLOY_FINAL_REPORT.md
          test -s _glv3/GROW_LAUNCH_v3_DEPLOY_PROOF.json
          test -s _glv3/GROW_LAUNCH_v3_REPORT_AND_PROOF.zip

      - name: Remove one-shot staging and obsolete invalid workflows
        shell: bash
        run: |
          set -euo pipefail
          rm -rf node_modules _glv3/input _glv3/tooling
          rm -f _glv3/RUN_GENERATION.md _glv3/tools/bs4.py _glv3/tools/closeout_prep.py
          rm -f .github/workflows/glv3-candidate.yml .github/workflows/glv3-closeout.yml .github/workflows/glv3-deploy.yml .github/workflows/glv3-generate.yml .github/workflows/glv3-generation-gate.yml .github/workflows/glv3-preflight.yml .github/workflows/glv3-execute.yml
          test "$(find GROW_Estate_v3 LAUNCH_Estate_v3 -type f -name '*.html' | wc -l)" = 94
          test "$(find _glv3/contact_sheet -type f -name '*.png' | wc -l)" = 83
          test -z "$(git diff --name-only -- Art_Teesside GROW_ASDAN LAUNCH_ASDAN Grow/Slideshows Launch/Slideshows Science_Teesside Humanities_Teesside Baseline_Weeks BUILD_Estate_v3)"
          ! grep -RIlE '/home/runner/work|gh[pousr]_[A-Za-z0-9_]{20,}|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY' _glv3 GROW_Estate_v3 LAUNCH_Estate_v3 | grep -q .
          ! find . -path './.git' -prune -o -type f -size +50M -print | grep -q .
          git diff --check

      - name: Commit and push immutable implementation candidate
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/claude/gl-estate-v3:refs/remotes/origin/claude/gl-estate-v3
          remote_head="$(git rev-parse refs/remotes/origin/claude/gl-estate-v3)"
          test "$remote_head" = '${{ steps.identity.outputs.start }}' || { echo "recovery branch moved during execution: $remote_head"; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'candidate generation produced no commit'; exit 1; }
          git commit -m 'feat: install verified GROW and LAUNCH alternative v3 estates'
          candidate="$(git rev-parse HEAD)"
          git push origin HEAD:claude/gl-estate-v3
          printf 'sha=%s\n' "$candidate" >> "$GITHUB_OUTPUT"
          printf 'candidate_head=%s\n' "$candidate"

      - name: Re-prove exact committed candidate tree
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/glv3-exact "$CANDIDATE_SHA"
          cd /tmp/glv3-exact
          test "$(find GROW_Estate_v3 LAUNCH_Estate_v3 -type f -name '*.html' | wc -l)" = 94
          test "$(find _glv3/contact_sheet -type f -name '*.png' | wc -l)" = 83
          python _glv3/tools/deploy.py --rerun-live-privacy
          before="$(git status --porcelain)"
          python _glv3/tools/positive_controls.py --repo "$PWD"
          after="$(git status --porcelain)"
          test "$before" = "$after"
          npm install --no-save --no-package-lock playwright@1.55.0 sharp pngjs pdfjs-dist
          python -m http.server 4174 --bind 127.0.0.1 --directory "$PWD" >/tmp/glv3-exact-http.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true; cat /tmp/glv3-exact-http.log || true' EXIT
          for attempt in $(seq 1 40); do curl -fsS http://127.0.0.1:4174/ >/dev/null && break; sleep 0.25; done
          BASE_URL=http://127.0.0.1:4174 GLV3_BASE_URL=http://127.0.0.1:4174 timeout 55m node _glv3/tools/browser_verify.mjs http://127.0.0.1:4174
          BASE_URL=http://127.0.0.1:4174 GLV3_BASE_URL=http://127.0.0.1:4174 timeout 20m node _glv3/tools/chip_gate.mjs http://127.0.0.1:4174
          kill "$server" 2>/dev/null || true
          wait "$server" 2>/dev/null || true
          trap - EXIT
          test -z "$(git diff --name-only HEAD -- Art_Teesside GROW_ASDAN LAUNCH_ASDAN Grow/Slideshows Launch/Slideshows Science_Teesside Humanities_Teesside Baseline_Weeks BUILD_Estate_v3)"
          git diff --check

      - name: Publish SHA-bound candidate statuses
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          target="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          for context in glv3/source-generation glv3/exact-tree glv3/protected-invariance; do
            payload="$(jq -nc --arg state success --arg context "$context" --arg description 'Verified GLV3 candidate gate passed' --arg target_url "$target" '{state:$state,context:$context,description:$description,target_url:$target_url}')"
            curl --fail-with-body --silent --show-error -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${CANDIDATE_SHA}" -d "$payload"
          done

      - name: Upload candidate dossier
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: glv3-candidate-${{ steps.candidate.outputs.sha || github.sha }}
          path: |
            _glv3/GROW_LAUNCH_v3_DEPLOY_FINAL_REPORT.md
            _glv3/GROW_LAUNCH_v3_DEPLOY_PROOF.json
            _glv3/GROW_LAUNCH_v3_REPORT_AND_PROOF.zip
            _glv3/GATES_STATIC.json
            _glv3/GATES_BROWSER.json
            _glv3/GATES_CHIPS.json
            _glv3/INPUT_INTEGRITY.json
            _glv3/COUNT_RECONCILIATION.json
            _glv3/PROTECTED_TREES.json
            _glv3/POSITIVE_CONTROLS.json
            _glv3/CONTACT_SHEET_INVENTORY.json
            _glv3/AUTONOMOUS_SENTINEL.json
            _glv3/AMBERS.md
            _glv3/DECISIONS.md
            _glv3/run_manifest.json
            _glv3/contact_sheet
          if-no-files-found: warn
          retention-days: 30
