name: Education Pages publication
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  publication:
    # Pinned 2026-09-07 reviewed Glitch handoff and all-file admission publisher (Site PR #292); this workflow reads
    # this repository's current source commit and never edits source content.
    # Advanced 2026-09-09 (LF1) 94ae15f8 -> 2e4d9966, a surgical Site commit that is
    # 94ae15f8 byte-identical except one review record: the all-file admission registry,
    # which now admits the 22 lessons and 8 SHA256SUMS.txt the LF1 week-label restoration
    # changed (#468), as 30 transition pairs. education-publication.yml itself is unchanged
    # between the two, and no builder, Play or usage-discovery code moves.
    # Advanced 2026-09-09 (FIN3 §4) 2e4d9966 -> 2a154e33, again surgical: measured, the
    # tree differs from 2e4d9966 in exactly one path, that same review record, and
    # education-publication.yml is byte-identical across the two, so the gate itself
    # does not move. It admits the four Science manifests whose bytes two Lessons
    # merges changed without a registry move -- Ruling 1 (#475) and Ruling 2
    # (aee37a1f) -- as transition pairs, and Ruling 3b's three new whole-route
    # manifests (#479) as ARRIVING. Those four are exactly what the publisher named
    # when it blocked publication on main tonight.
    # Advanced 2026-09-10 (AMEND-3R-GC1 P6) 2a154e33 -> 2e49afdd. This one is NOT
    # registry-only, and saying so is the point: it moves builder code as well.
    # .sb3 was missing from the publisher's extension allowlist, so all 23 Scratch
