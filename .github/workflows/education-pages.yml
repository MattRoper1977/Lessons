    # extension while the source tree showed their 15 sibling links resolving. The
    # commit adds .sb3 to PUBLIC in build_education.py and to INERT in the admission
    # census, and extends the disguised-code control to it -- 58 controls pass, the
    # sb3 one planted-FAIL and restored-PASS on all three trees. Beside that it
    # admits the unit: 163 education-lessons paths ARRIVING at built bytes, plus
    # transition pairs for ICT/Teaching_Packs/index.html and the site
    # data/usage-registry.json. Measured against both the currently pinned 2a154e33
    # and Thursday's carrier ee56d2c7: 0 paths lost, 0 digests lost -- a strict
    # widening of both, not a sibling. education-publication.yml is byte-identical
    # to the pinned revision, so the gate itself does not move. Proven green in both
    # directions before pinning: a build of Lessons main (unit absent) and a build of
    # Lessons main + #493 (unit present) each report 0 admission problems.
    # GC1 registration repair, 12 September 2026: carrier based directly on 810ae8f8.
    # Only the reviewed teaching download rows and separation checker differ:
    # 128 Computing additions, every previous row retained, conditional on the unit
    # hub being installed. Builder, admissions, Science baseline and other inputs
    # remain unchanged. Content #493 is already merged; catalogue is separate.
    uses: MattRoper1977/mattroper1977.github.io/.github/workflows/education-publication.yml@3c2743fbfb345e1314f138d6b50d6a7ce18031ef
    with:
      builder_ref: 3c2743fbfb345e1314f138d6b50d6a7ce18031ef
