name: Complete GROW ASDAN publication

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/codex-grow-asdan-finalize2.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out publication branch
        uses: actions/checkout@v4
        with:
          ref: codex/grow-asdan-interactions-motion
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install browser driver
        run: npm install --no-save puppeteer-core@24

      - name: Re-run validated checks and publish clean scope
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          source = Path('.github/workflows/codex-grow-asdan-publish.yml')
          lines = source.read_text(encoding='utf-8').splitlines()
          blocks = []
          index = 0
          while index < len(lines):
              if lines[index] == '        run: |':
                  index += 1
                  block = []
                  while index < len(lines) and (lines[index].startswith('          ') or not lines[index].strip()):
                      line = lines[index]
                      block.append(line[10:] if line.startswith('          ') else '')
                      index += 1
                  blocks.append('\n'.join(block) + '\n')
                  continue
              index += 1

          if len(blocks) != 3:
              raise SystemExit(f'Expected three publisher shell blocks, found {len(blocks)}')

          for block in blocks[:2]:
              subprocess.run(block, shell=True, executable='/bin/bash', check=True)
          PY

          rm -f .github/workflows/codex-grow-asdan-audit.yml
          rm -f .github/workflows/codex-grow-asdan-publish.yml
          rm -f .github/workflows/codex-grow-asdan-finalize.yml
          rm -f .github/workflows/codex-grow-asdan-finalize2.yml
          git add -A

          changed="$(git diff --cached --name-only origin/main)"
          test -n "$changed"
          invalid="$(printf '%s\n' "$changed" | grep -v '^GROW_ASDAN/' || true)"
          if [ -n "$invalid" ]; then
            printf 'Final staged diff contains out-of-scope paths:\n%s\n' "$invalid" >&2
            exit 1
          fi
          count="$(printf '%s\n' "$changed" | wc -l | tr -d ' ')"
          html_count="$(printf '%s\n' "$changed" | grep -c '\.html$')"
          if [ "$count" != "27" ] || [ "$html_count" != "24" ]; then
            printf 'Unexpected final staged scope: files=%s html=%s\n%s\n' "$count" "$html_count" "$changed" >&2
            exit 1
          fi

          git diff --cached --check
          printf 'PASS final scope: 27 files, 24 HTML plus three shared files, all under GROW_ASDAN/\n'

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: upgrade GROW ASDAN interactive teaching and motion"
          git push origin HEAD:codex/grow-asdan-interactions-motion
