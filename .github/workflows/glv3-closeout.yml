name: GROW LAUNCH v3 autonomous closeout

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  pull-requests: read

concurrency:
  group: glv3-closeout-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  generate-verify-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4
        with:
          ref: claude/gl-estate-v3
          fetch-depth: 0

      - name: Identity, ancestry and protected-base gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "claude/gl-estate-v3"
          git fetch origin main
          main_sha="$(git rev-parse origin/main)"
          test "$main_sha" = "1e8a428b523d1b970a8a3a2ab2a99f48a8271d09"
          git merge-base --is-ancestor "$main_sha" HEAD
          test -f BUILD_Estate_v3/index.html
          test -f _finish/ROUTES.md
          test -f resources.json
          test ! -e GROW_Estate_v3
          test ! -e LAUNCH_Estate_v3
          echo "HISTORIC_ROLLBACK_SHA=1e8a428b523d1b970a8a3a2ab2a99f48a8271d09"
          echo "INTEGRATION_BASE_SHA=$main_sha"
          echo "STARTING_BRANCH_SHA=$(git rev-parse HEAD)"

      - name: Reconstruct staged bytes and recover tar payload safely
        shell: bash
        run: |
          set -euo pipefail
          reported="efef35d7c8504f603646663da603a2f3690ed8204b2af7d0730b52560a9db918"
          discovered="777fcdafefc246c5c6b68a559886dc27b641471b7638ea79e51640c3e62791fd"
          rm -rf /tmp/glv3-packs /tmp/glv3-packs.tar.xz /tmp/glv3-packs.tar /tmp/glv3-*.candidate /tmp/glv3-stream.b64
          mkdir -p /tmp/glv3-packs

          : > /tmp/glv3-chunks.candidate
          for f in _glv3/input/pack.part{00..09}.b64; do
            test -s "$f"
            base64 -d "$f" >> /tmp/glv3-chunks.candidate
          done
          cat _glv3/input/pack.part{00..09}.b64 | tr -d '\r\n\t ' > /tmp/glv3-stream.b64
          base64 -d /tmp/glv3-stream.b64 > /tmp/glv3-stream.candidate

          chunk_hash="$(sha256sum /tmp/glv3-chunks.candidate | awk '{print $1}')"
          stream_hash="$(sha256sum /tmp/glv3-stream.candidate | awk '{print $1}')"
          chunk_size="$(stat -c %s /tmp/glv3-chunks.candidate)"
          stream_size="$(stat -c %s /tmp/glv3-stream.candidate)"
          echo "reported_transport_sha256=$reported"
          echo "decoded_per_part_sha256=$chunk_hash size=$chunk_size"
          echo "decoded_single_stream_sha256=$stream_hash size=$stream_size"
          test "$chunk_hash" = "$stream_hash"
          test "$chunk_size" = "$stream_size"
          test "$chunk_hash" = "$discovered"
          test "$chunk_size" = "106760"
          cp /tmp/glv3-chunks.candidate /tmp/glv3-packs.tar.xz

          set +e
          xz -dc /tmp/glv3-packs.tar.xz > /tmp/glv3-packs.tar 2>/tmp/glv3-xz-error.txt
          xz_rc=$?
          set -e
          echo "xz_exit_code=$xz_rc"
          cat /tmp/glv3-xz-error.txt
          test "$xz_rc" -ne 0
          test -s /tmp/glv3-packs.tar

          python3 - <<'PY'
          import pathlib, shutil, tarfile
          archive = pathlib.Path('/tmp/glv3-packs.tar')
          root = pathlib.Path('/tmp/glv3-packs').resolve()
          seen = set(); seen_ci = set(); extracted = 0
          try:
              with tarfile.open(archive, 'r|') as tf:
                  for member in tf:
                      p = pathlib.PurePosixPath(member.name)
                      if p.is_absolute() or '..' in p.parts:
                          raise SystemExit(f'unsafe tar path: {member.name}')
                      key = member.name.rstrip('/')
                      if key in seen or key.casefold() in seen_ci:
                          raise SystemExit(f'duplicate/case-colliding tar path: {member.name}')
                      seen.add(key); seen_ci.add(key.casefold())
                      if member.issym() or member.islnk() or not (member.isdir() or member.isfile()):
                          raise SystemExit(f'unsupported tar member: {member.name}')
                      destination = (root / pathlib.Path(*p.parts)).resolve()
                      if destination != root and root not in destination.parents:
                          raise SystemExit(f'tar path escaped root: {member.name}')
                      if member.isdir():
                          destination.mkdir(parents=True, exist_ok=True)
                      else:
                          destination.parent.mkdir(parents=True, exist_ok=True)
                          source = tf.extractfile(member)
                          if source is None:
                              raise SystemExit(f'cannot read tar member: {member.name}')
                          with destination.open('wb') as target:
                              shutil.copyfileobj(source, target)
                          extracted += 1
          except (tarfile.ReadError, EOFError) as error:
              print(f'CORRUPT_XZ_STREAM_ENDED_AFTER_RECOVERABLE_TAR_DATA: {error}')
          print(f'recovered_regular_files={extracted}')
          PY
          test -d /tmp/glv3-packs/grow
          test -d /tmp/glv3-packs/launch
          test ! -d /tmp/glv3-packs/grow/Science
          test ! -d /tmp/glv3-packs/launch/Science

      - name: Reconcile exact inputs and 28-versus-34 count
        env:
          GLV3_GROW_SRC: /tmp/glv3-packs/grow
          GLV3_LAUNCH_SRC: /tmp/glv3-packs/launch
        run: python3 _glv3/tools/closeout_prep.py

      - name: Install verifier dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check beautifulsoup4
          mkdir -p /tmp/glv3-node
          npm install --prefix /tmp/glv3-node --no-save --no-package-lock playwright@1.54.2
          ln -s /tmp/glv3-node/node_modules node_modules
          /tmp/glv3-node/node_modules/.bin/playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y poppler-utils imagemagick

      - name: Generate estates and run static gates
        env:
          GLV3_GROW_SRC: /tmp/glv3-packs/grow
          GLV3_LAUNCH_SRC: /tmp/glv3-packs/launch
        run: python3 _glv3/tools/deploy.py

      - name: Retain transport contradiction as AMBER evidence
        shell: bash
        run: |
          cat >> _glv3/AMBERS.md <<'EOF'
          - Input transport — the ten staged Base64 parts reconstruct to SHA-256 `777fcdafefc246c5c6b68a559886dc27b641471b7638ea79e51640c3e62791fd`, not the reported `efef35d7c8504f603646663da603a2f3690ed8204b2af7d0730b52560a9db918`, and the XZ trailer is corrupt. Both Base64 assembly methods produce identical bytes. The recovered tar payload was accepted only after every extracted GROW and LAUNCH file matched the deterministic manifests of the two independently verified uploaded repaired ZIPs.
          EOF

      - name: Start local lesson server
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8123 --bind 127.0.0.1 >/tmp/glv3-http.log 2>&1 &
          echo $! >/tmp/glv3-http.pid
          for i in {1..30}; do
            if python3 - <<'PY'
          import urllib.request
          urllib.request.urlopen('http://127.0.0.1:8123/index.html', timeout=1).read(32)
          PY
            then exit 0; fi
            sleep 1
          done
          cat /tmp/glv3-http.log
          exit 1

      - name: Browser boot, print, reachability and contact sheets
        env:
          GLV3_BASE_URL: http://127.0.0.1:8123
        run: node _glv3/tools/browser_verify.mjs

      - name: Browser chip count gate
        env:
          GLV3_BASE_URL: http://127.0.0.1:8123
        run: node _glv3/tools/chip_gate.mjs

      - name: Pre-push main refresh and final RED gates
        shell: bash
        env:
          GLV3_GROW_SRC: /tmp/glv3-packs/grow
          GLV3_LAUNCH_SRC: /tmp/glv3-packs/launch
        run: |
          set -euo pipefail
          git diff --check
          git fetch origin main
          latest="$(git rev-parse origin/main)"
          rollback="1e8a428b523d1b970a8a3a2ab2a99f48a8271d09"
          if [ "$latest" != "$rollback" ]; then
            if ! git diff --quiet "$latest" -- \
              Art_Teesside/ GROW_ASDAN/ LAUNCH_ASDAN/ Grow/Slideshows/ Launch/Slideshows/ \
              Science_Teesside/ Humanities_Teesside/ Baseline_Weeks/ BUILD_Estate_v3/; then
              echo "RED: protected live tree differs from refreshed origin/main"
              exit 20
            fi
            python3 _glv3/tools/deploy.py --rerun-live-privacy
          fi

      - name: Remove one-shot machinery and stage final generated tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _glv3/input _glv3/tools node_modules
          rm -f .github/workflows/glv3-deploy.yml .github/workflows/glv3-closeout.yml
          git add -A
          if git diff --cached --name-only | grep -Eq '^(Art_Teesside/|GROW_ASDAN/|LAUNCH_ASDAN/|Grow/Slideshows/|Launch/Slideshows/|Science_Teesside/|Humanities_Teesside/|Baseline_Weeks/|BUILD_Estate_v3/)'; then
            echo "RED: protected live path is staged"
            git diff --cached --name-status
            exit 21
          fi
          test -f GROW_Estate_v3/index.html
          test -f LAUNCH_Estate_v3/index.html
          test -f _glv3/REPORT.md
          test -f _glv3/INPUT_INTEGRITY.json
          test -f _glv3/COUNT_RECONCILIATION.json
          test -f _glv3/AUTONOMOUS_SENTINEL.json
          test -f _glv3/contact_sheet/art/combined-art.png
          test -f _glv3/contact_sheet/asdan/combined-asdan.png
          test -f _glv3/contact_sheet/humanities/combined-humanities.png
          git diff --cached --check
          git status --short

      - name: Commit verified deployment and push recovery branch
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Made by Matt deployment verifier"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: install verified GROW and LAUNCH alternative v3 estates"
          git fetch origin main
          latest="$(git rev-parse origin/main)"
          if ! git diff --quiet "$latest" -- \
            Art_Teesside/ GROW_ASDAN/ LAUNCH_ASDAN/ Grow/Slideshows/ Launch/Slideshows/ \
            Science_Teesside/ Humanities_Teesside/ Baseline_Weeks/ BUILD_Estate_v3/; then
            echo "RED: protected live tree differs from current main before push"
            exit 22
          fi
          git push origin HEAD:claude/gl-estate-v3
          candidate="$(git rev-parse HEAD)"
          printf '{"candidate_head_sha":"%s","run_id":"%s","run_attempt":"%s"}\n' "$candidate" "${GITHUB_RUN_ID}" "${GITHUB_RUN_ATTEMPT}" > /tmp/glv3-candidate.json
          echo "candidate_sha=$candidate" >> "$GITHUB_OUTPUT"
          echo "VERIFIED_BRANCH_SHA=$candidate"

      - name: Upload generated evidence dossier
        uses: actions/upload-artifact@v4
        with:
          name: glv3-generated-evidence-${{ steps.candidate.outputs.candidate_sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            /tmp/glv3-candidate.json
            _glv3/REPORT.md
            _glv3/AMBERS.md
            _glv3/DECISIONS.md
            _glv3/run_manifest.json
            _glv3/GATES_STATIC.json
            _glv3/GATES_BROWSER.json
            _glv3/GATES_CHIPS.json
            _glv3/INPUT_INTEGRITY.json
            _glv3/COUNT_RECONCILIATION.json
            _glv3/AUTONOMOUS_SENTINEL.json
            _glv3/contact_sheet/
