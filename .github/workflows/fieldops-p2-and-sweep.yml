name: FieldOps P2 and the stale-evidence sweep

# NO `paths:` FILTER, DELIBERATELY.
#
# PR #114 in this repository ran ZERO checks, because a new tool matched no path
# filter on any workflow. PR #120 - the one this file was added to - was about to
# do the same: it carries the four patched FieldOps labs, the Teacher Studio
# transforms, tools/stale_evidence_sweep.mjs and the release ledger, and not one
# of those paths appears in any filter in .github/workflows. A gate nobody runs
# is not evidence, and a filter that has to be remembered is a filter that will
# be forgotten.
#
# If this job becomes slow enough to be worth filtering, filter it by naming the
# paths AND adding a control that the filter matches the files the branch adds -
# not by trusting the list.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fieldops-p2-sweep-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sweep:
    name: The stale-evidence sweep can still find something
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # R0.15. The sweep's headline number is 0 stale. That is only worth
      # printing if the sweep can be shown to catch a stale subject - version 2
      # of this tool reported 0 stale because it could no longer fire at all.
      # --self-test authors three genuinely-stale fixtures of three shapes and
      # requires all three caught, then replays the four subjects version 1
      # wrongly destroyed and requires them not stale.
      - name: The three authored positive controls, and the four regressions
        run: node tools/stale_evidence_sweep.mjs --self-test

      # The sweep itself reads three repositories and only one of them is
      # checked out here, so it reports what it can see and exits 0 either way.
      # It is run for its output, not as a gate; the gate is the line above.
      - name: The sweep over what this checkout can see
        run: node tools/stale_evidence_sweep.mjs

      - name: A default run is a dry run
        run: |
          set -euo pipefail
          before=$(git status --porcelain)
          node tools/stale_evidence_sweep.mjs > /dev/null
          after=$(git status --porcelain)
          if [ "$before" != "$after" ]; then
            echo "the default run modified the tree - --apply is not the only destructive path"
            diff <(printf '%s\n' "$before") <(printf '%s\n' "$after") || true
            exit 1
          fi
          echo "default run changed nothing, as R0.14 requires"

  fieldops:
    name: FieldOps P2 - the build is reproducible and the labs still boot
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install the browser the harness drives
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      # U1 is the one that matters most and needs no browser: dropping every
      # transform must reproduce release/ byte for byte. A builder whose
      # drop-all output differs from release is editing something it has not
      # declared.
      - name: Every transform applies exactly once, and drop-all reproduces release
        env:
          P2_PLAYWRIGHT: playwright
        run: node tools/fieldops/assert_unchanged.mjs
