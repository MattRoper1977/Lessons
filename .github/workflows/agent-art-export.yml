name: Agent Art Teesside source export

on:
  push:
    branches:
      - agent/art-teesside-visual-teaching-upgrade-20260803
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out task branch
        uses: actions/checkout@v4
        with:
          ref: agent/art-teesside-visual-teaching-upgrade-20260803

      - name: Assemble and verify source bundle
        shell: bash
        env:
          PAYLOAD_SHA256: f3049d8ecd828f59a0027eb9bc8494dd25f87cdd4205bdcc224165fe63cf9a5e
        run: |
          set -euo pipefail
          cat \
            .github/agent-art-seed-00.b64 \
            .github/agent-art-seed-01.b64 \
            .github/agent-art-seed-02.b64 \
            .github/agent-art-seed-03a.b64 \
            .github/agent-art-seed-03b.b64 \
            .github/agent-art-seed-03c.b64 \
            .github/agent-art-seed-04.b64 \
            .github/agent-art-seed-05a.b64 \
            .github/agent-art-seed-05b.b64 \
            | base64 --decode > art-seed.tgz
          printf '%s  %s\n' "$PAYLOAD_SHA256" art-seed.tgz | sha256sum --check --strict
          tar -tzf art-seed.tgz

      - name: Upload verified source bundle
        uses: actions/upload-artifact@v4
        with:
          name: art-seed-${{ github.sha }}
          path: art-seed.tgz
          if-no-files-found: error
          retention-days: 2
