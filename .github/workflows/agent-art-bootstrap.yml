name: Agent Art Teesside source commit

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/agent-art-seed-*.b64'
      - '.github/agent-art-source-fix-*.b64'
      - '.github/workflows/agent-art-bootstrap.yml'
      - '.github/workflows/agent-art-export.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: '1'
  TASK_BRANCH: agent/art-teesside-visual-teaching-upgrade-20260803
  PRISTINE_MAIN: 10936b7f780f2fb18a8b3de9cd534b9e679cc305
  PAYLOAD_SHA256: f3049d8ecd828f59a0027eb9bc8494dd25f87cdd4205bdcc224165fe63cf9a5e
  SOURCE_FIX_SHA256: 0623bb2d724f0bf357794cf2ce905b270bfaf89a4adce1b63f819fb3d368b6ef

jobs:
  generate-verify-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact task branch with full history
        uses: actions/checkout@v4
        with:
          ref: agent/art-teesside-visual-teaching-upgrade-20260803
          fetch-depth: 0

      - name: Refresh main and prove the pristine Art source base is still current
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          actual_main=$(git rev-parse origin/main)
          printf 'origin/main: %s\n' "$actual_main"
          test "$actual_main" = "$PRISTINE_MAIN"
          git merge-base --is-ancestor "$PRISTINE_MAIN" HEAD
          git diff --quiet "$PRISTINE_MAIN" -- Art_Teesside art_teesside.html
          find Art_Teesside -type f -name '*.html' -print0 | sort -z | tr '\0' '\n' | tee "$RUNNER_TEMP/pristine-art-html.txt"
          test "$(wc -l < "$RUNNER_TEMP/pristine-art-html.txt")" -eq 53

      - name: Prove the exact thirteen transfer fragments are present
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/expected-transfer-files.txt" <<'EOF'
          .github/agent-art-seed-00.b64
          .github/agent-art-seed-01.b64
          .github/agent-art-seed-02.b64
          .github/agent-art-seed-03.b64
          .github/agent-art-seed-03a.b64
          .github/agent-art-seed-03b.b64
          .github/agent-art-seed-03c.b64
          .github/agent-art-seed-04.b64
          .github/agent-art-seed-05.b64
          .github/agent-art-seed-05a.b64
          .github/agent-art-seed-05b.b64
          .github/agent-art-source-fix-00.b64
          .github/agent-art-source-fix-01.b64
          EOF
          find .github -maxdepth 1 -type f \( -name 'agent-art-seed-*.b64' -o -name 'agent-art-source-fix-*.b64' \) -print | sort > "$RUNNER_TEMP/actual-transfer-files.txt"
          diff -u "$RUNNER_TEMP/expected-transfer-files.txt" "$RUNNER_TEMP/actual-transfer-files.txt"

      - name: Assemble the original transferred source bundle
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .github/agent-art-seed-00.b64 \
            .github/agent-art-seed-01.b64 \
            .github/agent-art-seed-02.b64 \
            .github/agent-art-seed-03a.b64 \
            .github/agent-art-seed-03b.b64 \
            .github/agent-art-seed-03c.b64 \
            .github/agent-art-seed-04.b64 \
            .github/agent-art-seed-05a.b64 \
            .github/agent-art-seed-05b.b64 \
            | base64 --decode > "$RUNNER_TEMP/art-seed.tgz"
          printf '%s  %s\n' "$PAYLOAD_SHA256" "$RUNNER_TEMP/art-seed.tgz" | sha256sum --check --strict

      - name: Print and validate the source-bundle inventory
        shell: bash
        run: |
          set -euo pipefail
          tar -tzf "$RUNNER_TEMP/art-seed.tgz" | tee "$RUNNER_TEMP/art-seed-files.txt"
          test "$(wc -l < "$RUNNER_TEMP/art-seed-files.txt")" -eq 11
          test "$(grep -Ec '(^|/)\.\.?($|/)' "$RUNNER_TEMP/art-seed-files.txt")" -eq 0

      - name: Extract the verified implementation source
        run: tar -xzf "$RUNNER_TEMP/art-seed.tgz"

      - name: Assemble and verify the indentation-safe source patch
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .github/agent-art-source-fix-00.b64 \
            .github/agent-art-source-fix-01.b64 \
            | base64 --decode > "$RUNNER_TEMP/art-source-fix.patch"
          printf '%s  %s\n' "$SOURCE_FIX_SHA256" "$RUNNER_TEMP/art-source-fix.patch" | sha256sum --check --strict
          grep -E '^\+\+\+ b/' "$RUNNER_TEMP/art-source-fix.patch" | sed 's#^+++ b/##' | tee "$RUNNER_TEMP/source-fix-files.txt"
          test "$(wc -l < "$RUNNER_TEMP/source-fix-files.txt")" -eq 3
          grep -Fx '.github/workflows/verify-art-teesside.yml' "$RUNNER_TEMP/source-fix-files.txt"
          grep -Fx 'Art_Teesside/art-teach.css' "$RUNNER_TEMP/source-fix-files.txt"
          grep -Fx 'Art_Teesside/tools/apply_visual_teaching.py' "$RUNNER_TEMP/source-fix-files.txt"
          git apply --check "$RUNNER_TEMP/art-source-fix.patch"
          git apply "$RUNNER_TEMP/art-source-fix.patch"

      - name: Validate shared JavaScript syntax before generation
        run: node --check Art_Teesside/art-teach.js

      - name: Validate browser assertion syntax before generation
        run: node --check Art_Teesside/tools/assert_visual_browser.js

      - name: Validate print assertion syntax before generation
        run: node --check Art_Teesside/tools/assert_print.js

      - name: Prove the indentation-safe injector and legacy positive control
        run: python3 Art_Teesside/tools/apply_visual_teaching.py --self-test

      - name: Apply the exact generated references to the 35 applicable pages
        run: python3 Art_Teesside/tools/apply_visual_teaching.py --apply

      - name: Record the first deterministic generated patch
        shell: bash
        run: |
          set -euo pipefail
          git diff --binary -- \
            .github/workflows/verify-art-teesside.yml \
            Art_Teesside \
            art_teesside.html \
            > "$RUNNER_TEMP/generated-first.patch"
          sha256sum "$RUNNER_TEMP/generated-first.patch"

      - name: Require a byte-identical second generator run
        shell: bash
        run: |
          set -euo pipefail
          python3 Art_Teesside/tools/apply_visual_teaching.py --apply
          git diff --binary -- \
            .github/workflows/verify-art-teesside.yml \
            Art_Teesside \
            art_teesside.html \
            > "$RUNNER_TEMP/generated-second.patch"
          cmp "$RUNNER_TEMP/generated-first.patch" "$RUNNER_TEMP/generated-second.patch"
          sha256sum "$RUNNER_TEMP/generated-second.patch"

      - name: Prove authored content round-trips byte for byte
        run: python3 Art_Teesside/tools/apply_visual_teaching.py

      - name: Inventory every Art Teesside file and assert the 53-page estate
        run: >-
          python3 Art_Teesside/tools/inventory_estate.py --check
          --json "$RUNNER_TEMP/art-estate-inventory.json"
          --markdown "$RUNNER_TEMP/art-estate-inventory.md"

      - name: Prove the static assertion detects deliberate defects
        run: python3 Art_Teesside/tools/assert_visual_layer.py --self-test

      - name: Validate visual scope, references and safeguards
        run: python3 Art_Teesside/tools/assert_visual_layer.py

      - name: Run the existing closed-kit instrument verbosely
        run: python3 Art_Teesside/tools/assert_kit.py --verbose

      - name: Assert the closed-kit population and non-empty totals
        run: python3 Art_Teesside/tools/assert_instrument_contracts.py kit-current

      - name: Run the existing estate assertions
        run: python3 Art_Teesside/tools/assert_estate.py

      - name: Prove the estate assertion detects a temporary AO1 defect
        run: python3 Art_Teesside/tools/assert_instrument_contracts.py estate-control

      - name: Require the raw co-occurrence instrument's exact known-finding exit
        shell: bash
        run: |
          set +e
          python3 Art_Teesside/tools/assert_cooccurrence.py
          code=$?
          set -e
          printf 'raw co-occurrence exit: %s\n' "$code"
          test "$code" -eq 1

      - name: Require the exact current co-occurrence baseline
        run: python3 Art_Teesside/tools/assert_instrument_contracts.py cooccurrence-current

      - name: Replay the documented historical co-occurrence positive control
        run: python3 Art_Teesside/tools/assert_instrument_contracts.py cooccurrence-control

      - name: Check generated working-tree whitespace
        run: git diff --check

      - name: Remove all transfer-only files and stage the complete release
        shell: bash
        run: |
          set -euo pipefail
          rm \
            .github/agent-art-seed-00.b64 \
            .github/agent-art-seed-01.b64 \
            .github/agent-art-seed-02.b64 \
            .github/agent-art-seed-03.b64 \
            .github/agent-art-seed-03a.b64 \
            .github/agent-art-seed-03b.b64 \
            .github/agent-art-seed-03c.b64 \
            .github/agent-art-seed-04.b64 \
            .github/agent-art-seed-05.b64 \
            .github/agent-art-seed-05a.b64 \
            .github/agent-art-seed-05b.b64 \
            .github/agent-art-source-fix-00.b64 \
            .github/agent-art-source-fix-01.b64 \
            .github/workflows/agent-art-bootstrap.yml \
            .github/workflows/agent-art-export.yml
          git add --all -- \
            Art_Teesside \
            art_teesside.html \
            .github/workflows/verify-art-teesside.yml \
            .github/workflows/agent-art-bootstrap.yml \
            .github/workflows/agent-art-export.yml \
            .github/agent-art-seed-00.b64 \
            .github/agent-art-seed-01.b64 \
            .github/agent-art-seed-02.b64 \
            .github/agent-art-seed-03.b64 \
            .github/agent-art-seed-03a.b64 \
            .github/agent-art-seed-03b.b64 \
            .github/agent-art-seed-03c.b64 \
            .github/agent-art-seed-04.b64 \
            .github/agent-art-seed-05.b64 \
            .github/agent-art-seed-05a.b64 \
            .github/agent-art-seed-05b.b64 \
            .github/agent-art-source-fix-00.b64 \
            .github/agent-art-source-fix-01.b64
          git diff --cached --name-status

      - name: Prove the exact 46-file release and 15-file cleanup scopes
        shell: bash
        run: |
          set -euo pipefail
          git diff --cached --name-only > "$RUNNER_TEMP/staged-files.txt"
          test "$(wc -l < "$RUNNER_TEMP/staged-files.txt")" -eq 61

          git diff --cached --diff-filter=AM --name-only > "$RUNNER_TEMP/release-files.txt"
          test "$(wc -l < "$RUNNER_TEMP/release-files.txt")" -eq 46
          test "$(grep -Ec '^(art_teesside\.html|Art_Teesside/.+\.html)$' "$RUNNER_TEMP/release-files.txt")" -eq 35
          test "$(grep -Ec '^\.github/workflows/verify-art-teesside\.yml$' "$RUNNER_TEMP/release-files.txt")" -eq 1
          if grep -Ev '^(Art_Teesside/|art_teesside\.html$|\.github/workflows/verify-art-teesside\.yml$)' "$RUNNER_TEMP/release-files.txt"; then
            echo 'Unexpected release path' >&2
            exit 1
          fi

          cat > "$RUNNER_TEMP/expected-cleanup-files.txt" <<'EOF'
          .github/agent-art-seed-00.b64
          .github/agent-art-seed-01.b64
          .github/agent-art-seed-02.b64
          .github/agent-art-seed-03.b64
          .github/agent-art-seed-03a.b64
          .github/agent-art-seed-03b.b64
          .github/agent-art-seed-03c.b64
          .github/agent-art-seed-04.b64
          .github/agent-art-seed-05.b64
          .github/agent-art-seed-05a.b64
          .github/agent-art-seed-05b.b64
          .github/agent-art-source-fix-00.b64
          .github/agent-art-source-fix-01.b64
          .github/workflows/agent-art-bootstrap.yml
          .github/workflows/agent-art-export.yml
          EOF
          git diff --cached --diff-filter=D --name-only | sort > "$RUNNER_TEMP/actual-cleanup-files.txt"
          diff -u "$RUNNER_TEMP/expected-cleanup-files.txt" "$RUNNER_TEMP/actual-cleanup-files.txt"

          printf '\n46 release files:\n'
          cat "$RUNNER_TEMP/release-files.txt"
          printf '\n15 removed transfer-only files:\n'
          cat "$RUNNER_TEMP/actual-cleanup-files.txt"

      - name: Require the staged whitespace gate to pass
        run: git diff --cached --check

      - name: Inspect staged patch shape and file modes
        shell: bash
        run: |
          set -euo pipefail
          git diff --cached --stat
          git diff --cached --summary
          if git diff --cached --numstat | grep -E '^-\s+-\s+'; then
            echo 'Unexpected binary change' >&2
            exit 1
          fi

      - name: Create the coherent regenerated Art publication commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit \
            -m 'fix: regenerate Art Teesside upgrade with indentation-safe injection' \
            -m 'Repairs the closing-tag injector so indented LF and CRLF source is preserved, and adds a permanent regression with a controlled reproduction of the former column-zero defect.' \
            -m 'Regenerates all 35 applicable pages from pristine Lessons main 10936b7f780f2fb18a8b3de9cd534b9e679cc305. The resulting publication scope is exactly 46 files, passes byte-exact content round-trip and idempotency gates, and removes every transfer-only fragment and one-use workflow from the PR diff.'

      - name: Confirm the generated commit has a clean worktree
        run: test -z "$(git status --porcelain)"

      - name: Push the verified task-branch commit without rewriting history
        run: git push origin "HEAD:$TASK_BRANCH"
