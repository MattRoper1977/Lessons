name: Session close records publisher

on:
  push:
    branches:
      - agent/session-close-records-20260803

permissions:
  contents: write

env:
  EXPECTED_MAIN: 10936b7f780f2fb18a8b3de9cd534b9e679cc305
  EXPECTED_BLOB: 367dc25194826eb1c00874b08da1826d9b42b033

jobs:
  publish-record:
    runs-on: ubuntu-latest
    steps:
      - name: Check out records branch with history
        uses: actions/checkout@v4
        with:
          ref: agent/session-close-records-20260803
          fetch-depth: 0

      - name: Lock current main and apply the exact docs-only patch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          actual=$(git rev-parse origin/main)
          printf 'current main: %s\n' "$actual"
          test "$actual" = "$EXPECTED_MAIN"
          git checkout --force -B main origin/main
          cat > "$RUNNER_TEMP/session-close.patch.b64" <<'EOF'

          base64 --decode "$RUNNER_TEMP/session-close.patch.b64" > "$RUNNER_TEMP/session-close.patch"
          git apply --check "$RUNNER_TEMP/session-close.patch"
          git apply "$RUNNER_TEMP/session-close.patch"
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 1
          git diff --name-only | grep -Fx 'LundyLoop/tools/INSTRUMENTS.md'
          actual_blob=$(git hash-object LundyLoop/tools/INSTRUMENTS.md)
          printf 'final blob: %s\n' "$actual_blob"
          test "$actual_blob" = "$EXPECTED_BLOB"

      - name: Commit and push the one-file record to main
        shell: bash
        run: |
          set -euo pipefail
          git add -- LundyLoop/tools/INSTRUMENTS.md
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: record browser evidence limits and Art diagnosis'
          git push origin HEAD:main
