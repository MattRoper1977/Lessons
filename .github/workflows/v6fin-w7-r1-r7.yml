name: V6FIN W7 R1-R7 Lessons contract

on:
  pull_request:
    branches: [main]
    paths:
      - "2 Physics 10/current_rush.html"
      - "5 Intervention 10/InterventionA_Battle_Arena (1).html"
      - "5 Intervention 10/InterventionB_Escape_Room.html"
      - "5 Intervention 10/L8a_Powerhouse_Arena_TeamQuiz.html"
      - "5 Intervention 10/Lesson_VIR_Pupil_App.html"
      - "LundyLoop/5_staff_training/R_Gate_Calibration_Game.html"
      - "Summer Term Fun/Kids_vs_Staff_Studio_Game_Show_v8_Autopilot.html"
      - "data/hud-coverage.json"
      - "tools/verify_v6fin_w7_r1_r7.py"
      - ".github/workflows/v6fin-w7-r1-r7.yml"
      - ".github/workflows/watch-main.yml"
  push:
    branches: [main]
    paths:
      - "2 Physics 10/current_rush.html"
      - "5 Intervention 10/InterventionA_Battle_Arena (1).html"
      - "5 Intervention 10/InterventionB_Escape_Room.html"
      - "5 Intervention 10/L8a_Powerhouse_Arena_TeamQuiz.html"
      - "5 Intervention 10/Lesson_VIR_Pupil_App.html"
      - "LundyLoop/5_staff_training/R_Gate_Calibration_Game.html"
      - "Summer Term Fun/Kids_vs_Staff_Studio_Game_Show_v8_Autopilot.html"
      - "data/hud-coverage.json"
      - "tools/verify_v6fin_w7_r1_r7.py"
      - ".github/workflows/v6fin-w7-r1-r7.yml"
      - ".github/workflows/watch-main.yml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash -Eeo pipefail {0}

concurrency:
  group: v6fin-w7-r1-r7-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static-contract:
    name: Seven exact routes, canonical bytes, zoom and firing controls
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the exact Lessons head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Check out the pinned canonical splash owner
        uses: actions/checkout@v4
        with:
          repository: MattRoper1977/mattroper1977.github.io
          ref: 4b37e60061c10d93e367ff56141443701282eafa
          path: _reference/site
          fetch-depth: 1

      - name: Reproduce the generated regions and the exact repair boundary
        run: |
          git fetch --no-tags origin main
          python3 _reference/site/tools/render_maker_splash.py --root "$GITHUB_WORKSPACE" --check \
            | tee "$RUNNER_TEMP/generator-check.txt"
          python3 tools/verify_v6fin_w7_r1_r7.py \
            --root "$GITHUB_WORKSPACE" \
            --site-root "$GITHUB_WORKSPACE/_reference/site" \
            --base origin/main \
            --report "$RUNNER_TEMP/static-report.json" \
            | tee "$RUNNER_TEMP/static-check.txt"
          git diff --check origin/main...HEAD

      - name: Upload static evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v6fin-w7-r1-r7-static-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/generator-check.txt
            ${{ runner.temp }}/static-check.txt
            ${{ runner.temp }}/static-report.json
          if-no-files-found: error
          retention-days: 14

  browser-contract:
    name: Splash, suppression, focus, reduced motion and exit matrix
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the exact Lessons head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Check out the pinned canonical browser harness
        uses: actions/checkout@v4
        with:
          repository: MattRoper1977/mattroper1977.github.io
          ref: 4b37e60061c10d93e367ff56141443701282eafa
          path: _reference/site
          fetch-depth: 1

      - name: Install the browser harness
        run: |
          npm install --no-save --no-package-lock playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Prove the storage, timing and removal controls can fire
        run: |
          node _reference/site/tools/verify_maker_splash.mjs \
            --mode=controls \
            --scope=both \
            --site-route=/townlife/ \
            --second-route="/Lessons/5 Intervention 10/InterventionA_Battle_Arena (1).html" \
            --site-root="$GITHUB_WORKSPACE/_reference/site" \
            --lessons-root="$GITHUB_WORKSPACE" \
            --report="$RUNNER_TEMP/browser-controls.json" \
            | tee "$RUNNER_TEMP/browser-controls.txt"

      - name: Drive all seven routes at both measured viewports
        run: |
          node _reference/site/tools/verify_maker_splash.mjs \
            --mode=verify \
            --scope=lessons \
            --site-root="$GITHUB_WORKSPACE/_reference/site" \
            --lessons-root="$GITHUB_WORKSPACE" \
            --report="$RUNNER_TEMP/browser-routes.json" \
            | tee "$RUNNER_TEMP/browser-routes.txt"

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v6fin-w7-r1-r7-browser-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/browser-controls.json
            ${{ runner.temp }}/browser-controls.txt
            ${{ runner.temp }}/browser-routes.json
            ${{ runner.temp }}/browser-routes.txt
          if-no-files-found: error
          retention-days: 14
