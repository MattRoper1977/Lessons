# CX2 B2: report the digests the education publisher actually produces.
#
# A served digest cannot be measured from a developer container: a local run of
# the pinned publisher reproduces every non-HTML published file exactly (PDF,
# DOCX, PPTX, ZIP, JSON, SVG, TXT, PNG, CSS all 100%) but only 559 of 1503 HTML,
# while main publishes green. Rather than guess a digest into an admission
# registry, this workflow runs the publisher the way the real publication runs it
# and prints the census for the paths you ask about.
#
# It builds and measures only. It writes nothing outside the runner, touches no
# registry, deploys nothing and has no repository write permission.
name: Served digest census

on:
  workflow_dispatch:
    inputs:
      builder_ref:
        description: Site publisher commit to build with (the carrier this branch pins)
        required: true
      paths:
        description: Newline- or comma-separated published paths; blank means every path that differs from origin/main
        required: false
        default: ''

permissions:
  contents: read

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: .sources/Lessons
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          repository: MattRoper1977/mattroper1977.github.io
          ref: ${{ inputs.builder_ref }}
          path: .sources/Site
          persist-credentials: false

      # The same pinned Apps source the education publisher uses when the
      # Lessons caller drives it. Kept in step so the built tree matches.
      - uses: actions/checkout@v4
        with:
          repository: MattRoper1977/Matt-s-Apps-
          ref: dd908441664339a27dc59f5bd0364024c7a1c231
          path: .sources/Apps
          persist-credentials: false

      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: python -m pip install lxml==6.0.1

      - name: Build the education trees exactly as the publisher does
        run: |
          set -euo pipefail
          python .sources/Site/domain-split/build_publications.py --lessons .sources/Lessons
          # The builder ends with its own admission check, after every tree is written. A branch
          # that changes a published file is refused there by design, which used to stop this job
          # before it could measure anything. That one refusal is tolerated here, and only that
          # one: any other builder failure still fails the job, so a half-built tree is never
          # measured. This job admits nothing; the registry is still changed only by a reviewed diff.
          if ! python .sources/Site/domain-split/build_education.py --lessons .sources/Lessons --apps .sources/Apps > build_education.log 2>&1; then
            tail -n 30 build_education.log
            grep -q 'Education file admission blocked publication' build_education.log
            echo 'Builder stopped at its own admission check after writing the trees; they are measured below.'
          else
            tail -n 5 build_education.log
          fi

      - name: Write the full census of all three trees (proposal only, not an approval)
        env:
          BUILDER_REF: ${{ inputs.builder_ref }}
        run: |
          set -euo pipefail
          python .sources/Site/domain-split/education_publication_admission.py --output .sources/Site/domain-split/output > admission_output.txt 2>&1 || true
          grep -E '^(CHANGED|MISSING|UNREVIEWED) ' admission_output.txt || echo 'No path differs from the admission record.'
          python .sources/Site/domain-split/education_publication_admission.py --output .sources/Site/domain-split/output --proposal census.json --review-source "Served digest census run $GITHUB_RUN_ID: Site $BUILDER_REF, Lessons $GITHUB_SHA, Apps dd908441664339a27dc59f5bd0364024c7a1c231"
      # The artifact cannot be fetched from every reviewing environment, and the admission check
      # stops at the first tree with a difference, so the complete list is also printed here: every
      # path in any of the three trees whose built digest the admission record does not yet hold,
      # and every recorded path the build did not produce. Read-only; it admits nothing.
      - name: Print every built digest the admission record does not yet hold
        run: |
          python - <<'PY'
          import json, pathlib, sys
          sys.path.insert(0, '.sources/Site/domain-split')
          import education_publication_admission as admission  # the Site's own rules, not a copy
          census = json.loads(pathlib.Path('census.json').read_text())['trees']
          registry = admission.load_registry()['trees']
          pending, unreviewed, missing = {}, [], []
          for tree, rows in census.items():
              reviewed = registry[tree]
              for path, digest in rows.items():
                  if path not in reviewed:
                      unreviewed.append(tree + '/' + path)
                      pending[tree + '/' + path] = digest
                  elif digest not in admission.admitted(reviewed[path]):
                      pending[tree + '/' + path] = digest
              missing += [tree + '/' + path for path in reviewed
                          if path not in rows and not admission.may_be_absent(reviewed[path])]
          print('=== DIGESTS NOT YET IN THE ADMISSION RECORD ===')
          print(json.dumps(pending, indent=2, sort_keys=True))
          print(f'\n{len(pending)} path(s) built to a digest the record does not hold '
                f'({len(unreviewed)} of them with no row at all); {len(missing)} recorded path(s) not built')
          for path in sorted(unreviewed):
              print('  no row yet:', path)
          for path in sorted(missing):
              print('  not built:', path)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: full-census
          path: |
            census.json
            admission_output.txt
          retention-days: 7

      - name: Report the served digest of each requested path
        env:
          REQUESTED: ${{ inputs.paths }}
        run: |
          python - <<'PY'
          import hashlib, os, pathlib, subprocess, json
          tree = pathlib.Path('.sources/Site/domain-split/output/education-lessons')
          requested = [p.strip() for p in os.environ.get('REQUESTED','').replace(',', '\n').splitlines() if p.strip()]
          if not requested:
              src = pathlib.Path('.sources/Lessons')
              subprocess.run(['git','-C',str(src),'fetch','--depth','1','origin','main'], check=True)
              out = subprocess.check_output(
                  ['git','-C',str(src),'diff','--name-only','FETCH_HEAD...HEAD'], text=True)
              requested = [p for p in out.split('\n') if p.strip()]
          rows = {}
          for rel in requested:
              f = tree / rel
              rows[rel] = hashlib.sha256(f.read_bytes()).hexdigest() if f.is_file() else None
          published = {k: v for k, v in rows.items() if v}
          skipped = sorted(k for k, v in rows.items() if not v)
          print('=== SERVED DIGEST CENSUS ===')
          print(json.dumps(published, indent=2, sort_keys=True))
          print(f'\n{len(published)} published path(s) measured; {len(skipped)} not in the published tree')
          for k in skipped:
              print('  not published:', k)
          pathlib.Path(os.environ['GITHUB_STEP_SUMMARY']).write_text(
              '## Served digest census\n\n```json\n' + json.dumps(published, indent=2, sort_keys=True) + '\n```\n')
          PY
