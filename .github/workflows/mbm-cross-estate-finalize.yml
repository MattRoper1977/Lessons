name: Finalise Lessons cross-estate payload

on:
  push:
    branches:
      - codex/mbm-cross-estate-unification-lessons-apps-2026-08-08

permissions:
  contents: write

concurrency:
  group: mbm-cross-estate-lessons-finalize
  cancel-in-progress: false

jobs:
  finalise:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the implementation branch
        uses: actions/checkout@v4
        with:
          ref: codex/mbm-cross-estate-unification-lessons-apps-2026-08-08
          fetch-depth: 0

      - name: Check the canonical served poster asset
        uses: actions/checkout@v4
        with:
          repository: MattRoper1977/mattroper1977.github.io
          ref: main
          path: _reference/site
          fetch-depth: 1

      - name: Repair the stale cross-estate poster route and remove this bootstrap
        shell: bash
        run: |
          set -euo pipefail
          test -f _reference/site/assets/video/poster-art.webp
          test "$(grep -o '/assets/video/poster-art.jpg' index.html | wc -l)" -eq 1
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = '/assets/video/poster-art.jpg'
          new = '/assets/video/poster-art.webp'
          if text.count(old) != 1:
              raise SystemExit(f'expected one stale poster path, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          rm -f .github/workflows/mbm-cross-estate-finalize.yml
          rm -rf _reference
          git diff --check

      - name: Commit the repaired final payload
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Made by Matt cross-estate release"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: use the served art poster asset"
          git push origin HEAD:codex/mbm-cross-estate-unification-lessons-apps-2026-08-08
