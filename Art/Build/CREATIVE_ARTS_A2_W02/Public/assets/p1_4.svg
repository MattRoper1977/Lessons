<svg xmlns="http://www.w3.org/2000/svg" width="920" height="540" viewBox="0 0 920 540" role="img" aria-label="Join and repeat"><title>Join and repeat</title><rect width="920" height="540" fill="white"/><text x="30" y="60" font-family="sans-serif" font-size="38" fill="#172B3A" font-weight="700">4  Join and repeat</text><text x="30" y="120" font-family="sans-serif" font-size="28" fill="#172B3A" font-weight="400">Start together. Play the whole part twice.</text><text x="30" y="225" font-family="sans-serif" font-size="34" fill="#172B3A" font-weight="700">Part A</text><rect x="195" y="170" width="150" height="137" rx="8" fill="#edf1f5" stroke="#527e98" stroke-width="2"/><text x="261" y="200" font-family="sans-serif" font-size="24" fill="#527e98" font-weight="700">1</text><circle cx="270" cy="241" r="22" fill="#25867a" stroke="#25867a" stroke-width="4"/><text x="237" y="287" font-family="sans-serif" font-size="25" fill="#172B3A" font-weight="700">TAP</text><rect x="370" y="170" width="150" height="137" rx="8" fill="#edf1f5" stroke="#527e98" stroke-width="2"/><text x="436" y="200" font-family="sans-serif" font-size="24" fill="#527e98" font-weight="700">2</text><circle cx="445" cy="241" r="22" fill="#25867a" stroke="#25867a" stroke-width="4"/><text x="412" y="287" font-family="sans-serif" font-size="25" fill="#172B3A" font-weight="700">TAP</text><rect x="545" y="170" width="150" height="137" rx="8" fill="#edf1f5" stroke="#527e98" stroke-width="2"/><text x="611" y="200" font-family="sans-serif" font-size="24" fill="#527e98" font-weight="700">3</text><circle cx="620" cy="241" r="22" fill="#25867a" stroke="#25867a" stroke-width="4"/><text x="587" y="287" font-family="sans-serif" font-size="25" fill="#172B3A" font-weight="700">TAP</text><rect x="720" y="170" width="150" height="137" rx="8" fill="#edf1f5" stroke="#527e98" stroke-width="2"/><text x="786" y="200" font-family="sans-serif" font-size="24" fill="#527e98" font-weight="700">4</text><circle cx="795" cy="241" r="22" fill="#25867a" stroke="#25867a" stroke-width="4"/><text x="762" y="287" font-family="sans-serif" font-size="25" fill="#172B3A" font-weight="700">TAP</text><text x="30" y="390" font-family="sans-serif" font-size="30" fill="#172B3A" font-weight="400">TAP makes a quiet sound.</text><text x="30" y="438" font-family="sans-serif" font-size="30" fill="#172B3A" font-weight="400">REST keeps one full beat silent.</text><text x="30" y="490" font-family="sans-serif" font-size="27" fill="#bd4545" font-weight="400">Stop at the agreed signal.</text></svg>