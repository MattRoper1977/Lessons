<svg xmlns="http://www.w3.org/2000/svg" width="920" height="540" viewBox="0 0 920 540" role="img" aria-label="Which record shows a real share? A says “we practised”. B has a real date, audience and own words."><rect width="920" height="540" fill="#fff"/><text x="35" y="55" font-family="Liberation Sans,Arial,sans-serif" font-size="38" fill="#17263b" font-weight="700">Practice or actual share?</text><rect x="35" y="100" width="400" height="350" rx="10" fill="#f7f8f8" stroke="none" stroke-width="3"/><rect x="480" y="100" width="400" height="350" rx="10" fill="#eef7f5" stroke="none" stroke-width="3"/><text x="60" y="155" font-family="Liberation Sans,Arial,sans-serif" font-size="32" fill="#17263b" font-weight="400">A</text><text x="60" y="197" font-family="Liberation Sans,Arial,sans-serif" font-size="32" fill="#17263b" font-weight="400">We practised.</text><text x="60" y="239" font-family="Liberation Sans,Arial,sans-serif" font-size="32" fill="#17263b" font-weight="400">D page 2</text><text x="505" y="155" font-family="Liberation Sans,Arial,sans-serif" font-size="29" fill="#17263b" font-weight="400">B</text><text x="505" y="197" font-family="Liberation Sans,Arial,sans-serif" font-size="29" fill="#17263b" font-weight="400">Actual date: ...</text><text x="505" y="239" font-family="Liberation Sans,Arial,sans-serif" font-size="29" fill="#17263b" font-weight="400">Audience: ...</text><text x="505" y="281" font-family="Liberation Sans,Arial,sans-serif" font-size="29" fill="#17263b" font-weight="400">My words: ...</text><text x="505" y="323" font-family="Liberation Sans,Arial,sans-serif" font-size="29" fill="#17263b" font-weight="400">Their response: ...</text><text x="35" y="510" font-family="Liberation Sans,Arial,sans-serif" font-size="24" fill="#527e98" font-weight="400">Only fill B when the real event has happened.</text></svg>